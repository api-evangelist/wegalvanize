- aid: wegalvanize:wegalvanize-questionnaires-api
  name: Wegalvanize Questionnaires API
  description: >-
    Questionnaires are used to gather information from respondents and contextualize data. Each Collection
    can have one or more questionnaires that you deploy as surveys,

    event reports, or as follow-up mechanisms when remediating records.


    Your organization can have a maximum of 14,000 questionnaires and each questionnaire can hold a maximum
    of 900 questions, including page breaks and sections.


    <a href="https://help.highbond.com/helpdocs/highbond/en-us/Default.htm#cshid=rm-creating-questionnaires"
    target="_blank">Learn more about questionnaires</a>.


    Questionnaires consist of a series of question and layout components. Please use the dedicated endpoints
    to manage these components:


    - **Question Type**
      * `Numeric Scale` Question
      * Simple Question:
        - `Short Answer`
        - `Paragraph`
        - `Numeric`
        - `Date`
        - `Email`
        - `Attachment`
        - `Digital Signature`
      * Choice Question
        - `Single Choice`
        - `Dropdown`
        - `Multiple Choice`
    - **Layout Type**
      * `Page Break`
      * `Section`

    > **Note:**

    >

    > 1. Only not archived questionnaires can be managed by this set of APIs.

    > 2. Only HighBond System Admins are authorized to manage questionnaires via this set of APIs.
