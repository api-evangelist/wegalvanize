- aid: wegalvanize:wegalvanize-project-types-api
  name: Wegalvanize Project types API
  description: >-
    Project types define the structure of a project or framework, including the terminology used in the
    project or framework. Updates to project types apply to

    all active projects, archived projects, temporarily deleted projects, and frameworks associated with
    the project type.


    Each project type has an associated workflow: Workplan (`procedure`) or Internal Control (`control`).
    Workflows define the components available in a project

    or framework.  The attributes `narrative_terms`, `control_test_terms`, and `test_plan_terms` are not
    available for a Workplan (`procedure`) workflow.


    When creating a new project type, only the basic defining attributes are available. After creating
    the project type default customizable terms and toggles

    are returned and available on PATCH requests for update.
  humanURL: https://docs-apis.highbond.com/
  baseURL: https://apis-us.highbond.com/v1
  tags:
  - Project types
