- aid: wegalvanize:wegalvanize-workflows-in-asset-inventory-asset-manager-api
  name: Wegalvanize Workflows in Asset Inventory/Asset Manager API
  description: >-
    Workflows contain a set of statuses that a certain item belonging to that workflow can be in. Any
    items in this workflow can move between certain statuses and the transition can trigger certain events
    which will execute their handlers.


    Workflow statuses represent all possible states an item of the workflow can be in. Statuses can be
    associated with Events to allow transition from one status to another within the same workflow.


    Every workflow must have exactly one "default" status. You can make a status the default status by
    setting or updating the default flag on that status. This default status cannot be deleted.
  humanURL: https://docs-apis.highbond.com/
