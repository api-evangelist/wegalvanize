- aid: wegalvanize:wegalvanize-projects-api
  name: Wegalvanize Projects API
  description: >-
    A project is a management system that allows you to define objectives, risks, and controls, perform
    tests, and compile information for reporting purposes. Projects may also

    be known as audits, compliance assessments, risk assessments, or another customized term.


    Each project has a default system classification, called a "state". A project can have one of the
    following states:

    * `"active"`— projects that are currently in progress

    * `"archive"`— projects that are inactive and have been moved to the Project Library

    * `"delete"`— previously deleted projects that are stored in the Project Library for 30 days, and
    then permanently deleted automatically after 30 days


    Projects in a `"framework"` state cannot be accessed using the API.


    <a href="https://help.highbond.com/helpdocs/highbond/en-us/Default.htm#cshid=pm-create-project" target="_blank">Learn
    more about projects</a>.
