- aid: wegalvanize:wegalvanize-control-test-plans-api
  name: Wegalvanize Control test plans API
  description: >-
    A test plan is a document that details how controls are assessed. Test plans identify the testing
    method or type of evidence obtained, specify the total sample size

    (split amongst testing rounds), and illustrate test steps or attributes.


    If your project includes at least one testing round, each control you create has one corresponding
    test plan.


    > **Note:**

    > * To access test plans using the API, the test plans tab must be enabled in the project type associated
    with the project or framework.

    >

    > Test plans located in such resources can be accessed using the API:

