  name: Wegalvanize Walkthroughs API
  description: >-
    A walkthrough is a series of steps you perform to establish the reliability of controls and test the
    design of controls. Each control you define has a corresponding

    walkthrough that is used to verify that the control is designed appropriately. In a Workplan workflow
    project, a walkthrough is called an execute procedure.


    > **Note**

    > * Only walkthroughs in projects that have an `"active"` state can be accessed using the API.

    > * To access walkthroughs using the API, the walkthroughs tab must be enabled in the project type
    associated with the project.


