name: Wegalvanize
description: >-
  Wegalvanize.com is the former web home of Galvanize, the governance, risk, and
  compliance (GRC) software company behind the HighBond platform; Galvanize was
  acquired by Diligent and wegalvanize.com now redirects to diligent.com. The
  HighBond platform (audit, risk, controls, compliance, data analytics, and
  Robots automation) exposes a substantial public REST API built on the JSON:API
  v1.0 specification, documented at docs-apis.highbond.com and authenticated with
  OAuth 2.0 bearer tokens issued through Launchpad. This profile was seeded as a
  Norwest Venture Partners portfolio lead and has been enriched from the live
  HighBond OpenAPI (390 operations across 67 resource groups) and the provider's
  public identity/security surface.
