overlay: 1.0.0
info:
  title: API Evangelist enhancements for HighBond (Diligent / Galvanize)
  version: 1.0.0
extends: openapi/wegalvanize-highbond-openapi-original.yml
actions:
  - target: $.info
    update:
      x-apievangelist-provider: wegalvanize
      x-apievangelist-brand: HighBond (Diligent, formerly Galvanize)
      x-apievangelist-standard: JSON:API 1.0
      x-apievangelist-auth: OAuth 2.0 bearer token (Launchpad) / OIDC oidc.highbond.com
      x-apievangelist-oidc-discovery: https://oidc.highbond.com/.well-known/openid-configuration
      x-apievangelist-status-page: https://status.diligent.com
      x-apievangelist-trust-center: https://trust.diligent.com
      x-apievangelist-rate-limit: 6 req/s default; 3 req/min for Users & Groups
  - target: $.info
    update:
      x-apievangelist-artifacts:
        authentication: authentication/wegalvanize-authentication.yml
        scopes: scopes/wegalvanize-scopes.yml
        conventions: conventions/wegalvanize-conventions.yml
        errors: errors/wegalvanize-problem-types.yml
        conformance: conformance/wegalvanize-conformance.yml
        lifecycle: lifecycle/wegalvanize-lifecycle.yml
        data_model: data-model/wegalvanize-data-model.yml
        well_known: well-known/wegalvanize-well-known.yml
        mcp: mcp/wegalvanize-mcp.yml
        skills: skills/_index.yml
