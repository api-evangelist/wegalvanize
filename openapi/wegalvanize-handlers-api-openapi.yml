openapi: 3.2.0
info:
  title: HighBond API Reference Handlers API
  version: 1.1.0
  description: Welcome to the API documentation for HighBond.
  x-logo:
    url: ./assets/logo.png
    altText: HighBond Logo
servers:
- url: '{protocol}://{server}/v1'
  variables:
    protocol:
      default: https
    server:
      default: apis-us.highbond.com
      enum:
      - apis-us.highbond.com
      - apis-ca.highbond.com
      - apis-eu.highbond.com
      - apis-ap.highbond.com
      - apis-au.highbond.com
      - apis-af.highbond.com
      - apis-sa.highbond.com
      - apis-jp.highbond.com
security:
- bearerToken: []
tags:
- name: Handlers
  description: Handlers contain a set of conditions and actions that occur upon certain situation, e.g. an event fired, on scheduled time, a message received, etc.
paths:
  /orgs/{org_id}/handlers:
    get:
      tags:
      - Handlers
      operationId: getHandlers
      summary: List Handlers
      description: List Handlers and their metadata for an organization. Does not include conditions, actions or events.
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/includeCountsHandlerParam'
      responses:
        '200':
          description: OK.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/MultipleHandlersResponse'
              example:
                data:
                - id: 9af02c4a-3c98-4283-8c5d-8dc47e3bf663
                  type: handlers
                  attributes:
                    name: My Handler
                    description: My Handler description
                    shared: true
                    created_at: '2019-02-09T13:17:38Z'
                    updated_at: '2019-02-09T13:17:38Z'
                - id: 768cd1bc-d8af-4429-9aa0-8a4b477de42b
                  type: handlers
                  attributes:
                    name: My other Handler
                    description: My other Handler description
                    shared: false
                    created_at: '2019-02-09T13:17:26Z'
                    updated_at: '2019-03-09T20:23:09Z'
        '400':
          $ref: '#/components/responses/MissingOrgId'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
      - Handlers
      operationId: createHandler
      summary: Create a handler
      description: Create a new, empty handler in an org.
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      requestBody:
        description: The data required to create a handler.
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/CreateHandlerPayload'
      responses:
        '201':
          description: Created.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/SingleHandlerResponse'
        '400':
          $ref: '#/components/responses/ResourceTypeMismatch'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/NotJsonapiMediaType'
        '422':
          description: 'Unprocessable entity.

            '
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/Errors'
              example:
                errors:
                - status: '422'
                  source:
                    pointer: /data/attributes/name
                  code: invalid_resource
                  detail: can't be blank
  /orgs/{org_id}/handlers/{id}:
    get:
      tags:
      - Handlers
      operationId: getHandler
      summary: Get a handler
      description: Get information about a handler.
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/resourceUuidParam'
      - $ref: '#/components/parameters/handlerIncludeParam'
      responses:
        '200':
          description: OK.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/SingleHandlerWithEventsResponse'
        '400':
          $ref: '#/components/responses/MissingResourceId'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - Handlers
      operationId: updateHandler
      summary: Update a handler
      description: Make changes to an existing handler.
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/resourceUuidParam'
      requestBody:
        description: The data required to update a handler.
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/UpdateHandlerPayload'
      responses:
        '200':
          description: Updated.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/SingleHandlerResponse'
        '400':
          $ref: '#/components/responses/ResourceTypeMismatch'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/NotJsonapiMediaType'
        '422':
          description: 'Unprocessable entity.

            '
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/Errors'
              example:
                errors:
                - status: 422
                  source:
                    pointer: /data/attributes/name
                  code: invalid_resource
                  detail: can't be blank
    delete:
      tags:
      - Handlers
      operationId: deleteHandler
      summary: Delete a handler
      description: Permanently delete a handler.
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/resourceUuidParam'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/MissingOrgId'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  schemas:
    MultipleHandlersResponse:
      type: object
      description: The data associated with the resource.
      required:
      - data
      properties:
        data:
          type: array
          description: The data associated with the resource.
          items:
            type: object
            description: The data associated with the resource.
            required:
            - id
            - type
            - attributes
            properties:
              id:
                type: string
                description: The ID of the handler.
                example: 415dc769-3e49-4501-a2fd-80908bea7a32
              type:
                type: string
                description: The classification of the object (`"handlers"`).
                example: handlers
              attributes:
                type: object
                description: The attributes associated with the resource.
                properties:
                  name:
                    type: string
                    description: The name of the handler.
                    example: My first Handler
                  description:
                    type: string
                    description: The description of the handler.
                    example: Description of My first Handler
                  shared:
                    type: boolean
                    description: Handlers can be marked as "shared". Only shared handlers can be reused across multiple events in different workflows.
                    default: false
                    example: false
                  created_at:
                    type: string
                    description: The date the handler was created.
                    example: '2019-02-09T13:17:26Z'
                    format: date-time
                  updated_at:
                    type: string
                    description: The date the handler was updated.
                    example: '2019-03-18T22:02:05Z'
                    format: date-time
    HandlerActionsConfigurationOptions:
      oneOf:
      - title: notify
        type: object
        required:
        - emails
        - email_subject
        - email_body
        properties:
          emails:
            type: array
            description: The list of email addresses that the email notification will be sent to.
            items:
              type: string
          email_subject:
            type: string
            description: The email subject of the email notification.
          email_body:
            type: string
            description: The email body of the email notification.
      - title: transitionStatus
        type: object
        required:
        - status_id
        properties:
          status_id:
            type: string
            description: The ID of the Workflow Status to transition an Item to by this Handler Action.
      - title: runRobot
        type: object
        required:
        - task_id
        properties:
          task_id:
            type: string
            description: The ID of the Workflow Robot task to run.
      - title: sendQuestionnaire
        type: object
        properties:
          distribution_type:
            type: string
            default: manual
            description: Distribution type. When set to `manual`, this implies that the event is being invoked manually (i.e. through APIs or the UI). When set to `automated`, this implies that the event is being invoked asynchronously through triggers (currently, is only supported using the fieldUpdated trigger type).
            example: manual
            enum:
            - manual
            - automated
          allowed_questionnaire_ids:
            type: array
            description: The list of questionnaires that are going to be displayed in the UI dropdown, for the user to choose from. Used and required for the `manual` distribution_type.
            items:
              type: string
          email_attribute_field_name:
            type: string
            description: A field name that references a field containing an email address (which represents the questionnaire recipient). Text and user lookup fields can be used - at this time, only one email is supported (if there are multiple, only the first email in the field will be used). Used and required for the `automated` distribution_type.
          sent_questionnaire_id:
            type: string
            description: The id of the questionnaire to be sent. Used and required for the `automated` distribution_type.
          questionnaire_context_fields:
            type: array
            maxItems: 15
            description: A list of field names that the display name and value will be shown up in questionnaire responding page.
            items:
              type: string
    HandlerConditionsConfigurationOperatorOptions:
      oneOf:
      - title: Numeric Operators
        type: string
        description: Operators used on numeric-like values. `is blank` will be true when the `left_operand_field_name` value is `null`.
        enum:
        - greater than
        - greater or equal to
        - less than
        - less or equal to
        - equals
        - not equals
        - is blank
        - is not blank
      - title: Boolean Operators
        type: string
        description: Operators used on boolean-like values. `is blank` will be true when the `left_operand_field_name` value is `null`.
        enum:
        - equals
        - not equals
        - is blank
        - is not blank
      - title: Text Operators
        type: string
        description: Operators used on text-like values. `is blank` will be true when the `left_operand_field_name` value is `null` or `empty`. Additionally a string consisting of only blank spaces is not considered `empty`.
        enum:
        - contains
        - not contains
        - equals
        - not equals
        - is blank
        - is not blank
      - title: Select Operators
        type: string
        description: Operators used on select field values. `is blank` will be true when the `left_operand_field_name` value is `null` or `empty`. Additionally a value consisting of only blank spaces is not considered `empty`.
        enum:
        - contains
        - not contains
        - equals
        - not equals
        - is blank
        - is not blank
    HandlerConditionsConfigurationOptions:
      oneOf:
      - title: specificFieldsAreRequired
        type: object
        required:
        - field_names
        properties:
          field_names:
            type: array
            description: list of attributes that need to be checked.
            items:
              type: string
      - title: fieldValueComparison
        type: object
        required:
        - left_operand_field_name
        - operator
        properties:
          left_operand_field_name:
            type: string
            description: The field of whom's value will be operated on (will be used to compare against right_operand_value). To reference a workflow status' name, use `metadata.workflow_status`.
            example: risk_score
          right_operand_value:
            type: array
            description: A list of values that `left_operand_field_name` will be compared against. The values can be number-like, boolean-like, or text. At this time, we only support one value passed in this list. This value is ignored when operators `is_blank` or `is_not_blank` is used, in all other cases this value is required.
            items:
              type: string
              example: '50'
          operator:
            description: Operator represents an action to be performed on the values. Depending on the type of `right_operand_value` (can be `numeric`, `boolean`, or `text`), the set of allowed operators will change. Currently, we only support `numeric` type.
            $ref: '#/components/schemas/HandlerConditionsConfigurationOperatorOptions'
    UpdateHandlerPayload:
      type: object
      description: The data associated with the resource.
      required:
      - data
      properties:
        data:
          type: object
          description: The data associated with the resource.
          required:
          - id
          - type
          - attributes
          properties:
            id:
              type: string
              description: The ID of the handler.
              example: 768cd1bc-d8af-4429-9aa0-8a4b477de42b
            type:
              type: string
              description: The classification of the object (`"handlers"`).
              example: handlers
            attributes:
              type: object
              description: The attributes associated with the resource.
              properties:
                name:
                  type: string
                  description: The name of the handler.
                  example: My first Handler
                description:
                  type: string
                  description: The description of the handler.
                  example: Description of My first Handler
                shared:
                  type: boolean
                  description: Handlers can be marked as "shared". Only shared handlers can be reused across multiple events in different workflows.
                  default: false
                  example: false
                condition_conjunction:
                  type: string
                  description: Type of conditions
                  example: allOf
                  default: allOf
                  enum:
                  - allOf
                  - anyOf
                conditions:
                  type: array
                  description: An array of conditions
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                        description: The name of the handler condition
                        example: My first handler condition
                      condition_type:
                        type: string
                        description: "Determines conditions under which an asset or record can advance to the next workflow status.\n  * `allRequiredFieldsAreProvided` - All attributes (whose flag `is_required` = `true`) associated with an asset or record must have values.\n  * `specificFieldsAreRequired` - All attributes/fields specified must have values.\n  * `fieldValueComparison` -  Workflow advances if the condition/comparison is met for a `numeric`, `boolean`, or `text` attribute.\n"
                        enum:
                        - allRequiredFieldsAreProvided
                        - specificFieldsAreRequired
                        - fieldValueComparison
                      configuration:
                        type: object
                        description: Configuration object differs depending on which `condition_type` is being used.
                        $ref: '#/components/schemas/HandlerConditionsConfigurationOptions'
                      scopes:
                        type: array
                        default:
                        - self
                        items:
                          type: string
                          enum:
                          - self
                      on_failure_action:
                        type: string
                        enum:
                        - stopAllHandlersForThisEvent
                        - stopThisHandlerForTheCurrentItem
                      on_failure_display_message:
                        type: boolean
                        default: false
                        description: 'Whether or not a custom error message is shown.


                          *This property will be deprecated* and replaced by `show_failure_message`.

                          Only this boolean OR `show_failure_message` may be set in a single request

                          '
                      show_failure_message:
                        type: boolean
                        default: true
                        description: 'Whether or not an error message is shown. If `on_failure_message` is defined a custom error message is shown.

                          '
                      on_failure_message:
                        type: string
                        description: 'When `on_failure_message` is set, `show_failure_message` must be set to true.

                          '
                  example:
                  - condition_type: specificFieldsAreRequired
                    configuration:
                      field_names:
                      - reviewSummary
                      - reviewer
                    scopes:
                    - self
                    on_failure_action: stopAllHandlersForThisEvent
                    on_failure_display_message: false
                    show_failure_message: true
                  - condition_type: fieldValueComparison
                    configuration:
                      left_operand_field_name: risk_score
                      right_operand_value:
                      - '50'
                      operator: greater than
                    scopes:
                    - self
                    on_failure_action: stopAllHandlersForThisEvent
                    on_failure_display_message: false
                    show_failure_message: false
                actions:
                  type: array
                  description: An array of actions
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                        description: The name of the handler action
                        example: My first handler action
                      action_type:
                        type: string
                        enum:
                        - notify
                        - transitionStatus
                        - runRobot
                        - sendQuestionnaire
                      configuration:
                        type: object
                        description: Configuration object differs depending on which `action_type` is being used.
                        $ref: '#/components/schemas/HandlerActionsConfigurationOptions'
                      scopes:
                        type: array
                        default:
                        - self
                        items:
                          type: string
                          enum:
                          - self
                      show_success_message:
                        type: boolean
                        default: true
                      on_success_message:
                        type: string
                        description: 'When `on_success_message` is set, `show_success_message` must be set to true.

                          '
                  example:
                  - action_type: transitionStatus
                    configuration:
                      status_id: 317dc769-3e09-4501-a2fd-80908bea7a66
                    scopes:
                    - self
                    show_success_message: false
                  - action_type: notify
                    configuration:
                      emails:
                      - example@example.com
                      email_body: Example email body
                      email_subject: Example email subject
                    scopes:
                    - self
                    show_success_message: true
                    on_success_message: Example notification has been sent to example@example.com.
                  - action_type: runRobot
                    configuration:
                      task_id: '123'
                    scopes:
                    - self
                  - action_type: sendQuestionnaire
                    configuration:
                      distribution_type: manual
                      allowed_questionnaire_ids:
                      - '123'
                      questionnaire_context_fields:
                      - name
                      - assetTypeId
                      - createdAt
                    scopes:
                    - self
                    show_success_message: true
                  - action_type: sendQuestionnaire
                    configuration:
                      distribution_type: automated
                      email_attribute_field_name: admins
                      sent_questionnaire_id: '1'
                      questionnaire_context_fields:
                      - name
                      - assetTypeId
                      - createdAt
                    scopes:
                    - self
                    show_success_message: true
                    on_success_message: Administrators were sent the Questionnaire.
                triggers:
                  type: array
                  description: 'An array of triggers | `DEPRECATED: Handlers with embedded triggers are not recommended. Please create an event to hold the trigger and link your handler to this event.`

                    '
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                        description: The name of the handler trigger
                      trigger_type:
                        type: string
                        description: The trigger type of the handler. Only one instance of a given triggerType is allowed in the triggers array.
                        enum:
                        - fieldUpdated
                        - questionnaireResponded
                      configuration:
                        type: object
                        description: Each trigger type requires its own set of configurations.
                        properties:
                          field_names:
                            type: array
                            description: 'The field names of an attribute that, when updated, will trigger the handler. Required by the `fieldUpdated` trigger_type.

                              '
                            items:
                              type: string
                          questionnaire_ids:
                            type: array
                            description: 'The questionnaire ids that trigger the handler. Required by the `questionnaireResponded` trigger_type.

                              '
                            items:
                              type: string
                          trigger_conjunction:
                            type: string
                            description: 'The conjunction used when performing the trigger check. Required by the `fieldUpdated` trigger_type, which supports both `anyOf` and `allOf`. For other trigger types, `anyOf` is implicitly used.

                              '
                            enum:
                            - anyOf
                            - allOf
                  example:
                  - name: My Handler Trigger
                    trigger_type: fieldUpdated
                    configuration:
                      field_names:
                      - risk_score
                      - risk_appetite
                      trigger_conjunction: allOf
    Error:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          description: The HTTP status code.
        source:
          type: object
          description: Indicates which part of the request document caused the error.
          required:
          - pointer
          properties:
            pointer:
              type: string
              description: 'A JSON Pointer <a href="https://tools.ietf.org/html/rfc6901" target="_blank">(RFC6901)</a> to the associated entity

                in the request document.

                '
        code:
          type: string
          description: Application-specific error code, expressed as a string value.
        title:
          type: string
          description: A short, human-readable summary of the problem.
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence of the problem.
    SingleHandlerWithEventsResponse:
      type: object
      description: The data associated with the resource.
      required:
      - data
      properties:
        data:
          type: object
          description: The data associated with the resource.
          required:
          - id
          - type
          - attributes
          properties:
            id:
              type: string
              description: The ID of the handler.
              example: e5079e91-3aed-40f0-b3d1-96b83a0bc159
            type:
              type: string
              description: The classification of the object (`"handlers"`).
              example: handlers
            attributes:
              type: object
              description: The attributes associated with the resource.
              properties:
                name:
                  type: string
                  description: The name of the handler.
                  example: My first Handler
                description:
                  type: string
                  description: The description of the handler.
                  example: Description of My first Handler
                shared:
                  type: boolean
                  description: Handlers can be marked as "shared". Only shared handlers can be reused across multiple events in different workflows.
                  default: false
                  example: false
                condition_conjunction:
                  type: string
                  description: Type of conditions
                  example: allOf
                  default: allOf
                  enum:
                  - allOf
                  - anyOf
                conditions:
                  type: array
                  description: An array of conditions
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                        description: The name of the handler condition
                        example: My first handler condition
                      condition_type:
                        type: string
                        description: "Determines conditions under which an asset or record can advance to the next workflow status.\n  * `allRequiredFieldsAreProvided` - All attributes (whose flag `is_required` = `true`) associated with an asset or record must have values.\n  * `specificFieldsAreRequired` - All attributes/fields specified must have values.\n  * `fieldValueComparison` -  Workflow advances if the condition/comparison is met for a `numeric`, `boolean`, or `text` attribute.\n"
                        enum:
                        - allRequiredFieldsAreProvided
                        - specificFieldsAreRequired
                        - fieldValueComparison
                      configuration:
                        type: object
                        description: Configuration object differs depending on which `condition_type` is being used.
                        $ref: '#/components/schemas/HandlerConditionsConfigurationOptions'
                      scopes:
                        type: array
                        default:
                        - self
                        items:
                          type: string
                          enum:
                          - self
                      on_failure_action:
                        type: string
                        enum:
                        - stopAllHandlersForThisEvent
                        - stopThisHandlerForTheCurrentItem
                      on_failure_display_message:
                        type: boolean
                        default: false
                        description: 'Whether or not a custom error message is shown.


                          *This property will be deprecated* and replaced by `show_failure_message`.

                          Only this boolean OR `show_failure_message` may be set in a single request

                          '
                      show_failure_message:
                        type: boolean
                        default: true
                        description: 'Whether or not an error message is shown. If `on_failure_message` is defined a custom error message is shown.

                          '
                      on_failure_message:
                        type: string
                        description: 'When `on_failure_message` is set, `show_failure_message` must be set to true.

                          '
                  example:
                  - condition_type: specificFieldsAreRequired
                    configuration:
                      field_names:
                      - reviewSummary
                      - reviewer
                    scopes:
                    - self
                    on_failure_action: stopAllHandlersForThisEvent
                    on_failure_display_message: false
                    show_failure_message: true
                  - condition_type: fieldValueComparison
                    configuration:
                      left_operand_field_name: risk_score
                      right_operand_value:
                      - '50'
                      operator: greater than
                    scopes:
                    - self
                    on_failure_action: stopAllHandlersForThisEvent
                    on_failure_display_message: false
                    show_failure_message: false
                actions:
                  type: array
                  description: An array of actions
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                        description: The name of the handler action
                        example: My first handler action
                      action_type:
                        type: string
                        enum:
                        - notify
                        - transitionStatus
                        - runRobot
                        - sendQuestionnaire
                      configuration:
                        type: object
                        description: Configuration object differs depending on which `action_type` is being used.
                        $ref: '#/components/schemas/HandlerActionsConfigurationOptions'
                      scopes:
                        type: array
                        default:
                        - self
                        items:
                          type: string
                          enum:
                          - self
                      show_success_message:
                        type: boolean
                        default: true
                      on_success_message:
                        type: string
                        description: 'When `on_success_message` is set, `show_success_message` must be set to true.

                          '
                  example:
                  - action_type: transitionStatus
                    configuration:
                      status_id: 317dc769-3e09-4501-a2fd-80908bea7a66
                    scopes:
                    - self
                    show_success_message: false
                  - action_type: notify
                    configuration:
                      emails:
                      - example@example.com
                      email_body: Example email body
                      email_subject: Example email subject
                    scopes:
                    - self
                    show_success_message: true
                    on_success_message: Example notification has been sent to example@example.com.
                  - action_type: runRobot
                    configuration:
                      task_id: '123'
                    scopes:
                    - self
                  - action_type: sendQuestionnaire
                    configuration:
                      distribution_type: manual
