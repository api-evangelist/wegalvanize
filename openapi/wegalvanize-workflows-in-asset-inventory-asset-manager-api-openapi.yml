openapi: 3.2.0
info:
  title: HighBond API Reference Workflows in Asset Inventory/Asset…
  version: 1.1.0
  description: Welcome to the API documentation for HighBond.
  x-logo:
    url: ./assets/logo.png
    altText: HighBond Logo
servers:
- url: '{protocol}://{server}/v1'
  variables:
    protocol:
      default: https
    server:
      default: apis-us.highbond.com
      enum:
      - apis-us.highbond.com
      - apis-ca.highbond.com
      - apis-eu.highbond.com
      - apis-ap.highbond.com
      - apis-au.highbond.com
      - apis-af.highbond.com
      - apis-sa.highbond.com
      - apis-jp.highbond.com
security:
- bearerToken: []
tags:
- name: Workflows in Asset Inventory/Asset Manager
  description: Workflows contain a set of statuses that a certain item belonging to that workflow can be in.
paths:
  /orgs/{org_id}/workflows:
    get:
      tags:
      - Workflows in Asset Inventory/Asset Manager
      operationId: getWorkflows
      summary: List Workflows
      description: List Workflows and their metadata for an organization. Does not include relationships with other entities (statuses, events, etc).
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      responses:
        '200':
          description: OK.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/MultipleWorkflowsResponse'
              example:
                data:
                - id: 9af02c4a-3c98-4283-8c5d-8dc47e3bf663
                  type: workflows
                  attributes:
                    name: My Workflow
                    description: My Workflow description
                    locked: true
                    system: false
                    created_at: '2019-02-09T13:17:38Z'
                    updated_at: '2019-02-09T13:17:38Z'
                    api_name: my_workflow_api_name__c
                - id: 768cd1bc-d8af-4429-9aa0-8a4b477de42b
                  type: workflows
                  attributes:
                    name: My other Workflow
                    description: My other Workflow description
                    locked: false
                    system: false
                    created_at: '2019-02-09T13:17:26Z'
                    updated_at: '2019-03-09T20:23:09Z'
                    api_name: my_other_workflow_api_name__c
        '400':
          $ref: '#/components/responses/MissingOrgId'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
      - Workflows in Asset Inventory/Asset Manager
      operationId: createWorkflow
      summary: Create a workflow
      description: Create a new, empty workflow in an organization.
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      requestBody:
        description: The data required to create a workflow.
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/CreateWorkflowPayload'
      responses:
        '201':
          description: Created.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/SingleWorkflowResponse'
        '400':
          $ref: '#/components/responses/ResourceTypeMismatch'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/NotJsonapiMediaType'
        '422':
          description: 'Unprocessable entity.

            '
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/Errors'
              example:
                errors:
                - status: 422
                  source:
                    pointer: /data/attributes/name
                  code: invalid_resource
                  detail: can't be blank
  /orgs/{org_id}/workflows/{id}:
    get:
      tags:
      - Workflows in Asset Inventory/Asset Manager
      operationId: getWorkflow
      summary: Get a workflow
      description: Get information about a workflow including all of its statuses, events and handlers if requested.
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/resourceUuidParam'
      - $ref: '#/components/parameters/includeWithWorkflowParam'
      responses:
        '200':
          description: OK.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/SingleWorkflowResponseWithIncludes'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - Workflows in Asset Inventory/Asset Manager
      operationId: updateWorkflow
      summary: Update a workflow
      description: Make changes to metadata for an existing workflow, such as changing the name or the description.
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/resourceUuidParam'
      requestBody:
        description: The data required to update a workflow.
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/UpdateWorkflowPayload'
      responses:
        '200':
          description: Updated.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/SingleWorkflowResponse'
        '400':
          $ref: '#/components/responses/ResourceTypeMismatch'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/NotJsonapiMediaType'
        '422':
          description: 'Unprocessable entity.

            '
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/Errors'
              example:
                errors:
                - status: 422
                  source:
                    pointer: /data/attributes/name
                  code: invalid_resource
                  detail: can't be blank
    delete:
      tags:
      - Workflows in Asset Inventory/Asset Manager
      operationId: deleteWorkflow
      summary: Delete a workflow
      description: 'Permanently delete a workflow.


        Locked workflows cannot be deleted.


        System workflows cannot be deleted.


        Workflows linked to an asset type or asset record type cannot be deleted.'
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/resourceUuidParam'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/MissingOrgId'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /orgs/{org_id}/workflows/{api_name}:
    get:
      tags:
      - Workflows in Asset Inventory/Asset Manager
      operationId: getWorkflowByApiName
      summary: Get a workflow by api name
      description: Get information about a workflow, using api_name, including all of its statuses, events and handlers if requested.
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/apiNameParam'
      - $ref: '#/components/parameters/includeWithWorkflowParam'
      responses:
        '200':
          description: OK.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/SingleWorkflowResponseWithIncludes'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /orgs/{org_id}/workflows/{workflow_id}/statuses:
    post:
      tags:
      - Workflows in Asset Inventory/Asset Manager
      operationId: createWorkflowStatus
      summary: Create a workflow status
      description: 'Create a new status in a workflow.


        Note: Creating a new default status will unset the previous default status.'
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/workflowIdParam'
      requestBody:
        description: The data required to create a workflow status.
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/CreateWorkflowStatusPayload'
      responses:
        '201':
          description: Created.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/SingleWorkflowStatusResponse'
        '400':
          $ref: '#/components/responses/ResourceTypeMismatch'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/NotJsonapiMediaType'
        '422':
          description: 'Unprocessable entity.

            '
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/Errors'
              example:
                errors:
                - status: 422
                  source:
                    pointer: /data/attributes/name
                  code: invalid_resource
                  detail: can't be blank
  /orgs/{org_id}/statuses/{id}:
    get:
      tags:
      - Workflows in Asset Inventory/Asset Manager
      operationId: getWorkflowStatus
      summary: Get a workflow status
      description: Get information about a workflow status.
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/resourceUuidParam'
      - $ref: '#/components/parameters/statusIncludeParam'
      responses:
        '200':
          description: OK.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/SingleWorkflowStatusResponseWithIncluded'
        '400':
          $ref: '#/components/responses/MissingResourceId'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - Workflows in Asset Inventory/Asset Manager
      operationId: updateWorkflowStatus
      summary: Update a workflow status
      description: 'Make changes to an existing workflow status.


        Notes regarding default statuses:

        - updating a status to be the new default status will unset the previous default status

        - the current default status cannot be unset directly since otherwise there would be no default status anymore'
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/resourceUuidParam'
      requestBody:
        description: The data required to update a workflow status.
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/UpdateWorkflowStatusPayload'
      responses:
        '200':
          description: Updated.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/SingleWorkflowStatusResponse'
        '400':
          $ref: '#/components/responses/ResourceTypeMismatch'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/NotJsonapiMediaType'
        '422':
          description: 'Unprocessable entity.

            '
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/Errors'
              example:
                errors:
                - status: 422
                  source:
                    pointer: /data/attributes/name
                  code: invalid_resource
                  detail: can't be blank
    delete:
      tags:
      - Workflows in Asset Inventory/Asset Manager
      operationId: deleteWorkflowStatus
      summary: Delete a workflow status
      description: 'Permanently delete a workflow status.


        Locked workflow statuses cannot be deleted.


        System workflow statuses cannot be deleted.


        Statuses that are the default in the workflow cannot be deleted.


        Statuses linked to an asset or asset record cannot be deleted.'
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/resourceUuidParam'
      - $ref: '#/components/parameters/forceDeleteStatusParam'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/MissingOrgId'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /orgs/{org_id}/status_event_mappings:
    post:
      tags:
      - Workflows in Asset Inventory/Asset Manager
      operationId: createStatusEventMapping
      summary: Create a status event mapping
      description: Associating an event to a status
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      requestBody:
        description: The data required to create a status event mapping.
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/CreateStatusEventMappingPayload'
      responses:
        '201':
          description: Created.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/SingleStatusEventMappingResponse'
        '400':
          $ref: '#/components/responses/ResourceTypeMismatch'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/NotJsonapiMediaType'
        '422':
          description: 'Unprocessable entity.

            '
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/Errors'
              example:
                errors:
                - status: 422
                  source:
                    pointer: /data/attributes/status_id
                  code: invalid_resource
                  detail: can't be blank
  /orgs/{org_id}/status_event_mappings/{id}:
    get:
      tags:
      - Workflows in Asset Inventory/Asset Manager
      operationId: getStatusEventMapping
      summary: Get a status event mapping
      description: Get the mapping between a status and an event.
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/resourceUuidParam'
      responses:
        '200':
          description: OK.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/SingleStatusEventMappingResponse'
        '400':
          $ref: '#/components/responses/MissingResourceId'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - Workflows in Asset Inventory/Asset Manager
      operationId: updateStatusEventMapping
      summary: Update a status event mapping
      description: Update the mapping between a status and an event.
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/resourceUuidParam'
      requestBody:
        description: The data required to update a status event mapping.
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/UpdateStatusEventMappingPayload'
      responses:
        '200':
          description: Updated.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/SingleStatusEventMappingResponse'
        '400':
          $ref: '#/components/responses/ResourceTypeMismatch'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/NotJsonapiMediaType'
        '422':
          description: 'Unprocessable entity.

            '
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/Errors'
              example:
                errors:
                - status: 422
                  source:
                    pointer: /data/attributes/name
                  code: invalid_resource
                  detail: can't be blank
    delete:
      tags:
      - Workflows in Asset Inventory/Asset Manager
      operationId: deleteStatusEventMapping
      summary: Delete a status event mapping
      description: Permanently delete a status event mapping.
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/resourceUuidParam'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/MissingOrgId'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  schemas:
    SingleWorkflowResponse:
      type: object
      description: The data associated with the resource.
      required:
      - data
      properties:
        data:
          type: object
          description: The data associated with the resource.
          required:
          - id
          - type
          - attributes
          properties:
            id:
              type: string
              description: The ID of the workflow.
              example: 768cd1bc-d8af-4429-9aa0-8a4b477de42b
            type:
              type: string
              description: The classification of the object (`"workflows"`).
              example: workflows
            attributes:
              type: object
              description: The attributes associated with the resource.
              properties:
                name:
                  type: string
                  description: The name of the workflow. Names are case-insensitive and must be unique.
                  example: My first Workflow
                description:
                  type: string
                  description: The description of the workflow.
                  example: Description of My first Workflow
                locked:
                  type: boolean
                  description: Indicates that this workflow cannot be deleted by the user.
                  example: false
                  default: false
                api_name:
                  type: string
                  description: "The API name of the workflow that is unique within the org, uneditable after creation, and must satisfy the following restrictions:\n- No uppercase letters\n- No whitespace (use `\"_\"` to separate words)\n- No special characters\n\nNote: upon successful workflow creation a `\"__c\"` is appended to the provided api_name \nEx: my_api_name  -->  my_api_name__c\n"
                  example: my_workflow_api_name__c
                  default: null
                created_at:
                  type: string
                  description: The date the workflow was created.
                  example: '2019-02-09T13:17:26Z'
                  format: date-time
                updated_at:
                  type: string
                  description: The date the workflow was updated.
                  example: '2019-03-18T22:02:05Z'
                  format: date-time
                system:
                  type: boolean
                  description: Indicates that this workflow cannot be modified by the user.
                  example: false
                  default: false
    SingleWorkflowStatusResponse:
      type: object
      description: The data associated with the resource.
      required:
      - data
      properties:
        data:
          type: object
          description: The data associated with the resource.
          required:
          - id
          - type
          - attributes
          - relationships
          properties:
            id:
              type: string
              description: The ID of the workflow.
              example: 9af02c4a-3c98-4283-8c5d-8dc47e3bf663
            type:
              type: string
              description: The classification of the object (`"statuses"`).
              example: statuses
            attributes:
              type: object
              description: The attributes associated with the resource.
              properties:
                name:
                  type: string
                  description: The name of the status. Names are case-insensitive and must be unique.
                  example: My first Status
                description:
                  type: string
                  description: The description of the status.
                  example: Description of My first Status
                position:
                  type: integer
                  format: int64
                  description: Determines the visual order of statuses inside the workflow.
                  example: 8
                default:
                  type: boolean
                  description: Specifies that this status is the default for items in the workflow. Every workflow must have exactly one default status.
                  example: false
                  default: false
                locked:
                  type: boolean
                  description: Indicates that this status cannot be deleted by the user.
                  example: false
                  default: false
                color:
                  type:
                  - string
                  - 'null'
                  description: Hexadecimal value to capture a color for the field, used in display and reporting
                  example: '#7D00FF'
                created_at:
                  type: string
                  description: The date the status was created.
                  example: '2020-08-11T07:42:42Z'
                  format: date-time
                updated_at:
                  type: string
                  description: The date the status was updated.
                  example: '2020-08-11T07:42:42Z'
                  format: date-time
                system:
                  type: boolean
                  description: Indicates that this status cannot be modified by the user.
                  example: false
                  default: false
            relationships:
              type: object
              description: The relationships associated with the resource.
              properties:
                workflow:
                  type: object
                  description: The data associated with the resource.
                  required:
                  - data
                  properties:
                    data:
                      type: object
                      properties:
                        id:
                          type: string
                          description: The ID of the workflow.
                          example: 5ca23d96-8c07-4c74-b7fd-1240e46a74ab
                        type:
                          type: string
                          description: The classification of the object (`"workflows"`)
                          example: workflows
                  example:
                    data:
                      id: 5ca23d96-8c07-4c74-b7fd-1240e46a74ab
                      type: workflows
                events:
                  type: object
                  description: The data associated with the resource.
                  required:
                  - data
                  properties:
                    data:
                      type: array
                      items:
                        type: object
                        description: The data associated with the resource.
                        required:
                        - id
                        - type
                        properties:
                          id:
                            type: string
                            description: The ID of the event.
                            example: b125726f-ee4f-4ec9-9488-b6efa4ee1270
                          type:
                            type: string
                            description: The classification of the object (`"events"`).
                            example: events
                      example:
                      - id: 2b8d8374-43a8-4124-b29e-bcfafd899cc5
                        type: events
                      - id: a5b5896c-0724-4460-9361-c2ea0bce92c9
                        type: events
    SingleWorkflowResponseWithIncludes:
      type: object
      description: The data associated with the resource.
      required:
      - data
      - included
      properties:
        data:
          type: object
          description: The data associated with the resource.
          required:
          - id
          - type
          - attributes
          properties:
            id:
              type: string
              description: The ID of the workflow.
              example: 768cd1bc-d8af-4429-9aa0-8a4b477de42b
            type:
              type: string
              description: The classification of the object (`"workflows"`).
              example: workflows
            attributes:
              type: object
              description: The attributes associated with the resource.
              properties:
                name:
                  type: string
                  description: The name of the workflow. Names are case-insensitive and must be unique.
                  example: My first Workflow
                description:
                  type: string
                  description: The description of the workflow.
                  example: Description of My first Workflow
                locked:
                  type: boolean
                  description: Indicates that this workflow cannot be deleted by the user.
                  example: false
                  default: false
                api_name:
                  type: string
                  description: "The API name of the workflow that is unique within the org, uneditable after creation, and must satisfy the following restrictions:\n- No uppercase letters\n- No whitespace (use `\"_\"` to separate words)\n- No special characters\n\nNote: upon successful workflow creation a `\"__c\"` is appended to the provided api_name \nEx: my_api_name  -->  my_api_name__c\n"
                  example: my_workflow_api_name__c
                  default: null
                created_at:
                  type: string
                  description: The date the workflow was created.
                  example: '2019-02-09T13:17:26Z'
                  format: date-time
                updated_at:
                  type: string
                  description: The date the workflow was updated.
                  example: '2019-03-18T22:02:05Z'
                  format: date-time
                system:
                  type: boolean
                  description: Indicates that this workflow cannot be modified by the user.
                  example: false
                  default: false
            relationships:
              type: object
              description: Each workflow has associated statuses.
              required:
              - statuses
              properties:
                statuses:
                  type: object
                  description: The data associated with the resource.
                  required:
                  - data
                  properties:
                    data:
                      type: array
                      items:
                        type: object
                        description: The data associated with the resource.
                        required:
                        - id
                        - type
                        properties:
                          id:
                            type: string
                            description: The ID of the status.
                            example: b125726f-ee4f-4ec9-9488-b6efa4ee1270
                          type:
                            type: string
                            description: The classification of the object (`"statuses"`).
                            example: statuses
        included:
          type: array
          description: All the objects related to the resource
          items:
            type: object
          example:
          - type: statuses
            id: 9af02c4a-3c98-4283-8c5d-8dc47e3bf663
            attributes:
              name: status 1
              description: blahblah...
              locked: false
              position: 0
              default: true
            relationships:
              events:
                data:
                - type: events
                  id: 2a4fe563-920b-467d-96e2-a761587b5edf
          - type: events
            id: 2a4fe563-920b-467d-96e2-a761587b5edf
            attributes:
              admin_name: event 1
