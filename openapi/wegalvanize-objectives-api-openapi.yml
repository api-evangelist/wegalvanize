openapi: 3.2.0
info:
  title: HighBond API Reference Objectives API
  version: 1.1.0
  description: Welcome to the API documentation for HighBond.
  x-logo:
    url: ./assets/logo.png
    altText: HighBond Logo
servers:
- url: '{protocol}://{server}/v1'
  variables:
    protocol:
      default: https
    server:
      default: apis-us.highbond.com
      enum:
      - apis-us.highbond.com
      - apis-ca.highbond.com
      - apis-eu.highbond.com
      - apis-ap.highbond.com
      - apis-au.highbond.com
      - apis-af.highbond.com
      - apis-sa.highbond.com
      - apis-jp.highbond.com
security:
- bearerToken: []
tags:
- name: Objectives
  description: Objectives are the basis of a project or framework.
paths:
  /orgs/{org_id}/{parent_resource_type}/{parent_resource_id}/objectives:
    get:
      tags:
      - Objectives
      operationId: getObjectives
      summary: Get objectives
      description: Get all objectives in a project or framework.
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/parentResourceTypeParam'
      - $ref: '#/components/parameters/parentResourceIdParam'
      - $ref: '#/components/parameters/objectiveSparseFieldsetParams'
      - $ref: '#/components/parameters/pageSizeParam'
      - $ref: '#/components/parameters/pageNumberEncodedParam'
      responses:
        '200':
          description: OK.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/GetObjectivesResponse'
        '400':
          $ref: '#/components/responses/MissingResourceId'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/NotJsonapiMediaType'
    post:
      tags:
      - Objectives
      operationId: createObjective
      summary: Create an objective
      description: 'Create a new objective in an existing project or framework.


        Limitations:

        * There can be a maximum of 500 objectives per project or framework.

        * Specifying a person''s name or email in the following fields does not automatically notify them via email: `owner`, `executive_owner`. If you want these fields to take effect, omit the `owner_user` and `executive_owner_user` fields.

        * Providing `owner_user` and `executive_owner_user` will assign the objective to the user respectively and notify them via email. In this case, the `owner` and `executive_owner` fields will be ignored.'
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/parentResourceTypeParam'
      - $ref: '#/components/parameters/parentResourceIdParam'
      - $ref: '#/components/parameters/objectiveSparseFieldsetParams'
      requestBody:
        description: The data required to create an objective.
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/CreateObjectiveRequest'
      responses:
        '201':
          description: Created.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/GetObjectiveResponse'
        '400':
          $ref: '#/components/responses/ResourceTypeMismatch'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/NotJsonapiMediaType'
        '422':
          description: 'Unprocessable entity.

            '
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/Errors'
              example:
                errors:
                - status: 422
                  source:
                    pointer: /data/attributes/title
                  code: invalid_resource
                  detail: can't be blank
  /orgs/{org_id}/objectives/{id}:
    get:
      tags:
      - Objectives
      operationId: getObjective
      summary: Get an objective
      description: Get information about an objective.
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/resourceIdParam'
      - $ref: '#/components/parameters/objectiveSparseFieldsetParams'
      responses:
        '200':
          description: OK.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/GetObjectiveResponseWithIncludes'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - Objectives
      operationId: updateObjective
      summary: Update an objective
      description: 'Make changes to an objective in a project or framework, like renaming the objective or specifying an owner.


        Limitations:

        * You cannot update the objective if it has been checked out using

        Offline Projects or the

        HighBond iPad app.

        * Specifying a person''s name or email in the following fields does not automatically notify them via email: `owner`, `executive_owner`. If you want these fields to take effect, omit the `owner_user` and `executive_owner_user` fields.

        * Providing `owner_user` and `executive_owner_user` will assign the objective to the user respectively and notify them via email. In this case, the `owner` and `executive_owner` fields will be ignored.'
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/resourceIdParam'
      - $ref: '#/components/parameters/objectiveSparseFieldsetParams'
      requestBody:
        description: The data required to update an objective.
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/UpdateObjectiveRequest'
      responses:
        '200':
          description: OK.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/GetObjectiveResponseWithIncludes'
        '400':
          $ref: '#/components/responses/MissingResourceId'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/NotJsonapiMediaType'
        '422':
          description: 'Unprocessable entity.

            '
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/Errors'
              example:
                errors:
                - status: 422
                  source:
                    pointer: /data/attributes/name
                  code: invalid_resource
                  detail: can't be blank
                - status: 422
                  source:
                    pointer: /data/attributes/entities
                  code: invalid_resource
                  detail: 'Missing child or parent entity ids: [1, 2 ,3]'
                - status: 422
                  source:
                    pointer: /data/attributes/entities
                  code: invalid_resource
                  detail: 'Missing inherited entity ids: [1, 2, 3]'
                - status: 422
                  source:
                    pointer: /data/attributes/entities
                  code: invalid_resource
                  detail: Entities not found
    delete:
      tags:
      - Objectives
      operationId: deleteObjective
      summary: Delete an objective
      description: 'Permanently delete an objective from a project or framework.


        Limitations:

        You cannot delete the objective in the following scenarios:

        * if the objective is included in an existing certification program

        * if the objective has been checked out using

        Offline Projects or the

        HighBond iPad app


        > **Caution —**

        Deleting an objective also removes associated data (including risks, controls, walkthroughs, test plans, control tests, to-dos, requests, issues, actions, time entries, etc.). Once deleted, you cannot access or restore the objective.'
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/resourceIdParam'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: 'Unprocessable entity.

            '
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/Errors'
              example:
                errors:
                - status: 422
                  code: certification_association
                  detail: This objective is associated with one or more certifications. To delete this objective, you must delete the associated certification.
  /orgs/{org_id}/objectives/{objective_id}/entities:
    post:
      tags:
      - Objectives
      operationId: createObjectiveEntityLink
      summary: Create objective entity link
      description: 'Link entity to an objective.


        > **Note**

        > * Tagging an objective to an entity automatically tags an objective with all ancestor entities and descendant entities.

        > * Request Get an objective with `entities` query param to get the whole list of entities linked to an objective.


        Limitations:

        * You cannot tag the objective with entity if it has been checked out using

        Offline Projects or the

        HighBond iPad app.

        * Only 1 entity can be sent in the request payload.


        Learn more about tagging items with entities.'
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/objectiveIdParam'
      requestBody:
        description: The data required to create a objective entity link.
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/CreateObjectiveEntityRequest'
      responses:
        '201':
          description: Created.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/CreateObjectiveEntityResponse'
        '400':
          $ref: '#/components/responses/MissingResourceId'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/NotJsonapiMediaType'
        '422':
          description: 'Unprocessable entity.

            '
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/Errors'
              example:
                errors:
                - status: 422
                  source:
                    pointer: /data/attributes/base
                  code: invalid_resource
                  detail: Entity and Responsibility should reference the same account
  /orgs/{org_id}/objectives/{objective_id}/entities/{id}:
    delete:
      tags:
      - Objectives
      operationId: deleteObjectiveEntityLink
      summary: Delete objective entity link
      description: 'Permanently delete objective entity link.


        > **Note -**

        Untagging an objective from an entity automatically untags an objective from all descendant entities.


        Limitations:

        * You cannot untag an objective from an entity if it has been checked out using

        Offline Projects or the

        HighBond iPad app.

        * Inherited entity tags cannot be removed.'
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/objectiveIdParam'
      - $ref: '#/components/parameters/resourceIdParam'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/MissingOrgId'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/NotJsonapiMediaType'
        '422':
          description: 'Unprocessable entity.

            '
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/Errors'
              example:
                errors:
                - status: 422
                  source:
                    pointer: /data/attributes/base
                  code: invalid_resource
                  title: Invalid resource
                  detail: Cannot delete an inherited Entity.
components:
  schemas:
    CreateObjectiveEntityRequest:
      type: object
      description: The data associated with the resource.
      required:
      - data
      properties:
        data:
          type: object
          description: The data associated with the resource.
          required:
          - id
          - type
          properties:
            id:
              type: string
              description: The ID of the objective.
              example: '1'
            type:
              type: string
              description: The classification of the object (`"entities"`).
              example: entities
    GetObjectiveResponseWithIncludes:
      type: object
      description: The data included in the response.
      required:
      - data
      properties:
        data:
          type: object
          description: The data associated with the resource.
          required:
          - id
          - type
          - attributes
          - relationships
          properties:
            id:
              type: string
              description: The ID of the requested resource.
              example: '1'
            type:
              type: string
              description: The classification of the object (`"objectives"`).
              example: objectives
            attributes:
              type: object
              description: The attributes associated with the resource.
              required:
              - title
              - reference
              properties:
                title:
                  type: string
                  description: The title of the objective.
                  maxLength: 60
                  example: Objective Title
                reference:
                  type: string
                  description: The reference number or code for the objective.
                  maxLength: 8
                  example: ITC
                description:
                  type: string
                  description: A detailed description of the objective.
                  example: Objective description
                division_department:
                  type: string
                  description: The division or department responsible for the objective.
                  example: Finance
                owner:
                  type: string
                  description: 'The person responsible for the objective. Specifying a person''s name or email does not automatically send them

                    an email notification about the objective. If you want this field to take effect when creating or updating an objective,

                    omit the `owner_user` field of the `relationships` section in the request data.

                    '
                  example: thomas@sodor.ca
                executive_owner:
                  type: string
                  description: 'The executive owner of the objective. Specifying a person''s name or email does not automatically send them

                    an email notification about the objective. If you want this field to take effect when creating or updating an objective,

                    omit the `executive_owner_user` field of the `relationships` section in the request data.

                    '
                  example: henry@sodor.com
                position:
                  type: integer
                  format: int64
                  description: 'The value that determines the order in which it is displayed in the index action. `position` must be a value between `1` and `2147483647`.

                    '
                  example: 1
                risk_control_matrix_id:
                  type: string
                  description: The id of the risk control matrix.
                  example: '100'
                walkthrough_summary_id:
                  type:
                  - string
                  - 'null'
                  description: The id of the walkthrough summary.
                  example: '200'
                testing_round_1_id:
                  type:
                  - string
                  - 'null'
                  description: The id of testing round 1 (if applicable).
                  example: '301'
                testing_round_2_id:
                  type:
                  - string
                  - 'null'
                  description: The id of testing round 2 (if applicable).
                  example: '302'
                testing_round_3_id:
                  type:
                  - string
                  - 'null'
                  description: The id of testing round 3 (if applicable).
                  example: '303'
                testing_round_4_id:
                  type:
                  - string
                  - 'null'
                  description: The id of testing round 4 (if applicable).
                  example: '304'
                created_at:
                  type: string
                  description: The timestamp identifying when the objective was created.
                  example: '2019-02-09T13:17:26Z'
                  format: date-time
                updated_at:
                  type: string
                  description: The timestamp identifying when the objective was last updated.
                  example: '2019-02-09T13:17:26Z'
                  format: date-time
                planned_start_date:
                  type:
                  - string
                  - 'null'
                  description: Planned start date
                  example: '2019-02-09'
                  format: date
                planned_end_date:
                  type:
                  - string
                  - 'null'
                  description: Planned end date.
                  example: '2019-02-10'
                  format: date
                actual_start_date:
                  type:
                  - string
                  - 'null'
                  description: Actual start date.
                  example: '2019-02-09'
                  format: date
                actual_end_date:
                  type:
                  - string
                  - 'null'
                  description: Actual end date.
                  example: '2019-02-10'
                  format: date
                actual_milestone_date:
                  type:
                  - string
                  - 'null'
                  description: Actual milestone date.
                  example: '2019-02-10'
                  format: date
                planned_milestone_date:
                  type:
                  - string
                  - 'null'
                  description: Planned milestone date.
                  example: '2019-02-09'
                  format: date
                custom_attributes:
                  type: array
                  description: An array of custom attributes defined on the project type used by the project this objective is from. <a href="https://help.highbond.com/helpdocs/highbond/en-us/Default.htm#cshid=pm-project-types" target="_blank">Learn more about project types</a>. Make a PATCH request to modify the value of a custom attribute.
                  items:
                    type: object
                    description: A user defined custom attribute value.
                    properties:
                      id:
                        type: string
                        description: The ID of this custom attribute. Optional if term is included.
                        example: '42'
                      term:
                        type: string
                        description: The user defined term used to identify this custom attribute. Optional if id is included.
                        example: Custom Objective Attribute
                      value:
                        type: array
                        description: The value or values (for multiselect) for this custom attribute.
                        example:
                        - Custom Select Option Text
                        items:
                          type: string
                risk_assurance_data:
                  type: object
                  description: 'Fields that determines assurance values. Assurance is an expression of confidence that risk is effectively mitigated. Returns `null` if Risk Assurance feature is disabled.

                    '
                  properties:
                    inherent_risk:
                      type: number
                      format: float
                      description: 'The risk that an activity would pose if no controls or other mitigating factors were in place. Can also be referred to as the gross risk, or risks before controls, and can act as the baseline for your organization''s risk tolerance or appetite.

                        '
                      example: 1.1
                    residual_risk:
                      type: number
                      format: float
                      description: 'The risk that remains after controls are taken into account. Can also be referred to as the net risk or risk after controls.

                        '
                      example: 1.1
                    assurance:
                      type: number
                      description: 'The level of assurance that the controls in place effectively mitigate risk to the business.

                        '
                      example: 0
            relationships:
              type: object
              description: The relationships associated with the resource.
              required:
              - assigned_user
              properties:
                project:
                  type: object
                  description: 'Each objective has an associated project or framework. Project/framework is a management system that allows you to define and compile information

                    for reporting purposes.

                    '
                  required:
                  - data
                  properties:
                    data:
                      type: object
                      description: The data associated with the resource.
                      required:
                      - id
                      - type
                      properties:
                        id:
                          type: string
                          description: The ID of the project.
                          example: '1'
                        type:
                          type: string
                          description: The classification of the object (`"projects"`).
                          example: projects
                framework:
                  type: object
                  description: 'Each objective has an associated project or framework. Project/framework is a management system that allows you to define and compile information

                    for reporting purposes.

                    '
                  required:
                  - data
                  properties:
                    data:
                      type: object
                      description: The data associated with the resource.
                      required:
                      - id
                      - type
                      properties:
                        id:
                          type: string
                          description: The ID of the framework.
                          example: '1'
                        type:
                          type: string
                          description: The classification of the object (`"frameworks"`).
                          example: frameworks
                framework_origin:
                  type: object
                  description: 'In the Projects app, a project `objective` can have a related counterpart in an associated framework. The `framework_origin` attribute allows you to associate an `objective` in a project with its related counterpart in a framework. Can be set only when `parent_resource_type` is `projects`.

                    '
                  required:
                  - data
                  properties:
                    data:
                      type: object
                      description: The data associated with the resource.
                      required:
                      - id
                      - type
                      properties:
                        id:
                          type: string
                          description: The ID of the parent objective.
                          example: '1'
                        type:
                          type: string
                          description: The classification of the object (`"objectives"`).
                          example: objectives
                assigned_user:
                  type: object
                  description: 'The person assigned to the objective. Only users assigned the Professional Manager or Professional User role in the project can be specified.

                    The user specified receives an email notification with a link to the objective, is able to view the objective on the project dashboard,

                    and has full read and write access to the objective.

                    '
                  required:
                  - data
                  properties:
                    data:
                      type: object
                      description: The data associated with the resource.
                      required:
                      - id
                      - type
                      properties:
                        id:
                          type: string
                          description: 'The unique identifier (UID) of the assigned user. For more information on obtaining this value, see

                            <a href="#section/Making-requests">Making requests</a>.

                            '
                          example: 3NQ6XzAUxqJMnAQ7n4KF
                        type:
                          type: string
                          description: The classification of the object (`"users"`).
                          example: users
                entities:
                  type: object
                  description: Each objective has an associated objective entities.
                  required:
                  - data
                  properties:
                    data:
                      type: array
                      description: The data associated with the resource.
                      items:
                        type: object
                        required:
                        - id
                        - type
                        properties:
                          id:
                            type: string
                            description: The ID of the entity.
                            example: '1'
                          type:
                            type: string
                            description: The classification of the object (`"entities"`).
                            example: entities
                owner_user:
                  type: object
                  description: 'Allows you to assign a licensed or non-licensed user as an owner of the objective for tracking and reporting purposes. This is an optional field.

                    Typically this is the key person accountable for the process/risk/control (often the manager of the function).

                    Managers responsible for an entire objective that have been assigned the Contributor Tester or Contributor User or Contributor Manager role are assigned as an owner of an objective.

                    Once a person is assigned as an owner of an objective, they receive an email notification with a link to the objective, granting them write access to controls and read access to risks and the objective overview.

                    If you provide this field when creating or updating an objective, the `owner` field will be ignored.

                    '
                  required:
                  - data
                  properties:
                    data:
                      type: object
                      description: The data associated with the resource.
                      properties:
                        id:
                          type: string
                          description: 'The unique identifier (UID) of the assigned user. For more information on obtaining this value, see

                            <a href="#section/Making-requests">Making requests</a>.

                            '
                          example: 3NQ6XzAUxqJMnAQ7n4KF
                        type:
                          type: string
                          description: The classification of the object (`"users"`).
                          example: users
                executive_owner_user:
                  type: object
                  description: 'Allows you to assign a licensed or non-licensed user as an executive owner of the objective for tracking and reporting purposes. This is an optional field.

                    Typically this is a sponsor/leader accountable for the process/risk/control (often the VP/C-Suite of the owner).

                    This may be board or executive members that are responsible for an entire objective and have been assigned the Contributor Tester or Contributor User or Contributor Manager role are assigned as an executive owner of an objective.

                    After a person has been assigned as executive owner, they receive an email notification with a link to the objective, granting them write access to controls and read access to risks and the objective overview.

                    If you provide this field when creating or updating an objective, the `executive_owner` field will be ignored.

                    '
                  required:
                  - data
                  properties:
                    data:
                      type: object
                      description: The data associated with the resource.
                      properties:
                        id:
                          type: string
                          description: 'The unique identifier (UID) of the assigned user. For more information on obtaining this value, see

                            <a href="#section/Making-requests">Making requests</a>.

                            '
                          example: 3NQ6XzAUxqJMnAQ7n4KF
                        type:
                          type: string
                          description: The classification of the object (`"users"`).
                          example: users
    GetObjectiveResponse:
      type: object
      description: The data associated with the resource.
      required:
      - data
      - links
      properties:
        data:
          type: object
          description: The data associated with the resource.
          required:
          - id
          - type
          - attributes
          - relationships
          properties:
            id:
              type: string
              description: The ID of the requested resource.
              example: '1'
            type:
              type: string
              description: The classification of the object (`"objectives"`).
              example: objectives
            attributes:
              type: object
              description: The attributes associated with the resource.
              required:
              - title
              - reference
              properties:
                title:
                  type: string
                  description: The title of the objective.
                  maxLength: 60
                  example: Objective Title
                reference:
                  type: string
                  description: The reference number or code for the objective.
                  maxLength: 8
                  example: ITC
                description:
                  type: string
                  description: A detailed description of the objective.
                  example: Objective description
                division_department:
                  type: string
                  description: The division or department responsible for the objective.
                  example: Finance
                owner:
                  type: string
                  description: 'The person responsible for the objective. Specifying a person''s name or email does not automatically send them

                    an email notification about the objective. If you want this field to take effect when creating or updating an objective,

                    omit the `owner_user` field of the `relationships` section in the request data.

                    '
                  example: thomas@sodor.ca
                executive_owner:
                  type: string
                  description: 'The executive owner of the objective. Specifying a person''s name or email does not automatically send them

                    an email notification about the objective. If you want this field to take effect when creating or updating an objective,

                    omit the `executive_owner_user` field of the `relationships` section in the request data.

                    '
                  example: henry@sodor.com
                position:
                  type: integer
                  format: int64
                  description: 'The value that determines the order in which it is displayed in the index action. `position` must be a value between `1` and `2147483647`.

                    '
                  example: 1
                risk_control_matrix_id:
                  type: string
                  description: The id of the risk control matrix.
                  example: '100'
