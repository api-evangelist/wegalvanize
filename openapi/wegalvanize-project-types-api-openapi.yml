openapi: 3.2.0
info:
  title: HighBond API Reference Project types API
  version: 1.1.0
  description: Welcome to the API documentation for HighBond.
  x-logo:
    url: ./assets/logo.png
    altText: HighBond Logo
servers:
- url: '{protocol}://{server}/v1'
  variables:
    protocol:
      default: https
    server:
      default: apis-us.highbond.com
      enum:
      - apis-us.highbond.com
      - apis-ca.highbond.com
      - apis-eu.highbond.com
      - apis-ap.highbond.com
      - apis-au.highbond.com
      - apis-af.highbond.com
      - apis-sa.highbond.com
      - apis-jp.highbond.com
security:
- bearerToken: []
tags:
- name: Project Types
  description: Project types define the structure of a project or framework, including the terminology used in the project or framework.
paths:
  /orgs/{org_id}/project_types:
    get:
      tags:
      - Project Types
      operationId: getProjectTypes
      summary: Get project types
      description: '> **Deprecation notice —**

        Please note that `conclusion_values_true` and `conclusion_values_false` fields will be deprecated. Consider using new `conclusion_status_options_true` and `conclusion_status_options_false` fields instead.


        Get all project types for an account.'
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/projectTypeSparseFieldsetParams'
      - $ref: '#/components/parameters/pageSizeParam'
      - $ref: '#/components/parameters/pageNumberEncodedParam'
      - $ref: '#/components/parameters/filterName'
      responses:
        '200':
          description: OK.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/GetProjectTypesResponse'
        '400':
          $ref: '#/components/responses/MissingResourceId'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/NotJsonapiMediaType'
    post:
      tags:
      - Project Types
      operationId: createProjectType
      summary: Create or copy a project type
      description: 'Create or copy a new project type to define a customized project or framework structure.


        Creating a project type:


        When creating a new project type, only the basic defining attributes are available. After creating the project type default customizable terms and toggles

        are returned and available on PATCH requests for update.


        Copying a project type:


        When copying an existing project type, you must define a `source_project_type_id` parameter in your request data, with its value being the ID of the

        existing project type you want to copy. Do not include this if you wish to create a new project type. The `attributes` object must be included in the

        request data, however, it will be ignored when copying.


        Limitations:

        * There can be a maximum of 500 project types per HighBond instance.'
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/projectTypeSparseFieldsetParams'
      requestBody:
        description: The data required to create a project type.
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/CreateProjectTypeRequest'
      responses:
        '201':
          description: Created.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/GetProjectTypeResponse'
        '400':
          $ref: '#/components/responses/MissingOrgId'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/NotJsonapiMediaType'
        '422':
          description: 'Unprocessable entity.

            '
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/Errors'
              example:
                errors:
                - status: 422
                  source:
                    pointer: /data/attributes/name
                  code: invalid_resource
                  detail: can't be blank
  /orgs/{org_id}/project_types/{id}:
    get:
      tags:
      - Project Types
      operationId: getProjectType
      summary: Get a project type
      description: '> **Deprecation notice —**

        Please note that `conclusion_values_true` and `conclusion_values_false` fields will be deprecated. Consider using new `conclusion_status_options_true` and `conclusion_status_options_false` fields instead.


        Get information about a project type.'
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/resourceIdParam'
      - $ref: '#/components/parameters/projectTypeSparseFieldsetParams'
      responses:
        '200':
          description: OK.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/GetProjectTypeResponse'
        '400':
          $ref: '#/components/responses/MissingResourceId'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - Project Types
      operationId: updateProjectType
      summary: Update a project type
      description: '> **Deprecation notice —**

        Please note that `conclusion_values_true` and `conclusion_values_false` fields will be deprecated. Consider using new `conclusion_status_options_true` and `conclusion_status_options_false` fields instead.


        Make changes to a project type, like renaming it or updating its description.


        Limitations:

        * You cannot update the attribute if a term is not compatible with workflow. Learn more about project types.


        > **Caution —**

        Updates to project types apply to all active projects, archived projects, temporarily deleted projects, and frameworks associated with the project type.'
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/resourceIdParam'
      - $ref: '#/components/parameters/projectTypeSparseFieldsetParams'
      requestBody:
        description: The data required to update a project type.
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/UpdateProjectTypeRequest'
      responses:
        '200':
          description: OK.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/GetProjectTypeResponse'
        '400':
          $ref: '#/components/responses/MissingResourceId'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/NotJsonapiMediaType'
        '422':
          description: 'Unprocessable entity.

            '
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/Errors'
              example:
                errors:
                - status: 422
                  source:
                    pointer: /data/attributes/name
                  code: invalid_resource
                  detail: can't be blank
    delete:
      tags:
      - Project Types
      operationId: deleteProjectType
      summary: Delete a project type
      description: 'Delete a project type from a HighBond instance.


        Limitation:

        You cannot delete project types that are associated with active projects, archived projects, temporarily deleted projects, or frameworks.


        > **Caution —**

        Deleting a project type is permanent. Once deleted, you cannot access or restore the project type.'
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/resourceIdParam'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/MissingResourceId'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: 'Unprocessable entity.

            '
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/Errors'
              example:
                errors:
                - status: 422
                  source:
                    pointer: /data/attributes/base
                  code: invalid_resource
                  title: Invalid resource
                  detail: has existing projects
components:
  parameters:
    orgIdParam:
      in: path
      name: org_id
      description: The ID of the HighBond instance.
      required: true
      schema:
        type: string
        example: 1
    pageSizeParam:
      in: query
      name: page[size]
      description: The number of items returned per page. Default is 50. Maximum is 100.
      required: false
      schema:
        type: string
        example: 25
    projectTypeSparseFieldsetParams:
      in: query
      name: fields[project_types]
      description: Requesting the API to return only the specified fields. For more information, see <a href="#section/Making-requests">Making requests</a>
      required: false
      schema:
        type: string
        example: name,description,workflow,project_terms,certification_terms,control_terms,finding_terms,finding_retest_terms,finding_remediation_terms,control_test_terms,narrative_terms,objective_terms,planning_terms,results_terms,risk_terms,risk_control_matrix_terms,test_plan_terms,process_walkthrough_terms,walkthrough_terms,testing_round_terms,assigned_users
    resourceIdParam:
      in: path
      name: id
      description: The ID of the requested resource.
      required: true
      schema:
        type: string
        example: 9999
    pageNumberEncodedParam:
      in: query
      name: page[number]
      description: The Base64-encoded page number of records to return.
      required: false
      schema:
        type: string
        example: Mg==
    filterName:
      in: query
      name: filter[name]
      description: Filter by name.  Response will include partial matches and ignore case.
      required: false
      schema:
        type: string
        example: LoremIpsum
  schemas:
    GetProjectTypeResponse:
      type: object
      required:
      - data
      properties:
        data:
          type: object
          description: The data associated with the resource.
          required:
          - id
          - type
          - attributes
          - relationships
          properties:
            id:
              type: string
              description: The ID of the requested resource.
              example: 1
            type:
              type: string
              description: The classification of the object (`"project_types"`).
              example: project_types
            attributes:
              type: object
              description: The attributes associated with the resource.
              properties:
                name:
                  type: string
                  description: The name of the project type.
                  maxLength: 255
                  example: Project type name
                description:
                  type: string
                  description: A detailed description of the project type.
                  maxLength: 255
                  example: Project type description.
                workflow:
                  type: string
                  description: 'The type of workflow associated with the project type. The workflow can be Workplan (`procedure`) or Internal Control (`control`).


                    `procedure` workflows are appropriate for straight-forward projects and frameworks, which consist of a set of steps or procedures that the assurance team will execute,

                    and the documentation of the outcome of each step. The attributes `narrative_terms`, `control_test_terms`, and `test_plan_terms` are not available for this workflow.


                    `control` workflows are appropriate for more complex types of projects and frameworks, where narratives are

                    defined, walkthroughs are performed to verify control design, and tests are performed to verify the operating effectiveness of controls.


                    For more information, see <a href="https://help.highbond.com/helpdocs/highbond/en-us/Default.htm#cshid=pm-project-types" target="_blank">Workflows and project types</a>.

                    '
                  example: control
                enable_creating_projects:
                  type: boolean
                  description: 'Specifies if users with the appropriate permissions can create new projects and frameworks using this project type (`true`) or if they cannot (`false`).


                    Typically, you specify `true` when you have finalized your project type settings and you are ready for others to use the project type. If you want the project type

                    to remain in draft mode, and prevent others from using it, specify `false`.

                    '
                  default: true
                  example: true
                project_terms:
                  type: object
                  description: The terms of the project.
                  properties:
                    term_for_project:
                      type:
                      - string
                      - 'null'
                      description: The term for the project.
                      example: Project
                    term_for_risk_control_matrix:
                      type:
                      - string
                      - 'null'
                      description: The term for Risk Control Matrix.
                      example: Risk Control Matrix
                    term_for_risk_control_matrix_short:
                      type:
                      - string
                      - 'null'
                      description: The short term for Risk Control Matrix.
                      example: RCM
                    term_for_fieldwork:
                      type:
                      - string
                      - 'null'
                      description: The term for fieldwork.
                      example: Fieldwork
                    term_for_planned_start_date:
                      type:
                      - string
                      - 'null'
                      description: Planned start date.
                      example: Planned start date
                    term_for_planned_end_date:
                      type:
                      - string
                      - 'null'
                      description: Planned end date.
                      example: Planned end date
                    planned_dates_enabled:
                      type:
                      - boolean
                      - 'null'
                      description: Planned dates enabled.
                      example: true
                    term_for_actual_start_date:
                      type:
                      - string
                      - 'null'
                      description: Actual start date.
                      example: Actual start date
                    term_for_actual_end_date:
                      type:
                      - string
                      - 'null'
                      description: Actual end date.
                      example: Actual end date
                    actual_dates_enabled:
                      type:
                      - boolean
                      - 'null'
                      description: Actual dates enabled.
                      example: true
                    term_for_planned_milestone_date:
                      type:
                      - string
                      - 'null'
                      description: Planned milestone date.
                      example: Planned milestone date
                    planned_milestone_date_enabled:
                      type:
                      - boolean
                      - 'null'
                      description: Planned milestone date enabled.
                      example: true
                    term_for_actual_milestone_date:
                      type:
                      - string
                      - 'null'
                      description: Term for actual milestone date.
                      example: Actual milestone date
                    actual_milestone_date_enabled:
                      type:
                      - boolean
                      - 'null'
                      description: Actual milestone date enabled.
                      example: true
                objective_terms:
                  type: object
                  description: The terms of the objective.
                  properties:
                    term_for_objective:
                      type:
                      - string
                      - 'null'
                      description: The term for Section.
                      example: Section
                    term_for_objectives:
                      type:
                      - string
                      - 'null'
                      description: The term for Sections.
                      example: Sections
                    term_for_objective_reference:
                      type:
                      - string
                      - 'null'
                      description: The term for Objective Reference
                      example: Reference
                    term_for_objective_location:
                      type:
                      - string
                      - 'null'
                      description: The term for Objective Location
                      example: Division/Department
                    term_for_objective_owner:
                      type:
                      - string
                      - 'null'
                      description: The term for Owner.
                      example: Owner
                    term_for_objective_executive_owner:
                      type:
                      - string
                      - 'null'
                      description: The term for executive owner.
                      example: Executive Owner
                    term_for_planned_start_date:
                      type:
                      - string
                      - 'null'
                      description: Planned start date.
                      example: Planned start date
                    term_for_planned_end_date:
                      type:
                      - string
                      - 'null'
                      description: Planned end date.
                      example: Planned end date
                    planned_dates_enabled:
                      type:
                      - boolean
                      - 'null'
                      description: Planned dates enabled.
                      example: true
                    term_for_actual_start_date:
                      type:
                      - string
                      - 'null'
                      description: Actual start date.
                      example: Actual start date
                    term_for_actual_end_date:
                      type:
                      - string
                      - 'null'
                      description: Actual end date.
                      example: Actual end date
                    actual_dates_enabled:
                      type:
                      - boolean
                      - 'null'
                      description: Actual dates enabled.
                      example: true
                    term_for_planned_milestone_date:
                      type:
                      - string
                      - 'null'
                      description: Planned milestone date.
                      example: Planned milestone date
                    planned_milestone_date_enabled:
                      type:
                      - boolean
                      - 'null'
                      description: Planned milestone date enabled.
                      example: true
                    term_for_actual_milestone_date:
                      type:
                      - string
                      - 'null'
                      description: Term for actual milestone date.
                      example: Actual milestone date
                    actual_milestone_date_enabled:
                      type:
                      - boolean
                      - 'null'
                      description: Actual milestone date enabled.
                      example: true
                process_walkthrough_terms:
                  type: object
                  description: The terms of process walkthrough.
                  properties:
                    term_for_preparer_signoff:
                      type: string
                      example: Preparer
                    term_for_detail_reviewer_signoff:
                      type: string
                      example: Detail Reviewer
                    term_for_general_reviewer_signoff:
                      type: string
                      example: General Reviewer
                    term_for_supplemental_reviewer_signoff:
                      type:
                      - string
                      - 'null'
                      example: Supplemental Reviewer
                    term_for_specialty_reviewer_signoff:
                      type:
                      - string
                      - 'null'
                      example: Specialty Reviewer
                    detail_reviewer_signoff_enabled:
                      type: boolean
                      example: true
                    general_reviewer_signoff_enabled:
                      type: boolean
                      example: true
                    supplemental_reviewer_signoff_enabled:
                      type: boolean
                      example: true
                    specialty_reviewer_signoff_enabled:
                      type: boolean
                      example: true
                walkthrough_terms:
                  type: object
                  description: The terms of walkthrough. In a Workplan workflow project, a walkthrough is called an execute procedure.
                  properties:
                    term_for_walkthrough:
                      type:
                      - string
                      - 'null'
                      description: The term for Walkthrough.
                      example: Walkthrough
                    term_for_walkthroughs:
                      type:
                      - string
                      - 'null'
                      description: The term for Walkthroughs.
                      example: walkthroughs
                    term_for_walkthrough_walkthrough:
                      type:
                      - string
                      - 'null'
                      description: The term for Walkthrough Results.
                      example: Walkthrough Terms
                    term_for_walkthrough_control_verified:
                      type:
                      - string
                      - 'null'
                      description: The term for is the Control designed appropriately.
                      example: Is my control designed appropriately?
                    control_verified_values_true:
                      type:
                      - string
                      - 'null'
                      description: The term choices for Control Designed Appropriately. The exact values for this field (E.g. "Designed Appropriately" / "No Issues") depend on the <a href=" https://help.highbond.com/helpdocs/highbond/en-us/Default.htm#cshid=pm-customize-terms" target="_blank">configuration of the project type</a>.
                      example: Designed Appropriately
                    control_verified_values_false:
                      type:
                      - string
                      - 'null'
                      description: The term choices for Control Design Failure. The exact values for this field (E.g. "Design Failure" / "Issue(s) Noted") depend on the <a href=" https://help.highbond.com/helpdocs/highbond/en-us/Default.htm#cshid=pm-customize-terms" target="_blank">configuration of the project type</a>.
                      example: Designed Failure
                    walkthrough_enabled:
                      type: boolean
                      description: Whether the walkthrough terms are enabled
                      example: true
                    term_for_preparer_signoff:
                      type: string
                      example: Preparer
                    term_for_detail_reviewer_signoff:
                      type: string
                      example: Detail Reviewer
                    term_for_general_reviewer_signoff:
                      type: string
                      example: General Reviewer
                    term_for_supplemental_reviewer_signoff:
                      type:
                      - string
                      - 'null'
                      example: Supplemental Reviewer
                    term_for_specialty_reviewer_signoff:
                      type:
                      - string
                      - 'null'
                      example: Specialty Reviewer
                    preparer_signoff_enabled:
                      type: boolean
                      example: true
                    detail_reviewer_signoff_enabled:
                      type: boolean
                      example: true
                    general_reviewer_signoff_enabled:
                      type: boolean
                      example: true
                    supplemental_reviewer_signoff_enabled:
                      type: boolean
                      example: true
                    specialty_reviewer_signoff_enabled:
                      type: boolean
                      example: true
                    term_for_planned_milestone_date:
                      type:
                      - string
                      - 'null'
                      description: Planned milestone date.
                      example: Planned milestone date
                    planned_milestone_date_enabled:
                      type:
                      - boolean
                      - 'null'
                      description: Planned milestone date enabled.
                      example: true
                    term_for_actual_milestone_date:
                      type:
                      - string
                      - 'null'
                      description: Term for actual milestone date.
                      example: Actual milestone date
                    actual_milestone_date_enabled:
                      type:
                      - boolean
                      - 'null'
                      description: Actual milestone date enabled.
                      example: true
                control_terms:
                  type: object
                  description: The terms of control.
                  properties:
                    term_for_control:
                      type:
                      - string
                      - 'null'
                      description: The term for Control.
                      example: Control
                    term_for_controls:
                      type:
                      - string
                      - 'null'
                      description: The term for Control (plural).
                      example: Controls
                    term_for_control_id:
                      type:
                      - string
                      - 'null'
                      description: The term for Control Id.
                      example: Control ID
                    term_for_control_owner:
                      type:
                      - string
                      - 'null'
                      description: The term for Control Owner.
                      example: Control Owner
                    term_for_control_frequency:
                      type:
                      - string
                      - 'null'
                      description: The term for Control Frequency.
                      example: Frequency
                    term_for_control_control_type:
                      type:
                      - string
                      - 'null'
                      description: The term for Control Type.
                      example: Type
                    term_for_control_prevent_or_detect:
                      type:
                      - string
                      - 'null'
                      description: The term for Prevent or Detect.
                      example: Prevent or Detect?
                    term_for_control_method:
                      type:
                      - string
                      - 'null'
                      description: The term for Control Method.
                      example: Method
                    term_for_control_status:
                      type:
                      - string
                      - 'null'
                      description: The term for Control Status.
                      example: Status
                    control_prevent_or_detects:
                      type: array
                      description: 'The term choices for Prevent or Detect.

                        The options available depends on the <a href="https://help.highbond.com/helpdocs/highbond/en-us/Default.htm#cshid=pm-customize-terms" target="_blank">configuration of the project type</a>.

                        '
                      example:
                      - prevent
                      - detect
                      - n_a
                      items:
                        type: string
                    control_methods:
                      type: array
                      description: 'The term choices for Method.

                        The options available depends on the <a href="https://help.highbond.com/helpdocs/highbond/en-us/Default.htm#cshid=pm-customize-terms" target="_blank">configuration of the project type</a>.

                        '
                      example:
                      - Authorization
                      - Management Review
                      - Reconciliation
                      items:
                        type: string
                    control_states:
                      type: array
                      description: 'The term choices for Control Status.

                        The options available depends on the <a href="https://help.highbond.com/helpdocs/highbond/en-us/Default.htm#cshid=pm-customize-terms" target="_blank">configuration of the project type</a>.

                        '
                      example:
                      - Key Control
                      - Non Key Control
                      - Obsolete
                      items:
                        type: string
                    frequencies:
                      type: array
                      description: 'The term choices for Control Frequency.

                        The options available depends on the <a href="https://help.highbond.com/helpdocs/highbond/en-us/Default.htm#cshid=pm-customize-terms" target="_blank">configuration of the project type</a>.

                        '
                      example:
                      - Continuous
                      - Multiple Times Daily
                      - Daily
                      items:
                        type: string
                    control_types:
                      type: array
                      description: 'The term choices for Control Type.

                        The options available depends on the <a href="https://help.highbond.com/helpdocs/highbond/en-us/Default.htm#cshid=pm-customize-terms" target="_blank">configuration of the project type</a>.

                        '
                      example:
                      - Manual Control
                      - Application/System Control
                      - IT Dependent Manual Control
                      items:
                        type: string
                    frequency_enabled:
                      type: boolean
                      description: Whether frequency is enabled
                      example: true
                    type_enabled:
                      type: boolean
                      description: Whether control types are enabled
                      example: true
                    prevent_detect_enabled:
                      type: boolean
                      description: Whether control prevent or detect is enabled
                      example: true
                    control_method_enabled:
                      type: boolean
                      description: Whether control methods are enabled
                      example: true
                    control_status_enabled:
                      type: boolean
                      description: Whether control statuses are enabled
                      example: true
                risk_terms:
                  type: object
                  description: The terms of risks.
                  properties:
                    term_for_risk:
                      type:
                      - string
                      - 'null'
                      description: The term for Risk.
                      example: Risk
                    term_for_risk_id:
                      type:
                      - string
                      - 'null'
                      description: The term for Risk Id.
                      example: Risk ID
                    term_for_risk_title:
                      type:
                      - string
                      - 'null'
                      description: The term for Risk Title.
                      example: Risk Title
                    term_for_risk_description:
                      type:
                      - string
                      - 'null'
                      description: The term for Risk Description.
                      example: Risk Description
                    term_for_risk_impact:
                      type:
                      - string
                      - 'null'
                      description: The term for Risk Impact.
                      example: Impact
                    term_for_risk_likelihood:
                      type:
                      - string
                      - 'null'
                      description: The term for Risk Likelihood.
                      example: Likelihood
                    risk_impacts:
                      type: array
                      description: 'The options for Risk Impact.

                        The options available depend on the <a href="https://help.highbond.com/helpdocs/highbond/en-us/Default.htm#cshid=pm-customize-terms" target="_blank">configuration of the project type</a>.

                        '
                      example:
                      - Low
                      - Medium
                      - High
                      items:
                        type: string
