openapi: 3.2.0
info:
  title: HighBond API Reference Results Users API
  version: 1.1.0
  description: Welcome to the API documentation for HighBond.
  x-logo:
    url: ./assets/logo.png
    altText: HighBond Logo
servers:
- url: '{protocol}://{server}/v1'
  variables:
    protocol:
      default: https
    server:
      default: apis-us.highbond.com
      enum:
      - apis-us.highbond.com
      - apis-ca.highbond.com
      - apis-eu.highbond.com
      - apis-ap.highbond.com
      - apis-au.highbond.com
      - apis-af.highbond.com
      - apis-sa.highbond.com
      - apis-jp.highbond.com
security:
- bearerToken: []
tags:
- name: Results Users
  x-displayName: Results Users
  description: Results users are users who have access to the Results app.
paths:
  /orgs/{org_id}/results/users:
    get:
      tags:
      - Results Users
      operationId: listResultsUsers
      summary: Get a list of all Results users
      description: 'Get a list of all the results users within the Results app of an organization.


        Note: System and root users are special types of users that act on behalf of the HighBond platform, like in automation tasks performed in the Robots app. Filters can be applied to query for them if needed.'
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      responses:
        '200':
          description: OK.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/UsersResponse'
        '400':
          $ref: '#/components/responses/MissingOrgId'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  responses:
    NotFound:
      description: Not found.
      content:
        application/vnd.api+json:
          schema:
            $ref: '#/components/schemas/Errors'
          example:
            errors:
            - status: '404'
              title: Not Found
              detail: The requested resource does not exist.
    MissingOrgId:
      description: Bad request.
      content:
        application/vnd.api+json:
          schema:
            $ref: '#/components/schemas/Errors'
          example:
            errors:
            - status: 400
              code: parameter_missing
              title: Parameter missing
              detail: The required parameter, org_id, is missing.
    BadCredentials:
      description: Bad credentials.
  schemas:
    Error:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          description: The HTTP status code.
        source:
          type: object
          description: Indicates which part of the request document caused the error.
          required:
          - pointer
          properties:
            pointer:
              type: string
              description: 'A JSON Pointer <a href="https://tools.ietf.org/html/rfc6901" target="_blank">(RFC6901)</a> to the associated entity

                in the request document.

                '
        code:
          type: string
          description: Application-specific error code, expressed as a string value.
        title:
          type: string
          description: A short, human-readable summary of the problem.
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence of the problem.
    Errors:
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/Error'
    UsersResponse:
      type: object
      properties:
        data:
          type: object
          description: The data associated with the resource.
          required:
          - id
          - type
          - attributes
          properties:
            id:
              type: string
              description: The ID of the requested resource.
              example: '1'
            type:
              type: string
              description: The classification of the object (`"users"`).
              example: users
            attributes:
              type: object
              description: The attributes associated with the user.
              required:
              - name
              properties:
                name:
                  type: string
                  description: The name of the user.
                  example: Basil Ryan
                email:
                  type: string
                  description: The email of the user.
                  example: null
                first_name:
                  type: string
                  description: The first name of the user.
                  example: Basil
                last_name:
                  type: string
                  description: The last name of the user.
                  example: Ryan
                user_type:
                  type: string
                  description: The type of the user.
                  example: user
        meta:
          type: object
          properties:
            next_page_url:
              type: string
              description: The URL to the next page of results.
              example: /api/v1/users?page=2
      required:
      - data
      - meta
      description: The data associated with the resource.
      example:
        data:
        - id: '1'
          type: users
          attributes:
            uid: '1'
            name: Basil Ryan
            email: null
            first_name: Basil
            last_name: Ryan
            preferred_community_org_id: 12345
        - id: '2'
          type: users
          attributes:
            uid: '2'
            name: John Doe
            email: null
            first_name: John
            last_name: Doe
            preferred_community_org_id: 12345
        meta:
          next_page_url: /api/v1/users?page=2
  parameters:
    orgIdParam:
      in: path
      name: org_id
      description: The ID of the HighBond instance.
      required: true
      schema:
        type: string
        example: 1
  securitySchemes:
    bearerToken:
      description: 'HighBond offers the industry-standard OAuth 2.0 flow for connecting to the HighBond platform. OAuth 2.0 provides a

        safe and secure way to access data, while protecting your account credentials.

        '
      type: http
      scheme: bearer
      bearerFormat: oauth2
