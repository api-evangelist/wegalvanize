openapi: 3.2.0
info:
  title: HighBond API Reference Control tests API
  version: 1.1.0
  description: Welcome to the API documentation for HighBond.
  x-logo:
    url: ./assets/logo.png
    altText: HighBond Logo
servers:
- url: '{protocol}://{server}/v1'
  variables:
    protocol:
      default: https
    server:
      default: apis-us.highbond.com
      enum:
      - apis-us.highbond.com
      - apis-ca.highbond.com
      - apis-eu.highbond.com
      - apis-ap.highbond.com
      - apis-au.highbond.com
      - apis-af.highbond.com
      - apis-sa.highbond.com
      - apis-jp.highbond.com
security:
- bearerToken: []
tags:
- name: Control tests
  description: 'Control tests evaluate the operating effectiveness of a control.

    * If your project includes one testing round, each control you create has one corresponding control test.

    * If your project includes multiple testing rounds, each control you create has a corresponding series of control tests.


    > **Note —**

    Only control tests in Internal Control workflow projects that have an `"active"` state can be accessed using the API.


    Learn more about control tests.'
paths:
  /orgs/{org_id}/control_tests:
    get:
      tags:
      - Control tests
      operationId: getControlTests
      summary: Get organization control tests
      description: 'Get a list of all of the control tests in an organization.


        > **Note:**

        By default, this endpoint only returns control tests from active projects. To fetch objects from archived projects or frameworks, do one of the following:

        > * Specify the project or framework ID using `filter[project.id]`

        > * Specify that you want results from archived projects using `filter[project.state]=archive`

        > * Specify that you want results from frameworks using `filter[project.state]=framework`'
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/controlTestsSparseFieldsetParams'
      - $ref: '#/components/parameters/pageSizeParam'
      - $ref: '#/components/parameters/pageNumberEncodedParam'
      - $ref: '#/components/parameters/controlTestsSortParams'
      - $ref: '#/components/parameters/controlTestProjectIdFilterParams'
      - $ref: '#/components/parameters/controlTestProjectNameFilterParams'
      - $ref: '#/components/parameters/controlTestProjectStateFilterParams'
      - $ref: '#/components/parameters/controlTestControlIDFilterParams'
      - $ref: '#/components/parameters/controlTestProjectStatusFilterParams'
      - $ref: '#/components/parameters/controlTestObjectiveTitleFilterParams'
      - $ref: '#/components/parameters/controlTestObjectiveReferenceFilterParams'
      - $ref: '#/components/parameters/controlTestControlStatusFilterParams'
      - $ref: '#/components/parameters/controlTestControlTitleFilterParams'
      - $ref: '#/components/parameters/controlTestControlQueryFilterParams'
      - $ref: '#/components/parameters/controlTestControlOwnerFilterParams'
      - $ref: '#/components/parameters/controlTestControlFrequencyFilterParams'
      - $ref: '#/components/parameters/controlTestControlTypeFilterParams'
      - $ref: '#/components/parameters/controlTestControlNumberFilterParams'
      - $ref: '#/components/parameters/controlTestControlControlTestFirstAssigneeFilterParams'
      - $ref: '#/components/parameters/controlTestControlControlTestSecondAssigneeFilterParams'
      - $ref: '#/components/parameters/controlTestControlControlTestThirdAssigneeFilterParams'
      - $ref: '#/components/parameters/controlTestControlControlTestFourthAssigneeFilterParams'
      - $ref: '#/components/parameters/controlTestIncludeParams'
      - $ref: '#/components/parameters/controlSparseFieldsetParams'
      - $ref: '#/components/parameters/objectiveSparseFieldsetParams'
      responses:
        '200':
          description: OK.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/GetControlTestsResponse'
        '400':
          $ref: '#/components/responses/MissingResourceId'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/NotJsonapiMediaType'
  /orgs/{org_id}/control_tests/{id}:
    get:
      tags:
      - Control tests
      operationId: getControlTest
      summary: Get a control test
      description: Get information about a control test in a project.
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/resourceIdParam'
      - $ref: '#/components/parameters/controlTestSparseFieldsetParams'
      - $ref: '#/components/parameters/controlTestIncludeParams'
      responses:
        '200':
          description: OK.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/GetControlTestResponse'
        '400':
          $ref: '#/components/responses/MissingResourceId'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/NotJsonapiMediaType'
    patch:
      tags:
      - Control tests
      operationId: updateControlTest
      summary: Update a control test
      description: '> **Deprecation notice —**

        Please note that `testing_conclusion` field will be deprecated. Consider using new `testing_conclusion_status` field instead.


        Make changes to a control test in a project, like updating the testing results or conclusion.


        Limitations:

        * You cannot update the control test if it is signed off or if the objective it belongs to has been checked out using

        Offline Projects or the

        HighBond iPad app.

        * You cannot update the `testing_conclusion_status` and `testing_conclusion` field if the field is automated using an

        assessment driver.'
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/resourceIdParam'
      - $ref: '#/components/parameters/controlTestSparseFieldsetParams'
      - $ref: '#/components/parameters/controlTestIncludeParams'
      requestBody:
        description: The data required to update a control test.
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/UpdateControlTestRequest'
      responses:
        '200':
          description: OK.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/GetControlTestResponse'
        '400':
          $ref: '#/components/responses/MissingResourceId'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/NotJsonapiMediaType'
        '422':
          description: 'Unprocessable entity.

            '
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/Errors'
              example:
                errors:
                - status: 422
                  source:
                    pointer: /data/attributes/not_applicable
                  code: invalid_resource
                  detail: can't be blank
components:
  parameters:
    controlTestControlIDFilterParams:
      in: query
      name: filter[control.id]
      description: Requesting the API to filter results by control IDs. For more information, see <a href="#section/Making-requests">Making requests</a>
      required: false
      schema:
        type: string
        example: 1,2,3
    controlSparseFieldsetParams:
      in: query
      name: fields[controls]
      description: Requesting the API to return only the specified fields. For more information, see <a href="#section/Making-requests">Making requests</a>
      required: false
      schema:
        type: string
        example: title,description,control_id,owner,frequency,control_type,prevent_detect,method,status,position,created_at,updated_at,custom_attributes,objective,walkthrough,control_test_plan,control_tests,mitigations,owner_user,entities,framework_origin
    orgIdParam:
      in: path
      name: org_id
      description: The ID of the HighBond instance.
      required: true
      schema:
        type: string
        example: 1
    controlTestControlTypeFilterParams:
      in: query
      name: filter[control.control_type]
      description: Requesting the API to filter results by control type. For more information, see <a href="#section/Making-requests">Making requests</a>
      required: false
      schema:
        type: string
        example: Application/System Control
    controlTestControlControlTestFirstAssigneeFilterParams:
      in: query
      name: filter[control.control_tests.1.assigned_user.id]
      description: Requesting the API to filter results by the user assigned to the first testing round in the related control. For more information, see <a href="#section/Making-requests">Making requests</a>
      required: false
      schema:
        type: string
        example: uid1
    controlTestProjectStatusFilterParams:
      in: query
      name: filter[project.status]
      description: Requesting the API to filter results by project status. For more information, see <a href="#section/Making-requests">Making requests</a>
      required: false
      schema:
        type: string
        example: active
    controlTestObjectiveTitleFilterParams:
      in: query
      name: filter[objective.title]
      description: Requesting the API to filter results by objective title. For more information, see <a href="#section/Making-requests">Making requests</a>
      required: false
      schema:
        type: string
        example: some objective title
    pageSizeParam:
      in: query
      name: page[size]
      description: The number of items returned per page. Default is 50. Maximum is 100.
      required: false
      schema:
        type: string
        example: 25
    controlTestProjectNameFilterParams:
      in: query
      name: filter[project.name]
      description: Requesting the API to filter results by project name. For more information, see <a href="#section/Making-requests">Making requests</a>
      required: false
      schema:
        type: string
        example: some project name
    controlTestSparseFieldsetParams:
      in: query
      name: fields[control_tests]
      description: Requesting the API to return only the specified fields. For more information, see <a href="#section/Making-requests">Making requests</a>
      required: false
      schema:
        type: string
        example: assignee_name,testing_round_number,not_applicable,sample_size,testing_results,testing_conclusion,testing_conclusion_status,created_at,updated_at,control,assigned_user,actual_milestone_date,planned_milestone_date,preparer_signoff,detail_reviewer_signoff,general_reviewer_signoff,supplemental_reviewer,specialty_reviewer
    controlTestControlControlTestFourthAssigneeFilterParams:
      in: query
      name: filter[control.control_tests.4.assigned_user.id]
      description: Requesting the API to filter results by the user assigned to the fourth testing round in the related control. For more information, see <a href="#section/Making-requests">Making requests</a>
      required: false
      schema:
        type: string
        example: uid1
    resourceIdParam:
      in: path
      name: id
      description: The ID of the requested resource.
      required: true
      schema:
        type: string
        example: 9999
    controlTestsSortParams:
      in: query
      name: sort
      description: Requesting the API to sort control tests by the values in a given field. The control tests are sorted ascending by default, but you can prefix the field name with `-` to sort descending (e.g., `-id`). You can sort control tests by only one field at a time.
      required: false
      schema:
        type: string
        enum:
        - id
        - testing_round_number
        - not_applicable
        - sample_size
        - testing_results
        - testing_conclusion
        - testing_conclusion_status
        - created_at
        - updated_at
        default: id
    controlTestControlTitleFilterParams:
      in: query
      name: filter[control.title]
      description: Requesting the API to filter results by control title. For more information, see <a href="#section/Making-requests">Making requests</a>
      required: false
      schema:
        type: string
        example: some control title
    controlTestControlOwnerFilterParams:
      in: query
      name: filter[control.owner]
      description: Requesting the API to filter results by control owner. For more information, see <a href="#section/Making-requests">Making requests</a>
      required: false
      schema:
        type: string
        example: some@example.com
    pageNumberEncodedParam:
      in: query
      name: page[number]
      description: The Base64-encoded page number of records to return.
      required: false
      schema:
        type: string
        example: Mg==
    controlTestProjectStateFilterParams:
      in: query
      name: filter[project.state]
      description: Requesting the API to filter results by project state. For more information, see <a href="#section/Making-requests">Making requests</a>
      required: false
      schema:
        type: string
        example: active
    controlTestIncludeParams:
      in: query
      name: include
      description: Requesting the API to return related resources. For more information, see <a href="#section/Making-requests">Making requests</a>
      required: false
      schema:
        type: string
        example: control,control.objective
    controlTestProjectIdFilterParams:
      in: query
      name: filter[project.id]
      description: Requesting the API to filter results by project ID. For more information, see <a href="#section/Making-requests">Making requests</a>
      required: false
      schema:
        type: string
        example: '1'
    controlTestControlControlTestThirdAssigneeFilterParams:
      in: query
      name: filter[control.control_tests.3.assigned_user.id]
      description: Requesting the API to filter results by the user assigned to the third testing round in the related control. For more information, see <a href="#section/Making-requests">Making requests</a>
      required: false
      schema:
        type: string
        example: uid1
    controlTestControlNumberFilterParams:
      in: query
      name: filter[control.control_id]
      description: Requesting the API to filter results by control numbers. For more information, see <a href="#section/Making-requests">Making requests</a>
      required: false
      schema:
        type: string
        example: 001,002,003
    objectiveSparseFieldsetParams:
      in: query
      name: fields[objectives]
      description: Requesting the API to return only the specified fields. For more information, see <a href="#section/Making-requests">Making requests</a>
      required: false
      schema:
        type: string
        example: title,description,reference,division_department,owner,executive_owner,created_at,updated_at,project,assigned_user,owner_user,executive_owner_user,custom_attributes,position,risk_control_matrix_id,walkthrough_summary_id,testing_round_1_id,testing_round_2_id,testing_round_3_id,testing_round_4_id,entities,framework,framework_origin,risk_assurance_data,planned_start_date,actual_start_date,planned_end_date,actual_end_date,planned_milestone_date,actual_milestone_date
    controlTestControlQueryFilterParams:
      in: query
      name: filter[control.query]
      description: Requesting the API to filter results by control title or description. For more information, see <a href="#section/Making-requests">Making requests</a>
      required: false
      schema:
        type: string
        example: some control title or description
    controlTestControlFrequencyFilterParams:
      in: query
      name: filter[control.frequency]
      description: Requesting the API to filter results by control frequency. For more information, see <a href="#section/Making-requests">Making requests</a>
      required: false
      schema:
        type: string
        example: Multiple Times Daily
    controlTestsSparseFieldsetParams:
      in: query
      name: fields[control_tests]
      description: Requesting the API to return only the specified fields. For more information, see <a href="#section/Making-requests">Making requests</a>
      required: false
      schema:
        type: string
        example: testing_round_number,not_applicable,sample_size,testing_results,testing_conclusion,testing_conclusion_status,created_at,updated_at,custom_attributes,control,assigned_user,actual_milestone_date,planned_milestone_date
    controlTestControlStatusFilterParams:
      in: query
      name: filter[control.status]
      description: Requesting the API to filter results by control status. For more information, see <a href="#section/Making-requests">Making requests</a>
      required: false
      schema:
        type: string
        example: Key Control
    controlTestControlControlTestSecondAssigneeFilterParams:
      in: query
      name: filter[control.control_tests.2.assigned_user.id]
      description: Requesting the API to filter results by the user assigned to the second testing round in the related control. For more information, see <a href="#section/Making-requests">Making requests</a>
      required: false
      schema:
        type: string
        example: uid1
    controlTestObjectiveReferenceFilterParams:
      in: query
      name: filter[objective.reference]
      description: Requesting the API to filter results by objective reference. For more information, see <a href="#section/Making-requests">Making requests</a>
      required: false
      schema:
        type: string
        example: ITC
  schemas:
    GetControlTestsResponse:
      type: object
      required:
      - data
      - links
      properties:
        data:
          type: array
          items:
            type: object
            description: The data associated with the resource.
            required:
            - id
            - type
            - relationships
            properties:
              id:
                type: string
                description: The ID of the requested resource.
                example: 1
              type:
                type: string
                description: The classification of the object (`"control_tests"`).
                example: control_tests
              attributes:
                type: object
                description: The attributes associated with the resource.
                properties:
                  assignee_name:
                    type: string
                    description: The name of the person to whom the issue was assigned.
                    example: Payam Moghaddam
                  testing_round_number:
                    type: integer
                    description: 'The specific testing round `(1-4)` that the control test belongs to. A control may have 0, 1, 2, or 4 testing rounds, depending upon the

                      `number_of_testing_rounds` <a href="https://help.highbond.com/helpdocs/highbond/en-us/Default.htm#cshid=pm-update-project-settings" target="_blank">

                      defined in the project settings</a>.


                      The names for testing rounds are customizable and depend on the <a href="

                      https://help.highbond.com/helpdocs/highbond/en-us/Default.htm#cshid=pm-customize-terms" target="_blank">configuration of the project type</a>.


                      **Examples**


                      1 testing round =

                      **"Testing"** (`1`)


                      2 testing rounds =

                      **"Interim"** (`1`), **"Final"** (`2`)


                      4 testing rounds =

                      **"Q1"** (`1`), **"Q2"** (`2`), **"Q3"** (`3`), **"Q4"** (`4`)

                      '
                    example: 1
                    format: int64
                  created_at:
                    type: string
                    description: The timestamp identifying when the control test was created.
                    example: '2019-02-09T13:17:26Z'
                    format: date-time
                  updated_at:
                    type: string
                    description: The timestamp identifying when the control test was updated.
                    example: '2019-02-09T13:17:26Z'
                    format: date-time
                  actual_milestone_date:
                    type:
                    - string
                    - 'null'
                    description: Actual milestone date.
                    example: '2019-02-10'
                    format: date
                  planned_milestone_date:
                    type:
                    - string
                    - 'null'
                    description: Planned milestone date.
                    example: '2019-02-09'
                    format: date
                  not_applicable:
                    type: boolean
                    description: '`false` specifies that the control test is applicable to the testing round. `true` specifies that the control test

                      is not applicable to the testing round. Only applicable control tests are included in

                      <a href="https://help.highbond.com/helpdocs/highbond/en-us/Default.htm#cshid=pm-risk-assurance" target="_blank">assurance calculations</a>.

                      '
                    example: false
                  sample_size:
                    type:
                    - integer
                    - 'null'
                    description: 'The total sample size, split among testing rounds. `sample_size` must be a value between `0` and `2147483647`.


                      Sample size is set when a

                      test plan is created the first time, which occurs when you create a control. The logic used to automatically set the sample size field is

                      based on two control attribute fields: `frequency` and `type`. For more information, see <a href="

                      https://help.highbond.com/helpdocs/highbond/en-us/Default.htm#cshid=pm-tests-walkthroughs" target="_blank">Executing procedures and testing

                      controls</a>.

                      '
                    example: 24
                    format: int64
                  testing_results:
                    type: string
                    description: 'A detailed evaluation that describes whether or not the control is operating effectively.

                      '
                    maxLength: 524288
                    example: <h1>Heading</h1><p>Testing results description.</p>
                  testing_conclusion:
                    type:
                    - boolean
                    - 'null'
                    description: 'A rating that specifies whether the control passes (`true`) or fails (`false`).


                      The exact values for this field (E.g. "Operating Effectively" and "Exception(s) Noted") depend on the <a href="

                      https://help.highbond.com/helpdocs/highbond/en-us/Default.htm#cshid=pm-customize-terms" target="_blank">configuration of the project type</a>.

                      `true` maps to the first customizable value (E.g. "Operating Effectively") and `false` maps to the second customizable value (E.g.

                      "Exception(s) Noted") in the project type.

                      '
                    example: true
                  testing_conclusion_status:
                    type:
                    - string
                    - 'null'
                    description: The control rating choice.
                    example: Operating Effectively
                  custom_attributes:
                    type: array
                    description: An array of custom attributes defined on the project type used by the project this control test is from. <a href="https://help.highbond.com/helpdocs/highbond/en-us/Default.htm#cshid=pm-project-types" target="_blank">Learn more about project types</a>. Make a PATCH request to modify the value of a custom attribute.
                    items:
                      type: object
                      description: A user defined custom attribute value.
                      properties:
                        id:
                          type: string
                          description: The ID of this custom attribute.  Optional if term is included.
                          example: '42'
                        term:
                          type: string
                          description: The user defined term used to identify this custom attribute. Optional if id is included.
                          example: Custom Control Test Attribute
                        value:
                          type: array
                          description: The value or values (for multiselect) for this custom attribute.
                          example:
                          - Custom Select Option Text
                          items:
                            type: string
              relationships:
                type: object
                description: The relationships associated with the resource.
                required:
                - control
                properties:
                  control:
                    type: object
                    description: The attributes associated with the resource.
                    required:
                    - data
                    properties:
                      data:
                        type: object
                        description: The data associated with the resource.
                        required:
                        - id
                        - type
                        properties:
                          id:
                            type: string
                            description: The ID of the control.
                            example: '1'
                          type:
                            type: string
                            description: The classification of the object (`"controls"`).
                            example: controls
                  assigned_user:
                    type:
                    - object
                    - 'null'
                    description: 'The person assigned to the control test. Only users assigned the Professional Manager, Professional User, or Contributor Tester role in the project

                      can be specified. The user specified receives an email notification with a link to the control test, and has full read and write access to the control

                      test.


                      To return this field, you must specify the `fields[control_tests]=assigned_user` parameter in your request. For more information, see

                      <a href="#section/Making-requests">Making requests</a>.

                      '
                    required:
                    - data
                    properties:
                      data:
                        type: object
                        description: The data associated with the resource.
                        required:
                        - id
                        - type
                        properties:
                          id:
                            type: string
                            description: The unique identifier (UID) of the assigned user. For more information on obtaining this value, see <a href="#section/Making-requests">Making requests</a>.
                            example: 3NQ6XzAUxqJMnAQ7n4KF
                          type:
                            type: string
                            description: The classification of the object (`"users"`).
                            example: users
        included:
          type: array
          description: Included resources.
          items:
            type: object
          example:
          - id: 1
            type: controls
            attributes:
              title: Control Title
              description: Control description
              control_id: '001'
              owner: thomas@sodor.ca
              frequency: Daily
              control_type: Application/System Control
              prevent_detect: Prevent
              method: Management Review
              status: Key Control
              position: '1'
              created_at: '2019-02-09T13:17:26Z'
              updated_at: '2019-02-09T13:17:26Z'
              custom_attributes:
              - id: 2
                term: Custom Control Attribute
                value:
                - Custom Select Option Text
            relationships:
              objective:
                data:
                  id: 1
                  type: objectives
              walkthrough:
                data:
                  id: 1
                  type: walkthroughs
              control_test_plan:
                data:
                  id: 1
                  type: control_test_plans
              control_tests:
                data:
                - id: 1
                  type: control_tests
              mitigations:
                data:
                - id: 1
                  type: mitigations
              framework_origin:
                data:
                  id: 1
                  type: controls
              owner_user:
                data:
                  id: 3NQ6XzAUxqJMnAQ7n4KF
                  type: users
          - id: 1
            type: objectives
            attributes:
              title: Objective Title
              reference: ITC
              description: Objective description
              division_department: Finance
              owner: thomas@sodor.ca
              executive_owner: henry@sodor.com
              position: 1
              risk_control_matrix_id: '100'
              walkthrough_summary_id: '200'
              testing_round_1_id: '301'
              testing_round_2_id: '302'
              testing_round_3_id: '303'
              testing_round_4_id: '304'
              created_at: '2019-02-09T13:17:26Z'
              updated_at: '2019-02-09T13:17:26Z'
              custom_attributes:
              - id: 42
                term: Custom Objective Attribute
                value:
                - Custom Select Option Text
              risk_assurance_data:
                inherent_risk: 1.1
                residual_risk: 1.1
                assurance: 0
            relationships:
              project:
                data:
                  id: 1
                  type: projects
              framework:
                data:
                  id: 1
                  type: frameworks
              framework_origin:
                data:
                  id: 1
                  type: objectives
              assigned_user:
                data:
                  id: 3NQ6XzAUxqJMnAQ7n4KF
                  type: users
        links:
          type: object
          required:
          - next
          - prev
          properties:
            next:
              type:
              - string
              - 'null'
              description: Next page url
              example: /api/resource?page[number]=Mg==
            prev:
