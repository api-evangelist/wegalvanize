openapi: 3.2.0
info:
  title: HighBond API Reference Time entries API
  version: 1.1.0
  description: Welcome to the API documentation for HighBond.
  x-logo:
    url: ./assets/logo.png
    altText: HighBond Logo
servers:
- url: '{protocol}://{server}/v1'
  variables:
    protocol:
      default: https
    server:
      default: apis-us.highbond.com
      enum:
      - apis-us.highbond.com
      - apis-ca.highbond.com
      - apis-eu.highbond.com
      - apis-ap.highbond.com
      - apis-au.highbond.com
      - apis-af.highbond.com
      - apis-sa.highbond.com
      - apis-jp.highbond.com
security:
- bearerToken: []
tags:
- name: Time Entries
  description: 'Use time entries to record time spent on projects, or on other tasks, for reporting purposes.


    Learn more about time entries.'
paths:
  /orgs/{org_id}/time_entries:
    get:
      tags:
      - Time Entries
      operationId: getTimeEntries
      summary: Get time entries
      description: Get a list of all time entries in an organization.
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/pageSizeParam'
      - $ref: '#/components/parameters/pageNumberParam'
      - $ref: '#/components/parameters/timeEntryIncludeParams'
      - $ref: '#/components/parameters/timeEntryUserFilterParams'
      - $ref: '#/components/parameters/timeEntryStartDateFilterParams'
      - $ref: '#/components/parameters/timeEntryEndDateFilterParams'
      - $ref: '#/components/parameters/timeEntryTargetTypeFilterParams'
      - $ref: '#/components/parameters/timeEntryTargetIdFilterParams'
      - $ref: '#/components/parameters/timeEntrySortParams'
      - $ref: '#/components/parameters/timeEntrySparseFieldsetParams'
      - $ref: '#/components/parameters/projectSparseFieldsetParams'
      - $ref: '#/components/parameters/controlSparseFieldsetParams'
      - $ref: '#/components/parameters/controlTestSparseFieldsetParams'
      - $ref: '#/components/parameters/issueSparseFieldsetParams'
      - $ref: '#/components/parameters/narrativeSparseFieldsetParams'
      - $ref: '#/components/parameters/objectiveSparseFieldsetParams'
      - $ref: '#/components/parameters/riskSparseFieldsetParams'
      - $ref: '#/components/parameters/accountFieldsetParams'
      - $ref: '#/components/parameters/controlTestPlanFieldsetParams'
      - $ref: '#/components/parameters/projectFileFieldsetParams'
      - $ref: '#/components/parameters/testingRoundFieldsetParams'
      - $ref: '#/components/parameters/walkthroughFieldsetParams'
      responses:
        '200':
          description: OK.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/GetTimeEntriesResponse'
        '400':
          $ref: '#/components/responses/MissingResourceId'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
      - Time Entries
      operationId: createTimeEntry
      summary: Create a time entry
      description: 'Create a new time entry.


        Limitations:

        * There can be a maximum of 300,000 time entries per HighBond instance.'
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/timeEntryIncludeParams'
      - $ref: '#/components/parameters/timeEntrySparseFieldsetParams'
      - $ref: '#/components/parameters/projectSparseFieldsetParams'
      - $ref: '#/components/parameters/controlSparseFieldsetParams'
      - $ref: '#/components/parameters/controlTestSparseFieldsetParams'
      - $ref: '#/components/parameters/issueSparseFieldsetParams'
      - $ref: '#/components/parameters/narrativeSparseFieldsetParams'
      - $ref: '#/components/parameters/objectiveSparseFieldsetParams'
      - $ref: '#/components/parameters/riskSparseFieldsetParams'
      - $ref: '#/components/parameters/accountFieldsetParams'
      - $ref: '#/components/parameters/controlTestPlanFieldsetParams'
      - $ref: '#/components/parameters/projectFileFieldsetParams'
      - $ref: '#/components/parameters/testingRoundFieldsetParams'
      - $ref: '#/components/parameters/walkthroughFieldsetParams'
      requestBody:
        description: The data required to create a time entry.
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/CreateTimeEntryRequest'
      responses:
        '201':
          description: Created.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/GetTimeEntryResponse'
        '400':
          $ref: '#/components/responses/ResourceTypeMismatch'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/NotJsonapiMediaType'
        '422':
          description: 'Unprocessable entity.

            '
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/Errors'
              example:
                errors:
                - status: 422
                  source:
                    pointer: /data/attributes/title
                  code: invalid_resource
                  detail: can't be blank
  /orgs/{org_id}/time_entries/{id}:
    get:
      tags:
      - Time Entries
      operationId: getTimeEntry
      summary: Get information about a time entry
      description: Get information about a time entry.
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/resourceIdParam'
      - $ref: '#/components/parameters/timeEntryIncludeParams'
      - $ref: '#/components/parameters/timeEntrySparseFieldsetParams'
      - $ref: '#/components/parameters/projectSparseFieldsetParams'
      - $ref: '#/components/parameters/controlSparseFieldsetParams'
      - $ref: '#/components/parameters/controlTestSparseFieldsetParams'
      - $ref: '#/components/parameters/issueSparseFieldsetParams'
      - $ref: '#/components/parameters/narrativeSparseFieldsetParams'
      - $ref: '#/components/parameters/objectiveSparseFieldsetParams'
      - $ref: '#/components/parameters/riskSparseFieldsetParams'
      - $ref: '#/components/parameters/accountFieldsetParams'
      - $ref: '#/components/parameters/controlTestPlanFieldsetParams'
      - $ref: '#/components/parameters/projectFileFieldsetParams'
      - $ref: '#/components/parameters/testingRoundFieldsetParams'
      - $ref: '#/components/parameters/walkthroughFieldsetParams'
      responses:
        '200':
          description: OK.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/GetTimeEntryResponse'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - Time Entries
      operationId: updateTimeEntry
      summary: Update a time entry
      description: Make changes to a time entry.
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/resourceIdParam'
      - $ref: '#/components/parameters/timeEntryIncludeParams'
      - $ref: '#/components/parameters/timeEntrySparseFieldsetParams'
      - $ref: '#/components/parameters/projectSparseFieldsetParams'
      - $ref: '#/components/parameters/controlSparseFieldsetParams'
      - $ref: '#/components/parameters/controlTestSparseFieldsetParams'
      - $ref: '#/components/parameters/issueSparseFieldsetParams'
      - $ref: '#/components/parameters/narrativeSparseFieldsetParams'
      - $ref: '#/components/parameters/objectiveSparseFieldsetParams'
      - $ref: '#/components/parameters/riskSparseFieldsetParams'
      - $ref: '#/components/parameters/accountFieldsetParams'
      - $ref: '#/components/parameters/controlTestPlanFieldsetParams'
      - $ref: '#/components/parameters/projectFileFieldsetParams'
      - $ref: '#/components/parameters/testingRoundFieldsetParams'
      - $ref: '#/components/parameters/walkthroughFieldsetParams'
      requestBody:
        description: The data required to update an objective.
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/UpdateTimeEntryRequest'
      responses:
        '200':
          description: OK.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/GetTimeEntryResponse'
        '400':
          $ref: '#/components/responses/MissingResourceId'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/NotJsonapiMediaType'
        '422':
          description: 'Unprocessable entity.

            '
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/Errors'
              example:
                errors:
                - status: 422
                  source:
                    pointer: /data/attributes/name
                  code: invalid_resource
                  detail: can't be blank
    delete:
      tags:
      - Time Entries
      operationId: deleteTimeEntry
      summary: Delete a time entry
      description: Permanently delete a time entry.
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/resourceIdParam'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/MissingOrgId'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/NotJsonapiMediaType'
components:
  parameters:
    timeEntrySparseFieldsetParams:
      in: query
      name: fields[time_entries]
      description: Requesting the API to return only the specified fields. For more information, see <a href="#section/Making-requests">Making requests</a>
      required: false
      schema:
        type: string
        example: date,description,time,client_delay,created_at,updated_at,position,project,objective,target
    controlSparseFieldsetParams:
      in: query
      name: fields[controls]
      description: Requesting the API to return only the specified fields. For more information, see <a href="#section/Making-requests">Making requests</a>
      required: false
      schema:
        type: string
        example: title,description,control_id,owner,frequency,control_type,prevent_detect,method,status,position,created_at,updated_at,custom_attributes,objective,walkthrough,control_test_plan,control_tests,mitigations,owner_user,entities,framework_origin
    timeEntryTargetTypeFilterParams:
      in: query
      name: filter[target.type]
      description: Requesting the API to filter results by target's type. For more information, see <a href="#section/Making-requests">Making requests</a>
      required: false
      schema:
        type: string
        enum:
        - objectives
        - projects
        - project_files
        - issues
        - objectives
        - narratives
        - walkthroughs
        - walkthrough_summaries
        - testing_rounds
        - controls
        - risks
        - risk_control_matrices
        - control_tests
        - control_test_plans
        - project_results
        - project_plannings
        - accounts
        - test_plans
    timeEntryStartDateFilterParams:
      in: query
      name: filter[date][start]
      description: Requesting the API to filter results by start date. For more information, see <a href="#section/Making-requests">Making requests</a>
      required: false
      schema:
        type: string
        example: '2021-04-28'
    orgIdParam:
      in: path
      name: org_id
      description: The ID of the HighBond instance.
      required: true
      schema:
        type: string
        example: 1
    riskSparseFieldsetParams:
      in: query
      name: fields[risks]
      description: Requesting the API to return only the specified fields. For more information, see <a href="#section/Making-requests">Making requests</a>
      required: false
      schema:
        type: string
        example: title,description,risk_id,owner,position,impact,likelihood,custom_attributes,custom_factors,created_at,updated_at,objective,mitigations,owner_user,entities,framework_origin,risk_assurance_data
    timeEntryIncludeParams:
      in: query
      name: include
      description: Requesting the API to return related resources. For more information, see <a href="#section/Making-requests">Making requests</a>
      required: false
      schema:
        type: string
        example: target,project,objective,category,assigned_user
    projectFileFieldsetParams:
      in: query
      name: fields[project_files]
      description: Requesting the API to return only the specified fields. For more information, see <a href="#section/Making-requests">Making requests</a>
      required: false
      schema:
        type: string
        example: name,reference,file_type,is_editable,is_signed_off
    pageSizeParam:
      in: query
      name: page[size]
      description: The number of items returned per page. Default is 50. Maximum is 100.
      required: false
      schema:
        type: string
        example: 25
    timeEntryUserFilterParams:
      in: query
      name: filter[uid]
      description: Requesting the API to filter results by user. For more information, see <a href="#section/Making-requests">Making requests</a>
      required: false
      schema:
        type: integer
        example: Hdf7sKAHWAiGsqeKhACh
    controlTestSparseFieldsetParams:
      in: query
      name: fields[control_tests]
      description: Requesting the API to return only the specified fields. For more information, see <a href="#section/Making-requests">Making requests</a>
      required: false
      schema:
        type: string
        example: assignee_name,testing_round_number,not_applicable,sample_size,testing_results,testing_conclusion,testing_conclusion_status,created_at,updated_at,control,assigned_user,actual_milestone_date,planned_milestone_date,preparer_signoff,detail_reviewer_signoff,general_reviewer_signoff,supplemental_reviewer,specialty_reviewer
    pageNumberParam:
      in: query
      name: page[number]
      description: The page number of records to return. Default is 1.
      required: false
      schema:
        type: string
        example: 2
    accountFieldsetParams:
      in: query
      name: fields[accounts]
      description: Requesting the API to return only the specified fields. For more information, see <a href="#section/Making-requests">Making requests</a>
      required: false
      schema:
        type: string
        example: fy_end_day,fy_end_month
    issueSparseFieldsetParams:
      in: query
      name: fields[issues]
      description: Requesting the API to return only the specified fields. For more information, see <a href="#section/Making-requests">Making requests</a>
      required: false
      schema:
        type: string
        example: title,description,creator_name,created_at,updated_at,position,owner,recommendation,deficiency_type,severity,published,identified_at,reference,reference_prefix,risk,scope,escalation,cause,effect,cost_impact,executive_summary,executive_owner,project_owner,closed,remediation_status,remediation_plan,remediation_date,actual_remediation_date,retest_deadline_date,actual_retest_date,retesting_results_overview,custom_attributes,project,entities,target,owner_user,executive_owner_user,project_owner_user,creator_user
    timeEntrySortParams:
      in: query
      name: sort
      description: Orders the resulting resources by the given field(s). Sorts ascending by default, prefix with `-` to sort descending. You can provide multiple sort fields separated by comma.
      required: false
      schema:
        type: string
        enum:
        - date
        default: id
    resourceIdParam:
      in: path
      name: id
      description: The ID of the requested resource.
      required: true
      schema:
        type: string
        example: 9999
    projectSparseFieldsetParams:
      in: query
      name: fields[projects]
      description: Requesting the API to return only the specified fields. For more information, see <a href="#section/Making-requests">Making requests</a>
      required: false
      schema:
        type: string
        example: name,state,status,created_at,updated_at,description,background,budget,position,header_alert_enabled,header_alert_text,certification,control_performance,risk_assurance,management_response,max_sample_size,number_of_testing_rounds,opinion,opinion_description,purpose,scope,start_date,target_date,tag_list,project_type,entities,collaborators,risk_assurance_data,collaborator_groups,time_spent,progress,planned_start_date,actual_start_date,planned_end_date,actual_end_date,planned_milestone_date,actual_milestone_date
    controlTestPlanFieldsetParams:
      in: query
      name: fields[control_test_plans]
      description: Requesting the API to return only the specified fields. For more information, see <a href="#section/Making-requests">Making requests</a>
      required: false
      schema:
        type: string
        example: title,test_steps,sanitized_description,reference_prefix,self_link,update_linked_control_test_plans_link,preparer_signoff,detail_reviewer_signoff,general_reviewer_signoff,supplemental_reviewer,specialty_reviewer,sample_size,test_method,audit_name,sanitized_test_steps
    timeEntryEndDateFilterParams:
      in: query
      name: filter[date][end]
      description: Requesting the API to filter results by end date. For more information, see <a href="#section/Making-requests">Making requests</a>
      required: false
      schema:
        type: string
        example: '2021-04-30'
    narrativeSparseFieldsetParams:
      in: query
      name: fields[narratives]
      description: Requesting the API to return only the specified fields. For more information, see <a href="#section/Making-requests">Making requests</a>
      required: false
      schema:
        type: string
        example: title,description,created_at,updated_at,objective,framework_origin
    testingRoundFieldsetParams:
      in: query
      name: fields[testing_rounds]
      description: Requesting the API to return only the specified fields. For more information, see <a href="#section/Making-requests">Making requests</a>
      required: false
      schema:
        type: string
        example: round_number,full_title
    objectiveSparseFieldsetParams:
      in: query
      name: fields[objectives]
      description: Requesting the API to return only the specified fields. For more information, see <a href="#section/Making-requests">Making requests</a>
      required: false
      schema:
        type: string
        example: title,description,reference,division_department,owner,executive_owner,created_at,updated_at,project,assigned_user,owner_user,executive_owner_user,custom_attributes,position,risk_control_matrix_id,walkthrough_summary_id,testing_round_1_id,testing_round_2_id,testing_round_3_id,testing_round_4_id,entities,framework,framework_origin,risk_assurance_data,planned_start_date,actual_start_date,planned_end_date,actual_end_date,planned_milestone_date,actual_milestone_date
    walkthroughFieldsetParams:
      in: query
      name: fields[walkthroughs]
      description: Requesting the API to return only the specified fields. For more information, see <a href="#section/Making-requests">Making requests</a>
      required: false
      schema:
        type: string
        example: walkthrough,control_verified,original_updated_at,preparer_signoff,detail_reviewer_signoff,general_reviewer_signoff,supplemental_reviewer,specialty_reviewer,control_performance_enabled,control_performance_readonly,signed_off,readonly,locked,enabled,planned_milestone_date,actual_milestone_date
    timeEntryTargetIdFilterParams:
      in: query
      name: filter[target.id]
      description: Requesting the API to filter results by target's id. For more information, see <a href="#section/Making-requests">Making requests</a>
      required: false
      schema:
        type: integer
        example: 2
  schemas:
    GetTimeEntriesResponse:
      type: object
      description: The data associated with the resource.
      required:
      - data
      properties:
        data:
          type: array
          items:
            type: object
            description: The data associated with the resource.
            required:
            - id
            - type
            - attributes
            - relationships
            properties:
              id:
                type: string
                description: The ID of the requested resource.
                example: '1'
              type:
                type: string
                description: The classification of the object (`"time_entries"`).
                example: time_entries
              attributes:
                type: object
                description: The attributes associated with the resource.
                required:
                - date
                properties:
                  date:
                    type: string
                    description: The date of the time entry.
                    maxLength: 60
                    example: '2021-03-15'
                  time:
                    type: number
                    format: double
                    description: The time of the time entry.
                    example: 8
                  description:
                    type: string
                    description: A detailed description of the time entry.
                    example: TimeEntry description
                  position:
                    type: integer
                    format: int64
                    description: 'The value that determines the order in which it is displayed in the index action. `position` must be a value between `1` and `2147483647`.

                      '
                    example: 1
                  client_delay:
                    type: boolean
                    default: false
                    description: 'Specifies whether project was delayed.

                      '
                  created_at:
                    type: string
                    description: The timestamp identifying when the time entry was created.
                    example: '2019-02-09T13:17:26Z'
                    format: date-time
                  updated_at:
                    type: string
                    description: The timestamp identifying when the time entry was last updated.
                    example: '2019-02-09T13:17:26Z'
                    format: date-time
              relationships:
                type: object
                description: The relationships associated with the resource.
                required:
                - target
                properties:
                  objective:
                    type: object
                    description: 'Time Entry can have an associated objective. Objectives are the organizing containers for the work done in a project or framework.

                      '
                    required:
                    - data
                    properties:
                      data:
                        type: object
                        description: The data associated with the resource.
                        required:
                        - id
                        - type
                        properties:
                          id:
                            type: string
                            description: The ID of the objective.
                            example: '1'
                          type:
                            type: string
                            description: The classification of the object (`"objectives"`).
                            example: objectives
                  project:
                    type: object
                    description: 'Each time entry has an associated project or framework. Project/framework is a management system that allows you to define and compile information

                      for reporting purposes.

                      '
                    required:
                    - data
                    - links
                    properties:
                      data:
                        type: object
                        description: The data associated with the resource.
                        required:
                        - id
                        - type
                        properties:
                          id:
                            type: string
                            description: The ID of the project.
                            example: '1'
                          type:
                            type: string
                            description: The classification of the object (`"projects"`).
                            example: projects
                      links:
                        type: object
                        description: Links associated with a project.
                        properties:
                          ui:
                            type: string
                            description: URL of page providing user interface for project.
                            example: https://myorg.projects.highbond.com/audits/1/dashboard
                  target:
                    type: object
                    description: Specifies the resource that the time entry is associated with.
                    required:
                    - data
                    - links
                    properties:
                      data:
                        type: object
                        description: The data associated with a time entry.
                        properties:
                          id:
                            type: string
                            description: The ID of the resource.
                            example: '1'
                          type:
                            type: string
                            description: 'The classification of the object.


                              A target can have one of the following types: `"projects`", `"narratives`", `"objectives`", `"walkthrough_summaries`",

                              `"project_plannings`", `"walkthroughs`", `"control_tests`", `"control_test_plans`", `"project_results`", `"project_files`",

                              `"risk_control_matrices`", `"testing_rounds`", `"risks`", `"controls`"

                              '
                            example: objectives
                      links:
                        type: object
                        description: Links associated with a target relationship.
                        properties:
                          ui:
                            type: string
                            description: URL of page providing user interface for target resource.
                            example: https://myorg.projects.highbond.com/audits/1/dashboard
                  category:
                    type: object
                    description: 'Time Entry can have a category, if target is NOT a project or project-related entity like Risk, Narrative, Control, etc.

                      '
                    required:
                    - data
                    properties:
                      data:
                        type: object
                        description: The data associated with the resource.
                        required:
                        - id
                        - type
                        properties:
                          id:
                            type: string
                            description: The ID of the category.
                            example: '1'
                          type:
                            type: string
                            description: The classification of the object (`"time_entry_categories"`).
                            example: work_types
                  assigned_user:
                    type:
                    - object
                    - 'null'
                    description: "The person assigned to the time entry. Only the Professional Manager role user of the project is permitted to assign users, and only users of the Professional Manager, Professional User, \nor Contributor Tester role within a project can be specified. The specified user has full read and write access to the time entry. The current user is assigned when the user is not specified on create action.\n\nTo return this field, you must specify the `fields[time_entry]=assigned_user` parameter in your request. For more information, see\n<a href=\"#section/Making-requests\">Making requests</a>.\n"
                    required:
                    - data
                    properties:
                      data:
                        type: object
                        description: The data associated with the resource.
                        required:
                        - id
                        - type
                        properties:
                          id:
                            type: string
                            description: The unique identifier (UID) of the assigned user. For more information on obtaining this value, see <a href="#section/Making-requests">Making requests</a>.
                            example: 3NQ6XzAUxqJMnAQ7n4KF
                          type:
                            type: string
                            description: The classification of the object (`"users"`).
                            example: users
          description: Array of time entries
    CreateTimeEntryRequest:
      type: object
      description: The data associated with the resource.
      required:
      - data
      properties:
        data:
          type: object
          description: The data associated with the resource.
          required:
          - type
          - attributes
          properties:
            type:
              type: string
