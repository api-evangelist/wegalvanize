        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/ContentTooLargeError'
        '415':
          $ref: '#/components/responses/NotJsonapiMediaType'
    patch:
      tags:
      - Compliance Maps
      operationId: updateComplianceMapping
      summary: Update a compliance mapping
      description: Make changes to a compliance mapping in an organization.
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/resourceIdParam'
      - $ref: '#/components/parameters/complianceMappingSparseFieldsetParams'
      requestBody:
        description: The data required to update a compliance mapping.
        required: true
        content:
