      summary: Update a link between requirements
      description: <p>Once a relationship is established between requirements, you can change any aspect of that relationship.</p> <p>To update a link, you need the id of the relationship that was generated when it was created. You also need the requirement ID for each requirement, whether the related requirement supports or overlaps the first requirement, the strength of the relationship, and whether the link should be active or not.</p> <p>Use the related requirements feature at your discretion and risk. You are responsible to apply professional judgment to determine the appropriate procedures, tests, or controls for your own use. <a href="https://help.highbond.com/helpdocs/highbond/en-us/Default.htm#cshid=pm-relationships-controls-requirements">Learn more</a>.</p>
