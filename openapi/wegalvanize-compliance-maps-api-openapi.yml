  /orgs/{org_id}/related_requirements:
    post:
      tags:
      - Compliance Maps
      operationId: postRelatedRequirement
      summary: Create a link between requirements
      description: 'Organizations typically need to be compliant with multiple standards and regulations that may have related or overlapping requirements. Related requirements indicate that controls implemented for one requirement should effectively address another (related) requirement.


        To link two requirements, you need the requirement ID for each requirement, whether the related requirement supports or overlaps the first requirement, the strength of the relationship, and whether the link should be active or not. When you create a link, that link is tracked with a unique ID, which you can use again later to update or delete that relationship.


        Use the related requirements feature at your discretion and risk. You are responsible to apply professional judgment to determine the appropriate procedures, tests, or controls for your own use. Learn more.'
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/relatedComplianceRequirementSparseFieldsetParamsPost'
      requestBody:
        description: The data required to create a link between requirements.
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/CreateRelatedRequirementRequest'
      responses:
        '201':
          description: Created.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/CreateRelatedRequirementResponse'
        '400':
          $ref: '#/components/responses/ResourceTypeMismatch'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/NotJsonapiMediaType'
  /orgs/{org_id}/related_requirements/{id}:
    get:
      tags:
      - Compliance Maps
      operationId: getRelatedRequirement
      summary: Get a link between requirements
      description: 'For a given link between requirements, get detailed information about the relationship and the requirements that are related.


        Use the related requirements feature at your discretion and risk. You are responsible to apply professional judgment to determine the appropriate procedures, tests, or controls for your own use. Learn more.'
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/resourceIdParam'
      - $ref: '#/components/parameters/relatedComplianceRequirementSparseFieldsetParamsGet'
      responses:
        '200':
          description: OK.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/GetRelatedRequirementResponse'
        '400':
          $ref: '#/components/responses/MissingResourceId'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/NotJsonapiMediaType'
    patch:
      tags:
      - Compliance Maps
      operationId: updateRelatedRequirement
      summary: Update a link between requirements
      description: 'Once a relationship is established between requirements, you can change any aspect of that relationship.


        To update a link, you need the id of the relationship that was generated when it was created. You also need the requirement ID for each requirement, whether the related requirement supports or overlaps the first requirement, the strength of the relationship, and whether the link should be active or not.


        Use the related requirements feature at your discretion and risk. You are responsible to apply professional judgment to determine the appropriate procedures, tests, or controls for your own use. Learn more.'
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/resourceIdParam'
      - $ref: '#/components/parameters/relatedComplianceRequirementSparseFieldsetParamsPost'
      requestBody:
        description: The data required to update a related requirement.
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/UpdateRelatedRequirementRequest'
      responses:
        '200':
          description: OK.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/CreateRelatedRequirementResponse'
        '400':
          $ref: '#/components/responses/ResourceTypeMismatch'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/NotJsonapiMediaType'
        '422':
          description: 'Unprocessable entity.

            '
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/Errors'
              example:
                errors:
                - status: 422
                  source:
                    pointer: /data/attributes/requirement_id
                  code: invalid_resource
                  detail: can't be blank
    delete:
      tags:
      - Compliance Maps
      operationId: deleteRelatedRequirement
      summary: Delete a link between requirements
      description: 'Once a relationship is established between requirements, you can delete that relationship.


        Use the related requirements feature at your discretion and risk. You are responsible to apply professional judgment to determine the appropriate procedures, tests, or controls for your own use. Learn more.'
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/resourceIdParam'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /orgs/{org_id}/compliance_requirements/{compliance_requirement_id}/related_requirements:
    get:
      tags:
      - Compliance Maps
      operationId: getRelatedRequirements
      summary: Get related compliance requirements
      description: 'Get a full list of all related requirements in your organization that have a relationship strength of equivalent, strongly related, or moderately related, and details about those relationships and the requirements.


        Use the related requirements feature at your discretion and risk. You are responsible to apply professional judgment to determine the appropriate procedures, tests, or controls for your own use. Learn more.'
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/complianceRequirementIdParam'
      - $ref: '#/components/parameters/relatedComplianceRequirementSparseFieldsetParamsGetWithoutRequirement'
      - $ref: '#/components/parameters/complianceRequirementSparseFieldsetParamsWithoutRelationships'
      - $ref: '#/components/parameters/complianceRegulationSparseFieldsetWithoutLicencedFields'
      responses:
        '200':
          description: OK.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/GetRelatedRequirementsResponse'
        '400':
          $ref: '#/components/responses/MissingOrgId'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/NotJsonapiMediaType'
  /orgs/{org_id}/compliance_mappings:
    post:
      tags:
      - Compliance Maps
      operationId: createComplianceMapping
      summary: Create a compliance mapping
      description: Create a new compliance mapping in an existing organization.
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/complianceMappingSparseFieldsetParams'
      requestBody:
        description: 'The data required to create a mapping.


          <strong>Limitations</strong>:

          * There can be a maximum of 500 compliance mappings per compliance requirement.

          '
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/CreateComplianceMappingRequest'
      responses:
        '201':
          description: Created.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/GetComplianceMappingResponseWithIncludes'
        '400':
          $ref: '#/components/responses/ResourceTypeMismatch'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 'Conflict.

            '
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/Errors'
              example:
                errors:
                - status: 409
                  title: ConflictError
                  detail: A requirement has been mapped to a control elsewhere in this grouping.
        '415':
          $ref: '#/components/responses/NotJsonapiMediaType'
        '422':
          description: 'Unprocessable entity.

            '
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/Errors'
              example:
                errors:
                - status: 422
                  source:
                    pointer: /data/attributes/coverage
                  code: invalid_resource
                  detail: coverage value exceeds 100%
  /orgs/{org_id}/compliance_mappings/{id}:
    get:
      tags:
      - Compliance Maps
      operationId: getComplianceMapping
      summary: Get a compliance mapping
      description: Get information about a compliance mapping in an organization.
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/resourceIdParam'
      - $ref: '#/components/parameters/complianceMappingSparseFieldsetParams'
      responses:
        '200':
