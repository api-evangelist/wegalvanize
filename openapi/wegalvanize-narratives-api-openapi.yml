openapi: 3.2.0
info:
  title: HighBond API Reference Narratives API
  version: 1.1.0
  description: Welcome to the API documentation for HighBond.
  x-logo:
    url: ./assets/logo.png
    altText: HighBond Logo
servers:
- url: '{protocol}://{server}/v1'
  variables:
    protocol:
      default: https
    server:
      default: apis-us.highbond.com
      enum:
      - apis-us.highbond.com
      - apis-ca.highbond.com
      - apis-eu.highbond.com
      - apis-ap.highbond.com
      - apis-au.highbond.com
      - apis-af.highbond.com
      - apis-sa.highbond.com
      - apis-jp.highbond.com
security:
- bearerToken: []
tags:
- name: Narratives
  description: A narrative is a description of a business process or area under review.
paths:
  /orgs/{org_id}/objectives/{objective_id}/narratives:
    get:
      tags:
      - Narratives
      operationId: getNarratives
      summary: Get narratives
      description: Get all narratives in an objective.
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/objectiveIdParam'
      - $ref: '#/components/parameters/narrativeSparseFieldsetParams'
      - $ref: '#/components/parameters/pageSizeParam'
      - $ref: '#/components/parameters/pageNumberEncodedParam'
      responses:
        '200':
          description: OK.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/GetNarrativesResponse'
        '400':
          $ref: '#/components/responses/MissingResourceId'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/NotJsonapiMediaType'
    post:
      tags:
      - Narratives
      operationId: createNarrative
      summary: Create a narrative
      description: 'Create a new narrative in an existing objective.


        Limitations:

        * Each objective in a project or framework can contain a maximum of 1000 narratives.

        * You cannot update narrative title to value that has more than 60 characters'
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/objectiveIdParam'
      - $ref: '#/components/parameters/narrativeSparseFieldsetParams'
      requestBody:
        description: The data required to create a narrative.
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/CreateNarrativeRequest'
      responses:
        '201':
          description: Created.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/GetNarrativeResponse'
        '400':
          $ref: '#/components/responses/ResourceTypeMismatch'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/NotJsonapiMediaType'
        '422':
          description: 'Unprocessable entity.

            '
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/Errors'
              example:
                errors:
                - status: 422
                  source:
                    pointer: /data/attributes/title
                  code: invalid_resource
                  detail: is too long (maximum is 60 characters)
  /orgs/{org_id}/narratives/{id}:
    get:
      tags:
      - Narratives
      operationId: getNarrative
      summary: Get a narrative
      description: 'Get information about a narrative.


        Limitation:

        Existing Citation Mode highlights and links are not displayed in the `description` field.'
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/resourceIdParam'
      - $ref: '#/components/parameters/narrativeSparseFieldsetParams'
      responses:
        '200':
          description: OK.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/GetNarrativeResponse'
        '400':
          $ref: '#/components/responses/MissingResourceId'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/NotJsonapiMediaType'
    patch:
      tags:
      - Narratives
      operationId: updateNarrative
      summary: Update a narrative
      description: 'Make changes to a narrative in objective, like renaming the narrative title or updating the narrative description.


        Limitations:

        * You cannot update narrative title to value that has more than 60 characters'
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/resourceIdParam'
      - $ref: '#/components/parameters/narrativeSparseFieldsetParams'
      requestBody:
        description: The data required to update a narrative.
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/UpdateNarrativeRequest'
      responses:
        '200':
          description: OK.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/GetNarrativeResponse'
        '400':
          $ref: '#/components/responses/MissingResourceId'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/NotJsonapiMediaType'
        '422':
          description: 'Unprocessable entity.

            '
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/Errors'
              example:
                errors:
                - status: 422
                  source:
                    pointer: /data/attributes/title
                  code: invalid_resource
                  detail: is too long (maximum is 60 characters)
    delete:
      tags:
      - Narratives
      operationId: deleteNarratrive
      summary: Delete a narrative
      description: 'Permanently delete a narrative from an objective.


        Limitations:

        * You cannot delete the narrative if it is included in an existing certification program.

        * You cannot delete the narrative if the objective it belongs to has been checked out using

        Offline Projects or the

        HighBond iPad app.


        > **Caution —**

        Deleting a narrative is permanent. Once deleted, you cannot access or restore the narrative.'
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/resourceIdParam'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/MissingOrgId'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/NotJsonapiMediaType'
components:
  schemas:
    UpdateNarrativeRequest:
      type: object
      description: The data associated with the resource.
      required:
      - data
      properties:
        data:
          type: object
          description: The data associated with the resource.
          required:
          - id
          - type
          - attributes
          properties:
            id:
              type: string
              description: The ID of the requested resource.
              example: '1'
            type:
              type: string
              description: The type of narrative (`"narratives"`).
              example: narratives
            attributes:
              type: object
              description: The attributes associated with the resource.
              required:
              - title
              properties:
                title:
                  type: string
                  description: The title of the narrative.
                  maxLength: 60
                  example: Narrative title
                description:
                  type: string
                  description: A detailed description of the narrative.
                  maxLength: 524288
                  example: Narrative description
                position:
                  type: integer
                  format: int64
                  description: 'The value that determines the order in which it is displayed in the index action. `position` must be a value between `1` and `2147483647`.

                    '
                  example: 1
            relationships:
              type: object
              description: The attributes associated with the resource.
              properties:
                framework_origin:
                  type: object
                  description: 'In the Projects app, a project `narrative` can have a related counterpart in an associated framework. The `framework_origin` attribute allows you to associate an `narrative` in a project with its related counterpart in a framework.

                    '
                  required:
                  - data
                  properties:
                    data:
                      type: object
                      description: The data associated with the resource.
                      required:
                      - id
                      - type
                      properties:
                        id:
                          type: string
                          description: The ID of the parent control.
                          example: '1'
                        type:
                          type: string
                          description: The classification of the object (`"narratives"`).
                          example: narratives
    CreateNarrativeRequest:
      type: object
      description: The data associated with the resource.
      required:
      - data
      properties:
        data:
          type: object
          description: The data associated with the resource.
          required:
          - type
          - attributes
          properties:
            type:
              type: string
              description: The type of narrative (`"narratives"`).
              example: narratives
            attributes:
              type: object
              description: The attributes associated with the resource.
              required:
              - title
              properties:
                title:
                  type: string
                  description: The title of the narrative.
                  maxLength: 60
                  example: Narrative title
                description:
                  type: string
                  description: A detailed description of the narrative.
                  maxLength: 524288
                  example: Narrative description
                position:
                  type: integer
                  format: int64
                  description: 'The value that determines the order in which it is displayed in the index action. `position` must be a value between `1` and `2147483647`.

                    '
                  example: 1
            relationships:
              type: object
              description: The attributes associated with the resource.
              properties:
                framework_origin:
                  type: object
                  description: 'In the Projects app, a project `narrative` can have a related counterpart in an associated framework. The `framework_origin` attribute allows you to associate an `narrative` in a project with its related counterpart in a framework.

                    '
                  required:
                  - data
                  properties:
                    data:
                      type: object
                      description: The data associated with the resource.
                      required:
                      - id
                      - type
                      properties:
                        id:
                          type: string
                          description: The ID of the parent control.
                          example: '1'
                        type:
                          type: string
                          description: The classification of the object (`"narratives"`).
                          example: narratives
    Error:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          description: The HTTP status code.
        source:
          type: object
          description: Indicates which part of the request document caused the error.
          required:
          - pointer
          properties:
            pointer:
              type: string
              description: 'A JSON Pointer <a href="https://tools.ietf.org/html/rfc6901" target="_blank">(RFC6901)</a> to the associated entity

                in the request document.

                '
        code:
          type: string
          description: Application-specific error code, expressed as a string value.
        title:
          type: string
          description: A short, human-readable summary of the problem.
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence of the problem.
    GetNarrativeResponse:
      type: object
      required:
      - data
      properties:
        data:
          type: object
          description: The data associated with the resource.
          required:
          - id
          - type
          - attributes
          - relationships
          properties:
            id:
              type: string
              description: The ID of the requested resource.
              example: '1'
            type:
              type: string
              description: The type of narrative (`"narratives"`).
              example: narratives
            attributes:
              type: object
              description: The attributes associated with the resource.
              required:
              - title
              properties:
                title:
                  type: string
                  description: The title of the narrative.
                  maxLength: 60
                  example: Narrative title
                description:
                  type: string
                  description: A detailed description of the narrative.
                  maxLength: 524288
                  example: Narrative description
                position:
                  type: integer
                  format: int64
                  description: 'The value that determines the order in which it is displayed in the index action. `position` must be a value between `1` and `2147483647`.

                    '
                  example: 1
                created_at:
                  type: string
                  description: The timestamp identifying when the narrative was created.
                  example: '2019-02-09T13:17:26Z'
                  format: date-time
                updated_at:
                  type: string
                  description: The timestamp identifying when the narrative was last updated.
                  example: '2019-02-09T13:17:26Z'
                  format: date-time
            relationships:
              type: object
              description: The relationships associated with the resource.
              required:
              - objective
              properties:
                objective:
                  type: object
                  description: 'Each narrative has an associated objective. Objectives are the basis of a project or framework.

                    They are also the organizing containers for the work done in a project or framework.

                    '
                  required:
                  - data
                  properties:
