                  description: 'In the Projects app, a project `narrative` can have a related counterpart in an associated framework. The `framework_origin` attribute allows you to associate an `narrative` in a project with its related counterpart in a framework.

                    '
                  required:
                  - data
                  properties:
                    data:
                      type: object
                      description: The data associated with the resource.
                      required:
                      - id
                      - type
                      properties:
                        id:
                          type: string
                          description: The ID of the parent control.
                          example: '1'
                        type:
                          type: string
                          description: The classification of the object (`"narratives"`).
                          example: narratives
    Errors:
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/Error'
    GetNarrativesResponse:
      type: object
      required:
      - data
      - links
      properties:
        data:
          type: array
          description: Array of narratives
          items:
            type: object
            description: The data associated with the resource.
            required:
            - id
            - type
            - attributes
            - relationships
            properties:
              id:
                type: string
                description: The ID of the requested resource.
                example: '1'
              type:
                type: string
                description: The type of narrative (`"narratives"`).
                example: narratives
              attributes:
                type: object
                description: The attributes associated with the resource.
                required:
                - title
                properties:
                  title:
                    type: string
                    description: The title of the narrative.
                    maxLength: 60
                    example: Narrative title
                  description:
                    type: string
                    description: A detailed description of the narrative.
                    maxLength: 524288
                    example: Narrative description
                  position:
                    type: integer
                    format: int64
                    description: 'The value that determines the order in which it is displayed in the index action. `position` must be a value between `1` and `2147483647`.

                      '
                    example: 1
                  created_at:
                    type: string
                    description: The timestamp identifying when the narrative was created.
                    example: '2019-02-09T13:17:26Z'
                    format: date-time
                  updated_at:
                    type: string
                    description: The timestamp identifying when the narrative was last updated.
                    example: '2019-02-09T13:17:26Z'
                    format: date-time
              relationships:
                type: object
                description: The relationships associated with the resource.
                required:
                - objective
                properties:
                  objective:
                    type: object
                    description: 'Each narrative has an associated objective. Objectives are the basis of a project or framework.

                      They are also the organizing containers for the work done in a project or framework.

                      '
                    required:
                    - data
                    properties:
                      data:
                        type: object
                        description: The data associated with the resource.
                        required:
                        - id
                        - type
                        properties:
                          id:
                            type: string
                            description: The ID of the objective.
                            example: '1'
                          type:
                            type: string
                            description: The classification of the object (`"objectives"`).
                            example: objectives
                  framework_origin:
                    type: object
                    description: 'In the Projects app, a project `narrative` can have a related counterpart in an associated framework. The `framework_origin` attribute allows you to associate an `narrative` in a project with its related counterpart in a framework.

                      '
                    required:
                    - data
                    properties:
                      data:
                        type: object
                        description: The data associated with the resource.
                        required:
                        - id
                        - type
                        properties:
                          id:
                            type: string
                            description: The ID of the parent control.
                            example: '1'
                          type:
                            type: string
                            description: The classification of the object (`"narratives"`).
                            example: narratives
        links:
          type: object
          required:
          - next
          - prev
          properties:
            next:
              type:
              - string
              - 'null'
              description: Next page url
              example: /api/resource?page[number]=Mg==
            prev:
              type:
              - string
              - 'null'
              description: Previous page url
              example: null
  parameters:
    objectiveIdParam:
      in: path
      name: objective_id
      description: The ID of the objective.
      required: true
      schema:
        type: integer
        example: 1
    orgIdParam:
      in: path
      name: org_id
      description: The ID of the HighBond instance.
      required: true
      schema:
        type: string
        example: 1
    pageSizeParam:
      in: query
      name: page[size]
      description: The number of items returned per page. Default is 50. Maximum is 100.
      required: false
      schema:
        type: string
        example: 25
    resourceIdParam:
      in: path
      name: id
      description: The ID of the requested resource.
      required: true
      schema:
        type: string
        example: 9999
    pageNumberEncodedParam:
      in: query
      name: page[number]
      description: The Base64-encoded page number of records to return.
      required: false
      schema:
        type: string
        example: Mg==
    narrativeSparseFieldsetParams:
      in: query
      name: fields[narratives]
      description: Requesting the API to return only the specified fields. For more information, see <a href="#section/Making-requests">Making requests</a>
      required: false
      schema:
        type: string
        example: title,description,created_at,updated_at,objective,framework_origin
