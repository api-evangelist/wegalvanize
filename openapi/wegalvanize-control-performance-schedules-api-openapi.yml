            attributes:
              type: object
              properties:
                title:
                  type: string
                  description: The title of the control performance schedule. Mandatory.
                  example: Control performance schedule 1
                  maxLength: 255
                enabled:
                  type: boolean
                  description: Whether the control performance schedule is enabled.
                  example: true
                send_immediately:
                  type: boolean
                  description: Whether to send the email immediately, outside the scope of the control performance schedule.
                  example: false
                procedure:
                  type: string
                  description: The procedure of the control performance schedule.
                  example: <p>Control performance schedule 1 procedure</p>
                frequency_type:
                  type: string
                  description: "The frequency type of the control performance schedule. Mandatory. \nValues: \"daily\", \"weekly\", \"monthly\", \"quarterly\", \"custom\"."
                  example: daily
                frequency_timezone:
                  type: string
                  description: The frequency timezone of the control performance schedule.
                  example: Central Time (US & Canada)
                frequency_day_of_month:
                  type: integer
                  description: 'The frequency day of month of the control performance schedule.

                    Values: 1-28,32, null.

                    Mandatory if frequency_type is "monthly".

                    '
                  example: null
                frequency_day_of_week:
                  type: integer
                  description: "The frequency day of week of the control performance schedule. \nValues: 0-6, null; 0 means first day of the week.\nMandatory if frequency_type is \"weekly\".\n"
                  example: 0
                frequency_days:
                  type: integer
                  description: 'The frequency days of the control performance schedule.

                    Mandatory if frequency_type is "custom".

                    '
                  example: 1
                frequency_run_at:
                  type: string
                  description: The frequency run at of the control performance schedule in time format.
                  example: '15:30:00'
                frequency_starts_on:
                  type: string
                  description: 'The frequency starts on of the control performance schedule.

                    Mandatory.

                    '
                  example: '2019-01-01'
                frequency_local_run_at:
                  type: integer
                  description: "The frequency local run at of the control performance schedule. \nWhole hours given in seconds. E.g.: 54000 means 3pm.\n"
                  example: 54000
                results_questionnaire_id:
                  type: integer
                  description: The results questionnaire ID of the control performance schedule. Mandatory.
                  example: 1
                performer_user_ids:
                  type: array
                  items:
                    type: string
                  description: "The performer user UIDs of the control performance schedule. \nMandatory if performer_contact_emails is empty.\n"
                  example:
                  - P2tuGWyTWxCAQgTd1XKx
                performer_contact_emails:
                  type: array
                  items:
                    type: string
                  description: 'The performer contact emails of the control performance schedule.

                    Mandatory if performer_user_ids is empty.

