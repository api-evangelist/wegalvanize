openapi: 3.2.0
info:
  title: HighBond API Reference Control performance schedules API
  version: 1.1.0
  description: Welcome to the API documentation for HighBond.
  x-logo:
    url: ./assets/logo.png
    altText: HighBond Logo
servers:
- url: '{protocol}://{server}/v1'
  variables:
    protocol:
      default: https
    server:
      default: apis-us.highbond.com
      enum:
      - apis-us.highbond.com
      - apis-ca.highbond.com
      - apis-eu.highbond.com
      - apis-ap.highbond.com
      - apis-au.highbond.com
      - apis-af.highbond.com
      - apis-sa.highbond.com
      - apis-jp.highbond.com
security:
- bearerToken: []
tags:
- name: Control performance schedules
  description: 'A control performance schedule is a schedule of control tests that are performed on a recurring basis. Control performance schedules are associated with controls.


    > **Note:**

    Control performance schedules located in such resources can be accessed using the API:

    > * In projects that have an "active" state

    > * In frameworks


    Learn more about control performance schedules.'
paths:
  /orgs/{org_id}/controls/{control_id}/control_performance_schedules:
    get:
      tags:
      - Control performance schedules
      operationId: getControlPerformanceSchedules
      summary: Get control performance schedules
      description: Get a list of all control performance schedules for a control.
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/controlIdParam'
      responses:
        '200':
          description: OK.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/GetControlPerformanceSchedulesResponse'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
      - Control performance schedules
      operationId: createControlPerformanceSchedule
      summary: Create control performance schedule
      description: Create a new control performance schedule for a control.
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/controlIdParam'
      requestBody:
        description: The data to create the control performance schedule.
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/CreateControlPerformanceScheduleRequest'
      responses:
        '201':
          description: Created.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/GetControlPerformanceScheduleResponse'
        '400':
          $ref: '#/components/responses/ResourceTypeMismatch'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/NotJsonapiMediaType'
        '422':
          description: 'Unprocessable entity.

            '
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/Errors'
              example:
                errors:
                - status: 422
                  source:
                    pointer: /data/attributes/title
                  code: invalid_resource
                  detail: can't be blank
  /orgs/{org_id}/control_performance_schedules/{id}:
    get:
      tags:
      - Control performance schedules
      operationId: getControlPerformanceSchedule
      summary: Get a control performance schedule
      description: Get information about a control performance schedule.
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/resourceIdParam'
      responses:
        '200':
          description: OK.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/GetControlPerformanceScheduleResponse'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - Control performance schedules
      operationId: updateControlPerformanceSchedule
      summary: Update a control performance schedule
      description: 'Make changes to a control performance schedule in a project or framework, like renaming the control performance schedule or updating the control performance schedule description.


        Limitations:

        * You cannot update the control performance schedule if the objective it belongs to has been checked out using

        Offline Projects or the

        HighBond iPad app.

        * You cannot update the `frequency`, `control_type`, `prevent_detect`, `method` or `status` fields if the fields are hidden by the project type.'
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/resourceIdParam'
      requestBody:
        description: The data required to update a control performance schedule.
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/UpdateControlPerformanceScheduleRequest'
      responses:
        '200':
          description: OK.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/GetControlPerformanceScheduleResponse'
        '400':
          $ref: '#/components/responses/MissingResourceId'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: 'Unprocessable entity.

            '
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/Errors'
              example:
                errors:
                - status: 422
                  source:
                    pointer: /data/attributes/title
                  code: invalid_resource
                  detail: can't be blank
    delete:
      tags:
      - Control performance schedules
      operationId: deleteControlPerformanceSchedule
      summary: Delete a Control Performance Schedule
      description: Delete a control performance schedule from a project or framework.
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/resourceIdParam'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
