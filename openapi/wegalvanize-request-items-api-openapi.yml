openapi: 3.2.0
info:
  title: HighBond API Reference Request Items API
  version: 1.1.0
  description: Welcome to the API documentation for HighBond.
  x-logo:
    url: ./assets/logo.png
    altText: HighBond Logo
servers:
- url: '{protocol}://{server}/v1'
  variables:
    protocol:
      default: https
    server:
      default: apis-us.highbond.com
      enum:
      - apis-us.highbond.com
      - apis-ca.highbond.com
      - apis-eu.highbond.com
      - apis-ap.highbond.com
      - apis-au.highbond.com
      - apis-af.highbond.com
      - apis-sa.highbond.com
      - apis-jp.highbond.com
security:
- bearerToken: []
tags:
- name: Request Items
  description: 'A request item is used by Auditors to request documentation from business owners and other stakeholders to gather further information.


    Learn more about request items.'
paths:
  /orgs/{org_id}/request_items:
    get:
      tags:
      - Request Items
      operationId: getOrgRequestItems
      summary: Get organization's request items
      description: Get a list of all request items in an organization.
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/organizationRequestItemsFieldsetParams'
      - $ref: '#/components/parameters/pageSizeParam'
      - $ref: '#/components/parameters/pageNumberEncodedParam'
      - $ref: '#/components/parameters/orgRequestItemsSortParams'
      - $ref: '#/components/parameters/orgRequestItemsProjectIdFilterParams'
      - $ref: '#/components/parameters/orgRequestItemsProjectNameFilterParams'
      - $ref: '#/components/parameters/orgRequestItemsProjectStatusFilterParams'
      - $ref: '#/components/parameters/orgRequestItemsTargetIdFilterParams'
      - $ref: '#/components/parameters/orgRequestItemsTargetTypeFilterParams'
      - $ref: '#/components/parameters/orgRequestItemsReceivedFilterParams'
      responses:
        '200':
          description: OK.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/GetOrgRequestItemsResponse'
        '400':
          $ref: '#/components/responses/MissingResourceId'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/NotJsonapiMediaType'
  /orgs/{org_id}/projects/{project_id}/request_items:
    post:
      tags:
      - Request Items
      operationId: createRequestItem
      summary: Create a request item
      description: 'Create a new request item in an existing project.


        Limitations:

        * There can be a maximum of 5000 request items per project.'
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/projectIdParam'
      requestBody:
        description: The data required to create a request item.
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/CreateRequestItemRequest'
      responses:
        '201':
          description: Created.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/GetRequestItemResponse'
        '400':
          $ref: '#/components/responses/ResourceTypeMismatch'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/NotJsonapiMediaType'
        '422':
          description: 'Unprocessable entity.

            '
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/Errors'
              example:
                errors:
                - status: 422
                  source:
                    pointer: /data/attributes/description
                  code: invalid_resource
                  detail: can't be blank
  /orgs/{org_id}/request_items/{id}:
    get:
      tags:
      - Request Items
      operationId: getRequestItem
      summary: Get a request item
      description: Get information about a request item.
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/resourceIdParam'
      responses:
        '200':
          description: OK.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/GetRequestItemResponse'
        '400':
          $ref: '#/components/responses/MissingResourceId'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/NotJsonapiMediaType'
    patch:
      tags:
      - Request Items
      operationId: updateRequestItem
      summary: Update a request item
      description: Make changes to a request item.
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/resourceIdParam'
      requestBody:
        description: The data required to update a request item.
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/UpdateRequestItemRequest'
      responses:
        '200':
          description: OK.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/GetRequestItemResponse'
        '400':
          $ref: '#/components/responses/MissingResourceId'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/NotJsonapiMediaType'
        '422':
          description: 'Unprocessable entity.

            '
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/Errors'
              example:
                errors:
                - status: 422
                  source:
                    pointer: /data/attributes/description
                  code: invalid_resource
                  detail: can't be blank
    delete:
      tags:
      - Request Items
      operationId: deleteRequestItem
      summary: Delete a request item
      description: Permanently delete a request item from a project
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/resourceIdParam'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/MissingOrgId'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/NotJsonapiMediaType'
components:
  parameters:
    projectIdParam:
      in: path
      name: project_id
      description: The ID of the project.
      required: true
      schema:
        type: integer
        example: 1
    orgRequestItemsTargetIdFilterParams:
      in: query
      name: filter[target.id]
      description: Requesting the API to filter results by target ID. For more information, see <a href="#section/Making-requests">Making requests</a>
      required: false
      schema:
        type: string
        example: '1'
    orgIdParam:
      in: path
      name: org_id
      description: The ID of the HighBond instance.
      required: true
      schema:
        type: string
        example: 1
    orgRequestItemsSortParams:
      in: query
      name: sort
      description: Orders the resulting resources by the given field(s). Sorts ascending by default, prefix with `-` to sort descending. You can provide multiple sort fields separated by comma.
      required: false
      schema:
        type: string
        enum:
        - id
        - created_at
        - updated_at
        - description
        - owner
        - owner_email
        - received
        - requestor
        - due_date
        - send_recurrent_notifications
        - email_subject
        - email_message
        - position
        default: id
    orgRequestItemsReceivedFilterParams:
      in: query
      name: filter[received]
      description: Requesting the API to filter results by received state. For more information, see <a href="#section/Making-requests">Making requests</a>
      required: false
      schema:
        type: string
        enum:
        - 'true'
        - 'false'
    pageSizeParam:
      in: query
      name: page[size]
      description: The number of items returned per page. Default is 50. Maximum is 100.
      required: false
      schema:
        type: string
        example: 25
    orgRequestItemsProjectIdFilterParams:
      in: query
      name: filter[project.id]
      description: Requesting the API to filter results by project ID. For more information, see <a href="#section/Making-requests">Making requests</a>
      required: false
      schema:
        type: string
        example: '1'
    orgRequestItemsProjectStatusFilterParams:
      in: query
      name: filter[project.status]
      description: Requesting the API to filter results by project status. Draft, Proposed, Active, Completed (these values are customizable by customers) For more information, see <a href="#section/Making-requests">Making requests</a>
      required: false
      schema:
        type: string
        example: active
    resourceIdParam:
      in: path
      name: id
      description: The ID of the requested resource.
      required: true
      schema:
        type: string
        example: 9999
    orgRequestItemsProjectNameFilterParams:
      in: query
      name: filter[project.name]
      description: Requesting the API to filter results by project name. For more information, see <a href="#section/Making-requests">Making requests</a>
      required: false
      schema:
        type: string
        example: some project name
    pageNumberEncodedParam:
      in: query
      name: page[number]
      description: The Base64-encoded page number of records to return.
      required: false
      schema:
        type: string
        example: Mg==
    organizationRequestItemsFieldsetParams:
      in: query
      name: fields[request_items]
      description: Requesting the API to return only specific fields. For more information, see <a href="#section/Making-requests">Making requests</a>
      required: false
      schema:
        type: string
      example: created_at,updated_at,description,owner,owner_email,received,request_item_status,requestor,due_date,send_recurrent_notifications,email_subject,email_message,position,project_type,owner,project,owner_user,requestor_user,cc_users,cc_contacts,contact_reference_name,contact_reference_email,contact_reference_table_id,contact_reference_record_id,target
    orgRequestItemsTargetTypeFilterParams:
      in: query
      name: filter[target.type]
      description: Requesting the API to filter results by target type. For more information, see <a href="#section/Making-requests">Making requests</a>
      required: false
      schema:
        type: string
        example: test_plans
  schemas:
    GetRequestItemResponse:
      type: object
      description: The data associated with the resource.
      required:
      - data
      properties:
        data:
          type: object
          description: The data associated with the resource.
          required:
          - id
          - type
          - attributes
          - relationships
          properties:
            id:
              type: string
              description: The ID of the requested resource.
              example: '1'
            type:
              type: string
              description: The classification of the object (`"request_items"`).
              example: request_items
            attributes:
              type: object
              description: The attributes associated with the resource.
              properties:
                description:
                  type: string
                  description: Describes the requested information, such as the document name, version number, or department where you might expect to find the information.
                  maxLength: 524288
                  example: <h1>Description heading</h1><p>Request item description.</p>
                created_at:
                  type: string
                  description: The timestamp identifying when the request item was created.
                  example: '2019-02-09T13:17:26Z'
                  format: date-time
                updated_at:
                  type: string
                  description: The timestamp identifying when the request item was last updated.
                  example: '2019-02-09T13:17:26Z'
                  format: date-time
                owner:
                  type: string
                  description: 'Specifies the name of the person responsible for fulfilling the request.

                    If the person is not a user or contact in a HighBond instance, you can provide a value in this field on create or update.

                    This field becomes required if the `owner_user` relationship is not provided.

                    '
                  example: Owner name
                owner_email:
                  type: string
                  format: email
                  description: 'Specifies the email of the person responsible for fulfilling the request.

                    If the person is not a user or contact in a HighBond instance, you can provide a value in this field on create or update.

                    '
                  example: owner_email@example.com
                received:
                  type: boolean
                  description: 'Specifies if the request item has been received (`true`) or if it is still open (`false`). The default is `false`.


                    >**Note**: Deprecated, please us the `request_item_status` instead of this.

                    '
                  example: false
                request_item_status:
                  type: string
                  description: 'Specifies the status of the request item.

                    '
                  example: Open
                requestor:
                  type: string
                  description: 'Specifies the name of the person requesting the documentation.

                    '
                  example: Requestor name
                due_date:
                  type: string
                  description: Specifies when the request should be fulfilled by.
                  example: '2020-06-01'
                  format: date
                send_recurrent_notifications:
                  type: boolean
                  description: 'Sends an email to the request owner and CC''ed persons on a specified recurring schedule.

                    For more information about recurring reminders, see

                    <a href="https://help.highbond.com/helpdocs/highbond/en-us/Content/projects/fieldwork/requests/sending_recurring_request_reminders.htm"

                    target="_blank">Sending recurring request reminders</a>.

                    '
                  example: false
                email_subject:
                  type: string
                  description: Provides the ability to customize the email subject line.
                  example: Email subject
                email_message:
                  type: string
                  description: Provides the ability to customize the body of the email.
                  example: Email message
                position:
                  type: integer
                  description: 'The value that determines the order in which it is displayed. `position` must be a value between `1` and `2147483647`.

                    '
                  example: 1
                cc_contacts:
                  type:
                  - array
                  - 'null'
                  description: 'Specifies one or more people that can contribute to the request. A comma separated list of email addresses.

                    '
                  example:
                  - email_1@example.com
                  - email_2@example.com
                  items:
                    type: string
                    format: email
                contact_reference_name:
                  type: string
                  description: 'Specifies the name of the contact reference for fulfilling the request.

                    Should be provided together with other contact reference fields.

                    Values in contact reference fields will override any values provided in the `owner` and `owner_email`, but will not override owner relationship.

                    '
                  example: Contact User Name
                contact_reference_email:
                  type: string
                  description: 'Specifies the email of the contact reference for fulfilling the request.

                    Should be provided together with other contact reference fields.

                    Values in contact reference fields will override any values provided in the `owner` and `owner_email`, but will not override owner relationship.

                    '
                  example: email_1@example.com
                contact_reference_table_id:
                  type: string
                  description: 'Specifies the table_id of the contact reference for fulfilling the request.

                    Should be provided together with other contact reference fields.

                    Values in contact reference fields will override any values provided in the `owner` and `owner_email`, but will not override owner relationship.

                    '
                  example: '13517676342454'
                contact_reference_record_id:
                  type: string
                  description: "Specifies the record_id of the contact reference for fulfilling the request.\nShould be provided together with other contact reference fields. \nValues in contact reference fields will override any values provided in the `owner` and `owner_email`, but will not override owner relationship.\n"
                  example: '512356'
            relationships:
              type: object
              description: The relationships associated with the resource.
              properties:
                project:
                  type: object
                  description: Specifies the project that the request item is associated with.
                  properties:
                    data:
                      type: object
                      description: The data associated with a project.
                      properties:
                        id:
                          type: string
                          description: The ID of the project.
                          example: '1'
                        type:
                          type: string
                          description: The classification of the object (`"projects"`).
                          example: projects
                target:
                  type:
                  - object
                  - 'null'
                  description: Specifies the resource that the request item is associated with.
                  properties:
                    data:
                      type: object
                      description: The data associated with a project.
                      properties:
                        id:
                          type: string
                          description: The ID of the resource.
                          example: '1'
                        type:
                          type: string
                          description: 'The classification of the object.


                            A target can have one of the following types: `"projects"`, `"controls"`, `"control_tests"`,

                            `"control_test_plans"`, `"issues"`, `"narratives"`, `"objectives"`, `"walkthrough_summaries"`,

                            `"project_files"`, `"project_plannings"`, `"project_results"`, `"risks"`, `"risk_control_matrices"`,

                            `"testing_rounds"`, `"walkthroughs"`.

                            '
                          example: objectives
                owner_user:
                  type:
                  - object
                  - 'null'
                  description: 'Specifies the user responsible for fulfilling the request.

                    A value in this field will override any values provided in the `owner` and `owner_email` attributes or contact reference fields.

                    This field becomes required if the `owner` attribute is not provided.

                    '
                  required:
                  - data
                  properties:
                    data:
                      type: object
                      description: The data associated with the resource.
                      required:
                      - id
                      - type
                      properties:
                        id:
                          type: string
                          description: 'The unique identifier (UID) of the user. For more information on obtaining this value, see

                            <a href="#section/Making-requests">Making requests</a>.

                            '
                          example: 3NQ6XzAUxqJMnAQ7n4KF
                        type:
                          type: string
                          description: The classification of the object (`"users"`).
                          example: users
                requestor_user:
                  type: object
                  description: 'Specifies the user requesting the documentation.

                    '
                  required:
                  - data
                  properties:
                    data:
                      type: object
                      description: The data associated with the resource.
                      required:
                      - id
                      - type
                      properties:
                        id:
                          type: string
                          description: 'The unique identifier (UID) of the user. For more information on obtaining this value, see

                            <a href="#section/Making-requests">Making requests</a>.

                            '
                          example: 3NQ6XzAUxqJMnAQ7n4KF
                        type:
                          type: string
                          description: The classification of the object (`"users"`).
                          example: users
                cc_users:
                  type:
                  - object
                  - 'null'
                  description: 'Specifies one or more users in a HighBond instance that can contribute to the request.

                    '
                  required:
                  - data
                  properties:
                    data:
                      type: array
                      items:
                        type: object
                        description: The data associated with the resource.
                        required:
                        - id
                        - type
                        properties:
                          id:
                            type: string
                            description: 'The unique identifier (UID) of the user. For more information on obtaining this value, see

                              <a href="#section/Making-requests">Making requests</a>.

                              '
                            example: 3NQ6XzAUxqJMnAQ7n4KF
                          type:
                            type: string
                            description: The classification of the object (`"users"`).
                            example: users
    GetOrgRequestItemsResponse:
      type: object
      description: The data associated with the resource.
      required:
      - data
      properties:
        data:
          type: array
          items:
            type: object
            description: The data associated with the resource.
            required:
            - id
            - type
            - attributes
            - relationships
            properties:
              id:
                type: string
                description: The ID of the requested resource.
                example: '1'
              type:
                type: string
                description: The classification of the object (`"request_items"`).
                example: request_items
              attributes:
                type: object
                description: The attributes associated with the resource.
                properties:
                  description:
                    type: string
                    description: Describes the requested information, such as the document name, version number, or department where you might expect to find the information.
                    maxLength: 524288
                    example: <h1>Description heading</h1><p>Request item description.</p>
                  created_at:
                    type: string
                    description: The timestamp identifying when the request item was created.
                    example: '2019-02-09T13:17:26Z'
                    format: date-time
                  updated_at:
                    type: string
                    description: The timestamp identifying when the request item was last updated.
                    example: '2019-02-09T13:17:26Z'
                    format: date-time
                  owner:
                    type: string
                    description: 'Specifies the name of the person responsible for fulfilling the request.

                      If the person is not a user or contact in a HighBond instance, you can provide a value in this field on create or update.

                      This field becomes required if the `owner_user` relationship is not provided.

                      '
                    example: Owner name
                  owner_email:
                    type: string
                    format: email
                    description: 'Specifies the email of the person responsible for fulfilling the request.

                      If the person is not a user or contact in a HighBond instance, you can provide a value in this field on create or update.

                      '
                    example: owner_email@example.com
                  received:
                    type: boolean
                    description: 'Specifies if the request item has been received (`true`) or if it is still open (`false`). The default is `false`.


                      >**Note**: Deprecated, please us the `request_item_status` instead of this.

                      '
                    example: false
                  request_item_status:
                    type: string
                    description: 'Specifies the status of the request item.

                      '
                    example: Open
                  requestor:
                    type: string
                    description: 'Specifies the name of the person requesting the documentation.

                      '
                    example: Requestor name
                  due_date:
                    type: string
                    description: Specifies when the request should be fulfilled by.
                    example: '2020-06-01'
                    format: date
                  send_recurrent_notifications:
                    type: boolean
                    description: 'Sends an email to the request owner and CC''ed persons on a specified recurring schedule.

                      For more information about recurring reminders, see

                      <a href="https://help.highbond.com/helpdocs/highbond/en-us/Content/projects/fieldwork/requests/sending_recurring_request_reminders.htm"

                      target="_blank">Sending recurring request reminders</a>.

                      '
                    example: false
                  email_subject:
