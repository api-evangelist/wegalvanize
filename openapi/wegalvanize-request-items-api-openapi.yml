                      '
                    example: '13517676342454'
                  contact_reference_record_id:
                    type: string
                    description: "Specifies the record_id of the contact reference for fulfilling the request.\nShould be provided together with other contact reference fields. \nValues in contact reference fields will override any values provided in the `owner` and `owner_email`, but will not override owner relationship.\n"
                    example: '512356'
              relationships:
                type: object
                description: The relationships associated with the resource.
                properties:
                  project:
                    type: object
                    description: Specifies the project that the request item is associated with.
                    properties:
                      data:
                        type: object
                        description: The data associated with a project.
                        properties:
                          id:
