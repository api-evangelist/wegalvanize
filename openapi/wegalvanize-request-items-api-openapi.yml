                    description: 'Specifies one or more people that can contribute to the request. A comma separated list of email addresses.

                      '
                    example:
                    - email_1@example.com
                    - email_2@example.com
                    items:
                      type: string
                      format: email
                  contact_reference_name:
                    type: string
                    description: 'Specifies the name of the contact reference for fulfilling the request.

                      Should be provided together with other contact reference fields.

                      Values in contact reference fields will override any values provided in the `owner` and `owner_email`, but will not override owner relationship.

                      '
                    example: Contact User Name
                  contact_reference_email:
                    type: string
                    description: 'Specifies the email of the contact reference for fulfilling the request.

                      Should be provided together with other contact reference fields.

                      Values in contact reference fields will override any values provided in the `owner` and `owner_email`, but will not override owner relationship.

                      '
                    example: email_1@example.com
                  contact_reference_table_id:
                    type: string
                    description: 'Specifies the table_id of the contact reference for fulfilling the request.

