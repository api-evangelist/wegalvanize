openapi: 3.2.0
info:
  title: HighBond API Reference Collaborators API
  version: 1.1.0
  description: Welcome to the API documentation for HighBond.
  x-logo:
    url: ./assets/logo.png
    altText: HighBond Logo
servers:
- url: '{protocol}://{server}/v1'
  variables:
    protocol:
      default: https
    server:
      default: apis-us.highbond.com
      enum:
      - apis-us.highbond.com
      - apis-ca.highbond.com
      - apis-eu.highbond.com
      - apis-ap.highbond.com
      - apis-au.highbond.com
      - apis-af.highbond.com
      - apis-sa.highbond.com
      - apis-jp.highbond.com
security:
- bearerToken: []
tags:
- name: Collaborators
  description: A collaborator is a representation of user roles, which are associated with projects and frameworks, that you can manipulate.
paths:
  /orgs/{org_id}/{parent_resource_type}/{parent_resource_id}/collaborators:
    get:
      tags:
      - Collaborators
      operationId: getCollaborators
      summary: Get collaborators
      description: 'Get all collaborators in a project or framework.


        Note:

        * Only users that have an assigned `project_role` are returned in the response.'
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/parentResourceTypeParam'
      - $ref: '#/components/parameters/parentResourceIdParam'
      - $ref: '#/components/parameters/collaboratorSparseFieldsetParams'
      - $ref: '#/components/parameters/collaboratorIncludeParam'
      responses:
        '200':
          description: OK.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/GetCollaboratorsResponse'
        '400':
          $ref: '#/components/responses/MissingResourceId'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/NotJsonapiMediaType'
    post:
      tags:
      - Collaborators
      operationId: createCollaborator
      summary: Create a collaborator
      description: 'Add a user with a specific project role to an existing project or framework.


        Limitations:

        * You cannot add a user as a collaborator if they already have an assigned `project_role`.'
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/parentResourceTypeParam'
      - $ref: '#/components/parameters/parentResourceIdParam'
      - $ref: '#/components/parameters/collaboratorSparseFieldsetParams'
      - $ref: '#/components/parameters/collaboratorIncludeParam'
      requestBody:
        description: The data required to create a collaborator.
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/CreateCollaboratorRequest'
      responses:
        '201':
          description: Created.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/GetCollaboratorResponse'
        '400':
          $ref: '#/components/responses/ResourceTypeMismatch'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/NotJsonapiMediaType'
        '422':
          description: 'Unprocessable entity.

            '
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/Errors'
              example:
                errors:
                - status: 422
                  source:
                    pointer: /data/attributes/title
                  code: invalid_resource
                  detail: can't be blank
  /orgs/{org_id}/collaborators/{encoded_uid}:
    get:
      tags:
      - Collaborators
      operationId: getCollaborator
      summary: Get a collaborator
      description: 'Get information about a specific collaborator.


        Note:

        * Only users that have an assigned `project_role` are returned in the response..'
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/EncodedUid'
      - $ref: '#/components/parameters/collaboratorSparseFieldsetParams'
      - $ref: '#/components/parameters/collaboratorIncludeParam'
      responses:
        '200':
          description: OK.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/GetCollaboratorResponse'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - Collaborators
      operationId: updateCollaborator
      summary: Update a collaborator
      description: 'Make changes to a collaborator in a project or framework, like changing their project role.


        Limitations:

        * You can''t update users who are System Admins.'
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/EncodedUid'
      - $ref: '#/components/parameters/collaboratorSparseFieldsetParams'
      - $ref: '#/components/parameters/collaboratorIncludeParam'
      requestBody:
        description: The data required to update a collaborator.
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/UpdateCollaboratorRequest'
      responses:
        '200':
          description: OK.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/GetCollaboratorResponse'
        '400':
          $ref: '#/components/responses/MissingResourceId'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/NotJsonapiMediaType'
        '422':
          description: 'Unprocessable entity.

            '
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/Errors'
              example:
                errors:
                - status: 422
                  source:
                    pointer: /data/attributes/name
                  code: invalid_resource
                  detail: can't be blank
    delete:
      tags:
      - Collaborators
      operationId: deleteCollaborator
      summary: Delete a collaborator
      description: Remove a collaborator from a project or framework.
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/EncodedUid'
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: 'Unprocessable entity.

            '
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/Errors'
              example:
                errors:
                - status: 422
                  code: certification_association
                  detail: This collaborator is associated with one or more certifications. To delete this collaborator, you must delete the associated certification.
  /orgs/{org_id}/{parent_resource_type}/{parent_resource_id}/collaborator_groups:
    get:
      tags:
      - Collaborators
      operationId: getCollaboratorGroups
      summary: Get collaborator groups
      description: 'Get all collaborator groups in a project or framework.


        Note:

        * Only groups with assigned `project_role` are returned in the response.

        * The `updated_at` field represents the date of the last direct collaborator group update.'
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/parentResourceTypeParam'
      - $ref: '#/components/parameters/parentResourceIdParam'
      - $ref: '#/components/parameters/collaboratorGroupSparseFieldsetParams'
      - $ref: '#/components/parameters/collaboratorGroupIncludeParam'
      responses:
        '200':
          description: OK.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/GetCollaboratorGroupsResponse'
        '400':
          $ref: '#/components/responses/MissingResourceId'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/NotJsonapiMediaType'
    post:
      tags:
      - Collaborators
      operationId: createCollaboratorGroup
      summary: Create a collaborator group
      description: 'Assign a role for a group to an existing project or framework.


        Limitations:

        * You can only assign a role to an existing group if it has a value of `none` assigned in the `project_role` attribute.'
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/parentResourceTypeParam'
      - $ref: '#/components/parameters/parentResourceIdParam'
      - $ref: '#/components/parameters/collaboratorGroupSparseFieldsetParams'
      - $ref: '#/components/parameters/collaboratorGroupIncludeParam'
      requestBody:
        description: The data required to create a collaborator group.
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/CreateCollaboratorGroupRequest'
      responses:
        '201':
          description: Created.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/GetCollaboratorGroupResponse'
        '400':
          $ref: '#/components/responses/ResourceTypeMismatch'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/NotJsonapiMediaType'
        '422':
          description: 'Unprocessable entity.

            '
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/Errors'
              example:
                errors:
                - status: 422
                  source:
                    pointer: /data/attributes/title
                  code: invalid_resource
                  detail: can't be blank
  /orgs/{org_id}/collaborator_groups/{encoded_uid}:
    get:
      tags:
      - Collaborators
      operationId: getCollaboratorGroup
      summary: Get a collaborator group
      description: 'Get information about a specific collaborator group.


        Note:

        * You can only view a collaborator group if it has a value assigned to the `project_role` attribute.

        * The `updated_at` field represents the date of the last direct collaborator group update. Changes to the `effective_role` may occur as a result of assigning the group a `group_role`, but doing so won''t update the `updated_at` field.'
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/collaboratorGroupEncodedUid'
      - $ref: '#/components/parameters/collaboratorGroupSparseFieldsetParams'
      - $ref: '#/components/parameters/collaboratorGroupIncludeParam'
      responses:
        '200':
          description: OK.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/GetCollaboratorGroupResponse'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - Collaborators
      operationId: updateCollaboratorGroup
      summary: Update a collaborator group
      description: 'Make changes to a collaborator group in a project or framework, like changing its `project_role` attribute.


        Limitations:

        * You can''t update a group that has a value of `none` assigned to the `project_role` attribute.

        * You can''t update the `Default System Admins` group.'
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/collaboratorGroupEncodedUid'
      - $ref: '#/components/parameters/collaboratorGroupSparseFieldsetParams'
      - $ref: '#/components/parameters/collaboratorGroupIncludeParam'
      requestBody:
        description: The data required to update a collaborator group.
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/UpdateCollaboratorGroupRequest'
      responses:
        '200':
          description: OK.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/GetCollaboratorGroupResponse'
        '400':
          $ref: '#/components/responses/MissingResourceId'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/NotJsonapiMediaType'
        '422':
          description: 'Unprocessable entity.

            '
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/Errors'
              example:
                errors:
                - status: 422
                  source:
                    pointer: /data/attributes/name
                  code: invalid_resource
                  detail: can't be blank
    delete:
      tags:
      - Collaborators
      operationId: deleteCollaboratorGroup
      summary: Delete a collaborator group
      description: 'Remove a collaborator group from a project or framework.


        Limitations:

        * You can''t unassign the `Default System Admins` group from a project.'
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/collaboratorGroupEncodedUid'
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: 'Unprocessable entity.

            '
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/Errors'
              example:
                errors:
                - status: 422
                  code: admin_reassignment
                  detail: Failed to assign System Admin Group to project role.
components:
  responses:
    Accepted:
      description: Accepted.
    BadCredentials:
      description: Bad credentials.
    Forbidden:
      description: Forbidden.
    NotFound:
      description: Not found.
      content:
        application/vnd.api+json:
          schema:
            $ref: '#/components/schemas/Errors'
          example:
            errors:
            - status: '404'
              title: Not Found
              detail: The requested resource does not exist.
    NotJsonapiMediaType:
      description: Unsupported media type.
      content:
        application/vnd.api+json:
          schema:
            $ref: '#/components/schemas/Errors'
          example:
            errors:
            - status: 415
              code: unsupported_media_type
              title: Unsupported media type
              detail: 'The endpoint supports only the application/vnd.api+json Content-Type. This request specified application/json.

                '
    MissingResourceId:
      description: Bad request.
      content:
        application/vnd.api+json:
          schema:
            $ref: '#/components/schemas/Errors'
          example:
            errors:
            - status: 400
              code: parameter_missing
              title: Parameter missing
              detail: The required parameter, id, is missing.
    ResourceTypeMismatch:
      description: Bad request.
      content:
        application/vnd.api+json:
          schema:
            $ref: '#/components/schemas/Errors'
          example:
            errors:
            - status: 400
              code: resource_type_mismatch
              title: Resource type mismatch
              detail: 'The requested data type, a-bad-type, is incompatible with the endpoint.

                '
  schemas:
    GetCollaboratorsResponse:
      type: object
      description: The data associated with the resource.
      required:
      - data
      - included
      properties:
        data:
          type: array
          items:
            type: object
            description: The data associated with the resource.
            required:
            - id
            - type
            - attributes
            - relationships
            properties:
              id:
                type: string
                description: 'The IDs of the parent resource (project or framework) and user, in the `parent_resource_id:user_uid` format, which then must be encoded into Base64.


                  For example, if the `parent_resource_id` is `11955` and the `user_uid` is `yvqdNCtv8TeM47WQtzau`, you would encode `11955:yvqdNCtv8TeM47WQtzau` into Base64. The result is `MTE5NTU6eXZxZE5DdHY4VGVNNDdXUXR6YXU=`, which is the `id`.

                  '
                example: MTE5NTU6eXZxZE5DdHY4VGVNNDdXUXR6YXU=
              type:
                type: string
                description: The classification of the object (`"collaborators"`).
                example: collaborators
              attributes:
                type: object
                description: The attributes associated with the resource.
                required:
                - title
                - reference
                properties:
                  project_role:
                    type: string
                    description: "Roles apply within an individual project or framework. A single user may have a different role for each project or framework.\n\nAvailable project roles are:\n  `\"professional_manager\"`, `\"professional_user\"`, `\"oversight_executive\"`, `\"oversight_reviewer\"`,\n  `\"contributor_user\"`, `\"contributor_manager\"`, `\"contributor_tester\"`\n"
                    example: professional_manager
                  effective_role:
                    type: string
                    description: 'A user may be assigned to a project as an individual with a specific role, and also as a member of a group with a different role.

                      If those roles conflict with each other, HighBond uses the effective_role.

                      '
                    example: client_manager
                  organization_role:
                    type: string
                    description: "Organization roles are user privileges that allow users to perform actions in projects and frameworks. <a href=\"https://help.highbond.com/helpdocs/highbond/en-us/Default.htm#cshid=pm-roles-privilege-types\" target=\"_blank\">Learn more about privileges in projects and frameworks</a>.\n\nAvailable account roles are:\n  `\"sys_admin\"`, `\"project_creator\"`, `\"admin\"`, `\"project_type_admin\"`, `\"archivist\"`, `\"timesheets_admin\"`,\n  `\"compliance_maps_read\"`, `\"compliance_maps_write\"`, `\"compliance_maps_no_access\"`, `\"assurance_plan_admin\"`\n"
                    example: project_creator
                  created_at:
                    type: string
                    description: The timestamp identifying when the collaborator was created.
                    example: '2019-02-09T13:17:26Z'
                    format: date-time
                  updated_at:
                    type: string
                    description: The timestamp identifying when the collaborator was last updated.
                    example: '2019-02-09T13:17:26Z'
                    format: date-time
              relationships:
                type: object
                description: The relationships associated with the resource.
                required:
                - project or framework
                properties:
                  project:
                    type: object
                    description: 'Each collaborator has an associated project or framework. Project/framework is a management system that allows you to define and compile information

                      for reporting purposes.

                      '
                    required:
                    - data
                    properties:
                      data:
                        type: object
                        description: The data associated with the resource.
                        required:
                        - id
                        - type
                        properties:
                          id:
                            type: string
                            description: The ID of the project.
                            example: '1'
                          type:
                            type: string
                            description: The classification of the object (`"projects"`).
                            example: projects
                  framework:
                    type: object
                    description: 'Each collaborator has an associated project or framework. Project/framework is a management system that allows you to define and compile information

                      for reporting purposes.

                      '
                    required:
                    - data
                    properties:
                      data:
                        type: object
                        description: The data associated with the resource.
                        required:
                        - id
                        - type
                        properties:
                          id:
                            type: string
                            description: The ID of the framework.
                            example: '1'
                          type:
                            type: string
                            description: The classification of the object (`"frameworks"`).
                            example: frameworks
                  user:
                    type: object
                    description: 'Details of the user nested in that endpoint.

                      '
                    required:
                    - data
                    properties:
                      data:
                        type: object
                        description: The data associated with the resource.
                        required:
                        - id
                        - type
                        properties:
                          id:
                            type: string
                            description: The unique identifier (UID) of the assigned user. For more information on obtaining this value, see <a href="#section/Making-requests">Making requests</a>.
                            example: yvqdNCtv8TeM47WQtzau
                          type:
                            type: string
                            description: The classification of the object (`"users"`).
                            example: users
    CreateCollaboratorGroupRequest:
      type: object
      description: The data associated with the resource.
      required:
      - data
      properties:
        data:
          type: object
          description: The data associated with the resource.
          required:
          - type
          - attributes
          - relationships
          properties:
            type:
              type: string
              description: The classification of the object (`"collaborator_groups"`).
              example: collaborator_groups
            attributes:
              type: object
              description: The attributes associated with the resource.
              required:
              - project_role
              properties:
                project_role:
                  type: string
                  description: "Assigned role for group within project or framework.\n\nAvailable project roles are:\n  `\"professional_manager\"`, `\"professional_user\"`, `\"oversight_executive\"`, `\"oversight_reviewer\"`,\n  `\"contributor_user\"`, `\"contributor_manager\"`, `\"contributor_tester\"`\n"
                  example: professional_manager
            relationships:
              type: object
              description: The relationships associated with the resource.
              required:
              - group
              properties:
                group:
                  type: object
                  description: 'Groups are a security feature in Launchpad that allow you to assign the same level of access to multiple users simultaneously.

                    '
                  required:
                  - data
                  properties:
                    data:
                      type: object
                      description: The data associated with the resource.
                      required:
                      - id
                      - type
                      properties:
                        id:
                          type: string
                          description: The identifier of the assigned group.
                          example: 1
                        type:
                          type: string
                          description: The classification of the object (`"groups"`).
                          example: groups
    GetCollaboratorGroupsResponse:
      type: object
      description: The data associated with the resource.
      required:
      - data
      - included
      properties:
        data:
          type: array
          items:
            type: object
            description: The data associated with the resource.
            required:
            - id
            - type
            - attributes
            - relationships
            properties:
              id:
                type: string
                description: 'The IDs of the parent resource (project or framework) and Launchpad ID of the group, in the `parent_resource_id:group_lp_id` format, which then must be encoded into Base64.


                  For example, if the `parent_resource_id` is `11955` and the `group_lp_id` is `yvqdNCtv8TeM47WQtzau`, you would encode `11955:yvqdNCtv8TeM47WQtzau` into Base64. The result is `MTE5NTU6eXZxZE5DdHY4VGVNNDdXUXR6YXU=`, which is the `id`.

                  '
                example: MTE5NTU6eXZxZE5DdHY4VGVNNDdXUXR6YXU=
              type:
                type: string
                description: The classification of the object (`"collaborator_groups"`).
                example: collaborator_groups
              attributes:
                type: object
                description: The attributes associated with the resource.
                required:
                - title
                - reference
                properties:
                  project_role:
                    type: string
                    description: "Assigned role for group within project or framework.\n\nAvailable project roles are:\n  `\"professional_manager\"`, `\"professional_user\"`, `\"oversight_executive\"`, `\"oversight_reviewer\"`,\n  `\"contributor_user\"`, `\"contributor_manager\"`, `\"contributor_tester\"`\n"
                    example: professional_manager
                  admin:
                    type: boolean
                    description: 'Indicates if the group is assigned as the System Admin Group in Launchpad.

                      '
                    example: false
                  disabled:
                    type: boolean
                    description: 'Indicates if the `project_role` attribute has a value assigned to it.

                      '
                    example: false
                  default:
                    type: boolean
                    description: 'Indicates if the group was assigned by default to a project or framework.

                      '
                    example: false
                  created_at:
                    type: string
                    description: The timestamp identifying when the collaborator group was created.
                    example: '2019-02-09T13:17:26Z'
                    format: date-time
                  updated_at:
                    type: string
                    description: The timestamp identifying when the collaborator group was last updated.
                    example: '2019-02-09T13:17:26Z'
                    format: date-time
              relationships:
                type: object
                description: The relationships associated with the resource.
                required:
                - project or framework
                properties:
                  project:
                    type: object
                    description: 'Each collaborator group has an associated project or framework. A project/framework is a management system that allows you to define and compile information

                      for reporting purposes.

                      '
                    required:
                    - data
                    properties:
                      data:
                        type: object
                        description: The data associated with the resource.
                        required:
                        - id
                        - type
                        properties:
                          id:
                            type: string
                            description: The ID of the project.
                            example: '1'
                          type:
                            type: string
                            description: The classification of the object (`"projects"`).
                            example: projects
                  framework:
                    type: object
                    description: 'Each collaborator group has an associated project or framework. A project/framework is a management system that allows you to define and compile information

                      for reporting purposes.

                      '
                    required:
                    - data
                    properties:
                      data:
                        type: object
                        description: The data associated with the resource.
                        required:
                        - id
                        - type
                        properties:
                          id:
                            type: string
                            description: The ID of the framework.
                            example: '1'
                          type:
                            type: string
                            description: The classification of the object (`"frameworks"`).
                            example: frameworks
                  group:
                    type: object
