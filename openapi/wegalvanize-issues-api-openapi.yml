openapi: 3.2.0
info:
  title: HighBond API Reference Issues API
  version: 1.1.0
  description: Welcome to the API documentation for HighBond.
  x-logo:
    url: ./assets/logo.png
    altText: HighBond Logo
servers:
- url: '{protocol}://{server}/v1'
  variables:
    protocol:
      default: https
    server:
      default: apis-us.highbond.com
      enum:
      - apis-us.highbond.com
      - apis-ca.highbond.com
      - apis-eu.highbond.com
      - apis-ap.highbond.com
      - apis-au.highbond.com
      - apis-af.highbond.com
      - apis-sa.highbond.com
      - apis-jp.highbond.com
security:
- bearerToken: []
tags:
- name: Issues
  description: 'An issue is a problem, control gap, or exception that has been identified within a project. Adding an issue involves recording basic information about the issue and assigning

    the issue to an owner. Issues may also be known as deficiencies, findings, or another customized term.


    > **Note —**

    Only issues in projects that have an `"active"` state can be accessed using the API.


    Learn more about issues.'
paths:
  /orgs/{org_id}/issues:
    get:
      tags:
      - Issues
      operationId: getOrgIssues
      summary: Get an organization's issues
      description: 'Get a list of all issues in an organization.


        > **Note:**

        By default, this endpoint only returns issues from active projects. To fetch objects from archived projects, do one of the following:

        > * Specify the active or archived project ID using `filter[project.id]`

        > * Specify that you want results from archived projects using `filter[project.state]=archive`'
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/issueProjectIdFilterParams'
      - $ref: '#/components/parameters/issueProjectStateFilterParams'
      - $ref: '#/components/parameters/issueTargetTypeFilterParams'
      - $ref: '#/components/parameters/issueTargetIdFilterParams'
      - $ref: '#/components/parameters/issueClosedFilterParams'
      - $ref: '#/components/parameters/issueSortParams'
      - $ref: '#/components/parameters/issueSparseFieldsetParams'
      - $ref: '#/components/parameters/pageSizeParam'
      - $ref: '#/components/parameters/pageNumberEncodedParam'
      responses:
        '200':
          description: OK.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/GetIssuesResponse'
        '400':
          $ref: '#/components/responses/MissingProjectId'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/NotJsonapiMediaType'
  /orgs/{org_id}/projects/{project_id}/issues:
    get:
      tags:
      - Issues
      operationId: getIssues
      summary: Get issues
      description: Get a list of all issues in a project.
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/projectIdParam'
      - $ref: '#/components/parameters/issueSparseFieldsetParams'
      - $ref: '#/components/parameters/pageSizeParam'
      - $ref: '#/components/parameters/pageNumberEncodedParam'
      responses:
        '200':
          description: OK.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/GetIssuesResponse'
        '400':
          $ref: '#/components/responses/MissingProjectId'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/NotJsonapiMediaType'
    post:
      tags:
      - Issues
      operationId: createIssue
      summary: Create an issue
      description: 'Create a new issue in an existing project.


        Limitations:

        * There can be a maximum of 8000 issues per project.

        * You cannot create an issue directly under individual objectives, risks, controls, walkthroughs, test plans, or testing rounds. Issues can only be created under a project.

        * Issues created under a project do not display as part of assurance features in HighBond.

        * Specifying a person''s name or email in the following fields does not automatically notify them via email: `owner`, `project_owner`, `executive_owner`.'
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/projectIdParam'
      - $ref: '#/components/parameters/issueSparseFieldsetParams'
      requestBody:
        description: The data required to create an issue.
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/CreateIssueRequest'
      responses:
        '201':
          description: Created.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/GetIssueResponse'
        '400':
          $ref: '#/components/responses/ResourceTypeMismatch'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/NotJsonapiMediaType'
        '422':
          description: 'Unprocessable entity.

            '
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/Errors'
              example:
                errors:
                - status: 422
                  source:
                    pointer: /data/attributes/description
                  code: invalid_resource
                  detail: can't be blank
  /orgs/{org_id}/issues/{id}:
    get:
      tags:
      - Issues
      operationId: getIssue
      summary: Get an issue
      description: Get information about an issue.
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/resourceIdParam'
      - $ref: '#/components/parameters/issueSparseFieldsetParams'
      responses:
        '200':
          description: OK.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/GetIssueResponseWithIncludes'
        '400':
          $ref: '#/components/responses/MissingResourceId'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/NotJsonapiMediaType'
    patch:
      tags:
      - Issues
      operationId: updateIssue
      summary: Update an issue
      description: 'Make changes to an issue, like renaming it or specifying an owner.


        Limitations:

        * If the Issue Information subtab of the issue is signed off, you cannot update basic details about the issue.

        * If the Follow-up & Remediation subtab of the issue is signed off, you cannot update remediation details.

        * If the Retest Information subtab of the issue is signed off, you cannot update retesting details.

        * If the issue belongs to an objective that has been checked out using

        Offline Projects or the

        HighBond iPad app, you cannot update the issue.

        * Specifying a person''s name or email in the following fields does not automatically notify them via email: `owner`, `project_owner`, `executive_owner`.'
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/resourceIdParam'
      - $ref: '#/components/parameters/issueSparseFieldsetParams'
      requestBody:
        description: The data required to update an issue.
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/UpdateIssueRequest'
      responses:
        '200':
          description: OK.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/GetIssueResponseWithIncludes'
        '400':
          $ref: '#/components/responses/MissingResourceId'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/NotJsonapiMediaType'
        '422':
          description: 'Unprocessable entity.

            '
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/Errors'
              example:
                errors:
                - status: 422
                  source:
                    pointer: /data/attributes/description
                  code: invalid_resource
                  detail: can't be blank
                - status: 422
                  source:
                    pointer: /data/attributes/entities
                  code: invalid_resource
                  detail: 'Missing child or parent entity ids: [1, 2 ,3]'
                - status: 422
                  source:
                    pointer: /data/attributes/entities
                  code: invalid_resource
                  detail: 'Missing inherited entity ids: [1, 2, 3]'
                - status: 422
                  source:
                    pointer: /data/attributes/entities
                  code: invalid_resource
                  detail: Entities not found
    delete:
      tags:
      - Issues
      operationId: deleteIssue
      summary: Delete an issue
      description: 'Permanently delete an issue from a project.


        Limitation:

        If the issue belongs to an objective that has been checked out using

        Offline Projects or the

        HighBond iPad app, you cannot delete the issue.


        > **Caution —**

        Deleting an issue also removes any associated actions. Once deleted, you cannot access or restore the issue or associated actions.'
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/resourceIdParam'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/MissingOrgId'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/NotJsonapiMediaType'
  /orgs/{org_id}/issues/{issue_id}/entities:
    post:
      tags:
      - Issues
      operationId: createIssueEntityLink
      summary: Create issue entity link
      description: 'Link entity to an issue.


        > **Note**

        > * Tagging an issue to an entity automatically tags an issue with all ancestor entities and descendant entities.

        > * Request Get an issue with `entities` query param to get the whole list of entities linked to an issue.


        Limitations:

        * You cannot tag the issue with entity if the objective it belongs to has been checked out using

        Offline Projects or the

        HighBond iPad app.

        * Only 1 entity can be sent in the request payload.


        Learn more about tagging items with entities.'
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/issueIdParam'
      requestBody:
        description: The data required to create a issue entity link.
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/CreateIssueEntityRequest'
      responses:
        '201':
          description: Created.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/CreateIssueEntityResponse'
        '400':
          $ref: '#/components/responses/MissingResourceId'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/NotJsonapiMediaType'
        '422':
          description: 'Unprocessable entity.

            '
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/Errors'
              example:
                errors:
                - status: 422
                  source:
                    pointer: /data/attributes/base
                  code: invalid_resource
                  detail: Entity and Responsibility should reference the same account.
  /orgs/{org_id}/issues/{issue_id}/entities/{id}:
    delete:
      tags:
      - Issues
      operationId: deleteIssueEntityLink
      summary: Delete issue entity link
      description: 'Permanently delete issue entity link.


        > **Note -**

        Untagging an issue from an entity automatically untags an issue from all descendant entities.


        Limitations:

        * You cannot untag an issue from an entity if the objective it belongs to has been checked out using

        Offline Projects or the

        HighBond iPad app.

        * Inherited entity tags cannot be removed.'
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/issueIdParam'
      - $ref: '#/components/parameters/resourceIdParam'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/MissingOrgId'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/NotJsonapiMediaType'
        '422':
          description: 'Unprocessable entity.

            '
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/Errors'
              example:
                errors:
                - status: 422
                  source:
                    pointer: /data/attributes/base
                  code: invalid_resource
                  title: Invalid resource
                  detail: Cannot delete an inherited Entity.
components:
  schemas:
    CreateIssueRequest:
      type: object
      description: The data associated with the resource.
      required:
      - data
      properties:
        data:
          type: object
          description: The data associated with the resource.
          required:
          - type
          - attributes
          properties:
            type:
              type: string
              description: The classification of the object (`"issues"`).
              example: issues
            attributes:
              type: object
              description: The attributes associated with the resource.
              required:
              - description
              - deficiency_type
              - owner
              properties:
                description:
                  type: string
                  description: A detailed description of the issue.
                  maxLength: 524288
                  example: <h1>Description heading</h1><p>Issue description.</p>
                owner:
                  type: string
                  description: 'The person responsible for the issue. Specifying a person''s name or email does not automatically send them

                    an email notification about the issue.

                    This field becomes required if the `owner_user` relationship is not provided.

                    '
                  example: Payam Moghaddam
                deficiency_type:
                  type: string
                  description: 'A user configurable classification of the issue.

                    The options available depend on the <a href="https://help.highbond.com/helpdocs/highbond/en-us/Default.htm#cshid=pm-customize-terms" target="_blank">configuration of the project type</a>.

                    '
                  example: Deficiency
                recommendation:
                  type: string
                  description: A detailed description of the recommended actions to be taken based on the issue.
                  maxLength: 524288
                  example: <h1>Issue recommendation heading</h1><p>Recommendation description.</p>
                title:
                  type: string
                  description: The title of the issue.
                  maxLength: 255
                  example: Title of issue
                severity:
                  type: string
                  description: 'A user configurable label that specifies the intensity of the issue.

                    The options available depend on the <a href="https://help.highbond.com/helpdocs/highbond/en-us/Default.htm#cshid=pm-customize-terms" target="_blank">configuration of the project type</a>.

                    '
                  example: High
                published:
                  type: boolean
                  description: 'Specifies whether the issue is visible to all users (`true`), or hidden from users assigned the Contributor Tester, Contributor User, Oversight Executive, and Oversight Reviewer roles (`false`).

                    An issue must be published to display in other related HighBond apps, such as Strategy. The default is `false`.

                    '
                  example: true
                identified_at:
                  type: string
                  description: The timestamp specifying when the issue was identified. The default is the current date and time.
                  example: '2019-02-09T13:17:26Z'
                  format: date-time
                reference:
                  type: string
                  description: The ID of the issue.
                  maxLength: 255
                  example: ISS-01
                risk:
                  type: string
                  description: A detailed description of the risk or the impact the issue will have.
                  maxLength: 524288
                  example: <h1>Risk heading</h1><p>Risk or impact description.</p>
                scope:
                  type: string
                  description: 'A user configurable label that specifies the extent to which the issue affects the organization.

                    The options available depend on the <a href="https://help.highbond.com/helpdocs/highbond/en-us/Default.htm#cshid=pm-customize-terms" target="_blank">configuration of the project type</a>.

                    '
                  maxLength: 524288
                  example: Local
                escalation:
                  type: string
                  description: 'A user configurable label that specifies the person, department, or organizational body that the issue should be brought to.

                    The options available depend on the <a href="https://help.highbond.com/helpdocs/highbond/en-us/Default.htm#cshid=pm-customize-terms" target="_blank">configuration of the project type</a>.

                    '
                  example: Owner
                cause:
                  type: string
                  description: A detailed description of what caused the issue to occur.
                  maxLength: 524288
                  example: <h1>Issue cause heading</h1><p>Issue cause description.</p>
                effect:
                  type: string
                  description: A detailed description of the effect the issue will have on the organization.
                  maxLength: 524288
                  example: <h1>Issue effect heading</h1><p>Issue effect description.</p>
                cost_impact:
                  type:
                  - number
                  - 'null'
                  description: The estimated, or actual, monetary cost associated with the issue.
                  example: 4.2
                  format: double
                executive_summary:
                  type: string
                  description: A high level overview of the issue that typically summarizes information from other related fields, such as risk/impact, cause, and effect.
                  maxLength: 524288
                  example: <h1>Executive summary heading</h1><p>Executive summary description.</p>
                executive_owner:
                  type: string
                  description: 'The executive owner of the issue. Specifying a person''s name or email does not automatically send them

                    an email notification about the issue.

                    '
                  example: Max Powell
                project_owner:
                  type: string
                  description: 'The project owner of the issue. Specifying a person''s name or email does not automatically send them

                    an email notification about the issue.

                    '
                  example: Chris Rockwell
                closed:
                  type: boolean
                  description: 'Specifies whether the overall status of the issue is in an open (`false`) or closed state (`true`). The default is `false`.

                    '
                  example: false
                remediation_status:
                  type: string
                  description: 'A user configurable issue remediation status.

                    The options available depend on the <a href="https://help.highbond.com/helpdocs/highbond/en-us/Default.htm#cshid=pm-customize-terms" target="_blank">configuration of the project type</a>.

                    '
                  example: Opened
                remediation_plan:
                  type: string
                  description: A detailed description of the remediation plan.
                  maxLength: 524288
                  example: <h1>Remediation plan heading</h1><p>Remediation plan description.</p>
                remediation_date:
                  type: string
                  description: Specifies a deadline for the issue to be remediated by.
                  example: '2019-02-09'
                  format: date
                actual_remediation_date:
                  type: string
                  description: Specifies the date the issue was actually remediated.
                  example: '2019-02-09'
                  format: date
                retest_deadline_date:
                  type: string
                  description: Specifies a deadline for the issue to be retested by.
                  example: '2019-02-09'
                  format: date
                actual_retest_date:
                  type: string
                  description: Specifies the actual date when the issue was retested.
                  example: '2019-02-09'
                  format: date
                retesting_results_overview:
                  type: string
                  description: A detailed description that specifies whether or not the issue has truly been remediated.
                  maxLength: 524288
                  example: <h1>Retesting results overview heading</h1><p>Retesting results overview description.</p>
                position:
                  type: integer
                  format: int64
                  description: 'The value that determines the order in which it is displayed in the index action. `position` must be a value between `1` and `2147483647`.

                    '
                  example: 1
                custom_attributes:
                  type: array
                  description: An array of custom attributes defined by the user that are available on this object.
                  items:
                    type: object
                    description: A user defined custom attribute value.
                    properties:
                      id:
                        type: string
                        description: The ID of the custom attribute that this custom attribute value is for. Optional if term is included.
                        example: '42'
                      term:
                        type: string
                        description: The user defined term used to identify the custom attribute. Optional if id is included.
                        example: Custom Issue Attribute
                      value:
                        type: array
                        description: The value or values (for multiselect) to set this custom attribute to.
                        example:
                        - Custom Select Option Text
                        items:
                          type: string
            relationships:
              type: object
              description: The relationships associated with the resource.
              properties:
                target:
                  type: object
                  description: Specifies the resource that the issue is associated with. If a target field wasn't passed, then an Issue will be linked to a Project by default.
                  properties:
                    data:
                      type: object
                      description: The data associated with an issue.
                      properties:
                        id:
                          type: string
                          description: The ID of the resource.
                          example: '1'
                        type:
                          type: string
                          description: 'The classification of the object.


                            A target can have one of the following types: `"projects`", `"narratives`", `"objectives`", `"walkthrough_summaries`",

                            `"project_plannings`", `"walkthroughs`", `"control_tests`", `"control_test_plans`", `"project_results`", `"project_files`",

                            `"risk_control_matrices`", `"testing_rounds`", `"risks`", `"controls`"

                            '
                          example: objectives
                owner_user:
                  type:
                  - object
                  - 'null'
                  description: 'Specifies the user responsible for the issue.

                    A value in this field will override any values provided in the `owner` attribute.

                    This field becomes required if the `owner` attribute is not provided.

                    '
                  required:
                  - data
                  properties:
                    data:
                      type: object
                      description: The data associated with the resource.
                      required:
                      - id
                      - type
                      properties:
                        id:
                          type: string
                          description: 'The unique identifier (UID) of the user. For more information on obtaining this value, see

                            <a href="#section/Making-requests">Making requests</a>.

                            '
                          example: 3NQ6XzAUxqJMnAQ7n4KF
                        type:
                          type: string
                          description: The classification of the object (`"users"`).
                          example: users
    CreateIssueEntityResponse:
      type: object
      required:
      - data
      properties:
        data:
          type: object
          description: The data associated with the resource.
          required:
          - id
          - type
          properties:
            id:
              type: string
              description: The ID of the issue.
              example: '1'
            type:
              type: string
              description: The classification of the object (`"entities"`).
              example: entities
    CreateIssueEntityRequest:
      type: object
      description: The data associated with the resource.
      required:
      - data
      properties:
        data:
          type: object
          description: The data associated with the resource.
          required:
          - id
          - type
          properties:
            id:
              type: string
              description: The ID of the issue.
              example: '1'
            type:
              type: string
              description: The classification of the object (`"entities"`).
              example: entities
    GetIssueResponse:
      type: object
      description: The data associated with the resource.
      required:
      - data
      properties:
        data:
          type: object
          description: The data associated with the resource.
          required:
          - id
          - type
          - attributes
          - relationships
          properties:
            id:
              type: string
              description: The ID of the requested resource.
              example: '1'
            type:
              type: string
              description: The classification of the object (`"issues"`).
              example: issues
            attributes:
              type: object
              description: The attributes associated with the resource.
              properties:
                title:
                  type: string
                  description: The title of the issue.
                  maxLength: 255
                  example: Title of issue
                description:
                  type: string
                  description: A detailed description of the issue.
                  maxLength: 524288
                  example: <h1>Description heading</h1><p>Issue description.</p>
                creator_name:
                  type: string
                  description: The name of the person that created the issue. The default is the name of the current user.
                  example: Payam Moghaddam
                created_at:
                  type: string
                  description: The timestamp identifying when the issue was created.
                  example: '2019-02-09T13:17:26Z'
                  format: date-time
                updated_at:
                  type: string
                  description: The timestamp identifying when the issue was last updated.
                  example: '2019-02-09T13:17:26Z'
                  format: date-time
                owner:
                  type: string
                  description: 'The person responsible for the issue. Specifying a person''s name or email does not automatically send them

                    an email notification about the issue.

                    This field becomes required if the `owner_user` relationship is not provided.

                    '
                  example: Payam Moghaddam
                recommendation:
                  type: string
                  description: A detailed description of the recommended actions to be taken based on the issue.
                  maxLength: 524288
                  example: <h1>Issue recommendation heading</h1><p>Recommendation description.</p>
                deficiency_type:
                  type: string
                  description: 'A user configurable classification of the issue.

                    The options available depend on the <a href="https://help.highbond.com/helpdocs/highbond/en-us/Default.htm#cshid=pm-customize-terms" target="_blank">configuration of the project type</a>.

                    '
                  example: Deficiency
                severity:
                  type: string
                  description: 'A user configurable label that specifies the intensity of the issue.

                    The options available depend on the <a href="https://help.highbond.com/helpdocs/highbond/en-us/Default.htm#cshid=pm-customize-terms" target="_blank">configuration of the project type</a>.

                    '
                  example: High
                published:
                  type: boolean
                  description: 'Specifies whether the issue is visible to all users (`true`), or hidden from users assigned the Contributor Tester, Contributor User, Oversight Executive, and Oversight Reviewer roles (`false`).

                    An issue must be published to display in other related HighBond apps, such as Strategy. The default is `false`.

                    '
                  example: true
                identified_at:
                  type: string
