components:
  schemas:
    GetStrategyUserResponse:
      type: object
      description: The data associated with the resource.
      required:
      - data
      properties:
        data:
          type: object
          description: The data associated with the resource.
          required:
          - type
          - attributes
          properties:
            type:
              type: string
              description: The classification of the object (`"strategy_users"`).
              example: strategy_users
            attributes:
              type: object
              description: The attributes associated with the resource.
              properties:
                name:
                  type: string
                  description: Full name of the user.
                  example: John Doe
                email:
                  type: string
                  description: The email address of the user.
                  example: johndoe@riskybusiness.com
                grc_role:
                  type: string
                  example: ''
                role:
                  type: string
                  enum:
                  - admin
                  - executive
                  - reviewer
                  - no_access
                  example: admin
                user_type:
                  type: string
                  description: The type of the user.
                  example: user
                subscription_type:
                  type: string
                  nullable: true
                  description: 'The type of user subscription in this HighBond instance.  Available codes are: `"grc_full"` for _Professional_, `"grc_lite"`

                    for _Contributor_, `"grc_intermediate"` for _Oversight_, `"grc_results_cloud_admin"` for _Results Lite Professional_,

                    `"grc_results_cloud_user"` for _Results Lite Contributor_, and `null` for _None_.

                    '
                  example: grc_full
                time_zone:
                  type: string
                  description: The time zone of the user.
                  example: Pacific Time (US & Canada)
                locale:
                  type: string
                  description: 'The two letter code representing the user''s chosen locale in their HighBond profile.

                    The available locales are `"de"`, `"en"`, `"es"`, `"fr"`, `"pt"`, `"ja"`, and `"zh"`.

                    '
                  example: en
                date_format:
                  type: string
                  description: The date format this user uses when they view timestamped fields in HighBond.
                  example: '%m/%d/%Y'
                created_at:
                  type: string
                  description: The timestamp identifying when the user was created.
                  example: '2019-02-09T13:17:26Z'
                  format: date-time
                updated_at:
                  type: string
                  description: The timestamp identifying when the user was last updated.
                  example: '2019-02-09T13:17:26Z'
                  format: date-time
