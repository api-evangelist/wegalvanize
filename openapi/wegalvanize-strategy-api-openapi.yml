                  type: string
                  description: The data type of the custom attribute.
                  maxLength: 255
                  enum:
                  - text
                  - rich_text
                  - select
                  - multiselect
                  default: text
                  example: select
                options:
                  type: array
                  nullable: false
                  description: Selectable options of the values (when the `field_type` is `select` or `multiselect`).
                  default: []
                  example:
