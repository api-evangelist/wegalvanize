openapi: 3.2.0
info:
  title: HighBond API Reference Strategy API
  version: 1.1.0
  description: Welcome to the API documentation for HighBond.
  x-logo:
    url: ./assets/logo.png
    altText: HighBond Logo
servers:
- url: '{protocol}://{server}/v1'
  variables:
    protocol:
      default: https
    server:
      default: apis-us.highbond.com
      enum:
      - apis-us.highbond.com
      - apis-ca.highbond.com
      - apis-eu.highbond.com
      - apis-ap.highbond.com
      - apis-au.highbond.com
      - apis-af.highbond.com
      - apis-sa.highbond.com
      - apis-jp.highbond.com
security:
- bearerToken: []
tags:
- name: Strategy
  description: 'You can use the Strategy app to identify, assess, and monitor strategic risks.


    Learn more.'
paths:
  /orgs/{org_id}/strategy_risks:
    get:
      tags:
      - Strategy
      operationId: getStrategyRisks
      summary: Get risks
      description: 'Retrieves the full list of the organization''s risks from

        Strategy.


        A strategic risk is an effect of uncertainty on a strategic objective, with the effect having a positive or

        negative deviation from what is expected.


        The `status` field is the current state of the risk on the Kanban Board,

        its values can be:

        - `assess`

        - `accepted`

        - `audit`

        - `continuously_audit`

        - `mitigated`


        The field `strategy_custom_attributes` is an array containing all the currently assigned

        custom attributes for the risk. To get the definition of any custom attribute, you can use the

        Get a custom attribute endpoint.


        To retrive the `heat`, `score` and any other hidden fields, use the `fields[strategy_risks]` query parameter as

        described below.'
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/strategyRiskSparseFieldsetParams'
      - $ref: '#/components/parameters/strategyPageSizeParam'
      - $ref: '#/components/parameters/pageNumberEncodedParam'
      responses:
        '200':
          description: OK.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/GetStrategyRisksResponse'
        '400':
          $ref: '#/components/responses/MissingOrgId'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
      - Strategy
      operationId: createStrategyRisk
      summary: Create a risk
      description: 'Create a new risk in Strategy.


        A strategic risk is an effect of uncertainty on a strategic objective, with the effect having a positive or

        negative deviation from what is expected.


        The `status` field is the current state of the risk on the Kanban Board,

        its values can be:

        - `assess`

        - `accepted`

        - `audit`

        - `continuously_audit`

        - `mitigated`


        The field `strategy_custom_attributes` is an array containing all the currently assigned

        custom attributes for the risk. To get the definition of any custom attribute, you can use the

        Get a custom attribute endpoint.'
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      requestBody:
        description: The data required to create a risk.
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/CreateStrategyRiskRequest'
      responses:
        '201':
          description: Created.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/CreateStrategyRiskResponse'
        '400':
          $ref: '#/components/responses/ResourceTypeMismatch'
        '401':
          $ref: '#/components/responses/BadCredentials'
  /orgs/{org_id}/strategy_risks/{id}:
    get:
      tags:
      - Strategy
      operationId: getStrategyRisk
      summary: Get a risk
      description: Get information about a risk.
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/resourceIdParam'
      - $ref: '#/components/parameters/strategyRiskSparseFieldsetParams'
      responses:
        '200':
          description: OK.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/GetStrategyRiskResponse'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - Strategy
      operationId: updateStrategyRisk
      summary: Update a risk
      description: 'Make changes to a risk, including updating the risk''s title, description, status and custom attributes.


        Assigning an empty array to the `strategy_custom_attributes` field will remove all custom attributes from the risk.'
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/resourceIdParam'
      requestBody:
        description: The data required to update a risk.
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/UpdateStrategyRiskRequest'
      responses:
        '200':
          description: OK.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/UpdateStrategyRiskResponse'
        '400':
          $ref: '#/components/responses/MissingResourceId'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/NotJsonapiMediaType'
        '422':
          description: 'Unprocessable entity.

            '
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/Errors'
              example:
                errors:
                - status: 422
                  source:
                    pointer: /data/attributes/description
                  code: invalid_resource
                  detail: can't be blank
                - status: 422
                  source:
                    pointer: /data/attributes/status
                  code: invalid_resource
                  detail: is not included in the list
                - status: 422
                  source:
                    pointer: /data/attributes/target
                  code: invalid_resource
                  detail: The target specified is not valid.
    delete:
      tags:
      - Strategy
      operationId: deleteStrategyRisk
      summary: Delete a risk
      description: Permanently delete a risk.
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/resourceIdParam'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/MissingResourceId'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /orgs/{org_id}/strategy_risks/{risk_id}/strategy_assurances:
    get:
      tags:
      - Strategy
      operationId: getStrategyRiskAssurances
      summary: Get risk assurances
      description: 'Retrieves the list of assurances for the current risk from

        Strategy.


        Assurances link risks in Strategy to testing results, issues and controls inside the

        Projects

        application.

        See the Projects Objective resource to learn more.'
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/riskIdParam'
      - $ref: '#/components/parameters/strategyPageSizeParam'
      - $ref: '#/components/parameters/pageNumberEncodedParam'
      responses:
        '200':
          description: OK.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/GetStrategyRiskAssurancesResponse'
        '400':
          $ref: '#/components/responses/MissingOrgId'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
      - Strategy
      operationId: createStrategyRiskAssurance
      summary: Create a risk assurance link
      description: Create a new link between a risk and an assurance.
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/riskIdParam'
      requestBody:
        description: The data required to create a risk assurance link.
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/CreateStrategyRiskAssuranceLinkRequest'
      responses:
        '201':
          description: Created.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/GetStrategyRiskAssuranceResponse'
        '400':
          $ref: '#/components/responses/MissingOrgId'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /orgs/{org_id}/strategy_risks/{risk_id}/strategy_assurances/{id}:
    get:
      tags:
      - Strategy
      operationId: getStrategyRiskAssurance
      summary: Get a risk assurance
      description: Get information about an assurance.
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/riskIdParam'
      - $ref: '#/components/parameters/resourceIdParam'
      responses:
        '200':
          description: OK.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/GetStrategyRiskAssuranceResponse'
        '400':
          $ref: '#/components/responses/MissingOrgId'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
      - Strategy
      operationId: deleteStrategyRiskAssurance
      summary: Delete a risk assurance link
      description: Delete a link between a risk and an assurance.
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/riskIdParam'
      - $ref: '#/components/parameters/resourceIdParam'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/MissingResourceId'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/NotJsonapiMediaType'
  /orgs/{org_id}/strategy_risks/{risk_id}/strategy_comments:
    get:
      tags:
      - Strategy
      operationId: getStrategyRiskComments
      summary: Get risk comments
      description: 'Retrieves the list of comments on the discussion tab for the current risk from

        Strategy.


        Comments can have multiple file attachments. These can be retrieved via the

        Comment resource.


        The `user_id` points to the user''s unique identifier who created the comment.

        The User resource can be used to get information about

        this user. It can be empty if the user has been removed from the organization.'
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/riskIdParam'
      - $ref: '#/components/parameters/strategyPageSizeParam'
      - $ref: '#/components/parameters/pageNumberEncodedParam'
      responses:
        '200':
          description: OK.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/GetStrategyRiskCommentsResponse'
        '400':
          $ref: '#/components/responses/MissingOrgId'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
      - Strategy
      operationId: createStrategyRiskComment
      summary: Create a risk comment
      description: Create a risk comment.
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/riskIdParam'
      requestBody:
        description: The data required to create a risk comment.
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/CreateStrategyRiskCommentRequest'
      responses:
        '201':
          description: Created.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/CreateStrategyRiskCommentResponse'
        '400':
          $ref: '#/components/responses/MissingOrgId'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /orgs/{org_id}/strategy_risks/{risk_id}/strategy_comments/{id}:
    get:
      tags:
      - Strategy
      operationId: getStrategyRiskComment
      summary: Get a risk comment
      description: Get information about a comment and its attachments.
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/riskIdParam'
      - $ref: '#/components/parameters/resourceIdParam'
      responses:
        '200':
          description: OK.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/GetStrategyRiskCommentResponse'
        '400':
          $ref: '#/components/responses/MissingOrgId'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
      - Strategy
      operationId: deleteStrategyRiskComment
      summary: Delete a risk comment
      description: Permanently delete a risk comment
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/riskIdParam'
      - $ref: '#/components/parameters/resourceIdParam'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/MissingResourceId'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/NotJsonapiMediaType'
  /orgs/{org_id}/strategy_risks/{risk_id}/strategy_objectives:
    get:
      tags:
      - Strategy
      operationId: getStrategyRiskObjectives
      summary: Get risk objectives
      description: 'Retrieves the full list of a risk''s objectives from

        Strategy.


        A strategic objective is a business process, functional area, or auditable area that relates to an operating segment.

        The organization''s objectives can be accessed with the

        Objectives resource.'
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/riskIdParam'
      - $ref: '#/components/parameters/strategyPageSizeParam'
      - $ref: '#/components/parameters/pageNumberEncodedParam'
      responses:
        '200':
          description: OK.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/GetStrategyRiskObjectivesResponse'
        '400':
          $ref: '#/components/responses/MissingOrgId'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
      - Strategy
      operationId: createStrategyRiskObjective
      summary: Create a risk objective link
      description: Create a new link between a risk and an objective.
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/riskIdParam'
      requestBody:
        description: The data required to create a risk objective link.
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/CreateStrategyRiskObjectiveLinkRequest'
      responses:
        '201':
          description: Created.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/CreateStrategyRiskObjectiveLinkResponse'
        '400':
          $ref: '#/components/responses/ResourceTypeMismatch'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '415':
          $ref: '#/components/responses/NotJsonapiMediaType'
        '422':
          description: 'Unprocessable entity.

            '
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/Errors'
              example:
                errors:
                - status: 422
                  source:
                    pointer: /data/attributes/status
                  code: invalid_resource
                  detail: is not included in the list
  /orgs/{org_id}/strategy_risks/{risk_id}/strategy_objectives/{id}:
    get:
      tags:
      - Strategy
      operationId: getStrategyRiskObjective
      summary: Get a risk objective
      description: Get information about a risk's objective.
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/riskIdParam'
      - $ref: '#/components/parameters/resourceIdParam'
      responses:
        '200':
          description: OK.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/GetStrategyRiskObjectiveResponse'
        '400':
          $ref: '#/components/responses/MissingOrgId'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
      - Strategy
      operationId: deleteStrategyRiskObjective
      summary: Delete a risk objective link
      description: Delete a link between a risk and an objective.
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/riskIdParam'
      - $ref: '#/components/parameters/resourceIdParam'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/MissingResourceId'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/NotJsonapiMediaType'
  /orgs/{org_id}/strategy_risks/{risk_id}/strategy_segments:
    get:
      tags:
      - Strategy
      operationId: getStrategyRiskSegments
      summary: Get risk segments
      description: 'Retrieves the full list of the risks''s operating segments from

        Strategy.


        An operating segment is a region, business unit, division, location, or entity across which strategic risks are assessed.

        The organization''s operating segments can be accessed with the

        Segments resource.'
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/riskIdParam'
      - $ref: '#/components/parameters/strategyPageSizeParam'
      - $ref: '#/components/parameters/pageNumberEncodedParam'
      responses:
        '200':
          description: OK.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/GetStrategyRiskSegmentsResponse'
        '400':
          $ref: '#/components/responses/MissingOrgId'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /orgs/{org_id}/strategy_risks/{risk_id}/strategy_segments/{id}:
    get:
      tags:
      - Strategy
      operationId: getStrategyRiskSegment
      summary: Get a risk segment
      description: 'Get information about an operating segment for the risk.

        The field `strategy_factors` lists the values of the assessed severity levels for the current segment of the risk.

        To get information about this factor, use the Factor

        resource.


        To fetch the treatment data, you can specify the required fields via the `fields[strategy_segments]` or

        `fields[strategy_factors]` query parameters, as described below.'
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/riskIdParam'
      - $ref: '#/components/parameters/resourceIdParam'
      - $ref: '#/components/parameters/strategySegmentsSparseFieldsetParams'
      - $ref: '#/components/parameters/strategyFactorsSparseFieldsetParams'
      responses:
        '200':
          description: OK.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/GetStrategyRiskSegmentResponse'
        '400':
          $ref: '#/components/responses/MissingOrgId'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - Strategy
      operationId: updateStrategyRiskSegment
      summary: Update a risk segment
      description: Make changes to a risk segment, including updating the segment's severity values and treatment weights.
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/riskIdParam'
      - $ref: '#/components/parameters/resourceIdParam'
      requestBody:
        description: 'The data required to update a risk segment.


          The field `strategy_factors` lists the values of the assessed severity levels for the current segment of the risk.

          To get information about this factor, use the <a href="/#operation/getStrategyFactor" target="_blank">Factor</a>

          resource.


          The field `treatment_factors` lists the values of the assessed treatment weights for the current segment of the risk.

          '
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/UpdateStrategyRiskSegmentRequest'
      responses:
        '200':
          description: OK.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/UpdateStrategyRiskSegmentResponse'
        '400':
          $ref: '#/components/responses/MissingResourceId'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
  /orgs/{org_id}/strategy_risks/{risk_id}/strategy_metrics:
    get:
      tags:
      - Strategy
      operationId: getStrategyRiskMetrics
      summary: Get risk metrics
      description: 'Retrieves the list of metrics linked to the current risk from

        Strategy.


        A metric is a calculation that can be labeled as a specific type of key indicator.


        This list contains the metric''s URI as `metric_uri` pointing to the specific Metric inside the

        Results

        application, where its full data can be accessed. This is the

        same as using the `metric_id` directly as the `id` for the endpoint

        /orgs/{org_id}/metrics/{id}.'
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/riskIdParam'
      - $ref: '#/components/parameters/strategyPageSizeParam'
      - $ref: '#/components/parameters/pageNumberEncodedParam'
      responses:
        '200':
          description: OK.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/GetStrategyRiskMetricsResponse'
        '400':
          $ref: '#/components/responses/MissingOrgId'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
      - Strategy
      operationId: createStrategyRiskMetric
      summary: Create a risk metric link
      description: Create a new link between a risk and a metric.
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/riskIdParam'
      requestBody:
        description: The data required to create a risk metric link.
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/CreateStrategyRiskMetricLinkRequest'
      responses:
        '201':
          description: Created.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/CreateStrategyRiskMetricLinkResponse'
        '400':
          $ref: '#/components/responses/ResourceTypeMismatch'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /orgs/{org_id}/strategy_risks/{risk_id}/strategy_metrics/{id}:
    get:
      tags:
      - Strategy
      operationId: getStrategyRiskMetric
      summary: Get a risk metric
      description: Get information about a risk metric.
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/riskIdParam'
      - $ref: '#/components/parameters/resourceIdParam'
      responses:
        '200':
          description: OK.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/GetStrategyRiskMetricResponse'
        '400':
          $ref: '#/components/responses/MissingOrgId'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - Strategy
      operationId: updateStrategyRiskMetric
      summary: Update a risk metric
      description: Make changes to a risk metric, including updating the metric's description.
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/riskIdParam'
      - $ref: '#/components/parameters/resourceIdParam'
      requestBody:
