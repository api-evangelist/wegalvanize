components:
  schemas:
    UpdateStrategyObjectiveRequest:
      type: object
      description: The data required to update a objective.
      required:
      - data
      properties:
        data:
          type: object
          description: The data associated with the resource.
          required:
          - id
          - type
          properties:
            type:
              type: string
              description: The classification of the object (`"strategy_objectives"`).
              example: strategy_objectives
            attributes:
              type: object
              properties:
                name:
                  type: string
                  description: The name of the objective.
                  maxLength: 255
                  example: Increase Profit Margin
                segment_ids:
                  type: array
                  description: Segments connected to this objective, see Strategy Map.
                  example:
                  - '101'
                  - '121'
                  items:
                    type: string
    UpdateStrategyRiskSegmentRequest:
      type: object
      description: The data required to update a segment.
      required:
      - data
      properties:
        data:
          type: object
          description: The data associated with the resource.
          required:
          - type
          - attributes
          properties:
            type:
              type: string
              description: The classification of the object (`"strategy_segments"`).
              example: strategy_segments
            attributes:
              type: object
              description: The attributes associated with the resource.
              required:
              - strategy_factors
              properties:
                strategy_factors:
                  type: array
                  description: The assessed severity level for each factor of this segment.
                  items:
                    type: object
                    description: Assessment of the scoring factor.
                    required:
                    - id
                    properties:
                      id:
                        type: string
                        description: The ID of the scoring factor.
                        example: '106'
                      severity_value:
                        type: string
                        description: Decimal value of the current severity level.
                        example: '2.0'
                      treatment_factors:
                        type: array
                        description: The treatments associated with the factor.
                        items:
                          type: object
                          description: The treatments associated with the factor.
                          required:
                          - projects_objective_id
                          properties:
                            projects_objective_id:
                              type: string
                              description: The ID of the project objective.
                              example: '1'
                            weight:
                              type: string
                              description: The weight of the project objective.
                              minimum: 0
                              maximum: 1
                              example: '0.5'
    UpdateStrategyFactorRequest:
      type: object
      description: The data required to create a factor.
      required:
      - data
      properties:
        data:
          type: object
          description: The data associated with the resource.
          required:
          - type
          - attributes
          properties:
            type:
              type: string
              description: The classification of the object (`"strategy_factors"`).
              example: strategy_factors
            attributes:
              type: object
              description: The attributes associated with the resource.
              properties:
                name:
                  type: string
                  description: The name of the risk factor.
                  maxLength: 255
                  example: Likelihood
                description:
                  type: string
                  description: The description of the risk factor.
                  maxLength: 255
                  example: Likelihood of the risk
                weight:
                  type: string
                  description: Numeric weight of the factor
                  maxLength: 255
                  example: '1.0'
                severities:
                  type: array
                  minimum: 2
                  description: The factor's severity levels
                  items:
                    type: object
                    description: Severity level
                    required:
                    - name
                    - value
                    properties:
                      id:
                        type: string
                        description: The ID of the severity level
                        example: '21979'
                      name:
                        type: string
                        description: The name of the severity level (also shown in the assessment table on the UI)
                        example: Low
                      description:
                        type: string
                        description: Description of the severity level
                        example: The lowest possible severity level
                      value:
                        type: string
                        description: Decimal value of the severity level
                        example: '1'
    GetStrategyUsersResponse:
      type: object
      description: The data associated with the resource.
      required:
      - links
      - data
      properties:
        links:
          type: object
          required:
          - next
          - prev
          properties:
            next:
              type:
              - string
              - 'null'
              description: Next page url
              example: /v1/orgs/1/strategy_users?page[number]=Mg==
            prev:
              type:
              - string
              - 'null'
              description: Previous page url
              example: null
        data:
          type: array
          items:
            type: object
            description: The data associated with the resource.
            required:
            - id
            - type
            - attributes
            properties:
              id:
                type: string
                description: The ID of the requested resource.
                example: '407188'
              type:
                type: string
                description: The classification of the object (`"strategy_users"`).
                example: strategy_users
              attributes:
                type: object
                description: The attributes associated with the resource.
                required:
                - description
                properties:
                  name:
                    type: string
                    description: Full name of the user.
                    example: John Doe
                  email:
                    type: string
                    description: The email address of the user.
                    example: johndoe@riskybusiness.com
                  grc_role:
                    type: string
                    example: ''
                  role:
                    type: string
                    enum:
                    - admin
                    - executive
                    - reviewer
                    - no_access
                    example: admin
                  user_type:
                    type: string
                    description: The type of the user.
                    example: user
                  subscription_type:
                    type:
                    - string
                    - 'null'
                    description: 'The type of user subscription in this HighBond instance.  Available codes are: `"grc_full"` for _Professional_, `"grc_lite"`

                      for _Contributor_, `"grc_intermediate"` for _Oversight_, `"grc_results_cloud_admin"` for _Results Lite Professional_,

                      `"grc_results_cloud_user"` for _Results Lite Contributor_, and `null` for _None_.

                      '
                    example: grc_full
                  created_at:
                    type: string
                    description: The timestamp identifying when the user was created.
                    example: '2019-02-09T13:17:26Z'
                    format: date-time
                  updated_at:
                    type: string
                    description: The timestamp identifying when the user was last updated.
                    example: '2019-02-09T13:17:26Z'
                    format: date-time
          description: Array of users
    UpdateStrategyCustomAttributeRequest:
      type: object
      description: The data associated with the resource.
      required:
      - data
      properties:
        data:
          type: object
          description: The data associated with the resource.
          required:
          - type
          properties:
            type:
              type: string
              description: The classification of the object (`"strategy_custom_attributes"`).
              example: strategy_custom_attributes
            attributes:
              type: object
              description: The attributes associated with the resource.
              properties:
                term:
                  type: string
                  description: The name of the custom attribute.
                  maxLength: 255
                  example: Custom Risk Attribute
                options:
                  type: array
                  description: Selectable options of the values (when the `field_type` is `select` or `multiselect`).
                  default: []
                  example:
                  - First Custom Select Option Text
                  - Second Custom Select Option Text
                  - Third Custom Select Option Text
                  - Fourth Custom Select Option Text
                  items:
                    type: string
