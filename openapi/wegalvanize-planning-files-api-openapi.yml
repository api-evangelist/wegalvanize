              description: The classification of the object (`"planning_files"`).
              example: planning_files
            attributes:
              type: object
              description: The attributes associated with the planning file.
              required:
              - name
              properties:
                name:
                  type: string
                  description: The name of the planning file.
                  maxLength: 255
                  example: Planning File Name
                reference_id:
                  type: string
                  description: The planning id, reference number, or code for the planning file.
                  maxLength: 8
                  example: BPWS1
                description:
                  type: string
                  description: A detailed description of the planning file.
                  maxLength: 524288
                  example: <h1>Planning file heading</h1><p>Planning file description.</p>
                position:
                  type: integer
                  format: int64
                  description: 'The value that determines the order in which it is displayed in the index action. `position` must be a value between `1` and `2147483647`.

