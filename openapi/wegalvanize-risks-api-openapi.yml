openapi: 3.2.0
info:
  title: HighBond API Reference Risks API
  version: 1.1.0
  description: Welcome to the API documentation for HighBond.
  x-logo:
    url: ./assets/logo.png
    altText: HighBond Logo
servers:
- url: '{protocol}://{server}/v1'
  variables:
    protocol:
      default: https
    server:
      default: apis-us.highbond.com
      enum:
      - apis-us.highbond.com
      - apis-ca.highbond.com
      - apis-eu.highbond.com
      - apis-ap.highbond.com
      - apis-au.highbond.com
      - apis-af.highbond.com
      - apis-sa.highbond.com
      - apis-jp.highbond.com
security:
- bearerToken: []
tags:
- name: Risks
  description: 'A risk is an effect of uncertainty on an objective, with the effect having a positive or negative deviation from what is expected.

    Risks are organized by objectives, and can be associated with one or more controls. A risk may also be known as a requirement.


    > **Note:**

    Risks located in such resources can be accessed using the API:

    > * In projects that have an "active" state

    > * In frameworks


    Learn more about risks.'
paths:
  /orgs/{org_id}/objectives/{objective_id}/risks:
    get:
      tags:
      - Risks
      operationId: getRisks
      summary: Get risks
      description: Get a list of all risks for an objective.
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/objectiveIdParam'
      - $ref: '#/components/parameters/riskSparseFieldsetParams'
      - $ref: '#/components/parameters/riskIncludeParams'
      - $ref: '#/components/parameters/pageSizeParam'
      - $ref: '#/components/parameters/pageNumberEncodedParam'
      responses:
        '200':
          description: OK.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/GetRisksResponse'
        '400':
          $ref: '#/components/responses/MissingOrgId'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/NotJsonapiMediaType'
    post:
      tags:
      - Risks
      operationId: createRisk
      summary: Create a risk
      description: 'Create a new risk in an existing objective.


        Limitations:

        * Each objective in a project or framework can contain a maximum of 1000 risks.'
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/objectiveIdParam'
      - $ref: '#/components/parameters/riskSparseFieldsetParams'
      - $ref: '#/components/parameters/riskIncludeParams'
      requestBody:
        description: The data required to create a risk.
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/CreateRiskRequest'
      responses:
        '201':
          description: Created.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/GetRiskResponse'
        '400':
          $ref: '#/components/responses/ResourceTypeMismatch'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/NotJsonapiMediaType'
        '422':
          description: 'Unprocessable entity.

            '
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/Errors'
              example:
                errors:
                - status: 422
                  source:
                    pointer: /data/attributes/description
                  code: invalid_resource
                  detail: can't be blank
  /orgs/{org_id}/risks/{id}:
    get:
      tags:
      - Risks
      operationId: getRisk
      summary: Get a risk
      description: Get information about a risk.
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/resourceIdParam'
      - $ref: '#/components/parameters/riskSparseFieldsetParams'
      - $ref: '#/components/parameters/riskIncludeParams'
      responses:
        '200':
          description: OK.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/GetRiskResponse'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - Risks
      operationId: updateRisk
      summary: Update a risk
      description: 'Make changes to a risk in project or framework, like renaming the risk or updating the risk description.


        Limitations:

        * You cannot update the risk if the objective it belongs to has been checked out using

        Offline Projects or the

        HighBond iPad app.

        * You cannot update the `impact` or `likelihood` fields if the fields are automated using an

        assessment driver.'
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/resourceIdParam'
      - $ref: '#/components/parameters/riskSparseFieldsetParams'
      - $ref: '#/components/parameters/riskIncludeParams'
      requestBody:
        description: The data required to update a risk.
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/UpdateRiskRequest'
      responses:
        '200':
          description: OK.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/GetRiskResponseWithIncludes'
        '400':
          $ref: '#/components/responses/MissingResourceId'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/NotJsonapiMediaType'
        '422':
          description: 'Unprocessable entity.

            '
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/Errors'
              example:
                errors:
                - status: 422
                  source:
                    pointer: /data/attributes/description
                  code: invalid_resource
                  detail: can't be blank
                - status: 422
                  source:
                    pointer: /data/attributes/entities
                  code: invalid_resource
                  detail: 'Missing child or parent entity ids: [1, 2 ,3]'
                - status: 422
                  source:
                    pointer: /data/attributes/entities
                  code: invalid_resource
                  detail: 'Missing inherited entity ids: [1, 2, 3]'
                - status: 422
                  source:
                    pointer: /data/attributes/entities
                  code: invalid_resource
                  detail: Entities not found
    delete:
      tags:
      - Risks
      operationId: deleteRisk
      summary: Delete a risk
      description: 'Permanently delete a risk from an objective.


        Limitations:

        You cannot delete the risk in the following scenarios:

        * if the risk is included in an existing certification program

        * if the objective it belongs to has been checked out using

        Offline Projects or the

        HighBond iPad app


        > **Caution —**

        Deleting a risk also removes associated data (including assessment drivers, to-dos, requests, issues, actions, time entries, etc.). Once deleted, you cannot access or restore the risk.'
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/resourceIdParam'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: 'Unprocessable entity.

            '
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/Errors'
              example:
                errors:
                - status: 422
                  code: certification_association
                  detail: This risk is associated with one or more certifications.
  /orgs/{org_id}/risks/{risk_id}/entities:
    post:
      tags:
      - Risks
      operationId: createRiskEntityLink
      summary: Create risk entity link
      description: 'Link entity to a risk.


        > **Note**

        > * Tagging a risk to an entity automatically tags a risk with all ancestor entities and descendant entities.

        > * Request Get a risk with `entities` query param to get the whole list of entities linked to a risk.


        Limitations:

        * You cannot tag the risk with entity if the objective it belongs to has been checked out using

        Offline Projects or the

        HighBond iPad app.

        * Only 1 entity can be sent in the request payload.


        Learn more about tagging items with entities.'
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/riskIdParam'
      requestBody:
        description: The data required to create a risk entity link.
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/CreateRiskEntityRequest'
      responses:
        '201':
          description: Created.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/CreateRiskEntityResponse'
        '400':
          $ref: '#/components/responses/MissingResourceId'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/NotJsonapiMediaType'
        '422':
          description: 'Unprocessable entity.

            '
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/Errors'
              example:
                errors:
                - status: 422
                  source:
                    pointer: /data/attributes/base
                  code: invalid_resource
                  detail: Entity and Responsibility should reference the same account.
  /orgs/{org_id}/risks/{risk_id}/entities/{id}:
    delete:
      tags:
      - Risks
      operationId: deleteRiskEntityLink
      summary: Delete risk entity link
      description: 'Permanently delete risk entity link.


        > **Note -**

        Untagging a risk from an entity automatically untags a risk from all descendant entities.


        Limitations:

        * You cannot untag a risk from an entity if the objective it belongs to has been checked out using

        Offline Projects or the

        HighBond iPad app.

        * Inherited entity tags cannot be removed.'
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/riskIdParam'
      - $ref: '#/components/parameters/resourceIdParam'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/MissingOrgId'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/NotJsonapiMediaType'
        '422':
          description: 'Unprocessable entity.

            '
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/Errors'
              example:
                errors:
                - status: 422
                  source:
                    pointer: /data/attributes/base
                  code: invalid_resource
                  title: Invalid resource
                  detail: Cannot delete an inherited Entity.
components:
  parameters:
    objectiveIdParam:
      in: path
      name: objective_id
      description: The ID of the objective.
      required: true
      schema:
        type: integer
        example: 1
    orgIdParam:
      in: path
      name: org_id
      description: The ID of the HighBond instance.
      required: true
      schema:
        type: string
        example: 1
    riskSparseFieldsetParams:
      in: query
      name: fields[risks]
      description: Requesting the API to return only the specified fields. For more information, see <a href="#section/Making-requests">Making requests</a>
      required: false
      schema:
        type: string
        example: title,description,risk_id,owner,position,impact,likelihood,custom_attributes,custom_factors,created_at,updated_at,objective,mitigations,owner_user,entities,framework_origin,risk_assurance_data
    pageSizeParam:
      in: query
      name: page[size]
      description: The number of items returned per page. Default is 50. Maximum is 100.
      required: false
      schema:
        type: string
        example: 25
    riskIncludeParams:
      in: query
      name: include
      description: Requesting the API to return related resources. For more information, see <a href="#section/Making-requests">Making requests</a>
      required: false
      schema:
        type: string
        example: objective
    resourceIdParam:
      in: path
      name: id
      description: The ID of the requested resource.
      required: true
      schema:
        type: string
        example: 9999
    pageNumberEncodedParam:
      in: query
      name: page[number]
      description: The Base64-encoded page number of records to return.
      required: false
      schema:
        type: string
        example: Mg==
    riskIdParam:
      in: path
      name: risk_id
      description: The ID of the risk.
      required: true
      schema:
        type: integer
        example: 1
  schemas:
    GetRiskResponse:
      type: object
      description: The data associated with the resource.
      required:
      - data
      properties:
        data:
          type: object
          description: The data associated with the resource.
          required:
          - id
          - type
          - attributes
          - relationships
          properties:
            id:
              type: string
              description: The ID of the requested resource.
              example: '1'
            type:
              type: string
              description: The classification of the object (`"risks"`).
              example: risks
            attributes:
              type: object
              description: The attributes associated with the resource.
              required:
              - description
              properties:
                title:
                  type: string
                  description: The title of the risk.
                  maxLength: 255
                  example: Risk Title
                description:
                  type: string
                  description: A detailed description of the risk.
                  maxLength: 524288
                  example: Risk Description
                risk_id:
                  type: string
                  description: The reference number or code for the risk.
                  maxLength: 255
                  example: '1'
                owner:
                  type: string
                  description: 'The person responsible for the risk. Specifying a person''s name or email does not automatically send them

                    an email notification about the risk.

                    '
                  example: thomas@sodor.ca
                impact:
                  type: string
                  description: 'A user configurable rating of the consequences of the risk occurring. The options available depend

                    on the <a href="https://help.highbond.com/helpdocs/highbond/en-us/Default.htm#cshid=pm-customize-terms" target="_blank">configuration of the

                    project type</a>.

                    '
                  example: High
                likelihood:
                  type: string
                  description: 'A user configurable rating of the probability of the risk occurring. The options available depend

                    on the <a href="https://help.highbond.com/helpdocs/highbond/en-us/Default.htm#cshid=pm-customize-terms" target="_blank">configuration of the

                    project type</a>.

                    '
                  example: High
                position:
                  type: integer
                  format: int64
                  description: 'The value that determines the order in which it is displayed in the index action. `position` must be a value between `1` and `2147483647`.

                    '
                  example: 1
                created_at:
                  type: string
                  description: The timestamp identifying when the risk was created.
                  example: '2019-02-09T13:17:26Z'
                  format: date-time
                updated_at:
                  type: string
                  description: The timestamp identifying when the risk was last updated.
                  example: '2019-02-09T13:17:26Z'
                  format: date-time
                custom_attributes:
                  type: array
                  description: An array of custom attributes defined by the user that are available on this object.
                  items:
                    type: object
                    description: A user defined custom attribute value.
                    properties:
                      id:
                        type: string
                        description: The ID of the custom attribute that this custom attribute value is for. Optional if term is included.
                        example: '42'
                      term:
                        type: string
                        description: The user defined term used to identify the custom attribute. Optional if id is included.
                        example: Custom Risk Attribute
                      value:
                        type: array
                        description: The value or values (for multiselect) to set this custom attribute to.
                        example:
                        - Custom Select Option Text
                        items:
                          type: string
                custom_factors:
                  type: array
                  description: An array of custom risk factors defined by the user that are available on this object.
                  items:
                    type: object
                    description: A user defined custom risk factor value.
                    properties:
                      id:
                        type: string
                        description: The ID of the custom risk factor that this custom risk factor value is for. Optional if term is included.
                        example: '42'
                      term:
                        type: string
                        description: The user defined term used to identify the custom risk factor. Optional if id is included.
                        example: Custom Risk Factor
                      value:
                        type: array
                        description: The value to set this custom risk factor to.
                        example:
                        - Custom Risk Factor Option Text
                        items:
                          type: string
                risk_assurance_data:
                  type: object
                  description: 'Fields that determines assurance values. Assurance is an expression of confidence that risk is effectively mitigated. Returns `null` if Risk Assurance feature is disabled.

                    '
                  properties:
                    inherent_risk:
                      type: number
                      format: float
                      description: 'The risk that an activity would pose if no controls or other mitigating factors were in place. Can also be referred to as the gross risk, or risks before controls, and can act as the baseline for your organization''s risk tolerance or appetite.

                        '
                      example: 1.1
                    residual_risk:
                      type: number
                      format: float
                      description: 'The risk that remains after controls are taken into account. Can also be referred to as the net risk or risk after controls.

                        '
                      example: 1.1
                    assurance:
                      type: number
                      description: 'The level of assurance that the controls in place effectively mitigate risk to the business.

                        '
                      example: 0
            relationships:
              type: object
              description: The relationships associated with the resource.
              required:
              - objective
              properties:
                objective:
                  type: object
                  description: 'Each risk has an associated objective. Objectives are the organizing containers for the work done in a project or framework.

                    '
                  required:
                  - data
                  properties:
                    data:
                      type: object
                      description: The data associated with the resource.
                      required:
                      - id
                      - type
                      properties:
                        id:
                          type: string
                          description: The ID of the objective.
                          example: '1'
                        type:
                          type: string
                          description: The classification of the object (`"objectives"`).
                          example: objectives
                mitigations:
                  type: object
                  description: 'To return this field, you must specify the `fields[risks]=mitigations` parameter in your request. For more information, see

                    <a href="#section/Making-requests">Making requests</a>.

                    '
                  required:
                  - data
                  properties:
                    data:
                      type: array
                      items:
                        type: object
                        description: Mitigations associated with a risk
                        required:
                        - id
                        - type
                        properties:
                          id:
                            type: string
                            description: The ID of the mitigation.
                            example: '1'
                          type:
                            type: string
                            description: The classification of the object (`"mitigations"`).
                            example: mitigations
                entities:
                  type: object
                  description: Each risk has an associated risk entities.
                  required:
                  - data
                  properties:
                    data:
                      type: array
                      example: []
                      description: The data associated with the resource.
                      items:
                        type: object
                        required:
                        - id
                        - type
                        properties:
                          id:
                            type: string
                            description: The ID of the entity.
                            example: '1'
                          type:
                            type: string
                            description: The classification of the object (`"entities"`).
                            example: entities
                framework_origin:
                  type: object
                  description: 'In the Projects app, a project `risk` can have a related counterpart in an associated framework. The `framework_origin` attribute allows you to associate an `risk` in a project with its related counterpart in a framework.

                    '
                  required:
                  - data
                  properties:
                    data:
                      type: object
                      description: The data associated with the resource.
                      required:
                      - id
                      - type
                      properties:
                        id:
                          type: string
                          description: The ID of the parent control.
                          example: '1'
                        type:
                          type: string
                          description: The classification of the object (`"risks"`).
                          example: risks
                owner_user:
                  type:
                  - object
                  - 'null'
                  description: 'Specifies the user responsible for the risk.

                    A value in this field will override any value provided in the `owner` attribute.

                    Specifiying a user will automatically send them an email notification about the risk.


                    To return this field, you must specify the `fields[risks]=owner_user` parameter in your request. For more information, see

                    <a href="#section/Making-requests">Making requests</a>.

                    '
                  required:
                  - data
                  properties:
                    data:
                      type: object
                      description: The data associated with the resource.
                      required:
                      - id
                      - type
                      properties:
                        id:
                          type: string
                          description: 'The unique identifier (UID) of the user. For more information on obtaining this value, see

                            <a href="#section/Making-requests">Making requests</a>.

                            '
                          example: 3NQ6XzAUxqJMnAQ7n4KF
                        type:
                          type: string
                          description: The classification of the object (`"users"`).
                          example: users
    CreateRiskRequest:
      type: object
      description: The data associated with the resource.
      required:
      - data
      properties:
        data:
          type: object
          description: The data associated with the resource.
          required:
          - type
          - attributes
          properties:
            type:
              type: string
              description: The classification of the object (`"risks"`).
              example: risks
            attributes:
              type: object
              description: The attributes associated with the resource.
              required:
              - description
              properties:
                title:
                  type: string
                  description: The title of the risk.
                  maxLength: 255
                  example: Risk Title
                description:
                  type: string
                  description: A detailed description of the risk.
                  maxLength: 524288
                  example: Risk Description
                risk_id:
                  type: string
                  description: The reference number or code for the risk.
                  maxLength: 255
                  example: '1'
                owner:
                  type: string
                  description: 'The person responsible for the risk. Specifying a person''s name or email does not automatically send them

                    an email notification about the risk.

                    '
                  example: thomas@sodor.ca
                impact:
                  type: string
                  description: 'A user configurable rating of the consequences of the risk occurring. The options available depend

                    on the <a href="https://help.highbond.com/helpdocs/highbond/en-us/Default.htm#cshid=pm-customize-terms" target="_blank">configuration of the

                    project type</a>.

                    '
                  example: High
                likelihood:
                  type: string
                  description: 'A user configurable rating of the probability of the risk occurring. The options available depend

                    on the <a href="https://help.highbond.com/helpdocs/highbond/en-us/Default.htm#cshid=pm-customize-terms" target="_blank">configuration of the

                    project type</a>.

                    '
                  example: High
                position:
                  type: integer
                  format: int64
                  description: 'The value that determines the order in which it is displayed in the index action. `position` must be a value between `1` and `2147483647`.

                    '
                  example: 1
                custom_attributes:
                  type: array
                  description: An array of custom attributes defined by the user that are available on this object.
                  items:
                    type: object
                    description: A user defined custom attribute value.
                    properties:
                      id:
                        type: string
                        description: The ID of the custom attribute that this custom attribute value is for. Optional if term is included.
                        example: '42'
                      term:
                        type: string
                        description: The user defined term used to identify the custom attribute. Optional if id is included.
                        example: Custom Risk Attribute
                      value:
                        type: array
                        description: The value or values (for multiselect) to set this custom attribute to.
                        example:
                        - Custom Select Option Text
                        items:
                          type: string
                custom_factors:
                  type: array
                  description: An array of custom risk factors defined by the user that are available on this object.
                  items:
                    type: object
                    description: A user defined custom risk factor value.
                    properties:
                      id:
                        type: string
                        description: The ID of the custom risk factor that this custom risk factor value is for. Optional if term is included.
                        example: '42'
                      term:
                        type: string
                        description: The user defined term used to identify the custom risk factor. Optional if id is included.
                        example: Custom Risk Factor
                      value:
                        type: array
                        description: The value to set this custom risk factor to.
                        example:
                        - Custom Risk Factor Option Text
                        items:
                          type: string
            relationships:
              type: object
              description: The relationships associated with the resource.
              properties:
                owner_user:
                  type:
                  - object
                  - 'null'
                  description: 'Specifies the user responsible for the risk.

                    A value in this field will override any value provided in the `owner` attribute.

                    Specifiying a user will automatically send them an email notification about the risk.


                    To return this field, you must specify the `fields[risks]=owner_user` parameter in your request. For more information, see

                    <a href="#section/Making-requests">Making requests</a>.

                    '
                  required:
                  - data
                  properties:
                    data:
                      type: object
                      description: The data associated with the resource.
                      required:
                      - id
                      - type
                      properties:
                        id:
                          type: string
                          description: 'The unique identifier (UID) of the user. For more information on obtaining this value, see

                            <a href="#section/Making-requests">Making requests</a>.

                            '
                          example: 3NQ6XzAUxqJMnAQ7n4KF
                        type:
                          type: string
                          description: The classification of the object (`"users"`).
                          example: users
                framework_origin:
                  type: object
                  description: 'In the Projects app, a project `risk` can have a related counterpart in an associated framework. The `framework_origin` attribute allows you to associate an `risk` in a project with its related counterpart in a framework.

                    '
