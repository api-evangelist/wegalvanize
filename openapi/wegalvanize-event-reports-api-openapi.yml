openapi: 3.2.0
info:
  title: HighBond API Reference Event Reports API
  version: 1.1.0
  description: Welcome to the API documentation for HighBond.
  x-logo:
    url: ./assets/logo.png
    altText: HighBond Logo
servers:
- url: '{protocol}://{server}/v1'
  variables:
    protocol:
      default: https
    server:
      default: apis-us.highbond.com
      enum:
      - apis-us.highbond.com
      - apis-ca.highbond.com
      - apis-eu.highbond.com
      - apis-ap.highbond.com
      - apis-au.highbond.com
      - apis-af.highbond.com
      - apis-sa.highbond.com
      - apis-jp.highbond.com
security:
- bearerToken: []
tags:
- name: Event Reports
  description: 'A event report table stores responses to a questionnaire that are distributed through an anonymous link.


    Each event report table can hold a maximum of 100,000 rows, 500 columns, and 256 characters per field, including blank characters.'
paths:
  /orgs/{org_id}/event_reports/{id}:
    get:
      tags:
      - Event Reports
      operationId: getEventReport
      summary: Get an event report
      description: Get information about an event report.
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/resourceIdParam'
      responses:
        '200':
          description: OK.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/SingleEventReportResponse'
        '400':
          $ref: '#/components/responses/MissingResourceId'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  responses:
    NotFound:
      description: Not found.
      content:
        application/vnd.api+json:
          schema:
            $ref: '#/components/schemas/Errors'
          example:
            errors:
            - status: '404'
              title: Not Found
              detail: The requested resource does not exist.
    BadCredentials:
      description: Bad credentials.
    Forbidden:
      description: Forbidden.
    MissingResourceId:
      description: Bad request.
      content:
        application/vnd.api+json:
          schema:
            $ref: '#/components/schemas/Errors'
          example:
            errors:
            - status: 400
              code: parameter_missing
              title: Parameter missing
              detail: The required parameter, id, is missing.
  schemas:
    SingleEventReportResponse:
      type: object
      description: The data associated with the resource.
      required:
      - data
      properties:
        data:
          type: object
          description: The data associated with the resource.
          required:
          - id
          - type
          - attributes
          - relationships
          properties:
            id:
              type: string
              description: The ID of the event report.
              example: '300'
            type:
              type: string
              description: The classification of the object (`"event_reports"`).
              example: event_reports
            attributes:
              type: object
              description: The attributes associated with the resource.
              properties:
                name:
                  type: string
                  description: The name of the event report.
                  maxLength: 255
                  example: My first event report
                description:
                  type: string
                  description: The description of the event report.
                  example: Description of My first Event Report
                event_report_url:
                  type: string
                  description: The url for answering the linked questionnaire.
                  example: https://example.results.highbond.com/survey_responses/KUdsQzTZGjRGmiiWA4s9/edit
                data_table_id:
                  type: integer
                  description: The data table ID of the event report table.
                  example: 123
                  format: int64
                created_at:
                  type: string
                  description: The date the event report was created.
                  example: '2019-02-09T13:17:26Z'
                  format: date-time
                updated_at:
                  type: string
                  description: The date the event report was updated.
                  example: '2019-03-18T22:02:05Z'
                  format: date-time
            relationships:
              type: object
              description: The relationships associated with the resource.
              required:
              - analysis
              - questionnaire
              properties:
                analysis:
                  $ref: '#/components/schemas/RelationshipObject'
                questionnaire:
                  $ref: '#/components/schemas/RelationshipObject'
              example:
                analysis:
                  data:
                    id: '20'
                    type: analyses
                questionnaire:
                  data:
                    id: '29'
                    type: questionnaires
    Error:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          description: The HTTP status code.
        source:
          type: object
          description: Indicates which part of the request document caused the error.
          required:
          - pointer
          properties:
            pointer:
              type: string
              description: 'A JSON Pointer <a href="https://tools.ietf.org/html/rfc6901" target="_blank">(RFC6901)</a> to the associated entity

                in the request document.

                '
        code:
          type: string
          description: Application-specific error code, expressed as a string value.
        title:
          type: string
          description: A short, human-readable summary of the problem.
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence of the problem.
    Errors:
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/Error'
    RelationshipObject:
      type: object
      description: The object related to the resource.
      required:
      - data
      properties:
        data:
          type: object
          description: The data associated with the related object.
          required:
          - id
          - type
          properties:
            id:
              type: string
              description: The ID of the related object.
              example: 1
            type:
              type: string
              description: The classification of the related object.
              example: collection
  parameters:
    resourceIdParam:
      in: path
      name: id
      description: The ID of the requested resource.
      required: true
      schema:
        type: string
        example: 9999
    orgIdParam:
      in: path
      name: org_id
      description: The ID of the HighBond instance.
      required: true
      schema:
        type: string
        example: 1
  securitySchemes:
    bearerToken:
      description: 'HighBond offers the industry-standard OAuth 2.0 flow for connecting to the HighBond platform. OAuth 2.0 provides a

        safe and secure way to access data, while protecting your account credentials.

        '
      type: http
      scheme: bearer
      bearerFormat: oauth2
