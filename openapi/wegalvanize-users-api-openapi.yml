                    description: The initials of this user's first and last names. The character limit is 255.
                    example: JS
                  phone:
                    type: string
                    description: The user's phone number. This can be with or without hyphens.
                    example: 555-555-5555
                  phone_extension:
                    type: string
                    description: The user's phone extension.
                    example: '555'
                  date_format:
                    type: string
                    description: The date format this user uses when they view timestamped fields in HighBond.
                    example: '%m/%d/%Y'
                  timezone:
                    type: string
                    description: The user's timezone.
                    example: UTC
                  company:
                    type: string
                    description: "The user's company name. Maximum 255 characters. Whitespace is trimmed. This field is informational only and \nis not linked to any organizations the user belongs to within the platform.\n"
                    example: Diligent
                  locale:
                    type: string
                    description: 'The two letter code representing the user''s chosen locale in their HighBond profile.

                      The available locales are `"de"`, `"en"`, `"es"`, `"fr"`, `"pt"`, `"ja"`, and `"zh"`.

                      '
                    example: en
                  created_at:
                    type: string
                    description: The date and time when the user was created.
                    example: '2019-02-09T13:17:26Z'
                    format: date-time
                  current_sign_in_at:
                    type: string
                    description: The date and time when the user last signed in.
                    example: '2019-02-09T13:17:26Z'
                    format: date-time
                  name:
                    type: string
                    description: The user's full name. This value is system generated, based on `"first_name"` and `"last_name"`.
                    example: John Smith
                  preferred_community_org:
                    type: string
                    description: The name of the user's preferred community instance.
                    example: Organization A
                  preferred_community_org_id:
                    type: integer
                    format: int64
                    description: The id of the preferred HighBond instance for the user to access community.
                    example: 12345
                  user_type:
                    type: string
                    description: The type of user in the HighBond instance, one of `"user"`, `"system"` or `"root"`.
                    example: user
                  enabled:
                    type: boolean
                    description: Shows if the user is enabled or not in the platform.
                    example: true
                  subscription:
                    type: string
                    description: 'The type of user subscription in this HighBond instance. This field will be returned to provide information, currently it cannot be updated via APIs.

                      Available codes are: `"grc_full"` for _Professional_, `"grc_lite"` for _Contributor_, `"grc_intermediate"` for _Oversight_,

                      `"grc_results_cloud_admin"` for _Results Lite Professional_, `"grc_results_cloud_user"` for _Results Lite Contributor_, and `null` for _None_.

                      '
                    example: grc_full
                  is_system_admin:
                    type: boolean
                    description: Returns true when the user is a System Admin in this HighBond instance.
                    example: false
                  is_external:
                    type: boolean
                    description: Returns true when the user is managed externally and synced into this HighBond instance.
                    example: false
                  extended_attributes:
                    type: object
                    description: Set of key-value pairs containing up to 13 attributes defined externally in the user sync service.
                    example:
                      key1: one
                      key2: two
                      key3: three
                      key4: four
                      key5: five
                      key6: six
                      key7: seven
                      key8: eight
                      key9: nine
                      key10: ten
                      key11: eleven
                      key12: twelve
                      key13: thirteen
        links:
          type: object
          description: Links to the first, last, next, and previous pages.
          required:
          - next
          - prev
          - first
          - last
          - self
          properties:
            next:
              type: string
              description: Next page url
              example: /orgs/:org_id/users?page[number]=2&page[size]=10
            prev:
              type: string
              description: Previous page url
              example: /orgs/:org_id/users?page[number]=1&page[size]=10
            first:
              type: string
              description: First page url
              example: /orgs/:org_id/users?page[number]=1&page[size]=10
            last:
              type: string
              description: Last page url
              example: /orgs/:org_id/users?page[number]=1&page[size]=10
            self:
              type: string
              description: Current page url
              example: /orgs/:org_id/users?page[number]=1&page[size]=10
        meta:
          type: object
          description: Metadata about the users pagination.
          required:
          - total_pages
          - total_count
          properties:
            total_pages:
              type: integer
              format: int64
              description: Total number of pages
              example: 1
            total_count:
              type: integer
              format: int64
              description: Total number of users
              example: 1
