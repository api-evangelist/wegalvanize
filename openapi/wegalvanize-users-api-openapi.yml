openapi: 3.2.0
info:
  title: HighBond API Reference Users API
  version: 1.1.0
  description: Welcome to the API documentation for HighBond.
  x-logo:
    url: ./assets/logo.png
    altText: HighBond Logo
servers:
- url: '{protocol}://{server}/v1'
  variables:
    protocol:
      default: https
    server:
      default: apis-us.highbond.com
      enum:
      - apis-us.highbond.com
      - apis-ca.highbond.com
      - apis-eu.highbond.com
      - apis-ap.highbond.com
      - apis-au.highbond.com
      - apis-af.highbond.com
      - apis-sa.highbond.com
      - apis-jp.highbond.com
security:
- bearerToken: []
tags:
- name: Users
  description: 'A user represents a member of HighBond. Users can belong to multiple instances.


    Learn more about adding and managing users.'
paths:
  /orgs/{org_id}/users:
    get:
      tags:
      - Users
      operationId: getUsers
      summary: List users in an instance
      description: 'Get a list of users, excluding system and root users, who are part of a particular HighBond instance.


        Additional details: The filters have a priority order and at a time one filter can be applied. The priority is as follows:

        1. filter[user_type]

        2. filter[query]

        3. filter[membership_role]


        When multiple filters are passed, the filter with the highest priority is applied.


        Note: System and root users are special types of users that act on behalf of the HighBond platform, like in automation tasks performed in the Robots app. Filters can be applied to query for them if needed.'
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/listUsersTypeFilterParam'
      - $ref: '#/components/parameters/listMembershipRoleFilterParam'
      - $ref: '#/components/parameters/listUsersSearchParam'
      - $ref: '#/components/parameters/userPageSizeParam'
      - $ref: '#/components/parameters/userPageNumberParam'
      responses:
        '200':
          description: OK.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/MultipleUsersResponse'
        '400':
          $ref: '#/components/responses/MissingOrgId'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
      - Users
      operationId: createUser
      summary: Create a new user
      description: Add a user to a HighBond instance.
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      requestBody:
        description: The data required to create a user.
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: User created.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/CreateUserResponse'
        '400':
          $ref: '#/components/responses/MissingOrgId'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /orgs/{org_id}/users/{uid}:
    get:
      tags:
      - Users
      operationId: getUser
      summary: Get user information
      description: Get basic information for a single user.
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/uidPathParam'
      responses:
        '200':
          description: OK.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/GetUserResponse'
        '400':
          $ref: '#/components/responses/MissingOrgId'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - Users
      operationId: updateUser
      summary: Update user information
      description: Updates basic information for a single user.
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/uidPathParam'
      requestBody:
        description: The data required to update a user.
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: User updated.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/UpdateUserResponse'
        '400':
          $ref: '#/components/responses/MissingOrgId'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    delete:
      tags:
      - Users
      operationId: deleteUser
      summary: Remove user from organization
      description: Removes the membership of a user to an organization.
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/uidPathParam'
      responses:
        '200':
          description: OK.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/DeleteUserResponse'
        '400':
          $ref: '#/components/responses/CannotRemoveOnlyAdminInOrg'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  parameters:
    listMembershipRoleFilterParam:
      in: query
      name: filter[membership_role]
      description: Requesting the API to filter Users by their type of membership role in the organization. Can only be one of the following types `"admin"`, and `"member"`
      required: false
      schema:
        type: string
        example: admin
    orgIdParam:
      in: path
      name: org_id
      description: The ID of the HighBond instance.
      required: true
      schema:
        type: string
        example: 1
    userPageSizeParam:
      in: query
      name: page[size]
      description: The number of items returned per page. Default and maximum is 8000 to support backwards compatibility. Recommended best practice is to use 20-50 for user interface usage, and 100-500 for API usage.
      required: false
      schema:
        type: number
      example: 100
    userPageNumberParam:
      in: query
      name: page[number]
      description: The page number of records to return. Default is 1.
      required: false
      schema:
        type: number
      example: 1
    uidPathParam:
      name: uid
      description: The UID of the user.
      schema:
        type: string
        example: yvqdNCtv8TeM47WQtzau
      in: path
      required: true
    listUsersSearchParam:
      in: query
      name: filter[query]
      description: Requesting the API to return only Users matching their name or email if it contains the search query string. Case-insensitive.
      required: false
      schema:
        type: string
        example: diligent.com
    listUsersTypeFilterParam:
      in: query
      name: filter[user_type]
      description: Requesting the API to filter Users by their type. Can only be one of the following types `"user"`, `"system"`, and `"root"`
      required: false
      schema:
        type: string
        example: user
  responses:
    CannotRemoveOnlyAdminInOrg:
      description: Bad request.
      content:
        application/vnd.api+json:
          schema:
            $ref: '#/components/schemas/Errors'
          example:
            errors:
            - status: 400
              code: cannot_remove_only_admin_in_org
              title: Cannot remove only Admin in Org
              detail: You need at least one Administrator in the Org.
    MissingOrgId:
      description: Bad request.
      content:
        application/vnd.api+json:
          schema:
            $ref: '#/components/schemas/Errors'
          example:
            errors:
            - status: 400
              code: parameter_missing
              title: Parameter missing
              detail: The required parameter, org_id, is missing.
    BadCredentials:
      description: Bad credentials.
    Forbidden:
      description: Forbidden.
    NotFound:
      description: Not found.
      content:
        application/vnd.api+json:
          schema:
            $ref: '#/components/schemas/Errors'
          example:
            errors:
            - status: '404'
              title: Not Found
              detail: The requested resource does not exist.
    TooManyRequests:
      description: Too many requests.
    UnprocessableEntity:
      description: Unprocessable entity.
  schemas:
    CreateUserRequest:
      type: object
      description: The parameters required to create a new user.
      required:
      - data
      properties:
        data:
          type: object
          description: The data associated with the new user.
          required:
          - type
          - attributes
          properties:
            type:
              type: string
              description: The classification of the object (`"users"`) for API schema serialization purposes.
              example: users
            attributes:
              type: object
              description: The attributes associated with the new user.
              required:
              - name
              - first_name
              - last_name
              - email
              properties:
                email:
                  type: string
                  description: The user's email address, defined when that user was created.
                  example: john.smith.test@wegalvanize.com
                first_name:
                  type: string
                  description: First name for the user. The character limit is 40.
                  example: John
                last_name:
                  type: string
                  description: Last name for the user. The character limit is 40.
                  example: Smith
                title:
                  type: string
                  description: The user's professional title. The character limit is 255.
                  example: Prof.
                initials:
                  type: string
                  description: The initials of this user's first and last names. The character limit is 255.
                  example: JS
                phone:
                  type: string
                  description: The user's phone number. This can be with or without hyphens.
                  example: 555-555-5555
                phone_extension:
                  type: string
                  description: The user's phone extension.
                  example: '555'
                date_format:
                  type: string
                  description: The date format this user uses when they view timestamped fields in HighBond.
                  example: '%m/%d/%Y'
                timezone:
                  type: string
                  description: The user's timezone.
                  example: UTC
                company:
                  type: string
                  description: "The user's company name. Maximum 255 characters. Whitespace is trimmed. This field is informational only and \nis not linked to any organizations the user belongs to within the platform.\n"
                  example: Diligent
                locale:
                  type: string
                  description: 'The two letter code representing the user''s chosen locale in their HighBond profile.

                    The available locales are `"de"`, `"en"`, `"es"`, `"fr"`, `"pt"`, `"ja"`, and `"zh"`.

                    '
                  example: en
                created_at:
                  type: string
                  description: The date and time when the user was created.
                  example: '2019-02-09T13:17:26Z'
                  format: date-time
                current_sign_in_at:
                  type: string
                  description: The date and time when the user last signed in.
                  example: '2019-02-09T13:17:26Z'
                  format: date-time
                preferred_community_org_id:
                  type: integer
                  format: int64
                  description: The id of the preferred HighBond instance for the user to access community.
                  example: 12345
                membership:
                  type: object
                  properties:
                    role:
                      type: string
                      description: The role of the user in the organization. Can only be one of the following types `"admin"`, and `"member"`. Default is `"member"`.
                      example: member
    MultipleUsersResponse:
      type: object
      description: The data associated with the resource.
