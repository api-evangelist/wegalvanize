                description: The user ID for the user, used across all HighBond instances.
                example: P2tuGWyTWxCAQgTd1XKx
              type:
                type: string
                description: The classification of the object (`"users"`) for API schema serialization purposes.
                example: users
              attributes:
                type: object
                properties:
