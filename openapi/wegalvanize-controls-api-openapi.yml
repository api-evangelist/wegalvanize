  /orgs/{org_id}/controls/{control_id}/entities:
    post:
      tags:
      - Controls
      operationId: createControlEntityLink
      summary: Create control entity link
      description: "Link entity to a control.\n\n> **Note**\n> * Tagging a control to an entity automatically tags a control with all ancestor entities and descendant entities.\n> * Request <a href=\"#operation/getControl\">Get a control</a> with `entities` query param to get the whole list of entities linked to a control.\n\n<strong>Limitations</strong>:\n  * You cannot tag the control with entity if the objective it belongs to has been checked out using\n  <a href=\"https://help.highbond.com/helpdocs/highbond/en-us/Default.htm#cshid=pm-offline-client\" target=\"_blank\">Offline Projects</a> or the\n  <a href=\"https://help.highbond.com/helpdocs/highbond/en-us/Default.htm#cshid=pm-mobile\" target=\"_blank\">HighBond iPad app</a>.\n  * Only 1 entity can be sent in the request payload.\n\n<a href=\"https://help.highbond.com/helpdocs/auditbond/en-us/Content/projects/admin/config/Setting_up_entity_tagging.html\" target=\"_blank\">Learn more about tagging items with entities</a>.\n"
