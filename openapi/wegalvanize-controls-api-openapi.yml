openapi: 3.2.0
info:
  title: HighBond API Reference Controls API
  version: 1.1.0
  description: Welcome to the API documentation for HighBond.
  x-logo:
    url: ./assets/logo.png
    altText: HighBond Logo
servers:
- url: '{protocol}://{server}/v1'
  variables:
    protocol:
      default: https
    server:
      default: apis-us.highbond.com
      enum:
      - apis-us.highbond.com
      - apis-ca.highbond.com
      - apis-eu.highbond.com
      - apis-ap.highbond.com
      - apis-au.highbond.com
      - apis-af.highbond.com
      - apis-sa.highbond.com
      - apis-jp.highbond.com
security:
- bearerToken: []
tags:
- name: Controls
  description: 'A control is a program, policy, routine, or activity that is intended to mitigate a risk. Controls are organized by objectives, and can be associated with one or more risks.

    The combination of identified risks and corresponding controls defines the Risk Control Matrix. Controls are also known as procedures.


    > **Note:**

    Controls located in such resources can be accessed using the API:

    > * In projects that have an "active" state

    > * In frameworks


    Learn more about controls.'
paths:
  /orgs/{org_id}/objectives/{objective_id}/controls:
    get:
      tags:
      - Controls
      operationId: getControls
      summary: Get controls
      description: Get a list of all controls for an objective.
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/objectiveIdParam'
      - $ref: '#/components/parameters/controlSparseFieldsetParams'
      - $ref: '#/components/parameters/controlIncludeParams'
      - $ref: '#/components/parameters/pageSizeParam'
      - $ref: '#/components/parameters/pageNumberEncodedParam'
      responses:
        '200':
          description: OK.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/GetControlsResponse'
        '400':
          $ref: '#/components/responses/MissingOrgId'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/NotJsonapiMediaType'
    post:
      tags:
      - Controls
      operationId: createControl
      summary: Create a control
      description: 'Create a new control in an existing objective.


        Limitations:

        * Each objective in a project or framework can contain a maximum of 1000 controls.

        * You cannot create a control if the existing objective has been checked out using

        Offline Projects or the

        HighBond iPad app.'
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/objectiveIdParam'
      - $ref: '#/components/parameters/controlSparseFieldsetParams'
      - $ref: '#/components/parameters/controlIncludeParams'
      requestBody:
        description: The data required to create a control.
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/CreateControlRequest'
      responses:
        '201':
          description: Created.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/GetControlResponse'
        '400':
          $ref: '#/components/responses/ResourceTypeMismatch'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/NotJsonapiMediaType'
        '422':
          description: 'Unprocessable entity.

            '
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/Errors'
              example:
                errors:
                - status: 422
                  source:
                    pointer: /data/attributes/description
                  code: invalid_resource
                  detail: can't be blank
  /orgs/{org_id}/controls/{id}:
    get:
      tags:
      - Controls
      operationId: getControl
      summary: Get a control
      description: Get information about a control.
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/resourceIdParam'
      - $ref: '#/components/parameters/controlSparseFieldsetParams'
      - $ref: '#/components/parameters/controlIncludeParams'
      responses:
        '200':
          description: OK.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/GetControlResponseWithIncludes'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - Controls
      operationId: updateControl
      summary: Update a control
      description: 'Make changes to a control in a project or framework, like renaming the control or updating the control description.


        Limitations:

        * You cannot update the control if the objective it belongs to has been checked out using

        Offline Projects or the

        HighBond iPad app.

        * You cannot update the `frequency`, `control_type`, `prevent_detect`, `method` or `status` fields if the fields are hidden by the project type.'
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/resourceIdParam'
      - $ref: '#/components/parameters/controlSparseFieldsetParams'
      - $ref: '#/components/parameters/controlIncludeParams'
      requestBody:
        description: The data required to update a control.
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/UpdateControlRequest'
      responses:
        '200':
          description: OK.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/GetControlResponseWithIncludes'
        '400':
          $ref: '#/components/responses/MissingResourceId'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/NotJsonapiMediaType'
        '422':
          description: 'Unprocessable entity.

            '
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/Errors'
              example:
                errors:
                - status: 422
                  source:
                    pointer: /data/attributes/description
                  code: invalid_resource
                  detail: can't be blank
                - status: 422
                  source:
                    pointer: /data/attributes/entities
                  code: invalid_resource
                  detail: 'Missing child or parent entity ids: [1, 2 ,3]'
                - status: 422
                  source:
                    pointer: /data/attributes/entities
                  code: invalid_resource
                  detail: 'Missing inherited entity ids: [1, 2, 3]'
                - status: 422
                  source:
                    pointer: /data/attributes/entities
                  code: invalid_resource
                  detail: Entities not found
    delete:
      tags:
      - Controls
      operationId: deleteControl
      summary: Delete a control
      description: 'Permanently delete a control from an objective.


        Limitations:

        You cannot delete the control in the following scenarios:

        * if the control is included in an existing certification program,

        control performance schedule, or

        assessment survey

        * if the objective it belongs to has been checked out using

        Offline Projects or the

        HighBond iPad app


        > **Caution —**

        Deleting a control also removes associated data (including assessment drivers, to-dos, requests, issues, actions, time entries, etc.). Once deleted, you cannot access or restore the control.'
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/resourceIdParam'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: 'Unprocessable entity.

            '
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/Errors'
              example:
                errors:
                - status: 422
                  code: certification_association
                  detail: This control is associated with one or more certifications. To delete this control, you must delete the associated certification.
  /orgs/{org_id}/controls:
    get:
      tags:
      - Controls
      operationId: getOrganizationControls
      summary: Get all controls in an organization
      description: 'Get a list of all of the controls in an organization.


        > **Note:**

        By default, this endpoint only returns controls from active projects. To fetch objects from archived projects or frameworks, do one of the following:

        > * Specify the project or framework ID using `filter[project.id]`

        > * Specify that you want results from archived projects using `filter[project.state]=archive`

        > * Specify that you want results from frameworks using `filter[project.state]=framework`'
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/controlSparseFieldsetParams'
      - $ref: '#/components/parameters/objectiveSparseFieldsetParams'
      - $ref: '#/components/parameters/walkthroughFieldsetParams'
      - $ref: '#/components/parameters/controlTestSparseFieldsetParams'
      - $ref: '#/components/parameters/controlSortParam'
      - $ref: '#/components/parameters/controlFrequencyFilterParams'
      - $ref: '#/components/parameters/controlOwnerFilterParams'
      - $ref: '#/components/parameters/controlTestFirstAssigneeFilterParams'
      - $ref: '#/components/parameters/controlTestSecondAssigneeFilterParams'
      - $ref: '#/components/parameters/controlTestThirdAssigneeFilterParams'
      - $ref: '#/components/parameters/controlTestFourthAssigneeFilterParams'
      - $ref: '#/components/parameters/controlTestsNotApplicableFilterParams'
      - $ref: '#/components/parameters/controlTestsTestingConclusionFilterParams'
      - $ref: '#/components/parameters/controlTestsTestingConclusionStatusFilterParams'
      - $ref: '#/components/parameters/controlWalkthroughControlDesignFilterParams'
      - $ref: '#/components/parameters/ControlTypeFilterParams'
      - $ref: '#/components/parameters/controlStatusFilterParams'
      - $ref: '#/components/parameters/controlObjectiveTitleFilterParams'
      - $ref: '#/components/parameters/controlObjectiveNameFilterParams'
      - $ref: '#/components/parameters/controlObjectiveReferenceFilterParams'
      - $ref: '#/components/parameters/controlProjectIdFilterParams'
      - $ref: '#/components/parameters/controlProjectNameFilterParams'
      - $ref: '#/components/parameters/controlProjectStateFilterParams'
      - $ref: '#/components/parameters/controlProjectStatusFilterParams'
      - $ref: '#/components/parameters/controlDescriptionFilterParams'
      - $ref: '#/components/parameters/controlTitleFilterParams'
      - $ref: '#/components/parameters/controlQueryFilterParams'
      - $ref: '#/components/parameters/controlNumberFilterParams'
      - $ref: '#/components/parameters/controlIDFilterParams'
      - $ref: '#/components/parameters/controlIncludeParam'
      - $ref: '#/components/parameters/pageSizeParam'
      - $ref: '#/components/parameters/pageNumberEncodedParam'
      responses:
        '200':
          description: OK.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/GetOrganizationControlsResponse'
        '400':
          $ref: '#/components/responses/MissingOrgId'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/NotJsonapiMediaType'
  /orgs/{org_id}/controls/{control_id}/entities:
    post:
      tags:
      - Controls
      operationId: createControlEntityLink
      summary: Create control entity link
      description: 'Link entity to a control.


        > **Note**

        > * Tagging a control to an entity automatically tags a control with all ancestor entities and descendant entities.

        > * Request Get a control with `entities` query param to get the whole list of entities linked to a control.


        Limitations:

        * You cannot tag the control with entity if the objective it belongs to has been checked out using

        Offline Projects or the

        HighBond iPad app.

        * Only 1 entity can be sent in the request payload.


        Learn more about tagging items with entities.'
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/controlIdParam'
      requestBody:
        description: The data required to create a control entity link.
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/CreateControlEntityRequest'
      responses:
        '201':
          description: Created.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/CreateControlEntityResponse'
        '400':
          $ref: '#/components/responses/MissingResourceId'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/NotJsonapiMediaType'
        '422':
          description: 'Unprocessable entity.

            '
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/Errors'
              example:
                errors:
                - status: 422
                  source:
                    pointer: /data/attributes/base
                  code: invalid_resource
                  detail: Entity and Responsibility should reference the same account.
  /orgs/{org_id}/controls/{control_id}/entities/{id}:
    delete:
      tags:
      - Controls
      operationId: deleteControlEntityLink
      summary: Delete control entity link
      description: 'Permanently delete control entity link.


        > **Note -**

        Untagging a control from an entity automatically untags a control from all descendant entities.


        Limitations:

        * You cannot untag a control from an entity if the objective it belongs to has been checked out using

        Offline Projects or the

        HighBond iPad app.

        * Inherited entity tags cannot be removed.'
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/controlIdParam'
      - $ref: '#/components/parameters/resourceIdParam'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/MissingOrgId'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/NotJsonapiMediaType'
        '422':
          description: 'Unprocessable entity.

            '
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/Errors'
              example:
                errors:
                - status: 422
                  source:
                    pointer: /data/attributes/base
                  code: invalid_resource
                  title: Invalid resource
                  detail: Cannot delete an inherited Entity.
components:
  parameters:
    controlStatusFilterParams:
      in: query
      name: filter[status]
      description: Requesting the API to filter results by status. For more information, see <a href="#section/Making-requests">Making requests</a>
      required: false
      schema:
        type: string
        example: Key Control
    controlNumberFilterParams:
      in: query
      name: filter[control_id]
      description: Requesting the API to filter results by control numbers. For more information, see <a href="#section/Making-requests">Making requests</a>
      required: false
      schema:
        type: string
        example: 001,002,003
    controlIncludeParam:
      in: query
      name: include
      description: Requesting the API to return related resources.
      required: false
      schema:
        type: string
        enum:
        - objective
        - walkthough
        - control_tests
        - control_tests.assigned_user
      example: objective,walkthough,control_tests,control_tests.assigned_user
    controlSparseFieldsetParams:
      in: query
      name: fields[controls]
      description: Requesting the API to return only the specified fields. For more information, see <a href="#section/Making-requests">Making requests</a>
      required: false
      schema:
        type: string
        example: title,description,control_id,owner,frequency,control_type,prevent_detect,method,status,position,created_at,updated_at,custom_attributes,objective,walkthrough,control_test_plan,control_tests,mitigations,owner_user,entities,framework_origin
    objectiveIdParam:
      in: path
      name: objective_id
      description: The ID of the objective.
      required: true
      schema:
        type: integer
        example: 1
    orgIdParam:
      in: path
      name: org_id
      description: The ID of the HighBond instance.
      required: true
      schema:
        type: string
        example: 1
    controlObjectiveNameFilterParams:
      in: query
      name: filter[objective.name]
      description: Requesting the API to filter results by objective name. For more information, see <a href="#section/Making-requests">Making requests</a>
      required: false
      schema:
        type: string
        example: some objective name
    controlDescriptionFilterParams:
      in: query
      name: filter[description]
      description: Requesting the API to filter results by control description. For more information, see <a href="#section/Making-requests">Making requests</a>
      required: false
      schema:
        type: string
        example: Control description.
    controlProjectStateFilterParams:
      in: query
      name: filter[project.state]
      description: Requesting the API to filter results by project state. For more information, see <a href="#section/Making-requests">Making requests</a>
      required: false
      schema:
        type: string
        example: active
    controlQueryFilterParams:
      in: query
      name: filter[query]
      description: Requesting the API to filter results by control description, title, control_id or owner. For more information, see <a href="#section/Making-requests">Making requests</a>
      required: false
      schema:
        type: string
        example: Control description or title.
    pageSizeParam:
      in: query
      name: page[size]
      description: The number of items returned per page. Default is 50. Maximum is 100.
      required: false
      schema:
        type: string
        example: 25
    controlTestFirstAssigneeFilterParams:
      in: query
      name: filter[control_tests.1.assigned_user.id]
      description: Requesting the API to filter results by the user assigned to the first testing round. For more information, see <a href="#section/Making-requests">Making requests</a>
      required: false
      schema:
        type: string
        example: uid1
    controlTestsNotApplicableFilterParams:
      in: query
      name: filter[control_tests.not_applicable]
      description: Requesting the API to filter results to only include controls that are not being tested as part of any given testing round. For more information, see <a href="#section/Making-requests">Making requests</a>
      required: false
      schema:
        type: string
        enum:
        - 'true'
        - 'false'
        - ''
    controlTestSparseFieldsetParams:
      in: query
      name: fields[control_tests]
      description: Requesting the API to return only the specified fields. For more information, see <a href="#section/Making-requests">Making requests</a>
      required: false
      schema:
        type: string
        example: assignee_name,testing_round_number,not_applicable,sample_size,testing_results,testing_conclusion,testing_conclusion_status,created_at,updated_at,control,assigned_user,actual_milestone_date,planned_milestone_date,preparer_signoff,detail_reviewer_signoff,general_reviewer_signoff,supplemental_reviewer,specialty_reviewer
    controlProjectIdFilterParams:
      in: query
      name: filter[project.id]
      description: Requesting the API to filter results by project ID. For more information, see <a href="#section/Making-requests">Making requests</a>
      required: false
      schema:
        type: string
        example: '1'
    resourceIdParam:
      in: path
      name: id
      description: The ID of the requested resource.
      required: true
      schema:
        type: string
        example: 9999
    controlTestSecondAssigneeFilterParams:
      in: query
      name: filter[control_tests.2.assigned_user.id]
      description: Requesting the API to filter results by the user assigned to the second testing round. For more information, see <a href="#section/Making-requests">Making requests</a>
      required: false
      schema:
        type: string
        example: uid1
    controlTestThirdAssigneeFilterParams:
      in: query
      name: filter[control_tests.3.assigned_user.id]
      description: Requesting the API to filter results by the user assigned to the third testing round. For more information, see <a href="#section/Making-requests">Making requests</a>
      required: false
      schema:
        type: string
        example: uid1
    pageNumberEncodedParam:
      in: query
      name: page[number]
      description: The Base64-encoded page number of records to return.
      required: false
      schema:
        type: string
        example: Mg==
    controlOwnerFilterParams:
      in: query
      name: filter[owner]
      description: Requesting the API to filter results by owner. For more information, see <a href="#section/Making-requests">Making requests</a>
      required: false
      schema:
        type: string
        example: some@example.com
    controlFrequencyFilterParams:
      in: query
      name: filter[frequency]
      description: Requesting the API to filter results by frequency. For more information, see <a href="#section/Making-requests">Making requests</a>
      required: false
      schema:
        type: string
        example: Multiple Times Daily
    controlTestsTestingConclusionFilterParams:
      in: query
      name: filter[control_tests.testing_conclusion]
      description: Requesting the API to filter results to only include controls that were marked as operating effectively. For more information, see <a href="#section/Making-requests">Making requests</a>
      required: false
      schema:
        type: string
        enum:
        - 'true'
        - 'false'
        - ''
    controlProjectNameFilterParams:
      in: query
      name: filter[project.name]
      description: Requesting the API to filter results by project name. For more information, see <a href="#section/Making-requests">Making requests</a>
      required: false
      schema:
        type: string
        example: some project name
    controlObjectiveTitleFilterParams:
      in: query
      name: filter[objective.title]
      description: Requesting the API to filter results by objective title. For more information, see <a href="#section/Making-requests">Making requests</a>
      required: false
      schema:
        type: string
        example: some objective title
    controlIDFilterParams:
      in: query
      name: filter[id]
      description: Requesting the API to filter results by control IDs. For more information, see <a href="#section/Making-requests">Making requests</a>
      required: false
      schema:
        type: string
        example: 1,2,3
    objectiveSparseFieldsetParams:
      in: query
      name: fields[objectives]
      description: Requesting the API to return only the specified fields. For more information, see <a href="#section/Making-requests">Making requests</a>
      required: false
      schema:
        type: string
        example: title,description,reference,division_department,owner,executive_owner,created_at,updated_at,project,assigned_user,owner_user,executive_owner_user,custom_attributes,position,risk_control_matrix_id,walkthrough_summary_id,testing_round_1_id,testing_round_2_id,testing_round_3_id,testing_round_4_id,entities,framework,framework_origin,risk_assurance_data,planned_start_date,actual_start_date,planned_end_date,actual_end_date,planned_milestone_date,actual_milestone_date
    controlTestFourthAssigneeFilterParams:
      in: query
      name: filter[control_tests.4.assigned_user.id]
      description: Requesting the API to filter results by the user assigned to the fourth testing round. For more information, see <a href="#section/Making-requests">Making requests</a>
      required: false
      schema:
        type: string
        example: uid1
    controlIdParam:
      in: path
      name: control_id
      description: The ID of the control.
      required: true
      schema:
        type: integer
        example: 1
    controlObjectiveReferenceFilterParams:
      in: query
      name: filter[objective.reference]
      description: Requesting the API to filter results by objective reference. For more information, see <a href="#section/Making-requests">Making requests</a>
      required: false
      schema:
        type: string
        example: NM-INV
    controlIncludeParams:
      in: query
      name: include
      description: Requesting the API to return related resources. For more information, see <a href="#section/Making-requests">Making requests</a>
      required: false
      schema:
        type: string
        example: objective
    controlTitleFilterParams:
      in: query
      name: filter[title]
      description: Requesting the API to filter results by control title. For more information, see <a href="#section/Making-requests">Making requests</a>
      required: false
      schema:
        type: string
        example: Control title.
    walkthroughFieldsetParams:
      in: query
      name: fields[walkthroughs]
      description: Requesting the API to return only the specified fields. For more information, see <a href="#section/Making-requests">Making requests</a>
      required: false
      schema:
        type: string
        example: walkthrough,control_verified,original_updated_at,preparer_signoff,detail_reviewer_signoff,general_reviewer_signoff,supplemental_reviewer,specialty_reviewer,control_performance_enabled,control_performance_readonly,signed_off,readonly,locked,enabled,planned_milestone_date,actual_milestone_date
    controlSortParam:
      in: query
      name: sort
      description: Requesting the API to sort controls by the values in a given field. The controls are sorted ascending by default, but you can prefix the field name with `-` to sort descending (e.g., `-id`). You can sort controls by only one field at a time.
      required: false
      schema:
        type: string
        enum:
        - id
        - title
        - description
        - control_id
        - owner
        - control_tests.1.assigned_user.name
        - control_tests.2.assigned_user.name
        - control_tests.3.assigned_user.name
        - control_tests.4.assigned_user.name
        - control_tests.not_applicable
        - control_tests.testing_conclusion
        - control_tests.testing_conclusion_status
        - walkthrough.control_design
        - frequency
        - control_type
        - prevent_detect
        - method
        - status
        - position
        - created_at
        - updated_at
        - objective.title
        default: id
    ControlTypeFilterParams:
      in: query
      name: filter[control_type]
