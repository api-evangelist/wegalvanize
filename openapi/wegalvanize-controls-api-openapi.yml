              schema:
                $ref: '#/components/schemas/Errors'
              example:
                errors:
                - status: 422
                  source:
                    pointer: /data/attributes/base
                  code: invalid_resource
                  detail: Entity and Responsibility should reference the same account.
  /orgs/{org_id}/controls/{control_id}/entities/{id}:
    delete:
      tags:
      - Controls
      operationId: deleteControlEntityLink
      summary: Delete control entity link
      description: "Permanently delete control entity link.\n\n> **Note -**\nUntagging a control from an entity automatically untags a control from all descendant entities.\n\n<strong>Limitations</strong>:\n  * You cannot untag a control from an entity if the objective it belongs to has been checked out using\n  <a href=\"https://help.highbond.com/helpdocs/highbond/en-us/Default.htm#cshid=pm-offline-client\" target=\"_blank\">Offline Projects</a> or the\n  <a href=\"https://help.highbond.com/helpdocs/highbond/en-us/Default.htm#cshid=pm-mobile\" target=\"_blank\">HighBond iPad app</a>.\n  * <a href=\"https://help.highbond.com/helpdocs/highbond/en-us/Content/projects/admin/config/Setting_up_entity_tagging.html?Highlight=Inherited\">Inherited entity tags</a> cannot be removed.\n"
      parameters:
