openapi: 3.2.0
info:
  title: HighBond API Reference Robot Tasks API
  version: 1.1.0
  description: Welcome to the API documentation for HighBond.
  x-logo:
    url: ./assets/logo.png
    altText: HighBond Logo
servers:
- url: '{protocol}://{server}/v1'
  variables:
    protocol:
      default: https
    server:
      default: apis-us.highbond.com
      enum:
      - apis-us.highbond.com
      - apis-ca.highbond.com
      - apis-eu.highbond.com
      - apis-ap.highbond.com
      - apis-au.highbond.com
      - apis-af.highbond.com
      - apis-sa.highbond.com
      - apis-jp.highbond.com
security:
- bearerToken: []
tags:
- name: Robot Tasks
  x-displayName: Robot tasks
  description: 'When you create a task, a robot runs the task according to the settings that you configure. A task can be scheduled or run ad hoc (manually).

    Each task has its own unique settings.


    Learn more about tasks.'
paths:
  /orgs/{org_id}/robots/{robot_id}/robot_tasks:
    get:
      tags:
      - Robot Tasks
      operationId: getRobotTasks
      summary: List tasks in a robot
      description: Get a list of tasks for a robot.
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/robotIdParam'
      - $ref: '#/components/parameters/robotEnvParam'
      responses:
        '200':
          description: OK.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/GetRobotTasksResponse'
              example:
                data:
                - id: 1
                  type: robot_tasks
                  attributes:
                    analytic_names:
                    - Analyze
                    app_version: 1
                    conflicts:
                      missing_analytics: Lost analytic
                    count: 0
                    created_at: '2019-03-22T18:12:43.003Z'
                    email_notifications_enabled: true
                    enabled: true
                    environment: production
                    log_enabled: true
                    name: Ergonomic Wooden Lamp
                    public_key_name: null
                    publish_to_results: false
                    share_encrypted: true
                    updated_at: null
                    next_runs: []
                - id: 2
                  type: robot_tasks
                  attributes:
                    analytic_names:
                    - Extract
                    app_version: 1
                    conflicts:
                      missing_analytics: Lost analytic
                    count: 1
                    created_at: '2019-03-22T18:12:43.003Z'
                    email_notifications_enabled: true
                    enabled: true
                    environment: production
                    log_enabled: true
                    name: Ergonomic Wooden Lamp
                    public_key_name: null
                    publish_to_results: false
                    share_encrypted: false
                    updated_at: null
                    next_runs: []
        '400':
          $ref: '#/components/responses/MissingRobotId'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/NotJsonapiMediaType'
    post:
      tags:
      - Robot Tasks
      operationId: createRobotTask
      summary: Create a robot task
      description: Create a new task for a specified robot.
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/robotIdParam'
      requestBody:
        description: The data required to create a robot task.
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/CreateRobotTaskRequest'
      responses:
        '200':
          description: Created.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/GetRobotTaskResponse'
        '400':
          $ref: '#/components/responses/MissingRobotId'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/NotJsonapiMediaType'
        '422':
          description: Unprocessable entity.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/RobotsError'
  /orgs/{org_id}/robot_tasks/{id}:
    put:
      tags:
      - Robot Tasks
      operationId: putRobotTask
      summary: Update a robot task
      description: Edit an existing task to change the settings. The next time a robot runs the task, the new settings are used.
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/resourceIdParam'
      requestBody:
        description: The data required to update a robot task.
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/CreateRobotTaskRequest'
      responses:
        '200':
          description: Updated.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/GetRobotTaskResponse'
        '400':
          $ref: '#/components/responses/MissingResourceId'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/NotJsonapiMediaType'
        '422':
          description: Unprocessable entity.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/RobotsError'
    delete:
      tags:
      - Robot Tasks
      operationId: deleteRobotTask
      summary: Delete a robot task
      description: 'Permanently delete a task from a robot.


        > **Note —**

        When you delete a task, any previous task runs and output files are retained. You cannot delete a task if a task run is queued or in progress.'
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/resourceIdParam'
      responses:
        '200':
          description: Deleted.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/GetRobotTaskResponse'
        '400':
          $ref: '#/components/responses/MissingResourceId'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/NotJsonapiMediaType'
  /orgs/{org_id}/robot_tasks/{id}/run_now:
    post:
      tags:
      - Robot Tasks
      operationId: runRobotTask
      summary: Run a robot task
      description: Run a robot task. This creates a robot job
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/resourceIdParam'
      - in: query
        name: include
        schema:
          type: string
        required: false
        description: To return child objects of the job. Example ?include=job_values,result_tables
      responses:
        '200':
          description: OK.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/GetRunRobotTaskResponse'
              example:
                data:
                  id: '1'
                  type: robot_jobs
                  attributes:
                    app_version: 1
                    completed_at: '2019-03-21T20:32:48.282Z'
                    count: 1
                    delete_failed: false
                    discarded_at: null
                    environment: production
                    error_code: null
                    queued_at: '2019-03-21T20:22:48.282Z'
                    result_analytics:
                    - name: Test HB robot flow
                      logs:
                      - key: 1234567\/12345\/audit_logs.json
                        file_name: Test task.json
                      success: true
                    result_downloadable: true
                    status: success
                    trigger_type: schedule
                    agent_count: null
                  relationships:
                    robot:
                      data:
                        id: '1'
                        type: robot
                    task:
                      data:
                        id: '1'
                        type: task
                    triggered_by:
                      data:
                        id: '1'
                        type: user
        '400':
          $ref: '#/components/responses/MissingResourceId'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/NotJsonapiMediaType'
  /orgs/{org_id}/robot_tasks/{robot_task_id}/values:
    get:
      tags:
      - Robot Tasks
      operationId: getValues
      summary: List values in a robot task
      description: Get information about a robot's task, like its analytic name and data type.
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/robotTaskIdParam'
      responses:
        '200':
          description: OK.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/GetRobotTaskValuesResponse'
              example:
                data:
                - id: 1
                  type: value
                  attributes:
                    analytic_name: Future-proofed fault-tolerant definition
                    data:
                      type: logical
                      value: true
                    encrypted: false
                    parameter_id: quam.nobis
                - id: 2
                  type: value
                  attributes:
                    analytic_name: Realigned fresh-thinking algorithm
                    data:
                      type: character
                      value: R2D2
                    encrypted: false
                    parameter_id: earum_ipsa
        '400':
          $ref: '#/components/responses/MissingRobotTaskId'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/NotJsonapiMediaType'
    put:
      tags:
      - Robot Tasks
      operationId: putValues
      summary: Update values in a robot task
      description: Change values for a robot task, like its analytic name.
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/robotTaskIdParam'
      requestBody:
        description: The data required to create values.
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/UpdateRobotTaskValuesRequest'
      responses:
        '200':
          description: Updated.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/GetRobotTaskValuesResponse'
        '400':
          $ref: '#/components/responses/MissingRobotTaskId'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/NotJsonapiMediaType'
        '422':
          description: Unprocessable entity.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/RobotsError'
  /orgs/{org_id}/robot_tasks/{robot_task_id}/schedule:
    get:
      tags:
      - Robot Tasks
      operationId: getSchedule
      summary: Get a robot task's schedule
      description: See when a task is scheduled to run and additional information, like time zone and its last run date.
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/robotTaskIdParam'
      responses:
        '200':
          description: OK.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/GetRobotTaskScheduleResponse'
              example:
                data:
                  id: 1
                  type: schedule
                  attributes:
                    frequency: weekly
                    interval: 1
                    last_run_at: null
                    next_run_at: '2019-03-22T18:27:30.298Z'
                    settings:
                      days:
                      - 4
                      - 5
                      - 6
                    starts_at_timezone: America/Puerto_Rico
                    starts_at: '2019-03-22T14:27:30.298-04:00'
        '400':
          $ref: '#/components/responses/MissingRobotTaskId'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/NotJsonapiMediaType'
    post:
      tags:
      - Robot Tasks
      operationId: createSchedule
      summary: Create a robot task's schedule
      description: Schedule a task to run it on an automated basis.
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/robotTaskIdParam'
      requestBody:
        description: The data required to update a robot task's schedule.
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/CreateRobotTaskScheduleRequest'
      responses:
        '200':
          description: Created.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/GetRobotTaskScheduleResponse'
        '400':
          $ref: '#/components/responses/MissingRobotTaskId'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/NotJsonapiMediaType'
        '422':
          description: Unprocessable entity.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/RobotsError'
    put:
      tags:
      - Robot Tasks
      operationId: putSchedule
      summary: Update a robot task's schedule
      description: Change when a task runs.
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/robotTaskIdParam'
      requestBody:
        description: The data required to create a robot task.
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/CreateRobotTaskScheduleRequest'
      responses:
        '200':
          description: Updated.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/GetRobotTaskScheduleResponse'
        '400':
          $ref: '#/components/responses/MissingRobotTaskId'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/NotJsonapiMediaType'
        '422':
          description: Unprocessable entity.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/RobotsError'
    delete:
      tags:
      - Robot Tasks
      operationId: deleteSchedule
      summary: Delete a robot task's schedule
      description: Delete a task's schedule. Unscheduled tasks can still be run on an ad hoc basis.
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/robotTaskIdParam'
      responses:
        '200':
          description: Deleted.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/GetRobotTaskScheduleResponse'
        '400':
          $ref: '#/components/responses/MissingRobotTaskId'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/NotJsonapiMediaType'
components:
  schemas:
    RobotTaskSchedule:
      type: object
      description: The data associated with the resource.
      required:
      - id
      - type
      - attributes
      properties:
        id:
          type: string
          description: The ID of the task.
          example: 1
        type:
          type: string
          description: The classification of the object (`"schedule"`).
          example: schedule
        attributes:
          type: object
          description: The attributes associated with the resource.
          required:
          - settings
          properties:
            frequency:
              type: string
              description: The interval at which the task is repeatedly run.
              enum:
              - once
              - hourly
              - daily
              - weekly
              - monthly
              example: weekly
            interval:
              type: integer
              description: The interval in minutes between runs. To safeguard the HighBond API against bursts of usage, there is a minimum interval of 10 minutes between runs.
            starts_at:
              type: string
              description: The time of day to start running the task.
              example: '2019-03-21T16:25:00.478Z'
            starts_at_timezone:
              type: string
              description: The <a href="https://en.wikipedia.org/wiki/List_of_tz_database_time_zones" target="_blank">timezone</a> used to start running the task.
              example: America/Los_Angeles
            last_run_at:
              type:
              - string
              - 'null'
              description: The time when robot task was last run at.
            next_run_at:
              type: string
              description: The time when robot task will next run at.
            settings:
              type: object
              description: The settings associated with the resource.
              properties:
                days:
                  description: The days that the task is scheduled to run. If the task is scheduled to run on a weekly frequency, `days` are represented from `0` to `6`, where `0` represents Sunday and `6` represents Saturday. If the task is scheduled to run on a monthly frequency, `days` is represented as a number between `1` and `28` or specified as `last_day`. `days` does not return anything for once, hourly, and daily frequencies.
                  type: array
                  items:
                    type: integer
                  example:
                  - 0
                  - 1
                  - 2
    StringValues:
      type: array
      items:
        type: string
    StringValue:
      type: string
    GetRunRobotTaskResponse:
      type: object
      properties:
        data:
          type: object
          description: The data associated with the resource.
          required:
          - id
          - type
          - attributes
          properties:
            id:
              type: string
              description: The ID of the job.
              example: 1
            type:
              type: string
              description: The classification of the object (`"robot_jobs"`).
              example: robot_jobs
            attributes:
              type: object
              description: The attributes associated with the resource.
              properties:
                app_version:
                  type: integer
                  description: The version of the script.
                  example: 1
                completed_at:
                  type: string
                  description: The date the job was completed.
                  example: '2019-03-21T20:22:48.282Z'
                count:
                  type: integer
                  description: The folder name that is automatically created in the Robots Agent. The folder corresponds to an individual job.
                  example: 1
                delete_failed:
                  type: boolean
                  description: Indicate if the job failed to be deleted.
                  example: '2019-03-21T20:22:48.282Z'
                environment:
                  type: string
                  description: The environment of the script.
                  enum:
                  - production
                  - development
                queued_at:
                  type: string
                  description: The date the job was queued to execute.
                  example: '2019-03-21T20:22:48.282Z'
                result_analytics:
                  type: array
                  description: Includes information of the analytic results.
                  items:
                    type: string
                status:
                  type: string
                  description: The status of the job.
                  enum:
                  - success
                  - failed
                  - cancelled
                  - queued
                  - running
                  - skipped
                trigger_type:
                  type: string
                  description: The trigger type of the job.
                  enum:
                  - schedule
                  - manual
                  - event
            relationships:
              type: object
              description: List of associated objects with the robot job.
              properties:
                robot:
                  type: object
                  description: Associated robot with the job.
                  required:
                  - data
                  properties:
                    data:
                      type: object
                      required:
                      - id
                      - type
                      properties:
                        id:
                          type: string
                          description: The ID of the robot.
                        type:
                          type: string
                          description: The classification of the object (`"robot"`).
                task:
                  type: object
                  description: Associated task with the job.
                  required:
                  - data
                  properties:
                    data:
                      type: object
                      required:
                      - id
                      - type
                      properties:
                        id:
                          type: string
                          description: The ID of the task.
                        type:
                          type: string
                          description: The classification of the object (`"task"`).
                triggered_by:
                  type: object
                  description: User who triggered the job.
                  required:
                  - data
                  properties:
                    data:
                      type: object
                      required:
                      - id
                      - type
                      properties:
                        id:
                          type: string
                          description: The ID of the user.
                        type:
                          type: string
                          description: The classification of the object (`"user"`).
    RobotTaskRequestValue:
      description: A user-facing input parameter, which lets a user specify script input values in advance. This allows an analytic script to run unattended, either immediately, or at a scheduled time.
      anyOf:
      - $ref: '#/components/schemas/StringValue'
      - $ref: '#/components/schemas/StringValues'
    RobotTask:
      type: object
      description: The data associated with the resource.
      required:
      - id
      - type
      - attributes
      properties:
        id:
          type: string
          description: The ID of the task.
          example: 1
        type:
          type: string
          description: The classification of the object (`"robot_tasks"`).
          example: robot_tasks
        attributes:
          type: object
          description: The attributes associated with the resource.
          properties:
            analytic_names:
              type: array
              description: A list of the names of scripts to run.
              items:
                type: string
              example:
              - Analyze
            app_version:
              type: integer
              description: The version of the script.
              example: 1
            conflicts:
              type: object
              description: Specifies the conflicts related to a script activation.
              example: '2019-03-21T16:25:00.478Z'
            count:
              type: integer
              description: The folder name that is automatically created in the Robots Agent. The folder corresponds to an individual task.
              example: 1
            created_at:
              type: string
              description: The date the task was created.
              example: '2019-03-21T20:22:48.282Z'
            email_notifications_enabled:
              type: boolean
              description: If `true`, an email notification is sent to one or more specific users if the task fails.
              example: true
            enabled:
              type: boolean
              description: Specifies whether the task is enabled. You cannot run a disabled task.
              example: true
            environment:
              type: string
              description: The environment of the script.
              enum:
              - production
              - development
            log_enabled:
              type: boolean
              description: If `true`, a log is available every time the analytic is run.
              example: true
            name:
              type: string
              description: The name of the task.
              example: Incredible Copper Pants
            public_key_name:
              type: string
              description: The public RSA key for encrypting password values.
              example: Super_secret_public_key_name
            publish_to_results:
              type: boolean
              description: This is not currently supported.
              example: true
            share_encrypted:
              type: boolean
              description: If `true`, any user with access to the robot can run, disable, or enable the task. If `false`, only the user who entered the password can run, disable, or enable the task.
              example: false
            updated_at:
              type: string
              description: The date when the task was updated.
              example: '2019-03-21T20:22:48.282Z'
            next_runs:
              type: array
              description: Specifies when the task will next run.
              items:
                type: string
                example: '2019-03-21T20:22:48.282Z'
    CreateRobotTaskScheduleRequest:
      type: object
      description: The data associated with the resource.
      required:
      - data
      properties:
        data:
          type: object
          description: The data associated with the resource.
          properties:
            type:
              type: string
              description: The classification of the object (`"schedule"`).
              example: schedule
            attributes:
              type: object
              description: The attributes associated with the resource.
              required:
              - frequency
              - interval
              - starts_at
              - starts_at_timezone
              - settings
              properties:
                frequency:
                  type: string
                  description: The interval at which the task is repeatedly run.
                  enum:
                  - once
                  - hourly
                  - daily
                  - weekly
                  - monthly
                  example: weekly
                interval:
                  type: integer
                  description: The interval in minutes between runs. To safeguard the HighBond API against bursts of usage, there is a minimum interval of 10 minutes between runs.
                starts_at:
                  type: string
                  description: The time of day to start running the task.
                  example: '2019-03-21T16:25:00.478Z'
                starts_at_timezone:
                  type: string
                  description: The <a href="https://en.wikipedia.org/wiki/List_of_tz_database_time_zones" target="_blank">timezone</a> used to start running the task.
                  example: America/Los_Angeles
                settings:
                  type: object
                  description: The settings associated with the resource.
                  properties:
                    days:
                      description: The days that the task is scheduled to run. If the task is scheduled to run on a weekly frequency, `days` are represented from `0` to `6`, where `0` represents Sunday and `6` represents Saturday. If the task is scheduled to run on a monthly frequency, `days` is represented as a number between `1` and `28` or specified as `last_day`. `days` does not return anything for once, hourly, and daily frequencies.
                      type: array
                      items:
                        type: integer
                      example:
                      - 0
                      - 1
