openapi: 3.2.0
info:
  title: HighBond API Reference Results Triggers API
  version: 1.1.0
  description: Welcome to the API documentation for HighBond.
  x-logo:
    url: ./assets/logo.png
    altText: HighBond Logo
servers:
- url: '{protocol}://{server}/v1'
  variables:
    protocol:
      default: https
    server:
      default: apis-us.highbond.com
      enum:
      - apis-us.highbond.com
      - apis-ca.highbond.com
      - apis-eu.highbond.com
      - apis-ap.highbond.com
      - apis-au.highbond.com
      - apis-af.highbond.com
      - apis-sa.highbond.com
      - apis-jp.highbond.com
security:
- bearerToken: []
tags:
- name: Results Triggers
  x-displayName: Results Triggers
  description: Results triggers are automation definitions created by users in the Results app.
paths:
  /orgs/{org_id}/table/{table_id}/triggers:
    get:
      tags:
      - Results Triggers
      operationId: listResultsTriggersInTable
      summary: Get a list of Results triggers in a table
      description: Get a list of Results triggers in a table.
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/tableIdParam'
      responses:
        '200':
          description: OK.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/MultiResultsTriggersResponse'
              example:
                data:
                - id: '11'
                  type: triggers
                  attributes:
                    name: High turnover
                    enabled: false
                    position: 0
                    last_run: null
                    condition_type: record
                    created_at: '2026-04-28T06:46:07Z'
                    updated_at: '2026-04-28T06:46:07Z'
                  relationships:
                    table:
                      data:
                        id: '1'
                        type: tables
        '400':
          $ref: '#/components/responses/MissingTableId'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /orgs/{org_id}/triggers/{id}:
    get:
      tags:
      - Results Triggers
      operationId: getResultsTrigger
      summary: Get a results trigger
      description: Get the configuration of a single Results Trigger by Trigger ID.
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/triggerIdParam'
      responses:
        '200':
          description: OK.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/GetResultsTriggerResponse'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  schemas:
    ResultsFrequency:
      type: object
      description: Frequency configuration (realtime or scheduled)
      required:
      - type
      properties:
        type:
          type: string
          enum:
          - realtime
          - schedule
          example: realtime
        only_for_new_records:
          type: boolean
          description: Whether the trigger runs only for new records (realtime only).
          example: false
        frequency_type:
          type: string
          description: Schedule frequency type (scheduled only).
          example: daily
        start_date:
          type: string
          format: date
          description: Schedule start date (scheduled only).
          example: '2026-03-04'
        run_hour:
          type: integer
          minimum: 0
          maximum: 23
          description: Hour of day to run (scheduled only).
          example: 9
        time_zone:
          type: string
          description: Time zone for the schedule (scheduled only).
          example: UTC
        day_of_week:
          type:
          - string
          - 'null'
          description: Day of week for weekly schedules (scheduled only).
          example: null
        day_of_month:
          type:
          - integer
          - 'null'
          minimum: 1
          maximum: 31
          description: Day of month for monthly schedules (scheduled only).
          example: null
    MultiResultsTriggersResponse:
      type: object
      description: The data associated with the resource.
      required:
      - data
      properties:
        data:
          type: array
          description: The list of triggers.
          items:
            type: object
            description: The data associated with a trigger in a list response.
            required:
            - id
            - type
            - attributes
            - relationships
            properties:
              id:
                type: string
                description: The ID of the trigger.
                example: '11'
              type:
                type: string
                description: The classification of the object (`"triggers"`).
                example: triggers
              attributes:
                type: object
                description: The attributes associated with the trigger in a list response.
                properties:
                  name:
                    type: string
                    description: The name of the trigger.
                    example: tt2
                  enabled:
                    type: boolean
                    description: Indicates whether the trigger is enabled.
                    example: true
                  position:
                    type: integer
                    description: The trigger position in the table.
                    example: 0
                  last_run:
                    type:
                    - string
                    - 'null'
                    description: The date and time this trigger last ran.
                    format: date-time
                    example: null
                  condition_type:
                    type: string
                    description: The condition type that evaluates the trigger.
                    enum:
                    - record
                    - table
                    example: record
                  created_at:
                    type: string
                    description: The date and time the trigger was created.
                    format: date-time
                    example: '2026-07-06T03:45:07Z'
                  updated_at:
                    type: string
                    description: The date and time the trigger was last updated.
                    format: date-time
                    example: '2026-07-06T09:44:25Z'
              relationships:
                type: object
                description: The relationships associated with the resource.
                required:
                - table
                properties:
                  table:
                    $ref: '#/components/schemas/RelationshipObject'
                example:
                  table:
                    data:
                      id: '1'
                      type: tables
      example:
        data:
        - id: '11'
          type: triggers
          attributes:
            name: High turnover
            enabled: false
            position: 0
            last_run: null
            condition_type: record
            created_at: '2026-04-28T06:46:07Z'
            updated_at: '2026-04-28T06:46:07Z'
          relationships:
            table:
              data:
                id: '1'
                type: tables
    GetResultsTriggerResponse:
      type: object
      description: Configuration of a single Results trigger.
      required:
      - data
      properties:
        data:
          type: object
          description: The data associated with the trigger resource.
          required:
          - id
          - type
          - attributes
          - relationships
          properties:
            id:
              type: string
              description: The ID of the trigger.
              example: '490748'
            type:
              type: string
              description: The classification of the object (`"triggers"`).
              example: triggers
            attributes:
              type: object
              description: The attributes associated with the trigger.
              properties:
                name:
                  type: string
                  description: The name of the trigger.
                  example: tt2
                enabled:
                  type: boolean
                  description: Indicates whether the trigger is enabled.
                  example: true
                position:
                  type: integer
                  description: The trigger position in the table.
                  example: 0
                last_run:
                  type:
                  - string
                  - 'null'
                  description: The date and time this trigger last ran.
                  format: date-time
                  example: null
                condition_type:
                  type: string
                  description: The condition type that evaluates the trigger.
                  enum:
                  - record
                  - table
                  example: record
                created_at:
                  type: string
                  description: The date and time the trigger was created.
                  format: date-time
                  example: '2026-07-06T03:45:07Z'
                updated_at:
                  type: string
                  description: The date and time the trigger was last updated.
                  format: date-time
                  example: '2026-07-06T09:44:25Z'
                all_conditions:
                  type: boolean
                  description: Whether all conditions must be met (true) or any condition (false).
                  example: false
                condition_groups:
                  type: array
                  description: Groups of conditions with AND/OR logic.
                  items:
                    type: object
                    required:
                    - condition_group
                    - conditions
                    properties:
                      condition_group:
                        type: string
                        enum:
                        - and
                        - or
                        example: and
                      conditions:
                        type: array
                        items:
                          type: object
                          required:
                          - type
                          properties:
                            type:
                              type: string
                              enum:
                              - assignee
                              - condition
                              - priority
                              - status
                              - workflow_group
                              description: Type of condition
                              example: assignee
                            value:
                              type: string
                              description: Value for assignee, priority, status, or workflow_group types
                              example: Automation User1
                            user_id:
                              type: integer
                              description: User ID for assignee type conditions
                              example: 902803
                            group_id:
                              type: integer
                              description: Group ID for workflow_group type conditions
                              example: 3940
                            field_name:
                              type: string
                              description: Field name for condition type
                              example: metadata.publish_date
                            configuration:
                              $ref: '#/components/schemas/ResultsTriggerConditionConfiguration'
                actions:
                  type: array
                  description: Actions to execute when the trigger fires.
                  items:
                    type: object
                    required:
                    - type
                    - value
                    properties:
                      type:
                        type: string
                        example: priority
                      value:
                        type: string
                        example: Critical
                      use_one_questionnaire_to_respond_to_all_records:
                        type: boolean
                        example: true
                      configuration:
                        type: object
                        properties:
                          questionnaire_name:
                            type: string
                            example: Sanity_survey050126
                          option:
                            type: string
                            example: User
                          value:
                            type: string
                            example: bhanu a
                frequency:
                  $ref: '#/components/schemas/ResultsFrequency'
            relationships:
              type: object
              description: The relationships associated with the resource.
              required:
              - table
              properties:
                table:
                  $ref: '#/components/schemas/RelationshipObject'
              example:
                table:
                  data:
                    id: '208546'
                    type: tables
      example:
        data:
          id: '490748'
          type: triggers
          attributes:
            name: tt2
            enabled: true
            last_run: null
            created_at: '2026-07-06T03:45:07Z'
            updated_at: '2026-07-06T09:44:25Z'
            condition_type: record
            all_conditions: false
            condition_groups:
            - condition_group: and
              conditions:
              - type: assignee
                value: Automation User1
                user_id: 902803
              - type: condition
                field_name: metadata.publish_date
                configuration:
                  operator: is_x_days_before_today
                  value: '1'
              - type: priority
                value: Critical
              - type: status
                value: 10. Ten
              - type: workflow_group
                value: Assignee
                group_id: 3940
            - condition_group: and
              conditions:
              - type: assignee
                value: Adarsh Parida
                user_id: 112000
              - type: condition
                field_name: Deaths
                configuration:
                  operator: <
                  value: '3'
              - type: priority
                value: Hello_new_one
              - type: status
                value: 10. Ten
              - type: workflow_group
                value: Assignee
                group_id: 3940
            actions:
            - type: priority
              value: Critical
            frequency:
              type: realtime
              only_for_new_records: false
          relationships:
            table:
              data:
                id: '208546'
                type: tables
    Error:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          description: The HTTP status code.
        source:
          type: object
          description: Indicates which part of the request document caused the error.
          required:
          - pointer
          properties:
            pointer:
              type: string
              description: 'A JSON Pointer <a href="https://tools.ietf.org/html/rfc6901" target="_blank">(RFC6901)</a> to the associated entity

                in the request document.

                '
        code:
          type: string
          description: Application-specific error code, expressed as a string value.
        title:
          type: string
          description: A short, human-readable summary of the problem.
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence of the problem.
    Errors:
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/Error'
    ResultsTriggerConditionConfiguration:
      type: object
      description: Configuration for condition type with operator and value
      properties:
        operator:
          type: string
          example: is_x_days_before_today
        value:
          type: string
          example: '1'
    RelationshipObject:
      type: object
      description: The object related to the resource.
      required:
      - data
      properties:
        data:
          type: object
          description: The data associated with the related object.
          required:
          - id
          - type
          properties:
            id:
              type: string
              description: The ID of the related object.
              example: 1
            type:
              type: string
              description: The classification of the related object.
              example: collection
  responses:
    NotFound:
      description: Not found.
      content:
        application/vnd.api+json:
          schema:
            $ref: '#/components/schemas/Errors'
          example:
            errors:
            - status: '404'
              title: Not Found
              detail: The requested resource does not exist.
    InternalServerError:
      description: Internal Server Error.
      content:
        application/vnd.api+json:
          schema:
            $ref: '#/components/schemas/Errors'
          example:
            errors:
            - status: '500'
              code: internal_server_error
              title: Internal Server Error
              detail: A program error occurred. If the problem persists, contact Galvanize Support.
    BadCredentials:
      description: Bad credentials.
    Forbidden:
      description: Forbidden.
    MissingTableId:
      description: Bad request.
      content:
        application/vnd.api+json:
          schema:
            $ref: '#/components/schemas/Errors'
          example:
            errors:
            - status: 400
              code: parameter_missing
              title: Parameter missing
              detail: The required parameter, table_id, is missing.
  parameters:
    orgIdParam:
      in: path
      name: org_id
      description: The ID of the HighBond instance.
      required: true
      schema:
        type: string
        example: 1
    triggerIdParam:
      name: trigger_id
      in: path
      required: true
      description: The ID of the Results trigger.
      schema:
        type: integer
      example: 4
    tableIdParam:
      in: path
      name: table_id
      description: The ID of the table.
      required: true
      schema:
        type: integer
        example: 300
  securitySchemes:
    bearerToken:
      description: 'HighBond offers the industry-standard OAuth 2.0 flow for connecting to the HighBond platform. OAuth 2.0 provides a

        safe and secure way to access data, while protecting your account credentials.

        '
      type: http
      scheme: bearer
      bearerFormat: oauth2
