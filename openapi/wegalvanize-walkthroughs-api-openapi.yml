openapi: 3.2.0
info:
  title: HighBond API Reference Walkthroughs API
  version: 1.1.0
  description: Welcome to the API documentation for HighBond.
  x-logo:
    url: ./assets/logo.png
    altText: HighBond Logo
servers:
- url: '{protocol}://{server}/v1'
  variables:
    protocol:
      default: https
    server:
      default: apis-us.highbond.com
      enum:
      - apis-us.highbond.com
      - apis-ca.highbond.com
      - apis-eu.highbond.com
      - apis-ap.highbond.com
      - apis-au.highbond.com
      - apis-af.highbond.com
      - apis-sa.highbond.com
      - apis-jp.highbond.com
security:
- bearerToken: []
tags:
- name: Walkthroughs
  description: A walkthrough is a series of steps you perform to establish the reliability of controls and test the design of controls.
paths:
  /orgs/{org_id}/walkthroughs:
    get:
      tags:
      - Walkthroughs
      operationId: getOrganizationWalkthroughs
      summary: Get organization walkthroughs
      description: 'Get a list of all of the walkthroughs in an organization.


        > **Note:**

        By default, this endpoint only returns walkthroughs from active projects. To fetch objects from archived projects or frameworks, do one of the following:

        > * Specify the project or framework ID using `filter[project.id]`

        > * Specify that you want results from archived projects using `filter[project.state]=archive`

        > * Specify that you want results from frameworks using `filter[project.state]=framework`'
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/organizationWalkthroughsFieldsetParams'
      - $ref: '#/components/parameters/pageSizeParam'
      - $ref: '#/components/parameters/pageNumberEncodedParam'
      - $ref: '#/components/parameters/walkthroughsSortParams'
      - $ref: '#/components/parameters/walkthroughProjectIdFilterParams'
      - $ref: '#/components/parameters/walkthroughProjectNameFilterParams'
      - $ref: '#/components/parameters/walkthroughProjectStateFilterParams'
      - $ref: '#/components/parameters/walkthroughProjectStatusFilterParams'
      - $ref: '#/components/parameters/walkthroughControlIDFilterParams'
      - $ref: '#/components/parameters/walkthroughControlDesignFilterParams'
      - $ref: '#/components/parameters/walkthroughObjectiveTitleFilterParams'
      - $ref: '#/components/parameters/walkthroughObjectiveReferenceFilterParams'
      - $ref: '#/components/parameters/walkthroughControlNumberFilterParams'
      - $ref: '#/components/parameters/walkthroughControlTitleFilterParams'
      - $ref: '#/components/parameters/walkthroughControlQueryFilterParams'
      - $ref: '#/components/parameters/walkthroughControlStatusFilterParams'
      - $ref: '#/components/parameters/walkthroughControlOwnerFilterParams'
      - $ref: '#/components/parameters/walkthroughControlFrequencyFilterParams'
      - $ref: '#/components/parameters/walkthroughControlTypeFilterParams'
      - $ref: '#/components/parameters/walkthroughControlControlTestFirstAssigneeFilterParams'
      - $ref: '#/components/parameters/walkthroughControlControlTestSecondAssigneeFilterParams'
      - $ref: '#/components/parameters/walkthroughControlControlTestThirdAssigneeFilterParams'
      - $ref: '#/components/parameters/walkthroughControlControlTestFourthAssigneeFilterParams'
      - $ref: '#/components/parameters/walkthroughIncludeParams'
      - $ref: '#/components/parameters/controlSparseFieldsetParams'
      - $ref: '#/components/parameters/objectiveSparseFieldsetParams'
      responses:
        '200':
          description: OK.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/GetWalkthroughsResponse'
        '400':
          $ref: '#/components/responses/MissingResourceId'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/NotJsonapiMediaType'
  /orgs/{org_id}/walkthroughs/{id}:
    get:
      tags:
      - Walkthroughs
      operationId: getWalkthrough
      summary: Get a walkthrough
      description: 'Get information about a walkthrough.


        Limitation:

        Existing Citation Mode highlights and links are not displayed in the `walkthrough_results` field.'
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/resourceIdParam'
      - $ref: '#/components/parameters/organizationWalkthroughsFieldsetParams'
      - $ref: '#/components/parameters/walkthroughIncludeParams'
      responses:
        '200':
          description: OK.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/GetWalkthroughResponse'
        '400':
          $ref: '#/components/responses/MissingResourceId'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/NotJsonapiMediaType'
    patch:
      tags:
      - Walkthroughs
      operationId: updateWalkthrough
      summary: Update a walkthrough
      description: 'Make changes to a walkthrough in a project, like updating the walkthrough results or specifying whether or not the control was designed appropriately.


        Limitations:

        * You cannot update the walkthrough if it is signed off or if the objective it belongs to has been checked out using

        Offline Projects or the

        HighBond iPad app.

        * You cannot update the `control_design` field if the field is automated using an

        assessment driver.

        * Existing Citation Mode highlights and links are not displayed in the `walkthrough_results` field.'
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/resourceIdParam'
      - $ref: '#/components/parameters/organizationWalkthroughsFieldsetParams'
      - $ref: '#/components/parameters/walkthroughIncludeParams'
      requestBody:
        description: The data required to update a walkthrough.
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/UpdateWalkthroughRequest'
      responses:
        '200':
          description: OK.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/GetWalkthroughResponse'
        '400':
          $ref: '#/components/responses/MissingResourceId'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/NotJsonapiMediaType'
        '422':
          description: 'Unprocessable entity.

            '
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/Errors'
              example:
                errors:
                - status: 422
                  source:
                    pointer: /data/attributes/control_design
                  code: invalid_resource
                  detail: This field cannot be updated because it is currently being automated by an assessment driver.
components:
  parameters:
    walkthroughControlControlTestSecondAssigneeFilterParams:
      in: query
      name: filter[control.control_tests.2.assigned_user.id]
      description: Requesting the API to filter results by the user assigned to the second testing round in the related control. For more information, see <a href="#section/Making-requests">Making requests</a>
      required: false
      schema:
        type: string
        example: uid1
    walkthroughObjectiveTitleFilterParams:
      in: query
      name: filter[objective.title]
      description: Requesting the API to filter results by objective title. For more information, see <a href="#section/Making-requests">Making requests</a>
      required: false
      schema:
        type: string
        example: some objective title
    walkthroughsSortParams:
      in: query
      name: sort
      description: Requesting the API to sort walkthroughs by the values in a given field. The walkthroughs are sorted ascending by default, but you can prefix the field name with `-` to sort descending (e.g., `-id`). You can sort walkthroughs by only one field at a time.
      required: false
      schema:
        type: string
        enum:
        - id
        - walkthrough_results
        - control_design
        - created_at
        - updated_at
        default: id
    walkthroughObjectiveReferenceFilterParams:
      in: query
      name: filter[objective.reference]
      description: Requesting the API to filter results by objective reference. For more information, see <a href="#section/Making-requests">Making requests</a>
      required: false
      schema:
        type: string
        example: ITC
    walkthroughProjectIdFilterParams:
      in: query
      name: filter[project.id]
      description: Requesting the API to filter results by project ID. For more information, see <a href="#section/Making-requests">Making requests</a>
      required: false
      schema:
        type: string
        example: '1'
    controlSparseFieldsetParams:
      in: query
      name: fields[controls]
      description: Requesting the API to return only the specified fields. For more information, see <a href="#section/Making-requests">Making requests</a>
      required: false
      schema:
        type: string
        example: title,description,control_id,owner,frequency,control_type,prevent_detect,method,status,position,created_at,updated_at,custom_attributes,objective,walkthrough,control_test_plan,control_tests,mitigations,owner_user,entities,framework_origin
    walkthroughControlControlTestFirstAssigneeFilterParams:
      in: query
      name: filter[control.control_tests.1.assigned_user.id]
      description: Requesting the API to filter results by the user assigned to the first testing round in the related control. For more information, see <a href="#section/Making-requests">Making requests</a>
      required: false
      schema:
        type: string
        example: uid1
    orgIdParam:
      in: path
      name: org_id
      description: The ID of the HighBond instance.
      required: true
      schema:
        type: string
        example: 1
    walkthroughProjectStatusFilterParams:
      in: query
      name: filter[project.status]
      description: Requesting the API to filter results by project status. For more information, see <a href="#section/Making-requests">Making requests</a>
      required: false
      schema:
        type: string
        example: active
    walkthroughIncludeParams:
      in: query
      name: include
      description: Requesting the API to return related resources. For more information, see <a href="#section/Making-requests">Making requests</a>
      required: false
      schema:
        type: string
        example: control,control.objective
    walkthroughControlQueryFilterParams:
      in: query
      name: filter[control.query]
      description: Requesting the API to filter results by control title or description. For more information, see <a href="#section/Making-requests">Making requests</a>
      required: false
      schema:
        type: string
        example: some control title or description
    pageSizeParam:
      in: query
      name: page[size]
      description: The number of items returned per page. Default is 50. Maximum is 100.
      required: false
      schema:
        type: string
        example: 25
    walkthroughControlFrequencyFilterParams:
      in: query
      name: filter[control.frequency]
      description: Requesting the API to filter results by control frequency. For more information, see <a href="#section/Making-requests">Making requests</a>
      required: false
      schema:
        type: string
        example: Multiple Times Daily
    walkthroughControlTitleFilterParams:
      in: query
      name: filter[control.title]
      description: Requesting the API to filter results by control title. For more information, see <a href="#section/Making-requests">Making requests</a>
      required: false
      schema:
        type: string
        example: some control title
    walkthroughControlTypeFilterParams:
      in: query
      name: filter[control.control_type]
      description: Requesting the API to filter results by control type. For more information, see <a href="#section/Making-requests">Making requests</a>
      required: false
      schema:
        type: string
        example: Application/System Control
    resourceIdParam:
      in: path
      name: id
      description: The ID of the requested resource.
      required: true
      schema:
        type: string
        example: 9999
    walkthroughControlControlTestFourthAssigneeFilterParams:
      in: query
      name: filter[control.control_tests.4.assigned_user.id]
      description: Requesting the API to filter results by the user assigned to the fourth testing round in the related control. For more information, see <a href="#section/Making-requests">Making requests</a>
      required: false
      schema:
        type: string
        example: uid1
    pageNumberEncodedParam:
      in: query
      name: page[number]
      description: The Base64-encoded page number of records to return.
      required: false
      schema:
        type: string
        example: Mg==
    organizationWalkthroughsFieldsetParams:
      in: query
      name: fields[walkthroughs]
      description: Requesting the API to return only the specified fields. For more information, see <a href="#section/Making-requests">Making requests</a>
      required: false
      schema:
        type: string
      example: walkthrough_results,control_design,created_at,updated_at,custom_attributes,control,planned_milestone_date,actual_milestone_date
    walkthroughControlNumberFilterParams:
      in: query
      name: filter[control.control_id]
      description: Requesting the API to filter results by numbers of the control. For more information, see <a href="#section/Making-requests">Making requests</a>
      required: false
      schema:
        type: string
        example: 001,002,003
    walkthroughControlDesignFilterParams:
      in: query
      name: filter[control_design]
      description: Requesting the API to filter results to only include walkthroughs that were marked as designed appropriately. For more information, see <a href="#section/Making-requests">Making requests</a>
      required: false
      schema:
        type: string
        enum:
        - 'true'
        - 'false'
        - ''
    objectiveSparseFieldsetParams:
      in: query
      name: fields[objectives]
      description: Requesting the API to return only the specified fields. For more information, see <a href="#section/Making-requests">Making requests</a>
      required: false
      schema:
        type: string
        example: title,description,reference,division_department,owner,executive_owner,created_at,updated_at,project,assigned_user,owner_user,executive_owner_user,custom_attributes,position,risk_control_matrix_id,walkthrough_summary_id,testing_round_1_id,testing_round_2_id,testing_round_3_id,testing_round_4_id,entities,framework,framework_origin,risk_assurance_data,planned_start_date,actual_start_date,planned_end_date,actual_end_date,planned_milestone_date,actual_milestone_date
    walkthroughControlIDFilterParams:
      in: query
      name: filter[control.id]
      description: Requesting the API to filter results by control IDs. For more information, see <a href="#section/Making-requests">Making requests</a>
      required: false
      schema:
        type: string
        example: 1,2,3
    walkthroughControlControlTestThirdAssigneeFilterParams:
      in: query
      name: filter[control.control_tests.3.assigned_user.id]
      description: Requesting the API to filter results by the user assigned to the third testing round in the related control. For more information, see <a href="#section/Making-requests">Making requests</a>
      required: false
      schema:
        type: string
        example: uid1
    walkthroughProjectNameFilterParams:
      in: query
      name: filter[project.name]
      description: Requesting the API to filter results by project name. For more information, see <a href="#section/Making-requests">Making requests</a>
      required: false
      schema:
        type: string
        example: some project name
    walkthroughControlOwnerFilterParams:
      in: query
      name: filter[control.owner]
      description: Requesting the API to filter results by control owner. For more information, see <a href="#section/Making-requests">Making requests</a>
      required: false
      schema:
        type: string
        example: some@example.com
    walkthroughControlStatusFilterParams:
      in: query
      name: filter[control.status]
      description: Requesting the API to filter results by control status. For more information, see <a href="#section/Making-requests">Making requests</a>
      required: false
      schema:
        type: string
        example: Key Control
    walkthroughProjectStateFilterParams:
      in: query
      name: filter[project.state]
      description: Requesting the API to filter results by project state. For more information, see <a href="#section/Making-requests">Making requests</a>
      required: false
      schema:
        type: string
        example: active
  schemas:
    GetWalkthroughsResponse:
      type: object
      required:
      - data
      - links
      properties:
        data:
          type: array
          items:
            type: object
            description: The data associated with the resource.
            required:
            - id
            - type
            - relationships
            properties:
              id:
                type: string
                description: The ID of the requested resource.
                example: 1
              type:
                type: string
                description: The classification of the object (`"walkthroughs"`).
                example: walkthroughs
              attributes:
                type: object
                description: The attributes associated with the resource.
                properties:
                  walkthrough_results:
                    type:
                    - string
                    - 'null'
                    description: 'A description that captures the results of performing the walkthrough.

                      '
                    maxLength: 524288
                    example: <h1>Heading</h1><p>Walkthrough results description.</p>
                  created_at:
                    type: string
                    description: The timestamp identifying when the walkthrough was created.
                    example: '2019-02-09T13:17:26Z'
                    format: date-time
                  updated_at:
                    type: string
                    description: The timestamp identifying when the walkthrough was updated.
                    example: '2019-02-09T13:17:26Z'
                    format: date-time
                  actual_milestone_date:
                    type:
                    - string
                    - 'null'
                    description: Actual milestone date.
                    example: '2019-02-10'
                    format: date
                  planned_milestone_date:
                    type:
                    - string
                    - 'null'
                    description: Planned milestone date.
                    example: '2019-02-09'
                    format: date
                  control_design:
                    type:
                    - boolean
                    - 'null'
                    description: 'A rating that specifies whether the control design passes (`true`) or fails (`false`).


                      The exact values for this field (E.g. "Designed Appropriately" / "No Issues" and "Design Failure" / "Issue(s) Noted") depend on the <a href="

                      https://help.highbond.com/helpdocs/highbond/en-us/Default.htm#cshid=pm-customize-terms" target="_blank">configuration of the project type</a>.


                      `true` maps to the first customizable value (E.g. "Designed Appropriately" / "No Issues") and `false` maps to the second customizable value (E.g.

                      "Design Failure" / "Issue(s) Noted") in the project type.

                      '
                    example: true
                  custom_attributes:
                    type: array
                    description: An array of custom attributes defined on the project type used by the project this walkthrough is from. <a href="https://help.highbond.com/helpdocs/highbond/en-us/Default.htm#cshid=pm-project-types" target="_blank">Learn more about project types</a>. Make a PATCH request to modify the value of a custom attribute.
                    items:
                      type: object
                      description: A user defined custom attribute value.
                      properties:
                        id:
                          type: string
                          description: The ID of this custom attribute. Optional if term is included.
                          example: '42'
                        term:
                          type: string
                          description: The user defined term used to identify this custom attribute. Optional if id is included.
                          example: Custom Walkthrough Attribute
                        value:
                          type: array
                          description: The value or values (for multiselect) for this custom attribute.
                          example:
                          - Custom Select Option Text
                          items:
                            type: string
              relationships:
                type: object
                description: The relationships associated with the resource.
                required:
                - control
                properties:
                  control:
                    type: object
                    description: The attributes associated with the resource.
                    required:
                    - data
                    properties:
                      data:
                        type: object
                        description: The data associated with the resource.
                        required:
                        - id
                        - type
                        properties:
                          id:
                            type: string
                            description: The ID of the control.
                            example: '1'
                          type:
                            type: string
                            description: The classification of the object (`"controls"`).
                            example: controls
        included:
          type: array
          description: Included resources.
          items:
            type: object
          example:
          - id: 1
            type: control
            attributes:
              title: Control Title
              description: Control description
              control_id: '001'
              owner: thomas@sodor.ca
              frequency: Daily
              control_type: Application/System Control
              prevent_detect: Prevent
              method: Management Review
              status: Key Control
              position: '1'
              created_at: '2019-02-09T13:17:26Z'
              updated_at: '2019-02-09T13:17:26Z'
              custom_attributes:
              - id: 2
                term: Custom Control Attribute
                value:
                - Custom Select Option Text
            relationships:
              objective:
                data:
                  id: 1
                  type: objectives
              walkthrough:
                data:
                  id: 1
                  type: walkthroughs
              control_test_plan:
                data:
                  id: 1
                  type: control_test_plans
              control_tests:
                data:
                - id: 1
                  type: control_tests
              mitigations:
                data:
                - id: 1
                  type: mitigations
              framework_origin:
                data:
                  id: 1
                  type: controls
              owner_user:
                data:
                  id: 3NQ6XzAUxqJMnAQ7n4KF
                  type: users
          - id: 1
            type: objectives
            attributes:
              title: Objective Title
              reference: ITC
              description: Objective description
              division_department: Finance
              owner: thomas@sodor.ca
              executive_owner: henry@sodor.com
              position: 1
              risk_control_matrix_id: '100'
              walkthrough_summary_id: '200'
              testing_round_1_id: '301'
              testing_round_2_id: '302'
              testing_round_3_id: '303'
              testing_round_4_id: '304'
              created_at: '2019-02-09T13:17:26Z'
              updated_at: '2019-02-09T13:17:26Z'
              custom_attributes:
              - id: 42
                term: Custom Objective Attribute
                value:
                - Custom Select Option Text
              risk_assurance_data:
                inherent_risk: 1.1
                residual_risk: 1.1
                assurance: 0
            relationships:
              project:
                data:
                  id: 1
                  type: projects
              framework:
                data:
                  id: 1
                  type: frameworks
              framework_origin:
                data:
                  id: 1
                  type: objectives
              assigned_user:
                data:
                  id: 3NQ6XzAUxqJMnAQ7n4KF
                  type: users
        links:
          type: object
          required:
          - next
          - prev
          properties:
            next:
              type:
              - string
              - 'null'
              description: Next page url
              example: /api/resource?page[number]=Mg==
            prev:
              type:
              - string
              - 'null'
              description: Previous page url
              example: null
    UpdateWalkthroughRequest:
      type: object
      required:
      - data
      properties:
        data:
          type: object
          description: The data associated with the resource.
          required:
          - id
          - type
          - attributes
          - relationships
          properties:
            id:
              type: string
              description: The ID of the requested resource.
              example: 1
            type:
              type: string
              description: The classification of the object (`"walkthroughs"`).
              example: walkthroughs
            attributes:
              type: object
              description: The attributes associated with the resource.
              properties:
                walkthrough_results:
                  type:
                  - string
                  - 'null'
                  description: 'A description that captures the results of performing the walkthrough.

                    '
                  maxLength: 524288
                  example: <h1>Heading</h1><p>Walkthrough results description.</p>
                control_design:
                  type:
                  - boolean
                  - 'null'
                  description: 'A rating that specifies whether the control design passes (`true`) or fails (`false`).


                    The exact values for this field (E.g. "Designed Appropriately" / "No Issues" and "Design Failure" / "Issue(s) Noted") depend on the <a href="

                    https://help.highbond.com/helpdocs/highbond/en-us/Default.htm#cshid=pm-customize-terms" target="_blank">configuration of the project type</a>.


                    `true` maps to the first customizable value (E.g. "Designed Appropriately" / "No Issues") and `false` maps to the second customizable value (E.g.

                    "Design Failure" / "Issue(s) Noted") in the project type.

                    '
                  example: true
                actual_milestone_date:
                  type:
                  - string
                  - 'null'
                  description: Actual milestone date.
                  example: '2019-02-10'
                  format: date
                planned_milestone_date:
                  type:
                  - string
                  - 'null'
                  description: Planned milestone date.
                  example: '2019-02-09'
                  format: date
                custom_attributes:
                  type: array
                  description: An array of custom attributes defined on the project type used by the project this walkthrough is from. <a href="https://help.highbond.com/helpdocs/highbond/en-us/Default.htm#cshid=pm-project-types" target="_blank">Learn more about project types</a>. Make a PATCH request to modify the value of a custom attribute.
                  items:
                    type: object
                    description: A user defined custom attribute value.
                    properties:
                      id:
                        type: string
                        description: The ID of this custom attribute. Optional if term is included.
                        example: '42'
                      term:
                        type: string
                        description: The user defined term used to identify this custom attribute. Optional if id is included.
                        example: Custom Walkthrough Attribute
                      value:
                        type: array
                        description: The value or values (for multiselect) for this custom attribute.
                        example:
                        - Custom Select Option Text
                        items:
                          type: string
    Error:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          description: The HTTP status code.
        source:
          type: object
          description: Indicates which part of the request document caused the error.
          required:
          - pointer
          properties:
            pointer:
              type: string
              description: 'A JSON Pointer <a href="https://tools.ietf.org/html/rfc6901" target="_blank">(RFC6901)</a> to the associated entity

                in the request document.

                '
        code:
          type: string
          description: Application-specific error code, expressed as a string value.
        title:
          type: string
          description: A short, human-readable summary of the problem.
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence of the problem.
    GetWalkthroughResponse:
      type: object
      required:
      - data
      properties:
