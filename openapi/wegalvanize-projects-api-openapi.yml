openapi: 3.2.0
info:
  title: HighBond API Reference Projects API
  version: 1.1.0
  description: Welcome to the API documentation for HighBond.
  x-logo:
    url: ./assets/logo.png
    altText: HighBond Logo
servers:
- url: '{protocol}://{server}/v1'
  variables:
    protocol:
      default: https
    server:
      default: apis-us.highbond.com
      enum:
      - apis-us.highbond.com
      - apis-ca.highbond.com
      - apis-eu.highbond.com
      - apis-ap.highbond.com
      - apis-au.highbond.com
      - apis-af.highbond.com
      - apis-sa.highbond.com
      - apis-jp.highbond.com
security:
- bearerToken: []
tags:
- name: Projects
  description: A project is a management system that allows you to define objectives, risks, and controls, perform tests, and compile information for reporting purposes.
paths:
  /orgs/{org_id}/projects:
    get:
      tags:
      - Projects
      operationId: getProjects
      summary: Get projects
      description: Get a list of all projects in an account.
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/projectSparseFieldsetParams'
      - $ref: '#/components/parameters/pageSizeParam'
      - $ref: '#/components/parameters/pageNumberEncodedParam'
      - $ref: '#/components/parameters/filterName'
      - $ref: '#/components/parameters/projectStatusFilterParams'
      responses:
        '200':
          description: OK.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/GetProjectsResponse'
        '400':
          $ref: '#/components/responses/MissingOrgId'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/NotJsonapiMediaType'
    post:
      tags:
      - Projects
      operationId: createProject
      summary: Create a project
      description: 'Create a new project from scratch. New projects can be created in `"active"` (by default) or `"archive"` states.


        Limitations:

        * There can be a maximum of 20,000 projects per HighBond instance.

        * When you first create a project, you cannot enable the following. However, you can enable them when you update the project later:

        * Certifications (`certification: true`)

        * Control performance (`control_performance: true`)

        * Risk assurance (`risk_assurance: true`)'
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/projectSparseFieldsetParams'
      requestBody:
        description: The data required to create a project.
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        '201':
          description: Created.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/GetProjectResponse'
        '400':
          $ref: '#/components/responses/ResourceTypeMismatch'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/NotJsonapiMediaType'
        '422':
          description: 'Unprocessable entity.

            '
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/Errors'
              example:
                errors:
                - status: 422
                  source:
                    pointer: /data/attributes/name
                  code: invalid_resource
                  detail: can't be blank
  /orgs/{org_id}/projects/{id}:
    get:
      tags:
      - Projects
      operationId: getProject
      summary: Get a project
      description: Get information about a project. You can retrieve projects in the state `"active"`, `"archive"`, or `"delete"`.
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/resourceIdParam'
      - $ref: '#/components/parameters/projectSparseFieldsetParams'
      responses:
        '200':
          description: OK.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/GetProjectResponseWithIncludes'
        '400':
          $ref: '#/components/responses/MissingResourceId'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/NotJsonapiMediaType'
    patch:
      tags:
      - Projects
      operationId: updateProject
      summary: Update a project
      description: Make changes to a project. Only projects in the state `"active"` or `"delete"` can be updated. Projects in the state `"archive"` cannot be updated.
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/resourceIdParam'
      - $ref: '#/components/parameters/projectSparseFieldsetParams'
      requestBody:
        description: The data required to update a project.
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/UpdateProjectRequest'
      responses:
        '200':
          description: OK.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/GetProjectResponseWithIncludes'
        '400':
          $ref: '#/components/responses/MissingResourceId'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/NotJsonapiMediaType'
        '422':
          description: 'Unprocessable entity.

            '
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/Errors'
              example:
                errors:
                - status: 422
                  source:
                    pointer: /data/attributes/name
                  code: invalid_resource
                  detail: can't be blank
                - status: 422
                  source:
                    pointer: /data/attributes/entities
                  code: invalid_resource
                  detail: 'Missing child or parent entity ids: [1, 2 ,3]'
                - status: 422
                  source:
                    pointer: /data/attributes/entities
                  code: invalid_resource
                  detail: Entities not found
    delete:
      tags:
      - Projects
      operationId: deleteProject
      summary: Delete a project
      description: 'Delete a project that you no longer require. Projects in the state `"active"`, `"archived"` or `"delete"` can be deleted.


        You can temporarily or permanently delete a project:

        * By default, projects are temporarily deleted. The project is moved to a `"delete"` state and stored in the Project Library for 30 days. Project

        Admins receive an email notification when a project has been temporarily deleted. After 30 days, the project is permanently deleted automatically.

        * To request a permanent deletion of a project, you must specify `"delete"` using the `permanent` parameter. Project Admins do not receive

        an email notification when a project is permanently deleted.


        > **Caution —**

        Once a project is permanently deleted, you cannot access or restore the project.


        For more information, see Deleting

        and restoring projects.'
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/resourceIdParam'
      - $ref: '#/components/parameters/projectPermanentDeleteParam'
      responses:
        '200':
          description: OK. [The project is temporarily deleted.]
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/GetProjectResponse'
        '202':
          description: Accepted. [The project is queued for permanent deletion.]
        '400':
          $ref: '#/components/responses/MissingResourceId'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/NotJsonapiMediaType'
        '422':
          description: 'Unprocessable entity.

            '
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/Errors'
              example:
                errors:
                - status: 422
                  source:
                    pointer: /data/attributes/state
                  code: invalid_resource
                  detail: Invalid project state for the requested action.
  /orgs/{org_id}/projects/{project_id}/entities:
    post:
      tags:
      - Projects
      operationId: createProjectEntityLink
      summary: Create project entity link
      description: 'Link entity to a project.


        > **Note**

        > * Tagging a project to an entity automatically tags a project with all ancestor entities and descendant entities.

        > * Request Get a project with `entities` query param to get the whole list of entities linked to a project.


        Limitations:

        * Only 1 entity can be sent in the request payload.


        Learn more about tagging items with entities.'
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/projectIdParam'
      requestBody:
        description: The data required to create a project entity link.
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/CreateProjectEntityRequest'
      responses:
        '201':
          description: Created.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/CreateProjectEntityResponse'
        '400':
          $ref: '#/components/responses/MissingResourceId'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/NotJsonapiMediaType'
        '422':
          description: 'Unprocessable entity.

            '
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/Errors'
              example:
                errors:
                - status: 422
                  source:
                    pointer: /data/attributes/base
                  code: invalid_resource
                  detail: Entity and Responsibility should reference the same account.
  /orgs/{org_id}/projects/{project_id}/entities/{id}:
    delete:
      tags:
      - Projects
      operationId: deleteProjectEntityLink
      summary: Delete project entity link
      description: 'Permanently delete project entity link.


        > **Note -**

        Untagging a project from an entity automatically untags a project from all descendant entities.'
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/projectIdParam'
      - $ref: '#/components/parameters/resourceIdParam'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/MissingOrgId'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/NotJsonapiMediaType'
components:
  schemas:
    CreateProjectEntityResponse:
      type: object
      required:
      - data
      properties:
        data:
          type: object
          description: The data associated with the resource.
          required:
          - id
          - type
          properties:
            id:
              type: string
              description: The ID of the project.
              example: '1'
            type:
              type: string
              description: The classification of the object (`"entities"`).
              example: entities
    GetProjectsResponse:
      type: object
      description: The data associated with the resource.
      required:
      - data
      - links
      properties:
        data:
          type: array
          description: Array of projects
          items:
            type: object
            description: The data associated with the resource.
            required:
            - id
            - type
            - attributes
            - relationships
            properties:
              id:
                type: string
                description: The ID of the requested resource.
                example: '1'
              type:
                type: string
                description: The classification of the object (`"projects"`).
                example: projects
              attributes:
                type: object
                description: The attributes associated with the resource.
                properties:
                  name:
                    type: string
                    description: The name of the project.
                    maxLength: 120
                    example: Example Application
                  state:
                    type: string
                    description: 'A default system classification. A project can have one of the following states: `"active"`, `"archive"`, `"delete"`. When you create a project,

                      the project is created in an `"active"` state. Projects with the state `"active"` or `"delete"` can be updated. Projects in the state `"active"`,

                      `"archive"`, or `"delete"` can be deleted. Projects in the state `"framework"` cannot be accessed using the API. For more information, see

                      <a href="https://help.highbond.com/helpdocs/highbond/en-us/Default.htm#cshid=pm-project-statuses" target="_blank">Configuring project statuses</a>.

                      '
                    example: active
                  status:
                    type: string
                    description: 'A user configurable classification. Each project can have one status. Default statuses are: "draft", "proposed", "active", "completed".

                      The default status is "active", if not specified. For more information, see <a href=

                      "https://help.highbond.com/helpdocs/highbond/en-us/Default.htm#cshid=pm-project-statuses" target="_blank">Configuring project statuses</a>.

                      '
                    example: active
                  created_at:
                    type: string
                    description: The timestamp specifying when the project was created.
                    example: '2019-02-09T13:17:26Z'
                    format: date-time
                  updated_at:
                    type: string
                    description: The timestamp specifying when the project's settings were updated.
                    example: '2019-03-18T22:02:05Z'
                    format: date-time
                  description:
                    type: string
                    description: A detailed description of the project.
                    maxLength: 524288
                    example: Project description.
                  background:
                    type: string
                    description: The contextual circumstances of the project.
                    maxLength: 524288
                    example: <h1>Heading</h1><p>Project background description.</p>
                  budget:
                    type:
                    - integer
                    - 'null'
                    description: The budgeted hours that have been allocated for the project. `budget` must be a value between `0` and `2147483647`.
                    example: 1
                  certification:
                    type: boolean
                    description: 'Specifies if the Certifications feature has been enabled (`true`) or disabled (`false`) for the project. The default is `false`.

                      You must be a System Admin with a Professional subscription to configure this field. For more information, see

                      <a href="https://help.highbond.com/helpdocs/highbond/en-us/Default.htm#cshid=pm-certifications"

                      target="_blank">Creating certification programs</a>.

                      '
                    example: false
                  control_performance:
                    type: boolean
                    description: 'Specifies if the Control Performance feature has been enabled (`true`) or disabled (`false`) for the project. The default is `false`.

                      You must be a System Admin with a Professional subscription to configure this field. For more information, see

                      <a href="https://help.highbond.com/helpdocs/highbond/en-us/Content/projects/fieldwork/control_performance/scheduling_control_performance.htm"

                      target="_blank">Scheduling Control Performance</a>.

                      '
                    example: false
                  risk_assurance:
                    type: boolean
                    description: 'Specifies if the Risk Assurance feature has been enabled (`true`) or disabled (`false`) for the project. The default is `false`.

                      You must be a System Admin with a Professional subscription to configure this field. For more information, see

                      <a href="https://help.highbond.com/helpdocs/highbond/en-us/Content/projects/risk_assurance/getting_started_with_assurance_for_risk.html"

                      target="_blank">Getting started with assurance for risk</a>.

                      '
                    example: false
                  management_response:
                    type: string
                    description: A description of management's response to the overall rating of the project.
                    maxLength: 524288
                    example: <h1>Heading</h1><p>Management response description.</p>
                  max_sample_size:
                    type: integer
                    description: 'The total sample size, split among testing rounds, defined in the project. The default is `0`. This field depends on `project_type`,

                      which is dependent on workflow. For Workplan workflow projects, `max_sample_size` must be `0`. For Internal Control workflow

                      projects, `max_sample_size` must be a value between `0` and `2147483647`. For more information, see <a href=

                      "https://help.highbond.com/helpdocs/highbond/en-us/Default.htm#cshid=pm-project-types" target="_blank">Workflows and project types</a> and

                      <a href="https://help.highbond.com/helpdocs/highbond/en-us/Default.htm#cshid=pm-tests-walkthroughs" target="_blank">Executing procedures and

                      testing controls</a>.

                      '
                    example: 25
                  number_of_testing_rounds:
                    type: integer
                    description: 'The number of testing rounds performed in the project. The default is `0`. This field depends on `project_type`, which is dependent on workflow.

                      For Workplan workflow projects, `number_of_testing_rounds` must be `0`. For Internal Control workflow projects,

                      `number_of_testing_rounds` must be one of the following values: `0`,`1`,`2`, or `4`. The number of testing rounds can only be set on create. This field cannot be updated. For more information,

                      see <a href="https://help.highbond.com/helpdocs/highbond/en-us/Default.htm#cshid=pm-project-types" target="_blank">Workflows and project

                      types</a> and <a href="https://help.highbond.com/helpdocs/highbond/en-us/Default.htm#cshid=pm-tests-walkthroughs" target="_blank">Executing

                      procedures and testing controls</a>.

                      '
                    example: 4
                  opinion:
                    type: string
                    description: 'A user configurable final rating of the project outcome.

                      '
                    example: Excellent
                  opinion_description:
                    type: string
                    description: A formal statement about the project outcome, including remarks or recommendations.
                    maxLength: 524288
                    example: <h1>Heading</h1><p>Project opinion description.</p>
                  purpose:
                    type: string
                    description: The intended results, aims, or goals of the project.
                    maxLength: 524288
                    example: <h1>Heading</h1><p>Project purpose description.</p>
                  scope:
                    type: string
                    description: What is, and is not, covered by this project.
                    maxLength: 524288
                    example: <h1>Heading</h1><p>Project scope description.</p>
                  start_date:
                    type: string
                    description: The date specifying when the project is scheduled to begin.
                    example: '2019-02-01'
                    format: date
                  target_date:
                    type: string
                    description: The date specifying when the project is scheduled to be completed.
                    example: '2019-04-01'
                    format: date
                  tag_list:
                    type: array
                    description: 'A comma separated list of tags associated with the project. For more information, see

                      <a href="https://help.highbond.com/helpdocs/highbond/en-us/Default.htm#cshid=pm-organize-projects" target="_blank">Tagging projects</a>.

                      '
                    example:
                    - tag 1
                    - tag 2
                    - tag 3
                    items:
                      type: string
                  position:
                    type: integer
                    format: int64
                    description: 'Legacy field that was used to determine the order in which it is displayed in the index action. This field is no longer supported and will always return 0.

                      '
                    example: 0
                  header_alert_enabled:
                    type: boolean
                    description: 'Specifies if the Header Alert feature has been enabled (`true`) or disabled (`false`) for the project. The default is `false`.

                      Some of the projects have highly sensitive information. That data has restricted access and more controls apply to it.

                      '
                    example: false
                  header_alert_text:
                    type: string
                    description: Custom message displayed at the top (header) of each project with sensitive data.
                    maxLength: 255
                    example: This Project is not authorized for sensitive data
                  custom_attributes:
                    type: array
                    description: 'An array of custom attributes defined on the project type used by this project. <a href="https://help.highbond.com/helpdocs/highbond/en-us/Default.htm#cshid=pm-project-types" target="_blank">Learn more about project types</a>.

                      Make a PATCH request to modify the value of a custom attribute. Custom attributes can''t be updated at the same time as the project type because the project type determines which custom attributes apply to the project and its resources.

                      Custom attributes are not available on creation during a POST request, because the custom attributes are defined by the project type that is set when the project is created.

                      '
                    items:
                      type: object
                      description: A user defined custom attribute value.
                      properties:
                        id:
                          type: string
                          description: The ID of this custom attribute. Optional if term is included.
                          example: '42'
                        term:
                          type: string
                          description: The user defined term used to identify this custom attribute. Optional if id is included.
                          example: Custom Project Planning Attribute
                        value:
                          type: array
                          description: The value or values (for multiselect) for this custom attribute.
                          example:
                          - Custom Select Option Text
                          items:
                            type: string
                  risk_assurance_data:
                    type: object
                    description: 'Fields that determines assurance values. Assurance is an expression of confidence that risk is effectively mitigated. Returns `null` if Risk Assurance feature is disabled.

                      '
                    properties:
                      inherent_risk:
                        type: number
                        format: float
                        description: 'The risk that an activity would pose if no controls or other mitigating factors were in place. Can also be referred to as the gross risk, or risks before controls, and can act as the baseline for your organization''s risk tolerance or appetite.

                          '
                        example: 1.1
                      residual_risk:
                        type: number
                        format: float
                        description: 'The risk that remains after controls are taken into account. Can also be referred to as the net risk or risk after controls.

                          '
                        example: 1.1
                      assurance:
                        type: number
                        description: 'The level of assurance that the controls in place effectively mitigate risk to the business.

                          '
                        example: 0
                  time_spent:
                    type: number
                    format: float
                    description: The total time spent on the project.
                    example: 3.5
                  progress:
                    type: number
                    format: float
                    description: 'Project progress is calculated using the following formula: Sum of scores received per phase / Maximum score across all phases and objectives x 100.

                      '
                    example: 6.5
                  planned_start_date:
                    type:
                    - string
                    - 'null'
                    description: Planned start date
                    example: '2019-02-09'
                    format: date
                  planned_end_date:
                    type:
                    - string
                    - 'null'
                    description: Planned end date.
                    example: '2019-02-10'
                    format: date
                  actual_start_date:
                    type:
                    - string
                    - 'null'
                    description: Actual start date.
                    example: '2019-02-09'
                    format: date
                  actual_end_date:
                    type:
                    - string
                    - 'null'
                    description: Actual end date.
                    example: '2019-02-10'
                    format: date
                  actual_milestone_date:
                    type:
                    - string
                    - 'null'
                    description: Actual milestone date.
                    example: '2019-02-10'
                    format: date
                  planned_milestone_date:
                    type:
                    - string
                    - 'null'
                    description: Planned milestone date.
                    example: '2019-02-09'
                    format: date
              relationships:
                type: object
                description: The relationships associated with the resource.
                required:
                - project_type
                properties:
                  project_type:
                    type:
                    - object
                    - 'null'
                    description: 'Each project has an associated project type. Project types define the structure of a project, including the terminology used in the project.

                      The project type defines which workflow the project uses and which custom attributes are available on the project. Because of this dependency

                      the project type can''t be updated at the same time as the custom attributes.

                      '
                    required:
                    - data
                    properties:
                      data:
                        type: object
                        description: The data associated with the resource.
                        required:
                        - id
                        - type
                        properties:
                          id:
                            type: string
                            description: The ID of the project type.
                            example: '1'
                          type:
                            type: string
                            description: The classification of the object (`"project_types"`).
                            example: project_types
                  entities:
                    type: object
                    description: Each project has an associated project entities.
                    required:
                    - data
                    properties:
                      data:
                        type: array
                        description: The data associated with the resource.
                        items:
                          type: object
                          required:
                          - id
                          - type
                          properties:
                            id:
                              type: string
                              description: The ID of the entity.
                              example: '1'
                            type:
                              type: string
                              description: The classification of the object (`"entities"`).
                              example: entities
        links:
          type: object
          required:
          - next
          - prev
          properties:
            next:
              type:
              - string
              - 'null'
              description: Next page url
              example: /api/resource?page[number]=Mg==
            prev:
              type:
              - string
              - 'null'
              description: Previous page url
              example: null
        meta:
          type: object
          required:
          - status_translations
          properties:
            status_translations:
              type: object
              description: Translations, or customized values for the project status states.
              properties:
                draft:
                  type: string
                  description: Term to use when a project is in a draft state.
                  example: Draft
                proposed:
                  type: string
                  description: Term to use when a project is in a proposed state.
                  example: Proposed
                active:
                  type: string
                  description: Term to use when a project is in an active state.
                  example: Active
                completed:
                  type: string
                  description: Term to use when a project has been completed.
                  example: Completed
    CreateProjectEntityRequest:
      type: object
      description: The data associated with the resource.
      required:
      - data
      properties:
        data:
          type: object
          description: The data associated with the resource.
          required:
          - id
          - type
          properties:
            id:
              type: string
              description: The ID of the project.
              example: '1'
            type:
              type: string
              description: The classification of the object (`"entities"`).
              example: entities
    GetProjectResponse:
      type: object
      description: The data associated with the resource.
      required:
      - data
      properties:
        data:
          type: object
          description: The data associated with the resource.
          required:
          - id
          - type
          - attributes
          - relationships
          properties:
            id:
              type: string
              description: The ID of the requested resource.
              example: '1'
