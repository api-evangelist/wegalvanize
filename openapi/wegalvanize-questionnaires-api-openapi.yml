openapi: 3.2.0
info:
  title: HighBond API Reference Questionnaires API
  version: 1.1.0
  description: Welcome to the API documentation for HighBond.
  x-logo:
    url: ./assets/logo.png
    altText: HighBond Logo
servers:
- url: '{protocol}://{server}/v1'
  variables:
    protocol:
      default: https
    server:
      default: apis-us.highbond.com
      enum:
      - apis-us.highbond.com
      - apis-ca.highbond.com
      - apis-eu.highbond.com
      - apis-ap.highbond.com
      - apis-au.highbond.com
      - apis-af.highbond.com
      - apis-sa.highbond.com
      - apis-jp.highbond.com
security:
- bearerToken: []
tags:
- name: Questionnaires
  description: Questionnaires are used to gather information from respondents and contextualize data.
paths:
  /orgs/{org_id}/collections/{collection_id}/questionnaires:
    get:
      tags:
      - Questionnaires
      operationId: getQuestionnaires
      summary: List of questionnaires
      description: Get a list of all questionnaires inside a collection.
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/collectionIdParam'
      responses:
        '200':
          description: OK.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/MultiQuestionnairesResponse'
              example:
                data:
                - id: '22'
                  type: questionnaires
                  attributes:
                    name: My first Questionnaire
                    instruction: Please complete the training before filling out this questionnaire.
                    position: 1
                    resubmittable: false
                    respondent_view: all_records
                    email_subject: My first email subject
                    email_message: My first email message
                    linked_tables_ids:
                    - 1
                    - 3
                    - 5
                    linked_tables_only: false
                    weighting: false
                    reference_id: first-questionnaire
                    locale: pl
                    surveys_id:
                    - 1
                    - 3
                    created_at: '2019-02-09T13:17:38Z'
                    updated_at: '2019-02-09T13:17:38Z'
                  relationships:
                    collection:
                      data:
                        id: '2'
                        type: collections
                - id: '21'
                  type: questionnaires
                  attributes:
                    name: My second Questionnaire
                    instruction: Please complete the training before filling out this questionnaire.
                    resubmittable: true
                    respondent_view: no_records
                    email_subject: My second email subject
                    email_message: My second email message
                    linked_tables_ids:
                    - 2
                    - 4
                    - 6
                    linked_tables_only: false
                    weighting: false
                    reference_id: second-questionnaire
                    locale: ru
                    surveys_id:
                    - 2
                    - 4
                    created_at: '2019-02-09T13:17:38Z'
                    updated_at: '2019-02-09T13:17:38Z'
                  relationships:
                    collection:
                      data:
                        id: '2'
                        type: collections
        '400':
          $ref: '#/components/responses/MissingCollectionId'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /orgs/{org_id}/questionnaires:
    post:
      tags:
      - Questionnaires
      operationId: createQuestionnaire
      summary: Create a questionnaire
      description: 'Create a new questionnaire in an existing collection.


        Limitations:

        * Your organization can have a maximum of 14,000 questionnaires.'
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      requestBody:
        description: The data required to create a questionnaire.
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/CreateQuestionnairePayload'
      responses:
        '201':
          description: Created.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/SingleQuestionnaireResponse'
        '400':
          $ref: '#/components/responses/ResourceTypeMismatch'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/NotJsonapiMediaType'
        '422':
          description: 'Unprocessable entity.

            '
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/Errors'
              example:
                errors:
                - status: 422
                  source:
                    pointer: /data/attributes/name
                  code: invalid_resource
                  detail: can't be blank
                - status: 422
                  code: unprocessable_entity
                  detail: Maximum number of 14,000 Questionnaires reached.
  /orgs/{org_id}/questionnaires/{id}:
    get:
      tags:
      - Questionnaires
      operationId: getQuestionnaire
      summary: Get a questionnaire
      description: Get information about a questionnaire.
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/resourceIdParam'
      responses:
        '200':
