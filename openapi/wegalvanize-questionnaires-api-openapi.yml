                        - 2
                      weight:
                        type: number
                        format: double
                        description: Adds importance weight to an option.
                        example: 4.12
                      reference_id:
                        type: string
                        description: Unique identifier for the response option within the choice question.
                        example: Important-Options
                  minItems: 1
                  uniqueItems: true
                  example:
                  - reference_id: cat-option
                    text: cat
                    weight: 2
                  - reference_id: dog-option
                    text: dog
                    weight: 1
                    follow_up_questions:
                    - 1
                    - 2
                  - reference_id: dragon-option
                    text: dragon
                    follow_up_questions:
                    - 3
                question_id:
                  type: integer
                  description: Id of the question.
                  example: 77
                item_type:
                  type: string
                  maxLength: 255
                  description: Specifies the type of the questionnaire item.
                  enum:
                  - SingleChoiceQuestion
                  - MultipleChoiceQuestion
                  - DropdownQuestion
                  example: SingleChoiceQuestion
