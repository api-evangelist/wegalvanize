components:
  schemas:
    UpdatePageBreakPayload:
      type: object
      description: The data associated with the resource.
      required:
      - data
      properties:
        data:
          type: object
          description: The data associated with the resource.
          required:
          - id
          - type
          - attributes
          properties:
            id:
              type: string
              description: The ID of the requested resource.
              example: '20'
            type:
              type: string
              description: The classification of the object (`"questions"`).
              example: questionnaire_items
            attributes:
              type: object
              description: The attributes associated with the resource.
              required:
              - position
              properties:
                position:
                  type: integer
                  format: int64
                  description: 'The position value determines the order of items within the questionnaire.


                    e.g. position value of 2 will place the page break as the second item in the questionnaire.


                    If the value is not provided, the page break will be appended to the end of the questionnaire.

                    '
                  example: 2
                reference_id:
                  type: string
                  description: Unique identifier for the Page Break within the questionnaire.
                  example: Important-Page-Break
    RelationshipObject:
      type: object
      description: The object related to the resource.
      required:
      - data
      properties:
        data:
          type: object
          description: The data associated with the related object.
          required:
          - id
          - type
          properties:
            id:
              type: string
              description: The ID of the related object.
              example: 1
            type:
              type: string
              description: The classification of the related object.
              example: collection
    UpdateNumericScaleQuestionPayload:
      type: object
      description: The data associated with the resource.
      required:
      - data
      properties:
        data:
          type: object
          description: The data associated with the resource.
          required:
          - id
          - type
          - attributes
          properties:
            id:
              type: string
              description: The ID of the requested resource.
              example: '20'
            type:
              type: string
              description: The classification of the object (`"questions"`).
              example: questionnaire_items
            attributes:
              type: object
              description: The attributes associated with the resource.
              required:
              - text
              - scale_start
              - scale_end
              properties:
                text:
                  type: string
                  description: The main text of the question.
                  example: On a scale of 1 to 10, how much do you love cats?
                instructions:
                  type: string
                  description: The instructions for answering the question.
                  example: 10 is the only right choice.
                column_text:
                  type: string
                  maxLength: 255
                  description: The display name of the question when it appears in a table.
                  example: Cat love number
                optional:
                  type: boolean
                  description: Specifies whether the question is optional.
                  default: false
                  example: false
                scale_start:
                  type: integer
                  format: int64
                  description: The start of the numeric scale.
                  maximum: 1
                  minimum: 0
                  example: 1
                scale_end:
                  type: integer
                  format: int64
                  description: The end of the numeric scale.
                  maximum: 10
                  minimum: 2
                  example: 10
                label_left:
                  type: string
                  description: The label for the low end of the numeric scale.
                  example: This is the beginning of the scale.
                label_center:
                  type: string
                  description: The label for the center of the numeric scale.
                  example: This is the center of the scale.
                label_right:
                  type: string
                  description: The label for the high end of the numeric scale.
                  example: This is the end of the scale.
                position:
                  type: integer
                  format: int64
                  description: 'The position value determines the order of items within the questionnaire.


                    e.g. position value of 2 will place the numeric scale question as the second item in the questionnaire.


                    If the value is not provided, the numeric scale question will be appended to the end of the questionnaire.

                    '
                  example: 5
                question_id:
                  type: integer
                  description: Id of the question.
                  example: 47
                reference_id:
                  type: string
                  description: Unique identifier for the Numeric Scale question within the questionnaire.
                  example: Important-Questions
                weight:
                  type: number
                  format: double
                  description: Adds importance weight to numeric scale question.
                  example: 4.13
    CreateQuestionnairePayload:
      type: object
      description: The data associated with the resource.
      required:
      - data
      properties:
        data:
          type: object
          description: The data associated with the resource.
          required:
          - type
          - attributes
          - relationships
          properties:
            type:
              type: string
              description: The classification of the object (`"questionnaires"`).
              example: questionnaires
            attributes:
              type: object
              description: The attributes associated with the resource.
              required:
              - name
              properties:
                name:
                  type: string
                  description: The name of the questionnaire.
                  maxLength: 255
                  example: My first Questionnaire
                instruction:
                  type: string
                  description: Specifies the instructions for those individuals receiving your questionnaire.
                  example: Please complete the training before filling out this questionnaire.
                position:
                  type: integer
                  format: int64
                  minimum: 0
                  description: The position of the questionnaire in a collection.
                  example: 55
                resubmittable:
                  type: boolean
                  description: To allow users to submit updated responses to previously assigned questionnaires without supplying an explanatory comment.
                  default: false
                  example: false
                respondent_view:
                  type: string
                  description: Specifies whether recipients should see information about specific records.
                  enum:
                  - all_records
                  - select_records
                  - no_records
                  default: all_records
                email_subject:
                  type: string
                  nullable: true
                  maxLength: 255
                  description: 'The subject of the email notification to respondents when a questionnaire is sent.

                    If an email_subject value is not specified, there will be a default email subject.

                    '
                  example: Respond to My first Questionnaire
                email_message:
                  type: string
                  nullable: true
                  description: 'The content of the email notification to respondents when a questionnaire is sent.

                    If an email_message value is not specified, there will be a default email message body.

                    '
                  example: Test Collection has requested that you complete a questionnaire.
                linked_tables_ids:
                  type: array
                  items:
                    type: integer
                    format: int64
                  description: The IDs of the linked tables.
                  example:
                  - 1
                  - 3
                  - 5
                linked_tables_only:
                  type: boolean
                  description: Specifies whether only allow this questionnaire to be sent from linked tables for all roles.
                  default: false
                  example: false
                weighting:
                  type: boolean
                  description: Specifies whether the questionnaire supports weighted questions and responses.
                  example: false
                reference_id:
                  type: string
                  description: Unique identifier for the questionnaire within the collection, for the question within the questionnaire, and for the response option within the choice question.
                  example: important-questionnaire
                locale:
                  type: string
                  description: 'A locale for questionnaire system labels. The available locales are `"en"`, `"de"`, `"es"`, `"fr"`, `"pt"`, `"ja"`, `"zh"`, `"el"`, `"it"`, `"pl"`, `"ro"`, `"ru"`, `"uk"`

                    '
                  example: pl
            relationships:
              type: object
              description: The relationships associated with the resource.
              required:
              - collection
              properties:
