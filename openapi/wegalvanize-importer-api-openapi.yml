openapi: 3.2.0
info:
  title: HighBond API Reference Importer API
  version: 1.1.0
  description: Welcome to the API documentation for HighBond.
  x-logo:
    url: ./assets/logo.png
    altText: HighBond Logo
servers:
- url: '{protocol}://{server}/v1'
  variables:
    protocol:
      default: https
    server:
      default: apis-us.highbond.com
      enum:
      - apis-us.highbond.com
      - apis-ca.highbond.com
      - apis-eu.highbond.com
      - apis-ap.highbond.com
      - apis-au.highbond.com
      - apis-af.highbond.com
      - apis-sa.highbond.com
      - apis-jp.highbond.com
security:
- bearerToken: []
tags:
- name: Importer
  description: 'Importer for HighBond, responsible for importing HighBond resources.


    You can bulk import HighBond resources if you want to avoid time-consuming manual data entry associated with individually adding resources. You can bulk import resources such as requests, controls, risks, etc.


    Learn more about importer.'
paths:
  /orgs/{org_id}/import/{session_id}/status:
    get:
      tags:
      - Importer
      operationId: importStatus
      summary: Import Status
      description: Responsible for getting status of import session.
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/sessionIdParam'
      responses:
        '200':
          description: OK.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ImporterResponse'
              example:
                data:
                  type: import,
                  attributes:
                    status: Successful
        '400':
          $ref: '#/components/responses/ResourceTypeMismatch'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/ImportForbidden'
        '404':
          $ref: '#/components/responses/SessionNotFound'
  /orgs/{org_id}/import/{session_id}/error_logs:
    get:
      tags:
      - Importer
      operationId: importErrorLogs
      summary: Import Error Logs
      description: Responsible for getting error logs of import session.
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/sessionIdParam'
      responses:
        '200':
          description: OK.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ImporterResponse'
              example:
                data:
                  type: import,
                  attributes:
                    url: S3 signed url for error logs
        '400':
          $ref: '#/components/responses/ResourceTypeMismatch'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/ImportForbidden'
        '404':
          $ref: '#/components/responses/ImportErrorLogsNotFound'
