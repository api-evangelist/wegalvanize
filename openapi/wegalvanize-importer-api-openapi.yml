  /orgs/{org_id}/import/data/{session_id}/retry:
    patch:
      tags:
      - Importer
      operationId: retryImport
      summary: Retry import
      description: Responsible for retrying a timed-out import session.
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/sessionIdParam'
      responses:
        '200':
          description: OK.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/ImporterResponse'
              example:
                data:
                  type: import,
                  attributes:
                    session_id: 58e559b1-31bf-4341-b761-c30364376adf
        '208':
          $ref: '#/components/responses/ImportProcessing'
        '400':
          $ref: '#/components/responses/ResourceTypeMismatch'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/ImportForbidden'
        '404':
          $ref: '#/components/responses/SessionNotFound'
        '412':
          $ref: '#/components/responses/ImporterRetryInvalidSession'
        '422':
          $ref: '#/components/responses/ImporterRetryInvalidSessionStatus'
