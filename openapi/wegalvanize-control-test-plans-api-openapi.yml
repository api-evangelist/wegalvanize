openapi: 3.2.0
info:
  title: HighBond API Reference Control test plans API
  version: 1.1.0
  description: Welcome to the API documentation for HighBond.
  x-logo:
    url: ./assets/logo.png
    altText: HighBond Logo
servers:
- url: '{protocol}://{server}/v1'
  variables:
    protocol:
      default: https
    server:
      default: apis-us.highbond.com
      enum:
      - apis-us.highbond.com
      - apis-ca.highbond.com
      - apis-eu.highbond.com
      - apis-ap.highbond.com
      - apis-au.highbond.com
      - apis-af.highbond.com
      - apis-sa.highbond.com
      - apis-jp.highbond.com
security:
- bearerToken: []
tags:
- name: Control test plans
  x-displayName: Test plans
  description: A test plan is a document that details how controls are assessed.
paths:
  /orgs/{org_id}/control_test_plans:
    get:
      tags:
      - Control test plans
      operationId: getControlTestPlans
      summary: Get organization test plans
      description: 'Get a list of all of the test plans in an organization.


        > **Note:**

        By default, this endpoint only returns test plans from active projects. To fetch objects from archived projects or frameworks, do one of the following:

        > * Specify the project or framework ID using `filter[project.id]`

        > * Specify that you want results from archived projects using `filter[project.state]=archive`

        > * Specify that you want results from frameworks using `filter[project.state]=framework`'
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/controlTestPlanSparseFieldsetParams'
      - $ref: '#/components/parameters/pageSizeParam'
      - $ref: '#/components/parameters/pageNumberEncodedParam'
      - $ref: '#/components/parameters/controlTestPlanSortParams'
      - $ref: '#/components/parameters/controlTestPlanProjectIdFilterParams'
      - $ref: '#/components/parameters/controlTestPlanProjectNameFilterParams'
      - $ref: '#/components/parameters/controlTestPlanProjectStateFilterParams'
      - $ref: '#/components/parameters/controlTestPlanProjectStatusFilterParams'
      - $ref: '#/components/parameters/controlTestPlanControlIDFilterParams'
      - $ref: '#/components/parameters/controlTestPlanIncludeParams'
      - $ref: '#/components/parameters/objectiveSparseFieldsetParams'
      - $ref: '#/components/parameters/controlSparseFieldsetParams'
      responses:
        '200':
          description: OK.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/GetControlTestPlansResponse'
        '400':
          $ref: '#/components/responses/MissingResourceId'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/NotJsonapiMediaType'
  /orgs/{org_id}/control_test_plans/{id}:
    get:
      tags:
      - Control test plans
      operationId: getControlTestPlan
      summary: Get a test plan
      description: Get information about a test plan.
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/resourceIdParam'
      - $ref: '#/components/parameters/controlTestPlanIncludeParams'
      responses:
        '200':
          description: OK.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/GetControlTestPlanResponse'
        '400':
          $ref: '#/components/responses/MissingResourceId'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/NotJsonapiMediaType'
    patch:
      tags:
      - Control test plans
      operationId: updateControlTestPlan
      summary: Update a test plan
      description: 'Make changes to a test plan in a project or framework, like updating the testing method or test steps.


        Limitations:

        * You cannot update the test plan if it is signed off.

        * You cannot update the test plan if the objective it belongs to has been checked out using

        Offline Projects or the

        HighBond iPad app.'
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/resourceIdParam'
      - $ref: '#/components/parameters/controlTestPlanIncludeParams'
      requestBody:
        description: The data required to update a control test.
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/UpdateControlTestPlanRequest'
      responses:
        '200':
          description: OK.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/GetControlTestPlanResponse'
        '400':
          $ref: '#/components/responses/MissingResourceId'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/NotJsonapiMediaType'
        '422':
          description: 'Unprocessable entity.

            '
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/Errors'
              example:
                errors:
                - status: 422
                  source:
                    pointer: /data/attributes/total_sample_size
                  code: invalid_resource
                  detail: can't be blank
components:
  parameters:
    controlTestPlanIncludeParams:
      in: query
      name: include
      description: Requesting the API to return related resources. For more information, see <a href="#section/Making-requests">Making requests</a>
      required: false
      schema:
        type: string
        example: control,control.objective
    controlTestPlanProjectNameFilterParams:
      in: query
      name: filter[project.name]
      description: Requesting the API to filter results by project name. For more information, see <a href="#section/Making-requests">Making requests</a>
      required: false
      schema:
        type: string
        example: some project name
    controlSparseFieldsetParams:
      in: query
      name: fields[controls]
      description: Requesting the API to return only the specified fields. For more information, see <a href="#section/Making-requests">Making requests</a>
      required: false
      schema:
        type: string
        example: title,description,control_id,owner,frequency,control_type,prevent_detect,method,status,position,created_at,updated_at,custom_attributes,objective,walkthrough,control_test_plan,control_tests,mitigations,owner_user,entities,framework_origin
    orgIdParam:
      in: path
      name: org_id
      description: The ID of the HighBond instance.
      required: true
      schema:
        type: string
        example: 1
    controlTestPlanSparseFieldsetParams:
      in: query
      name: fields[control_test_plans]
      description: Requesting the API to return only the specified fields. For more information, see <a href="#section/Making-requests">Making requests</a>
      required: false
      schema:
        type: string
        example: testing_method,total_sample_size,test_steps,created_at,updated_at,custom_attributes,control,framework_origin,preparer_signoff,detail_reviewer_signoff,general_reviewer_signoff,supplemental_reviewer,specialty_reviewer
    pageSizeParam:
      in: query
      name: page[size]
      description: The number of items returned per page. Default is 50. Maximum is 100.
      required: false
      schema:
        type: string
        example: 25
    controlTestPlanSortParams:
      in: query
      name: sort
      description: Requesting the API to sort test plans by the values in a given field. The test plans are sorted ascending by default, but you can prefix the field name with `-` to sort descending (e.g., `-id`). You can sort test plans by only one field at a time.
      required: false
      schema:
        type: string
        enum:
        - id
        - testing_method
        - total_sample_size
        - test_steps
        - created_at
        - updated_at
        default: id
    controlTestPlanProjectStatusFilterParams:
      in: query
      name: filter[project.status]
      description: Requesting the API to filter results by project status. For more information, see <a href="#section/Making-requests">Making requests</a>
      required: false
      schema:
        type: string
        example: active
    resourceIdParam:
      in: path
      name: id
      description: The ID of the requested resource.
      required: true
      schema:
        type: string
        example: 9999
    pageNumberEncodedParam:
      in: query
      name: page[number]
      description: The Base64-encoded page number of records to return.
      required: false
      schema:
        type: string
        example: Mg==
    objectiveSparseFieldsetParams:
      in: query
      name: fields[objectives]
      description: Requesting the API to return only the specified fields. For more information, see <a href="#section/Making-requests">Making requests</a>
      required: false
      schema:
        type: string
        example: title,description,reference,division_department,owner,executive_owner,created_at,updated_at,project,assigned_user,owner_user,executive_owner_user,custom_attributes,position,risk_control_matrix_id,walkthrough_summary_id,testing_round_1_id,testing_round_2_id,testing_round_3_id,testing_round_4_id,entities,framework,framework_origin,risk_assurance_data,planned_start_date,actual_start_date,planned_end_date,actual_end_date,planned_milestone_date,actual_milestone_date
    controlTestPlanProjectStateFilterParams:
      in: query
      name: filter[project.state]
      description: Requesting the API to filter results by project state. For more information, see <a href="#section/Making-requests">Making requests</a>
      required: false
      schema:
        type: string
        example: active
    controlTestPlanControlIDFilterParams:
      in: query
      name: filter[control.id]
      description: Requesting the API to filter results by control IDs. For more information, see <a href="#section/Making-requests">Making requests</a>
      required: false
      schema:
        type: string
        example: 1,2,3
    controlTestPlanProjectIdFilterParams:
      in: query
      name: filter[project.id]
      description: Requesting the API to filter results by project ID. For more information, see <a href="#section/Making-requests">Making requests</a>
      required: false
      schema:
        type: string
        example: '1'
  responses:
    BadCredentials:
      description: Bad credentials.
    Forbidden:
      description: Forbidden.
    NotFound:
      description: Not found.
      content:
        application/vnd.api+json:
          schema:
            $ref: '#/components/schemas/Errors'
          example:
            errors:
            - status: '404'
              title: Not Found
              detail: The requested resource does not exist.
    NotJsonapiMediaType:
      description: Unsupported media type.
      content:
        application/vnd.api+json:
          schema:
            $ref: '#/components/schemas/Errors'
          example:
            errors:
            - status: 415
              code: unsupported_media_type
              title: Unsupported media type
              detail: 'The endpoint supports only the application/vnd.api+json Content-Type. This request specified application/json.

                '
    MissingResourceId:
      description: Bad request.
      content:
        application/vnd.api+json:
          schema:
            $ref: '#/components/schemas/Errors'
          example:
            errors:
            - status: 400
              code: parameter_missing
              title: Parameter missing
              detail: The required parameter, id, is missing.
  schemas:
    UpdateControlTestPlanRequest:
      type: object
      required:
      - data
      properties:
        data:
          type: object
          description: The data associated with the resource.
          required:
          - id
          - type
          properties:
            id:
              type: string
              description: The ID of the requested resource.
              example: 1
            type:
              type: string
              description: The classification of the object (`"control_test_plans"`).
              example: control_test_plans
            attributes:
              type: object
              description: The attributes associated with the resource.
              properties:
                testing_method:
                  type:
                  - string
                  - 'null'
                  description: 'The method specifying how evidence will be obtained. The exact values for this field depend on the <a href="

                    https://help.highbond.com/helpdocs/highbond/en-us/Default.htm#cshid=pm-customize-terms" target="_blank">configuration of the project type</a>.


                    >**Note**: If the `testing_method` field has been disabled in the project type, the field is hidden from the API response.

                    '
                  example: Inspection
                total_sample_size:
                  type: integer
                  description: 'The total sample size, split among testing rounds. `total_sample_size` must be a value between `0` and `2147483647`.


                    Sample size is set when a test plan is created the first time, which occurs when you create a control. The logic used to automatically set the sample size field is

                    based on two control attribute fields: `frequency` and `type`. For more information, see <a href="

                    https://help.highbond.com/helpdocs/highbond/en-us/Default.htm#cshid=pm-tests-walkthroughs" target="_blank">Executing procedures and testing

                    controls</a>.


                    >**Note**: If the `total_sample_size` field has been disabled in the project type, the field is hidden from the API response.

                    '
                  format: int64
                  example: 1
                test_steps:
                  type: string
                  description: The steps or attributes associated with the test plan.
                  maxLength: 524288
                  example: <h1>Heading</h1><p>Test Steps description.</p>
                custom_attributes:
                  type: array
                  description: An array of custom attributes defined on the project type used by the project this control test is from. <a href="https://help.highbond.com/helpdocs/highbond/en-us/Default.htm#cshid=pm-project-types" target="_blank">Learn more about project types</a>. Make a PATCH request to modify the value of a custom attribute.
                  items:
                    type: object
                    description: A user defined custom attribute value.
                    properties:
                      id:
                        type: string
                        description: The ID of this custom attribute. Optional if term is included.
                        example: '42'
                      term:
                        type: string
                        description: The user defined term used to identify this custom attribute. Optional if id is included.
                        example: Custom Control Test Plan Attribute
                      value:
                        type: array
                        description: The value or values (for multiselect) for this custom attribute.
                        example:
                        - Custom Select Option Text
                        items:
                          type: string
    GetControlTestPlansResponse:
      type: object
      required:
      - data
      - links
      properties:
        data:
          type: array
          items:
            type: object
            description: The data associated with the resource.
