openapi: 3.2.0
info:
  title: HighBond API Reference Activities API
  version: 1.1.0
  description: Welcome to the API documentation for HighBond.
  x-logo:
    url: ./assets/logo.png
    altText: HighBond Logo
servers:
- url: '{protocol}://{server}/v1'
  variables:
    protocol:
      default: https
    server:
      default: apis-us.highbond.com
      enum:
      - apis-us.highbond.com
      - apis-ca.highbond.com
      - apis-eu.highbond.com
      - apis-ap.highbond.com
      - apis-au.highbond.com
      - apis-af.highbond.com
      - apis-sa.highbond.com
      - apis-jp.highbond.com
security:
- bearerToken: []
tags:
- name: Activities
paths:
  /orgs/{org_id}/activities:
    get:
      tags:
      - Activities
      operationId: getActivities
      summary: Get activities
      description: Gets a paginated JSON list of activities.
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/activitiesExportEventOriginFilterParam'
      - $ref: '#/components/parameters/activitiesExportStartDateFilterParams'
      - $ref: '#/components/parameters/activitiesExportEndDateFilterParams'
      - $ref: '#/components/parameters/activitiesResourceIdParams'
      - $ref: '#/components/parameters/activitiesResourceTypeParams'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivitiesResponse'
        '400':
          $ref: '#/components/responses/AuthValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /orgs/{org_id}/activities/export:
    get:
      tags:
      - Activities
      operationId: getActivitiesExport
      summary: Export activities CSV
      description: 'Generate a log in CSV format containing your organization''s activity over the specified dates.

        An email with a link where you can download the activity log will be sent to you.


        > **Note —**

        The download link will expire 30 minutes after you receive the email.'
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/activitiesExportEventOriginFilterParam'
      - $ref: '#/components/parameters/activitiesExportStartDateFilterParams'
      - $ref: '#/components/parameters/activitiesExportEndDateFilterParams'
      - $ref: '#/components/parameters/activitiesResourceIdParams'
      - $ref: '#/components/parameters/activitiesResourceTypeParams'
      responses:
        '202':
          description: Accepted. [A link to download will be emailed.]
        '400':
          $ref: '#/components/responses/AuthValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
components:
  parameters:
    activitiesExportStartDateFilterParams:
      in: query
      name: filter[date][start]
      description: Requesting the API to filter results by start date. This parameter is required. The maximum date range supported is 31 days. The exact time can be specified using the ISO 8601 format `YYYY-MM-DDTHH:MM:SS` (see example). Please note that all times are UTC by default.
      required: true
      schema:
        type: string
        example: '2024-03-01T00:00:00'
    activitiesResourceTypeParams:
      in: query
      name: filter[resource_type]
      description: The type of the specific resource. It is used to filter activities by the resource type.  Either both `resource_id` and `resource_type` should be provided or both should not be provided, only with one of these filters should not be requested.
      required: false
      schema:
        type: string
        example: datatable
    orgIdParam:
      in: path
      name: org_id
      description: The ID of the HighBond instance.
      required: true
      schema:
        type: string
        example: 1
    activitiesExportEndDateFilterParams:
      in: query
      name: filter[date][end]
      description: Requesting the API to filter results by end date. This parameter is required. The maximum date range supported is 31 days. The exact time can be specified using the ISO 8601 format `YYYY-MM-DDTHH:MM:SS` (see example). Please note that all times are UTC by default.
      required: true
      schema:
        type: string
        example: '2024-03-01T00:00:00'
    activitiesExportEventOriginFilterParam:
      in: query
      name: filter[event_origin]
      description: Requesting the API to filter activities by event origin. Event origin is an identifier specifying where an activity originated from.
      required: true
      schema:
        type: string
        enum:
        - asset-types
        - assets-inventory
        - compliance-maps
        - projects
        - results
        - launchpad
        - service-notifications
        example: assets-inventory
    activitiesResourceIdParams:
      in: query
      name: filter[resource_id]
      description: The ID of the specific resource. It is used to filter activities by the resource ID. Either both`resource_id` and `resource_type` should be provided or both should not be provided, only with one of these filters should not be requested.
      required: false
      schema:
        type: string
        example: 1
  schemas:
    ActivitiesResponse:
      type: object
      description: Paginated list of activities.
      properties:
        data:
          type: array
          description: List of activities returned by request.
          items:
            type: object
            description: A single activity record.
            properties:
              updated_by:
                type: string
                description: The user or system that performed the action.
                example: '[System]'
              email:
                type: string
                example: example@diligent.com
              date:
                type: string
                format: date-time
                example: '2024-05-01T00:00:53.430Z'
              resource_module:
                type: string
                example: robots
              resource_type:
                type: string
                example: sequence run
              resource_id:
                type: integer
                example: 632408
              parent_resource_type:
                type: string
                example: sequence
              parent_resource_id:
                type: integer
                example: 1985
              root_resource_type:
                type: string
                example: ''
              root_resource_id:
                type: string
                example: ''
              action:
                type: string
                example: create
              fields_changed:
                type: array
                items:
                  type: string
                example:
                - id
                - org_id
                - category
                - trigger_type
                - status
                - created_at
              before:
                type: object
                description: The state of the resource before the action.
                example:
                  trigger_type: null
                  created_at: null
                  org_id: null
                  id: null
                  category: null
                  status: null
              after:
                type: object
                description: The state of the resource after the action.
                example:
                  trigger_type: sequence
                  created_at: '2024-05-01T00:00:55.647Z'
                  org_id: 12
                  id: 1234
                  category: microbot
                  status: queued
        nextPage:
          type: string
          description: Path URL to the next page of activities.
          example: /activities?<next_page_query_string>
    Error:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          description: The HTTP status code.
        source:
          type: object
          description: Indicates which part of the request document caused the error.
          required:
          - pointer
          properties:
            pointer:
              type: string
              description: 'A JSON Pointer <a href="https://tools.ietf.org/html/rfc6901" target="_blank">(RFC6901)</a> to the associated entity

                in the request document.

                '
        code:
          type: string
          description: Application-specific error code, expressed as a string value.
        title:
          type: string
          description: A short, human-readable summary of the problem.
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence of the problem.
    Errors:
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/Error'
  responses:
    Forbidden:
      description: Forbidden.
    Unauthorized:
      description: Unauthorized.
    AuthValidationError:
      description: Bad request.
      content:
        application/vnd.api+json:
          schema:
            $ref: '#/components/schemas/Errors'
          example:
            errors:
            - status: 400
              title: Bad Request
              detail: event_origin missing
  securitySchemes:
    bearerToken:
      description: 'HighBond offers the industry-standard OAuth 2.0 flow for connecting to the HighBond platform. OAuth 2.0 provides a

        safe and secure way to access data, while protecting your account credentials.

        '
      type: http
      scheme: bearer
      bearerFormat: oauth2
