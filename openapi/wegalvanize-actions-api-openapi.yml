openapi: 3.2.0
info:
  title: HighBond API Reference Actions API
  version: 1.1.0
  description: Welcome to the API documentation for HighBond.
  x-logo:
    url: ./assets/logo.png
    altText: HighBond Logo
servers:
- url: '{protocol}://{server}/v1'
  variables:
    protocol:
      default: https
    server:
      default: apis-us.highbond.com
      enum:
      - apis-us.highbond.com
      - apis-ca.highbond.com
      - apis-eu.highbond.com
      - apis-ap.highbond.com
      - apis-au.highbond.com
      - apis-af.highbond.com
      - apis-sa.highbond.com
      - apis-jp.highbond.com
security:
- bearerToken: []
tags:
- name: Actions
  description: 'An action is a specific follow-up measure that is associated with an identified issue. You can add actions and assign action owners. You can also set up reminders for

    yourself to retest issues or track hours spent on retesting by self-assigning actions.


    > **Note —**

    Only actions in projects that have an `"active"` state can be accessed using the API.


    Learn more about actions.'
paths:
  /orgs/{org_id}/issues/{issue_id}/actions:
    get:
      tags:
      - Actions
      operationId: getActions
      summary: List actions in an issue
      description: Get a list of all actions associated with an issue.
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/issueIdParam'
      - $ref: '#/components/parameters/actionSparseFieldsetParams'
      - $ref: '#/components/parameters/pageSizeParam'
      - $ref: '#/components/parameters/pageNumberEncodedParam'
      - $ref: '#/components/parameters/actionIncludeParams'
      responses:
        '200':
          description: OK.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/GetActionsResponse'
        '400':
          $ref: '#/components/responses/MissingIssueId'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/NotJsonapiMediaType'
    post:
      tags:
      - Actions
      operationId: createAction
      summary: Create an action
      description: 'Create a new action in an existing issue.


        Limitations:

        * There can be a maximum of 500 actions per issue.

        * You cannot create a new action in the following scenarios:

        * if the Follow-up & Remediation subtab of the associated issue is signed off

        * if the action belongs to an objective that has been checked out using

        Offline Projects or the

        HighBond iPad app


        Specifying a person''s name or email in the following fields does not immediately notify them via email: `owner_name`, `owner_email`.

        Email notifications about actions are only sent if `send_recurring_reminder` is `true`.'
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/issueIdParam'
      - $ref: '#/components/parameters/actionSparseFieldsetParams'
      requestBody:
        description: The data required to create an action.
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/CreateActionRequest'
      responses:
        '201':
          description: Created.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/GetActionResponse'
        '400':
          $ref: '#/components/responses/ResourceTypeMismatch'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/NotJsonapiMediaType'
        '422':
          description: 'Unprocessable entity.

            '
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/Errors'
              example:
                errors:
                - status: 422
                  source:
                    pointer: /data/attributes/title
                  code: invalid_resource
                  detail: can't be blank
  /orgs/{org_id}/actions/{id}:
    get:
      tags:
      - Actions
      operationId: getAction
      summary: Get an action
      description: Get information about an action.
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/resourceIdParam'
      - $ref: '#/components/parameters/actionSparseFieldsetParams'
      responses:
        '200':
          description: OK.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/GetActionResponseWithIncluded'
        '400':
          $ref: '#/components/responses/MissingResourceId'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/NotJsonapiMediaType'
    patch:
      tags:
      - Actions
      operationId: updateAction
      summary: Update an action
      description: 'Make changes to an action, like renaming it or specifying an owner.


        Limitations:

        You cannot update the action in the following scenarios:

        * if the Follow-up & Remediation subtab of the associated issue is signed off

        * if the action belongs to an objective that has been checked out using

        Offline Projects or the

        HighBond iPad app


        Specifying a person''s name or email in the following fields does not immediately notify them via email: `owner_name`, `owner_email`.

        Email notifications about actions are only sent if `send_recurring_reminder` is `true`.'
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/resourceIdParam'
      - $ref: '#/components/parameters/actionSparseFieldsetParams'
      requestBody:
        description: The data required to update an action.
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/UpdateActionRequest'
      responses:
        '200':
          description: OK.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/GetActionResponse'
        '400':
          $ref: '#/components/responses/MissingResourceId'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/NotJsonapiMediaType'
        '422':
          description: 'Unprocessable entity.

            '
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/Errors'
              example:
                errors:
                - status: 422
                  source:
                    pointer: /data/attributes/title
                  code: invalid_resource
                  detail: can't be blank
    delete:
      tags:
      - Actions
      operationId: deleteAction
      summary: Delete an action
      description: 'Delete an action from an existing issue.


        Limitations:

        You cannot delete the action in the following scenarios:

        * if the Follow-up & Remediation subtab of the associated issue is signed off

        * if the action belongs to an objective that has been checked out using

        Offline Projects or the

        HighBond iPad app


        > **Caution —**

        Deleting an action is permanent. Once deleted, you cannot access or restore the action.'
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/resourceIdParam'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/MissingResourceId'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/NotJsonapiMediaType'
        '422':
          description: 'Unprocessable entity.

            '
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/Errors'
              example:
                errors:
                - status: 422
                  source:
                    pointer: /data/attributes/base
                  code: invalid_resource
                  title: Invalid resource
                  detail: This Follow-up & Remediation cannot be updated as the preparer has already signed off.
  /orgs/{org_id}/actions/{action_id}/comments:
    get:
      tags:
      - Actions
      operationId: getActionComments
      summary: List action comments in an action
      description: Get a list of all action comments associated with an action.
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/actionIdParam'
      - $ref: '#/components/parameters/pageSizeParam'
      - $ref: '#/components/parameters/pageNumberEncodedParam'
      - $ref: '#/components/parameters/actionCommentSparseFieldsetParams'
      responses:
        '200':
          description: OK.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/GetActionCommentsResponse'
        '400':
          $ref: '#/components/responses/MissingResourceId'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/NotJsonapiMediaType'
    post:
      tags:
      - Actions
      operationId: createActionComment
      summary: Create an action comment
      description: 'Create a new comment for an existing action.


        The comment requires one mandatory attribute:

        * `message_content` - The content of the comment'
      parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/actionIdParam'
      requestBody:
        description: The data required to create an action comment.
        required: true
        content:
          application/vnd.api+json:
            schema:
              $ref: '#/components/schemas/CreateActionCommentRequest'
            example:
              data:
                type: action_comments
                attributes:
                  message_content: This is a comment on the action.
      responses:
        '201':
          description: Created.
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/CreateActionCommentResponse'
        '400':
          $ref: '#/components/responses/ResourceTypeMismatch'
        '401':
          $ref: '#/components/responses/BadCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/NotJsonapiMediaType'
        '422':
          description: 'Unprocessable entity.

            '
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/Errors'
              example:
                errors:
                - status: 422
                  source:
                    pointer: /data/attributes/message_content
                  code: invalid_resource
                  detail: can't be blank
components:
  schemas:
    CreateActionRequest:
      type: object
      required:
      - data
      properties:
        data:
          type: object
          description: The data associated with the resource.
          required:
          - type
          - attributes
          - relationships
          properties:
            type:
              type: string
              description: The classification of the object (`"actions"`).
              example: actions
            attributes:
              type: object
              description: The attributes associated with the resource.
              required:
              - title
              - due_date
              properties:
                title:
                  type: string
                  description: The title of the action.
                  maxLength: 255
                  example: Title of the action
                due_date:
                  type: string
                  description: Specifies the date the action must be completed by.
                  example: '2020-01-02'
                  format: date
                owner_name:
                  type: string
                  description: 'The action owner. Specifying a person''s name does not immediately send them an email notification about the action.

                    However, if `send_recurring_reminder` is configured to `true`, recurring email reminders are sent to the action owner

                    based on the frequency configured. This field becomes required if the `owner_user` relationship is not provided. For more information, see

                    <a href="https://help.highbond.com/helpdocs/highbond/en-us/Default.htm#cshid=pm-action-reminders" target="_blank">Sending recurring

                    action reminders</a>.

                    '
                  example: Tom Wachowski
                owner_email:
                  type: string
                  description: 'The action owner’s email address. Specifying a person''s email does not immediately send them an email notification

                    about the action. However, if `send_recurring_reminder` is configured to `true`, recurring email reminders are sent to the action owner

                    based on the frequency configured. This field becomes required if the `owner_user` relationship is not provided. For more information, see

                    <a href="https://help.highbond.com/helpdocs/highbond/en-us/Default.htm#cshid=pm-action-reminders" target="_blank">Sending recurring

                    action reminders</a>.

                    '
                  example: tom.wachowski@greenhills.com
                created_at:
                  type: string
                  description: The timestamp identifying when the action was created.
                  example: '2019-02-09T13:17:26Z'
                  format: date-time
                updated_at:
                  type: string
                  description: The timestamp identifying when the action was updated.
                  example: '2019-02-09T13:17:26Z'
                  format: date-time
                send_recurring_reminder:
                  type: boolean
                  description: 'If `true`, a recurring email reminder about the action is sent to the owner. If `false`, a recurring email reminder is not sent.

                    Recurring reminder frequencies are configurable. For more information, see

                    <a href="https://help.highbond.com/helpdocs/highbond/en-us/Default.htm#cshid=pm-action-reminders" target="_blank">Sending recurring

                    action reminders</a>.

                    '
                  example: true
                include_issue_details:
                  type: boolean
                  description: 'If `true`, the issue title and description fields are displayed to the action owner. Once the action owner clicks on the link to the

                    action in the email, they can see the fields on the action page. If `false`, the fields are not displayed to the action owner.

                    '
                  example: true
                include_remediation_details:
                  type: boolean
                  description: 'If `true`, the remediation plan and remediation deadline fields are displayed to the action owner. Once the action owner clicks on the

                    link to the action in the email, they can see the fields on the action page. If `false`, the fields are not displayed to the action owner.

                    '
                  example: false
                description:
                  type: string
                  description: A detailed description of the action.
                  maxLength: 524288
                  example: <h1>Action heading</h1><p>Action description.</p>
                priority:
                  type: string
                  description: 'A user configurable classification that specifies the priority of the action. The options available depend

                    on the <a href="https://help.highbond.com/helpdocs/highbond/en-us/Default.htm#cshid=pm-customize-terms" target="_blank">configuration of the

                    project type</a>.

                    '
                  example: high
                closed:
                  type: boolean
                  description: 'Specifies the state of the action. An action can have one of the following states: `"open"` or `"closed"`. If `true`, the action

                    is in a `"closed"` state. The action owner stops receiving recurring email notifications about the action. The link to the action

                    in any previously sent email notifications also expires. If `false`, the action is in an `"open"` state. Recurring notifications

                    about the action continue to be sent to the action owner.

                    '
                  example: true
                completed_date:
                  type: string
                  description: Specifies the date that the action was completed or addressed. This field is typically filled out by the issue owner.
                  example: '2020-01-02'
                  format: date
                status:
                  type: string
                  description: 'A user configurable classification that specifies the current status of the action. The options available

                    depend on the <a href="https://help.highbond.com/helpdocs/highbond/en-us/Default.htm#cshid=pm-customize-terms" target="_blank">configuration

                    of the project type</a>. This field is typically filled out by the action owner.

                    '
                  example: Audit Verifying
                submitted_on:
                  type: string
                  description: Specifies the date that the action was completed or addressed. This field is typically filled out by the action owner.
                  example: '2020-01-02'
                  format: date
                custom_attributes:
                  type: array
                  description: An array of custom attributes defined by the user that are available on this object.
                  items:
                    type: object
                    description: A user defined custom attribute value.
                    properties:
                      id:
                        type: string
                        description: The ID of the custom attribute that this custom attribute value is for. Optional if term is included.
                        example: '42'
                      term:
                        type: string
                        description: The user defined term used to identify the custom attribute. Optional if id is included.
                        example: Custom Action Attribute
                      value:
                        type: array
                        description: The value or values (for multiselect) to set this custom attribute to.
                        example:
                        - Custom Select Option Text
                        items:
                          type: string
                cc_contacts:
                  type:
                  - array
                  - 'null'
                  description: An array of user emails
                  example:
                  - user@company.com
                  - user1@company.com
                  items:
                    type: string
            relationships:
              type: object
              description: The relationships associated with the resource.
              required:
              - assigned_by
              properties:
                assigned_by:
                  type: object
                  description: 'The person who created the action. You can only specify users with a Professional Manager or Professional User role in the project this action belongs to.

                    '
                  required:
                  - data
                  properties:
                    data:
                      type: object
                      description: The data associated with the resource.
                      required:
                      - id
                      - type
                      properties:
                        id:
                          type: string
                          description: 'The unique identifier (UID) of the assigned user. For more information on obtaining this value, see

                            <a href="#section/Making-requests">Making requests</a>.

                            '
                          example: 3NQ6XzAUxqJMnAQ7n4KF
                        type:
                          type: string
                          description: The classification of the object (`"users"`).
                          example: users
                cc_users:
                  type:
                  - object
                  - 'null'
                  description: 'Specifies one or more users in a HighBond instance that are cc''ed on this action.

                    '
                  required:
                  - data
                  properties:
                    data:
                      type: array
                      items:
                        type: object
                        description: The data associated with the resource.
                        required:
                        - id
                        - type
                        properties:
                          id:
                            type: string
                            description: 'The unique identifier (UID) of the user. For more information on obtaining this value, see

                              <a href="#section/Making-requests">Making requests</a>.

                              '
                            example: 3NQ6XzAUxqJMnAQ7n4KF
                          type:
                            type: string
                            description: The classification of the object (`"users"`).
                            example: users
                owner_user:
                  type:
                  - object
                  - 'null'
                  description: 'Specifies the user in a HighBond instance that responsible for the action.

                    '
                  required:
                  - data
                  properties:
                    data:
                      type: object
                      description: The data associated with the resource.
                      required:
                      - id
                      - type
                      properties:
                        id:
                          type: string
                          description: 'The unique identifier (UID) of the user. For more information on obtaining this value, see

                            <a href="#section/Making-requests">Making requests</a>.

                            '
                          example: 3NQ6XzAUxqJMnAQ7n4KF
                        type:
                          type: string
                          description: The classification of the object (`"users"`).
                          example: users
    CreateActionCommentRequest:
      type: object
      required:
      - data
      properties:
        data:
          type: object
          description: The data associated with the resource.
          required:
          - type
          - attributes
          properties:
            type:
              type: string
              description: The classification of the object (`"action_comments"`).
              example: action_comments
            attributes:
              type: object
              description: The attributes associated with the resource.
              required:
              - message_content
              properties:
                message_content:
                  type: string
                  description: The content of the action comment.
                  example: Message content
    GetActionCommentsResponse:
      type: object
      required:
      - data
      - links
      properties:
        data:
          type: array
          description: Array of action comments
          items:
            type: object
            description: The data associated with the resource.
            required:
            - id
            - type
            - attributes
            - relationships
            properties:
              id:
                type: string
                description: The ID of the requested resource.
                example: '1'
              type:
                type: string
                description: The classification of the object (`"action_comments"`).
                example: action_comments
              attributes:
                type: object
                description: The attributes associated with the resource.
                properties:
                  message_content:
                    type: string
                    description: The content of the action comment.
                    example: Message content
                  commenter_name:
                    type: string
                    description: The name of the user who created the action comment.
                    example: Tom Wachowski
                  commenter_email:
                    type: string
                    description: The email of the user who created the action comment.
                    example: tom@example.com
                  created_at:
                    type: string
                    description: The timestamp identifying when the action comment was created.
                    example: '2021-06-09T13:17:26Z'
                    format: date-time
                  updated_at:
                    type: string
                    description: The timestamp identifying when the action comment was updated.
                    example: '2021-06-09T13:17:26Z'
                    format: date-time
              relationships:
                type: object
                description: The relationships associated with the resource.
                required:
                - action
                properties:
                  action:
                    type: object
                    description: The attributes associated with the resource.
                    required:
                    - data
                    properties:
                      data:
                        type: object
                        description: The data associated with the resource.
                        required:
                        - id
                        - type
                        properties:
                          id:
                            type: string
                            description: The ID of the action.
                            example: '1'
                          type:
                            type: string
                            description: The classification of the object (`"actions"`).
                            example: actions
                  commenter_user:
                    type: object
                    description: 'The ID for the user who created the action comment. Can be `null` if commenter is an external user.

                      '
                    required:
                    - data
                    properties:
                      data:
                        type: object
                        description: The data associated with the resource.
                        required:
                        - id
                        - type
                        properties:
                          id:
                            type: string
                            description: 'The unique identifier (UID) of the commenter user. For more information on obtaining this value, see

                              <a href="#section/Making-requests">Making requests</a>.

                              '
                            example: 3NQ6XzAUxqJMnAQ7n4KF
                          type:
                            type: string
                            description: The classification of the object (`"users"`).
                            example: users
        links:
          type: object
          required:
          - next
          - prev
          properties:
            next:
              type:
              - string
              - 'null'
              description: Next page url
              example: /api/resource?page[number]=Mg==
            prev:
              type:
              - string
              - 'null'
              description: Previous page url
              example: null
    GetActionResponseWithIncluded:
      type: object
      required:
      - data
      properties:
        data:
          type: object
          description: The data associated with the resource.
          required:
          - id
          - type
          - attributes
          - relationships
          properties:
            id:
              type: string
              description: The ID of the requested resource.
              example: 1
            type:
              type: string
              description: The classification of the object (`"actions"`).
              example: actions
            attributes:
              type: object
              description: The attributes associated with the resource.
              properties:
                title:
                  type: string
                  description: The title of the action.
                  maxLength: 255
                  example: Title of the action
                created_at:
                  type: string
                  description: The timestamp identifying when the action was created.
                  example: '2019-02-09T13:17:26Z'
                  format: date-time
                updated_at:
                  type: string
                  description: The timestamp identifying when the action was updated.
                  example: '2019-02-09T13:17:26Z'
                  format: date-time
                owner_name:
                  type: string
                  description: 'The action owner. Specifying a person''s name does not immediately send them an email notification about the action.

                    However, if `send_recurring_reminder` is configured to `true`, recurring email reminders are sent to the action owner

                    based on the frequency configured. This field becomes required if the `owner_user` relationship is not provided. For more information, see

                    <a href="https://help.highbond.com/helpdocs/highbond/en-us/Default.htm#cshid=pm-action-reminders" target="_blank">Sending recurring

                    action reminders</a>.

                    '
                  example: Tom Wachowski
                owner_email:
                  type: string
                  description: 'The action owner’s email address. Specifying a person''s email does not immediately send them an email notification

                    about the action. However, if `send_recurring_reminder` is configured to `true`, recurring email reminders are sent to the action owner

                    based on the frequency configured. This field becomes required if the `owner_user` relationship is not provided. For more information, see

                    <a href="https://help.highbond.com/helpdocs/highbond/en-us/Default.htm#cshid=pm-action-reminders" target="_blank">Sending recurring

                    action reminders</a>.

                    '
                  example: tom.wachowski@greenhills.com
                send_recurring_reminder:
                  type: boolean
                  description: 'If `true`, a recurring email reminder about the action is sent to the owner. If `false`, a recurring email reminder is not sent.

                    Recurring reminder frequencies are configurable. For more information, see

                    <a href="https://help.highbond.com/helpdocs/highbond/en-us/Default.htm#cshid=pm-action-reminders" target="_blank">Sending recurring

                    action reminders</a>.

                    '
                  example: true
                include_issue_details:
                  type: boolean
                  description: 'If `true`, the issue title and description fields are displayed to the action owner. Once the action owner clicks on the link to the

                    action in the email, they can see the fields on the action page. If `false`, the fields are not displayed to the action owner.

                    '
                  example: true
                include_remediation_details:
                  type: boolean
                  description: 'If `true`, the remediation plan and remediation deadline fields are displayed to the action owner. Once the action owner clicks on the

